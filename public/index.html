<title>Voceiro · Titulares</title>
<script>
  // Pintar el tema guardado antes de que el módulo y el body puedan mostrarse.
  try {
    const raw = localStorage.getItem('voceiro-acces-v2');
    const perfil = raw ? JSON.parse(raw) : null;
    let tema = perfil?.tema;
    if (!raw && !Object.keys(localStorage).some(k => k.startsWith('voceiro-')) &&
        matchMedia('(prefers-color-scheme: dark)').matches) tema = 'dark';
    const h = document.documentElement;
    if (['light', 'sepia', 'dark', 'contrast'].includes(tema)) h.dataset.theme = tema;
    if (tema === 'custom') {
      const c = perfil?.colores;
      if (['fondo', 'texto', 'enlaces', 'titulos'].every(k => /^#[0-9a-f]{6}$/i.test(c?.[k] || ''))) {
        const rgb = [0, 2, 4].map(i => parseInt(c.fondo.slice(i + 1, i + 3), 16) / 255);
        const [r, g, b] = rgb.map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
        const oscuro = 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.18;
        h.dataset.theme = oscuro ? 'dark' : 'light';
        h.style.setProperty('color-scheme', oscuro ? 'dark' : 'light');
        for (const [clave, valor] of Object.entries({ bg: c.fondo, fg: c.texto, accent: c.enlaces, titulos: c.titulos }))
          h.style.setProperty('--' + clave, valor);
      }
    }
  } catch(e){}
</script>

<!-- AJUSTES

      <button id="buscar-accesos" class="buscar-accesos" type="button" aria-expanded="false" aria-controls="accesos-panel"><svg class="ico" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
      <div id="accesos-panel" class="accesos-panel" role="region" aria-labelledby="accesos-titulo" hidden></div>
      <div id="buscar-sugerencias" class="buscar-sugerencias" style="display:none"></div>
    </div>
    <div id="cab-feed-home" class="feed-actions">
      <button id="btn-pase" class="btn-dup-inline btn-view-settings btn-cab" type="button"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg><span class="cab-txt"></span></button>
      <button id="btn-lectura" class="btn-dup-inline btn-view-settings btn-cab" type="button" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg><span class="cab-txt"></span></button>
      <button id="btn-acces" class="btn-cab" type="button"></button>
      <button id="btn-config" class="btn-cab" type="button"></button>
    </div>
    <button id="btn-filtros" class="btn-dup-inline btn-view-settings" type="button"
            aria-expanded="false" aria-haspopup="dialog" aria-controls="filtros-panel">
      <svg class="ico" aria-hidden="true"><use href="#i-filter"/></svg>
      <span id="filtros-label"></span>
      <span id="filtros-count" class="vs-count" data-count="0">0</span>
      <span class="vs-caret"><svg class="ico" aria-hidden="true"><use href="#i-chevron-down"/></svg></span>
    </button>
  </div>
  <dialog id="filtros-panel" class="filtros-panel" aria-labelledby="filtros-titulo">
    <div class="filtros-cab">
      <h2 id="filtros-titulo"></h2>
      <button id="filtros-cerrar" type="button" autofocus></button>
    </div>
    <div class="filtros">
      <label><span data-filtro-label="grupo"></span><select id="grupo"><option value=""></option></select></label>
      <label><span data-filtro-label="tipo"></span><select id="tipo"><option value=""></option></select></label>
      <label><span data-filtro-label="periodo"></span><select id="rango">
        <option value=""></option>
        <option value="1"></option>
        <option value="2"></option>
      </select></label>
      <label><span data-filtro-label="orden"></span><select id="orden">
        <option value="recientes"></option>
        <option value="antiguos"></option>
        <option value="relevancia"></option>
      </select></label>
      <label><span data-filtro-label="desde"></span><input type="date" id="fecha-desde"></label>
      <label><span data-filtro-label="hasta"></span><input type="date" id="fecha-hasta"></label>
    </div>
    <fieldset>
      <legend id="vs-title-hide"></legend>
      <details class="vs-ayuda">
        <summary><span class="temas-ayuda-q" aria-hidden="true">?</span><span id="vs-ayuda-lbl"></span></summary>
        <ul class="vs-ayuda-lista"></ul>
      </details>
      <div class="filtros-lectura">
        <label class="vs-radio"><input type="radio" name="vs-hide" value="off"><span id="vs-hide-off"></span></label>
        <label class="vs-radio"><input type="radio" name="vs-hide" value="read"><span id="vs-hide-read"></span></label>
        <label class="vs-radio"><input type="radio" name="vs-hide" value="viewed"><span id="vs-hide-viewed"></span></label>
        <label class="vs-radio"><input type="radio" name="vs-hide" value="both"><span id="vs-hide-both"></span></label>
      </div>
    </fieldset>
  </dialog>
</section>
</div>
</div>

<div id="chips-busqueda" class="chips-busqueda" style="display:none"></div>

<section id="tiempo-tarjeta" class="tiempo-tarjeta" hidden aria-live="polite"></section>
<section id="avisos-panel" class="tiempo-tarjeta" hidden></section>
<section id="consulta-panel" class="consulta-panel" hidden></section>
<section id="estadisticas-panel" class="estadisticas-panel" hidden></section>
<section id="calendario-panel" class="calendario-panel" aria-labelledby="cal-titulo" hidden></section>
<dialog id="cal-evento-dialogo" class="cal-evento-dialogo"></dialog>
<!-- Pestañas y chips del feed: bajo los paneles (tiempo, avisos, consulta),
     junto a las noticias que filtran. -->
<div id="preset-pestanas" class="preset-pestanas" role="tablist" hidden>
  <button type="button" role="tab" data-pestana="modo"></button>
  <button type="button" role="tab" data-pestana="todo"></button>
</div>
<div id="temas-chips" class="temas-chips" role="toolbar" hidden></div>
<details id="medios-resumen" class="medios-resumen" hidden></details>
<main id="resultados"></main>
<div id="cargar-mas-wrap" style="display:none; text-align:center; padding:20px 0;">
  <button id="btn-cargar-mas" type="button" style="padding:10px 20px; font-size:.85em;"></button>
</div>
<button id="btn-top" class="btn-top" type="button"
        aria-label="Volver arriba" title="Volver arriba"><svg class="ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
<div id="toast-wrap"></div>
<input type="file" id="file-import" accept=".json,application/json" style="display:none">

<script type="module" src="./app.js?v=2dc9cf1016"></script>
