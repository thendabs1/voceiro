<!DOCTYPE html>
<html lang="es" data-theme="light" data-font="sans" data-just="0" data-bionic="0" data-focus="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  /* ═══ PALETA ═══
     Común con el lector: lector/build.mjs copia este bloque (entre PALETA y
     FIN DE LA PALETA) y cambia :root por #il-full. Solo colores.
     tests/tema/paleta.test.mjs comprueba los contrastes (WCAG 2.2 AA).
     --on-solid es el texto sobre un fondo de color (--accent, --preset,
     --block, --save); --focus, el anillo de foco; --titulos, el de los
     títulos. El tema «Personalizado» (shared/tema/personalizado.js) pone
     encima, en línea, las variables que salen de los colores elegidos. ═══ */
  :root{
    color-scheme:light;
    --bg:#fff; --fg:#222; --muted:#6b6b6b; --accent:#d32f2f;
    --border:#eee; --quote-bg:#f9f9f9;
    --btn-bg:#f7f7f7; --btn-border:#8a8a8a;
    --shadow:rgba(0,0,0,.08);
    --preset:#0a7d3f; --preset-bg:#e8f5e9;
    --block:#b00020; --block-bg:#fde8ec;
    --save:#1565c0; --save-bg:#e3f2fd;
    --mark:#ffe680; --mark-fg:#111;
    --on-solid:#fff; --focus:#1565c0; --titulos:#222;
  }
  [data-theme="sepia"]{
    color-scheme:light;
    --bg:#f4ecd8; --fg:#3b2f1e; --muted:#6b5a3c; --accent:#8f4523;
    --border:#e0d5b8; --quote-bg:#ede0c4;
    --btn-bg:#ede0c4; --btn-border:#8c7c58;
    --shadow:rgba(59,47,30,.15);
    --preset:#33682a; --preset-bg:#e4ebd0;
    --block:#8b2020; --block-bg:#ebd5d0;
    --save:#2e5a8b; --save-bg:#d8e3ee;
    --mark:#c9a227; --mark-fg:#2c1c08;
    --on-solid:#fff; --focus:#2e5a8b; --titulos:#3b2f1e;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#1a1a1a; --fg:#e0e0e0; --muted:#999; --accent:#ff6b6b;
    --border:#333; --quote-bg:#252525;
    --btn-bg:#2a2a2a; --btn-border:#787878;
    --shadow:rgba(0,0,0,.5);
    --preset:#4cc97a; --preset-bg:#173524;
    --block:#ff8a9c; --block-bg:#3d1a20;
    --save:#6cb3ff; --save-bg:#1e3550;
    --mark:#b58600; --mark-fg:#111;
    --on-solid:#111; --focus:#6cb3ff; --titulos:#e0e0e0;
  }
  [data-theme="contrast"]{
    color-scheme:dark;
    --bg:#000; --fg:#fff; --muted:#ff0; --accent:#0ff;
    --border:#fff; --quote-bg:#111;
    --btn-bg:#111; --btn-border:#fff;
    --shadow:rgba(255,255,255,.2);
    --preset:#0f0; --preset-bg:#003300;
    --block:#f00; --block-bg:#330000;
    --save:#0ff; --save-bg:#003333;
    --mark:#ff0; --mark-fg:#000;
    --on-solid:#000; --focus:#ff0; --titulos:#fff;
  }
  /* ═══ FIN DE LA PALETA ═══ */
  :root{
    --fs:18px; --lh:1.55; --w:1100px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  [data-font="serif"]{ --ff: Georgia, "Times New Roman", serif }
  [data-font="sans"]{ --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
  [data-font="dyslexic"]{
    --ff: Verdana, Tahoma, "Comic Sans MS", sans-serif;
    letter-spacing: .03em; word-spacing: .1em;
  }

  *{box-sizing:border-box}
  /* hidden gana siempre, también a clases con display:flex */
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ff);
    background:var(--bg); color:var(--fg);
    font-size:var(--fs); line-height:var(--lh);
    max-width:var(--w); margin:0 auto; padding:20px;
    transition:background .15s, color .15s;
  }
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}
  /* Enlaces y foco con los colores del tema: los del navegador (azul,
     morado) casi no se ven en los temas oscuros */
  a{color:var(--accent)}
  h1, h2, h3, h4{color:var(--titulos)}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  /* Iconos del sprite: miden lo que la letra y toman su color */
  .ico{
    width:1.15em; height:1.15em; flex-shrink:0;
    fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
    vertical-align:-.2em;
  }
  /* Botón con icono y texto */
  .con-ico{ display:inline-flex; align-items:center; gap:.4em; }
  /* ═══ Cabecera ═══ */
  header{
    background: var(--bg);
    padding: 12px 0 0;
  }
  header .header-top{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin-bottom: 4px;
  }
  header #h-title{
    margin: 0;
    padding: 0;
    border: none;
    font-size: 1.6em;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  header .header-actions{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  header .header-actions button{
    font-size: .78em;
    padding: 6px 12px;
  }
  header .header-actions .lang-select{
    flex-shrink: 0;
  }
  header .header-actions-right{
    flex: 0 0 auto;
    margin-left: auto;   /* ← empuja el grupo a la derecha */
  }
  
  header .meta{
    color: var(--muted);
    font-size: .72em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    min-width: 0;
    flex: 1 1 auto;
  }
  header .meta .meta-text{
    flex: 1 1 auto;
    min-width: 0;
  }
  header .meta .meta-text > span{
    margin-right: 4px;
  }
  #total-r2{ font-weight: bold; }
  button, a.boton{
    cursor:pointer; padding:8px 14px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg);
    border-radius:6px;
    font-family:inherit; font-size:.8em; font-weight:500;
    transition:filter .1s, background .1s;
  }
  button:hover, a.boton:hover{filter:brightness(.95)}
  a.boton{ text-decoration:none; }
  button.primary{
    background:var(--accent); color:var(--on-solid); border-color:var(--accent); font-weight:bold;
  }
  button.active{
    background:var(--accent); color:var(--on-solid); border-color:var(--accent);
  }

  .btn-preset{
    border:2px solid var(--preset); background:transparent; color:var(--preset);
    font-weight:600;
    display:inline-flex; align-items:center; gap:.35em;
  }
  .btn-preset .preset-nombre{
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .btn-preset:hover{background:var(--preset-bg)}
  .btn-preset.active{background:var(--preset); color:var(--on-solid)}
  .preset-wrap{
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .preset-menu{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px var(--shadow);
    min-width: 220px;
    padding: 6px;
    z-index: 50;
  }
  .preset-item{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: .82em;
    text-align: left;
    font-weight: 500;
  }
  .preset-item:hover{ background: var(--quote-bg); }
  .preset-item.active{
    background: var(--preset-bg);
    color: var(--preset);
    font-weight: 600;
  }
  .preset-item .preset-check{
    display: inline-flex;
    width: 1.15em;
    flex-shrink: 0;
    color: var(--preset);
    opacity: 0;
  }
  .preset-item.active .preset-check{ opacity: 1; }
  .preset-sep{
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }
  .preset-item.preset-empezar{ color:var(--save); font-weight:600; }
  .preset-item.preset-manage{
    color: var(--muted);
    font-size: .78em;
  }

  .btn-pendientes{
    border:2px solid var(--save); background:transparent; color:var(--save);
    font-weight:600;
  }
  .btn-pendientes:hover{background:var(--save-bg)}
  .btn-pendientes{
    position: relative;
  }
  .pend-count{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    margin-left: 4px;
    border-radius: 8px;
    background: var(--save);
    color: var(--on-solid);
    font-size: .85em;
    font-weight: 700;
    line-height: 1;
    vertical-align: middle;
  }
  .pend-count[data-count="0"]{ display: none; }
  .btn-pendientes.has-pendientes{
    background: var(--save-bg);
  }

  select.lang-select{
    padding:7px 10px; border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg); border-radius:6px;
    font-family:inherit; font-size:.78em;
  }

  /* ═══ Paneles ═══ */
  .panel{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:100; display:none; padding:20px;
    overflow-y:auto;
  }
  .panel.open{display:flex}
  .panel-inner{
    background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:12px;
    max-width:1200px; width:100%;
    max-height:calc(100vh - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative; margin:auto;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .panel-header{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px;
    padding:18px 24px 12px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .panel-header h2{margin:0; font-size:1em; letter-spacing:.03em}
  .panel-close{
    background:transparent; border:1px solid var(--btn-border);
    padding:4px 10px; font-size:1em; line-height:1; border-radius:6px;
    flex-shrink:0;
  }
  .panel-body{
    padding:14px 24px 20px;
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .panel-body h3{
    margin:16px 0 6px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .panel-body h3:first-of-type{border-top:none; padding-top:0; margin-top:0}
  .panel-acciones{
    display:flex; justify-content:flex-end; gap:8px;
    flex-wrap:wrap;
    padding:12px 24px 18px;
    border-top:1px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
  }

  .opt-row{
    display:flex; align-items:center; gap:14px;
    padding:8px 0; border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .opt-row:first-of-type{border-top:none}
  .opt-label{
    color:var(--muted); font-size:.65em; letter-spacing:.05em;
    text-transform:uppercase; min-width:110px;
  }
  .opt-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .ac-colores{margin:-4px 0 14px; display:flex; flex-direction:column; gap:8px}
  .ac-color{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.8em}
  .ac-color input[type="color"]{width:44px; height:44px; padding:2px; border:1px solid var(--btn-border); border-radius:8px; background:var(--btn-bg); cursor:pointer}
  .ac-contraste{color:var(--muted); font-variant-numeric:tabular-nums}
  .ac-contraste.poco{color:var(--block); font-weight:600}
  .opt-val{
    font-weight:bold; min-width:44px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em;
  }

  .list-grupos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:4px;
    max-height:260px; overflow-y:auto;
    padding:8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .ctrl-override{
    display:grid; grid-template-columns:1fr 40px 40px; gap:6px;
    margin-bottom:8px;
  }
  .ctrl-override input{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .ctrl-override button{
    padding:0; font-size:.9em; font-weight:700;
    border:1px solid var(--border); border-radius:6px;
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .ctrl-override button:hover{ color:var(--accent); border-color:var(--accent); }
  .ctrl-override button.ignorar:hover{ color:var(--block); border-color:var(--block); }
  .ov-list{
    display:flex; flex-wrap:wrap; gap:4px;
    min-height:24px;
  }
  .ov-item{
    display:inline-flex; align-items:center; gap:6px;
    padding:2px 4px 2px 10px;
    border-radius:12px; font-size:.72em;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .ov-item.first{ background:var(--preset-bg); color:var(--preset); border:1px solid var(--preset); }
  .ov-item.ignore{ background:var(--block-bg); color:var(--block); border:1px solid var(--block); }
  .ov-item button{
    background:transparent; border:none; cursor:pointer;
    color:inherit; padding:0 6px; font-size:1.1em; line-height:1;
    border-radius:8px;
  }
  .ov-item button:hover{ background:rgba(0,0,0,.08); }
  .grupo-item{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; cursor:pointer;
    padding:5px 8px; border-radius:4px;
  }
  .grupo-item:hover{background:var(--quote-bg)}
  .grupo-item input{accent-color:var(--accent); width:1.1em; height:1.1em}
  .grupo-item .flag{
    font-size:.85em; color:var(--accent); opacity:.7;
    margin-left:auto; padding-left:6px;
  }
/* ── Cabeceras de super-grupo (lista de grupos) ── */
.grupo-cat-header{
  grid-column: 1 / -1;
  padding: 8px 8px 4px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.grupo-cat-header:first-child{ border-top: none; margin-top: 0; }
.grupo-cat-toggle-wrap{
  display: flex; align-items: center; gap: 8px;
  font-size: .78em; color: var(--muted);
  cursor: pointer; user-select: none;
}
.grupo-cat-toggle-wrap input{ accent-color: var(--accent); }
.grupo-cat-toggle-wrap strong{ color: var(--fg); }
.grupo-cat-count{
  background: var(--quote-bg);
  border: 1px solid var(--border);
  padding: 0 6px;
  border-radius: 8px;
  font-size: .85em;
  color: var(--muted);
}
  .ctrl-medios{
    display:grid; grid-template-columns:1fr auto; gap:8px;
    margin-bottom:8px;
  }
  .ctrl-medios input,
  .ctrl-medios select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .filtro-medio-add{
    display: flex;
    align-items: center;
    gap: 8px;
    margin: -2px 0 8px;
    padding: 8px 10px;
    background: var(--quote-bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: .78em;
  }
  .filtro-medio-add-label{
    flex: 1;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filtro-medio-add-label code{
    color: var(--fg);
    font-weight: 600;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .filtro-medio-add-btn{
    padding: 4px 12px;
    font-size: .9em;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    background: transparent;
    white-space: nowrap;
  }
  .filtro-medio-add-btn.force{
    border: 1px solid var(--preset);
    color: var(--preset);
  }
  .filtro-medio-add-btn.force:hover{ background: var(--preset-bg); }
  .filtro-medio-add-btn.ignore{
    border: 1px solid var(--block);
    color: var(--block);
  }
  .filtro-medio-add-btn.ignore:hover{ background: var(--block-bg); }
  .list-medios{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
    max-height:420px; overflow-y:auto;
  }
  .medio-fila{
    display:grid;
    grid-template-columns:34px 34px minmax(140px,1.2fr) 1.6fr 1.4fr;
    gap:8px; align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .medio-fila:last-child{border-bottom:none}
  .medio-fila.estado-incluir{background:var(--preset-bg)}
  .medio-fila.estado-ignorar{background:var(--block-bg)}
  .medio-fila .celda{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .medio-fila .celda-grupo{color:var(--muted); font-size:.9em}
/* ── Cabeceras de super-grupo (lista de medios) ── */
.medio-cat-header{
  padding: 10px 10px 4px;
  font-size: .68em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  background: var(--quote-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}

  .chk{display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none}
  .chk input{display:none}
  .chk span{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--btn-border);
    font-size:.9em; font-weight:700;
    background:transparent; color:var(--muted);
    transition:all .1s;
  }
  .chk:hover span{border-color:var(--accent)}
  .chk span .ico{ width:14px; height:14px; }
  .chk.incluir input:checked + span{
    background:var(--preset); border-color:var(--preset); color:var(--on-solid);
  }
  .chk.ignorar input:checked + span{
    background:var(--block); border-color:var(--block); color:var(--on-solid);
  }

  textarea.preset-texto{
    width:100%; min-height:180px; padding:12px;
    border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg);
    font-family:var(--ff); font-size:.82em;
    line-height:1.6; resize:vertical;
  }
  /* ═══ Pestaña Temas de la configuración: una caja por modo ═══ */
  .temas-ayuda{ margin:0 0 12px; font-size:.72em; color:var(--muted); }
  .temas-ayuda summary{ cursor:pointer; list-style:none; }
  .temas-ayuda summary::-webkit-details-marker{ display:none; }
  .temas-ayuda-q{
    display:inline-block; width:1.5em; height:1.5em; line-height:1.4em;
    margin-left:4px; text-align:center;
    border:1px solid var(--border); border-radius:50%;
  }
  .temas-ayuda[open] .temas-ayuda-q{ background:var(--quote-bg); color:var(--fg); }
  .temas-ayuda ul{ margin:6px 0 0; padding-left:1.2em; line-height:1.7; }
  .temas-ayuda code{ background:var(--quote-bg); color:var(--fg); padding:0 4px; border-radius:3px; }

  .backup-box{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.75em;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:space-between;
  }
  .backup-box .msg{color:var(--muted); flex:1; min-width:180px}
  .backup-box .acciones{display:flex; gap:8px; flex-wrap:wrap}

  /* ═══ Filtros ═══ */
.filtros-wrap{
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 9;
  padding: 6px 0 0;
}
.filtros-row{
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto auto auto auto;
  gap: 8px;
  align-items: center;
  padding-bottom: 10px;
}
.filtros-panel{
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--btn-border);
  border-radius: 12px;
  width: min(640px, calc(100% - 32px));
  max-height: calc(100dvh - 32px);
  padding: 20px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.filtros-panel::backdrop{ background: rgba(0,0,0,.4); }
.filtros-cab{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
.filtros-cab h2{ margin:0; font-size:1.1em; }
.filtros-panel label > span{ display:block; font-size:.78em; margin-bottom:4px; }
.filtros-panel select, .filtros-panel input[type="date"]{ width:100%; min-height:44px; }
.filtros-panel fieldset{ margin:18px 0 0; padding:12px; border:1px solid var(--border); border-radius:8px; }
.filtros-panel legend{ font-size:.85em; }
.filtros-panel .vs-radio{ min-height:44px; }
.filtros-panel .vs-radio span{ margin:0; }
.filtros-lectura{ display:grid; grid-template-columns:1fr 1fr; }
/* Escritorio: el mismo diálogo, abierto sin modal, va en línea bajo la barra. */
.filtros-panel:not(:modal){
  position:static; width:auto; max-width:none; max-height:none;
  margin:0; padding:0 0 10px; border:0; border-radius:0; overflow:visible;
}
.filtros-panel:not(:modal) .filtros-cab,
.filtros-panel:not(:modal) .vs-radio small{ display:none; }
.filtros-panel:not(:modal) .filtros{ grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); }
.filtros-panel:not(:modal) .filtros label > span{
  position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap;
}
.filtros-panel:not(:modal) select,
.filtros-panel:not(:modal) input[type="date"],
.filtros-panel:not(:modal) .vs-radio{ min-height:0; }
.filtros-panel:not(:modal) fieldset{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin:8px 0 0; padding:0; border:0; }
.filtros-panel:not(:modal) legend{ float:left; padding:0; font-size:.78em; color:var(--muted); }
.filtros-panel:not(:modal) .filtros-lectura{ display:flex; flex-wrap:wrap; gap:0 4px; }
.filtros-wrap .preset-wrap{ min-width:0; max-width:240px; }
.filtros-wrap .btn-preset{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:44px; }
#btn-filtros, #btn-buscar, #btn-pase, #btn-lectura, #filtros-cerrar{ min-height:44px; opacity:1; font-size:.78em; }
#btn-pase, #btn-lectura{ min-width:44px; justify-content:center; }
#btn-buscar{ display:none; }
@media (max-width: 640px){
  .filtros-row{ grid-template-columns:minmax(0,1fr) auto auto auto auto; gap:6px; }
  .filtros-wrap .preset-wrap{ max-width:none; }
  #btn-buscar{ display:inline-flex; align-items:center; gap:6px; }
  .filtros-row .filtro-buscar-wrap, .filtros-row #btn-prensa{ display:none; }
  .filtros-wrap.busqueda-abierta .filtro-buscar-wrap{ display:block; grid-row:2; grid-column:1 / 5; }
  .filtros-wrap.busqueda-abierta #btn-prensa{ display:inline-flex; grid-row:2; grid-column:5; min-height:44px; }
  .filtros-panel{ margin:auto 0 0; width:100%; max-width:none; max-height:85dvh; border-radius:16px 16px 0 0; padding:16px 16px max(16px, env(safe-area-inset-bottom)); }
  .filtros-lectura{ grid-template-columns:1fr; }
}
.filtros{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.filtros select{
  font-size: .78em;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  min-width: 0;
}
.filtros input[type="date"]{
  font-size: .78em;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  min-width: 0;
}
/* ═══ Prensa externa en el panel ═══ */
.filtros-sep{
  height: 1px;
  background: var(--border);
  margin: 10px 0 8px;
}
.filtros-prensa{
  font-size: .78em;
}
.chk-prensa{
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  color: var(--muted);
  padding: 2px 0;
}
.chk-prensa input{
  accent-color: var(--save);
  width: 1.1em;
  height: 1.1em;
  margin: 0;
  cursor: pointer;
}
.chk-prensa input:checked + span{
  color: var(--fg);
  font-weight: 600;
}
.cfg-toggle{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--quote-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  font-size: .78em;
  margin-bottom: 8px;
}
.cfg-toggle input{
  accent-color: var(--save);
  width: 1.1em;
  height: 1.1em;
  margin-top: .15em;
  flex-shrink: 0;
  cursor: pointer;
}
.cfg-toggle .cfg-toggle-txt{
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.cfg-toggle .cfg-toggle-title{ font-weight: 600; color: var(--fg); }
.cfg-toggle .cfg-toggle-hint{ color: var(--muted); font-size: .9em; line-height: 1.4; }
.filtros-prensa-selects{
  display: grid;
  grid-template-columns: auto 1fr 1fr auto;
  gap: 8px;
  align-items: end;
  margin-top: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--quote-bg);
}
.filtros-prensa-selects[hidden]{ display: none; }
.filtros-prensa-selects > label{
  display: grid;
  gap: 3px;
  min-width: 0;
}
.filtros-prensa-selects > label > span{
  color: var(--muted);
  text-transform: uppercase;
  font-size: .85em;
  letter-spacing: .05em;
  font-weight: 600;
}
.fp-chks{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  padding: 5px 0;
}
.fp-chk{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
  color: var(--muted);
  font-weight: 500;
}
.fp-chk input{
  accent-color: var(--save);
  width: 1em;
  height: 1em;
  margin: 0;
  cursor: pointer;
}
.fp-chk input:checked + span{
  color: var(--fg);
  font-weight: 600;
}
.filtros-prensa-selects select{
  font-size: 1em;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  width: 100%;
  min-width: 0;
}
.prensa-reset{
  padding: 6px 10px;
  font-size: 1.1em;
  line-height: 1;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  transition: color .15s, border-color .15s;
  align-self: end;
}
.prensa-reset:hover{
  color: var(--accent);
  border-color: var(--accent);
}
@media (max-width: 560px){
  .filtros-prensa-selects{
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .fp-fuentes{
    grid-column: 1 / -1;
  }
  .prensa-reset{
    grid-column: 2 / 3;
    justify-self: end;
  }
}
.buscar-clear{
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 1.1em;
  line-height: 1;
  cursor: pointer;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.buscar-clear:hover{
  background: var(--quote-bg);
  color: var(--fg);
}
/* ═══ Pestañas de búsqueda con modo activo: «Modo · N» / «Todo · M» ═══ */
.preset-pestanas{
  display: flex;
  gap: 6px;
  margin: 8px 0 4px;
  font-size: .75em;
}
.preset-pestanas[hidden]{ display: none; }
.preset-pestanas button{
  background: transparent;
  color: var(--preset);
  border: 1px solid var(--preset);
  border-radius: 6px;
  padding: 4px 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  font-size: .95em;
}
.preset-pestanas button[aria-selected="true"]{
  background: var(--preset);
  color: var(--on-solid);
}
[data-theme="contrast"] .preset-pestanas button[aria-selected="true"]{ color: #000; }
/* ═══ Tarjeta de eltiempo: va encima de la lista, no es una noticia ═══ */
.tiempo-tarjeta{
  margin: 6px 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--quote-bg);
  font-size: .8em;
}
.tiempo-tarjeta[hidden]{ display: none; }
.tiempo-tarjeta .sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tiempo-cab{ display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tiempo-cab strong{ font-size: 1.15em; }
.tiempo-cab span, .tiempo-msg, .tiempo-pie, .tiempo-min, .tiempo-sol{ color: var(--muted); }
.tiempo-msg{ margin: 0; }
.tiempo-ahora{ display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; flex-wrap: wrap; }
.tiempo-ahora > .ico{ width: 2em; height: 2em; }
.tiempo-temp{ font-size: 1.9em; font-weight: 700; line-height: 1; }
.tiempo-sol{ margin-left: auto; }
.tiempo-dias{ display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
.tiempo-dias::-webkit-scrollbar{ display: none; }
.tiempo-dias li{ flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 6px; background: var(--bg); }
.tiempo-dias .ico{ width: 1.4em; height: 1.4em; }
.tiempo-dia{ font-weight: 600; text-transform: capitalize; }
.tiempo-lluvia .ico{ width: 1em; height: 1em; vertical-align: -2px; }
.tiempo-pie{ margin-top: 8px; font-size: .9em; }
.tiempo-pie a{ color: inherit; }
.tiempo-pie button, .tiempo-elegir button{ font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.tiempo-pie button{ padding: 1px 8px; margin-left: 6px; }
.tiempo-elegir{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tiempo-elegir button{ padding: 5px 10px; text-align: left; }
.tiempo-elegir button span{ color: var(--muted); }
/* ═══ Panel de avisos (alertas:): el mismo recuadro que el tiempo. El nivel
   va siempre escrito; el color del borde solo lo acompaña. ═══ */
.aviso[data-nivel="amarillo"], .btn-avisos[data-nivel="amarillo"]{ --aviso: #e0b000; }
.aviso[data-nivel="naranja"],  .btn-avisos[data-nivel="naranja"]{ --aviso: #e65100; }
.aviso[data-nivel="rojo"],     .btn-avisos[data-nivel="rojo"]{ --aviso: #d32f2f; }
.avisos-grupo h3{ font-size: 1em; margin: 10px 0 4px; }
.avisos-grupo ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.avisos-grupo details{ margin-top: 6px; }
.avisos-grupo summary{ cursor: pointer; color: var(--muted); }
.avisos-grupo details ul{ margin-top: 6px; }
.aviso{ padding: 2px 0 2px 10px; border-left: 4px solid var(--aviso); }
.aviso-nivel{ font-weight: 700; margin-right: 6px; }
.aviso-cuando{ display: block; color: var(--muted); }
.aviso-texto{ margin: 2px 0 0; }
.aviso button{ font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; padding: 1px 8px; margin-top: 4px; }
.btn-avisos{ border: 2px solid var(--aviso); font-weight: 600; }
.btn-avisos[hidden]{ display: none; }
.btn-avisos .ico{ color: var(--aviso); }
[data-theme="contrast"] .aviso, [data-theme="contrast"] .btn-avisos{ --aviso: #fff; }
/* ═══ Chips de modo y de tema: «Todo · N» / «Política · M» / «incendio · K»…
   Una fila por nivel; cada fila hace scroll horizontal en móvil. ═══ */
.temas-chips{
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 6px 0 4px;
  font-size: .72em;
}
.temas-chips-fila{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.temas-chips-fila::-webkit-scrollbar{ display: none; }
.temas-chips[hidden]{ display: none; }
.temas-chips button.cero{ opacity: .45; cursor: default; }
.temas-chips button{
  flex: none;
  white-space: nowrap;
  background: transparent;
  color: var(--preset);
  border: 1px solid var(--preset);
  border-radius: 999px;
  padding: 3px 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: .95em;
}
.temas-chips button[aria-pressed="true"]{
  background: var(--preset);
  color: var(--on-solid);
}
/* Fila de temas bajo la de modos: sangrada y atenuada; el pulsado, como siempre. */
.temas-chips-fila.hija{ padding-left: 4px; }
.temas-chips-fila.hija::before{
  content: '↳';
  flex: none;
  align-self: center;
  color: var(--muted);
}
.temas-chips-fila.hija button:not([aria-pressed="true"]){
  color: var(--muted);
  border-color: var(--border);
}
[data-theme="contrast"] .temas-chips button[aria-pressed="true"]{ color: #000; }

  /* ═══ Chips de filtros activos ═══ */

  }
  [data-theme="contrast"] .badge.recolectado{
    background:#000; border-color:#ff0; color:#ff0;
  }

  .badge.estimada{

  }

    background:#1a2d47; border-color:#4a7ab5; color:#a0c4f8;
  }
  [data-theme="sepia"] .badge.estimada{
    background:#dae4ef; border-color:#8fa9c4; color:#2e5a8b;
  }
  [data-theme="contrast"] .badge.estimada{
    background:#003; border-color:#0ff; color:#0ff;
  }
  .badge.prensa{

  }
  [data-theme="dark"] .badge.prensa{
    background:#3d2f14; border-color:#b58600; color:#ffcc66;
  }
  [data-theme="sepia"] .badge.prensa{
    background:#f5e6c3; border-color:#c9a227; color:#5c4a1c;
  }
  [data-theme="contrast"] .badge.prensa{
    background:#000; border-color:#ff0; color:#ff0;
  }
  .noticia a.titular{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:1em; display:block; margin-top:2px;
  }
  .noticia a.titular:hover{text-decoration:underline}
  [data-just="1"] .noticia a.titular{text-align:justify; hyphens:auto}
  /* Móvil: cabecera de la tarjeta en una línea; sin tipo de medio y solo «hace…» */

  mark{background:var(--mark); color:var(--mark-fg); padding:0 3px; border-radius:2px}

  .aj-modo-cab .aj-activo{ font-size:.72em; }
  .aj-pista{
    margin:0 0 12px; padding:10px 12px; border-radius:6px;
    background:var(--save-bg); color:var(--fg); font-size:.75em; line-height:1.5;
  }
  .aj-bloque{ border:1px solid var(--border); border-radius:8px; margin-bottom:10px; padding:0 14px 14px; }
  .aj-bloque:not([open]){ padding-bottom:0; }
  .aj-bloque > summary{
    display:flex; align-items:center; gap:8px;
    margin:0 -14px; padding:12px 14px; cursor:pointer; list-style:none;
    font-size:.82em; font-weight:700;
  }
  .aj-bloque > summary::-webkit-details-marker{ display:none; }
  .aj-bloque > summary::after{
    content:''; margin-left:auto; width:.5em; height:.5em;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg); transition:transform .15s;
  }
  .aj-bloque[open] > summary::after{ transform:rotate(-135deg); }
  .aj-n{ color:var(--muted); font-weight:400; }
  .aj-bloque textarea.preset-texto{ min-height:110px; padding:8px 10px; margin-bottom:8px; }
  .aj-pegar{ margin:8px 0; }
  .aj-pegar > summary{ cursor:pointer; color:var(--save); font-size:.75em; font-weight:600; }
  .aj-resumen{ margin-top:6px; }
  .aj-zona-peligro{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:16px; }
  .aj-zona-peligro button{ font-size:.75em; }
  .aj-zona-peligro button.danger{ color:var(--block); border-color:var(--block); }
  .aj-zona-peligro button.danger:hover{ background:var(--block-bg); }

  /* Feed */
  .aj-radios{
    display:flex; flex-direction:column; gap:2px;
    padding:10px 12px; margin-bottom:8px;
    background:var(--quote-bg); border:1px solid var(--border); border-radius:6px;
    font-size:.78em;
  }
  .aj-radios-tit{ font-weight:600; margin-bottom:4px; }
  .aj-radios label{ display:flex; align-items:flex-start; gap:8px; padding:3px 0; cursor:pointer; }
  .aj-radios input{ accent-color:var(--save); margin-top:.2em; }
  .aj-radios small{ display:block; color:var(--muted); font-size:.9em; }

  .aj-aviso{
    padding:10px 12px; margin:8px 0; border-radius:6px;
    border:1px solid #e0a800; background:#fff8e1; color:#5d4200;
    font-size:.75em; line-height:1.45;
  }
  .aj-aviso p{ display:flex; gap:8px; align-items:flex-start; margin:0; }
  .aj-aviso .ico{ margin-top:.1em; }
  .aj-aviso .aj-fila-fin{ margin-top:8px; }
  [data-theme="dark"] .aj-aviso{ background:#3a2e00; color:#ffe08a; border-color:#a07b00; }
  [data-theme="sepia"] .aj-aviso{ background:#f3e3b8; color:#4f3a00; border-color:#b8962e; }
  [data-theme="contrast"] .aj-aviso{ background:#000; color:#ff0; border-color:#ff0; }

  /* Ayuda */
  .aj-atajos{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.78em; margin:0; }
  .aj-atajos dt{ font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; }
  .aj-atajos dd{ margin:0; color:var(--muted); }

  @media (max-width: 819.98px){
    .panel-ajustes[data-ruta=""] .aj-contenido{ display:none; }
    .panel-ajustes:not([data-ruta=""]) .aj-nav{ display:none; }
  }
  @media (min-width: 820px){
    .panel-ajustes{ background:rgba(0,0,0,.25); }
    .panel-ajustes .aj-inner{
      width:min(900px, 100vw); margin:0 0 0 auto;
      border-left:1px solid var(--border);
      box-shadow:-12px 0 40px rgba(0,0,0,.25);
    }
    .aj-resize{
      display:block; position:absolute; z-index:2; left:0; top:0;
      width:12px; height:100%; padding:0; border:0;
      background:transparent; cursor:ew-resize; touch-action:none;
    }
    .aj-resize::after{
      content:''; position:absolute; left:3px; top:50%;
      width:3px; height:36px; border-radius:3px;
      background:var(--border); transform:translateY(-50%);
    }
    .aj-resize:hover::after, .aj-resize:focus-visible::after{ background:var(--accent); }
    .aj-nav{ flex:0 0 240px; border-right:1px solid var(--border); }
    .aj-nav .panel-close{ display:none; }
    .aj-secciones .aj-flecha{ display:none; }
    .aj-atras{ display:none; }
    .panel-ajustes[data-ruta="modo"] .aj-atras{ display:inline-flex; }
  }

  /* ═══ Destino inline (➕ / 🚫 sin modo activo) ═══ */
  .destino-inline{
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--quote-bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: .72em;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .destino-inline[hidden]{ display: none; }
  .destino-inline .destino-lbl{
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 600;
    margin-right: 4px;
  }
  .destino-inline .destino-btn{
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: 1em;
    line-height: 1.3;
  }
  .destino-inline .destino-btn:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
  .destino-inline .destino-btn.activo{
    background: var(--preset-bg);
    border-color: var(--preset);
    color: var(--preset);
    font-weight: 600;
  }
  .destino-inline .destino-btn.nuevo{
    border-style: dashed;
    color: var(--save);
  }
  .destino-inline .destino-btn.nuevo:hover{
    border-color: var(--save);
    background: var(--save-bg);
  }






  /* Pase automático: solo cambia el titular al vencer el temporizador. */
  .pase-controles{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}
  .pase-controles button,.pase-controles select,.pase-contenido button{font:inherit;color:var(--fg);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:6px;padding:8px}
  .pase-controles button:disabled{opacity:.5}
  #pase-capa{box-sizing:border-box;position:fixed;inset:0;width:100%;max-width:none;height:100%;height:100dvh;max-height:none;margin:0;padding:20px;border:0;background:var(--bg);color:var(--fg);overflow:auto}
  #pase-capa[open]{display:flex;flex-direction:column}
  #pase-capa::backdrop{background:var(--bg)}
  .pase-contenido{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:850px;margin:auto;gap:24px;padding:24px 0}
  .pase-titular{font-size:clamp(1.4em,4vw,2.6em);line-height:1.4;color:var(--titulos);overflow-wrap:anywhere}
  .pase-medio{color:var(--muted)}
  .pase-estado{font-size:.85em;text-align:center}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════
   SWITCH DE BACKEND (CF ↔ Deno)
   - Al arrancar, intenta el backend guardado (por defecto CF).
   - Si el manifest falla, conmuta al otro backend.
   - Si un fetch falla mid-sesión estando en CF, conmuta a Deno y reintenta.
   - Al volver a la pestaña tras >5 min oculta, re-prueba CF si estamos en Deno.
   ═══════════════════════════════════════════════════════════════ */

function _leerBackendGuardado(){
  try {
    const v = localStorage.getItem(BACKEND_KEY);
    if (v === 'cf' || v === 'deno') return v;
  } catch(e){}
  return 'cf';
}

function _guardarBackend(nombre){
  try { localStorage.setItem(BACKEND_KEY, nombre); } catch(e){}
}

function _aplicarBackend(nombre){
  if (nombre !== 'cf' && nombre !== 'deno') nombre = 'cf';
  BACKEND_ACTIVO = nombre;
  DATA_BASE     = BACKENDS[nombre].data;
  WORKER_BUSCAR = BACKENDS[nombre].buscar;
}

function _otroBackend(){
  return BACKEND_ACTIVO === 'cf' ? 'deno' : 'cf';
}

// Combina un signal externo con timeout si estamos en CF.
function _signalConTimeout(signal, timeoutMs){
  if (BACKEND_ACTIVO !== 'cf' || !timeoutMs) return signal;
  const t = AbortSignal.timeout(timeoutMs);
  return signal ? AbortSignal.any([signal, t]) : t;
}

// Conmuta al otro backend una sola vez por ráfaga de fallos.
async function _conmutarBackendPorFallo(){
  if (_conmutacionEnCurso) return _conmutacionEnCurso;
  const nuevo = _otroBackend();
  _conmutacionEnCurso = (async () => {
    console.info(`[backend] fallo en ${BACKEND_ACTIVO} → conmutando a ${nuevo}`);
    _aplicarBackend(nuevo);
    _guardarBackend(nuevo);
    setTimeout(() => { _conmutacionEnCurso = null; }, 5000);
  })();
  return _conmutacionEnCurso;
}

// Probe silencioso a CF. No bloquea, no avisa.
async function _probarCFEnBackground(){
  _ultimoRecheckCF = Date.now();
  try {
    const r = await fetch(`${BACKENDS.cf.data}/manifest.json`, {
      cache: 'no-store',
      signal: AbortSignal.timeout(2500),
    });
    if (!r.ok) return false;
    if (BACKEND_ACTIVO === 'deno'){
      console.info('[backend] CF responde de nuevo → volviendo a CF');
      _aplicarBackend('cf');
      _guardarBackend('cf');
    }
    return true;
  } catch(e){
    return false;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (BACKEND_ACTIVO !== 'deno') return;
  if (Date.now() - _ultimoRecheckCF < BACKEND_RECHECK_MS) return;
  _probarCFEnBackground();
});

// Manifest con timeout y fallback automático.
// Devuelve el objeto parseado, o lanza si ambos backends fallan.
async function _fetchManifestConFallback(signal){
  const intentar = async (nombre) => {
    const url = `${BACKENDS[nombre].data}/manifest.json`;
    let sig = signal;
    if (nombre === 'cf'){
      const t = AbortSignal.timeout(BACKEND_TIMEOUT_MANIFEST_MS);
      sig = signal ? AbortSignal.any([signal, t]) : t;
    }
    const r = await fetch(url, { cache: 'no-cache', signal: sig });
    if (!r.ok) throw new Error('manifest HTTP ' + r.status);
    return await r.json();
  };

  const principal = _leerBackendGuardado();
  _aplicarBackend(principal);

  try {
    return await intentar(principal);
  } catch(e){
    if (signal && signal.aborted) throw e;   // abort real del caller
    const otro = principal === 'cf' ? 'deno' : 'cf';
    console.info(`[backend] ${principal} falló (${e.message}) → probando ${otro}`);
    const data = await intentar(otro);
    _aplicarBackend(otro);
    _guardarBackend(otro);
    return data;
  }
}

  if (!s) return '';
  let x = String(s).trim();
  let changed = true;
  while (changed){
    changed = false;
    if (x.startsWith('<![CDATA[')){ x = x.slice(9); changed = true; }
    if (x.endsWith(']]>')){ x = x.slice(0, -3); changed = true; }
    x = x.trim();
  }
  return x;
}
function _escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function parseLista(txt){
  return txt.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
// accion (opcional): { texto, fn } → botón dentro del aviso, p. ej. «Deshacer».
function toast(msg, ms, accion){
  ms = ms || 2400;
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  if (accion){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-accion';
    b.textContent = accion.texto;
    b.addEventListener('click', () => { el.remove(); accion.fn(); }, { once: true });
    el.appendChild(b);
  }
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, ms);
}
function debounce(fn, ms){
  let t;
  const wrapped = function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(() => { t = null; fn.apply(ctx, args); }, ms);
  };
  wrapped.cancel = () => { clearTimeout(t); t = null; };
  return wrapped;
}

   FECHAS
   ═══════════════════════════════════════════════════════════════ */
const HORIZONTE_FUTURO_MS = 1 * 60 * 60 * 1000;

let ABS_FMT = null;
let ABS_FMT_LANG = null;
const ABS_CACHE = new Map();

function getAbsFmt(){
  if (ABS_FMT_LANG !== ACCES.lang){
    ABS_FMT = new Intl.DateTimeFormat(ACCES.lang, {
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    ABS_FMT_LANG = ACCES.lang;
    ABS_CACHE.clear();
  }
  return ABS_FMT;
}

  
function parseFecha(s){
  if (!s) return NaN;
  const str = String(s).trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m){
    const [, d, mo, y, h = 0, mi = 0, se = 0] = m;
    const t = new Date(+y, +mo - 1, +d, +h, +mi, +se).getTime();
    return isNaN(t) ? NaN : t;
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(str)){
    const t = Date.parse(str);
    if (!isNaN(t)) return t;
  }
  const t = Date.parse(str);
  return !isNaN(t) ? t : NaN;
}

// En la tarjeta la parte absoluta va aparte para ocultarla en móvil (CSS).
function fechaTarjetaHtml(ts){
  const txt = formatearFecha(ts);
  const corte = txt.lastIndexOf(' · ');
  if (corte < 0 || ts > Date.now()) return escapeHtml(txt);
  return `<span class="fecha-abs">${escapeHtml(txt.slice(0, corte + 3))}</span>${escapeHtml(txt.slice(corte + 3))}`;
}

function formatearFecha(ts){
  if (isNaN(ts)) return '';
  let abs = ABS_CACHE.get(ts);
  if (abs === undefined){
    abs = getAbsFmt().format(ts);
    ABS_CACHE.set(ts, abs);
  }
  const diff = Date.now() - ts;
  if (diff < 0) return abs + ' · ' + t('fechaProgramado');
  if (diff >= 7 * 86400000) return abs;
  const min = (diff / 60000) | 0;
  const hr  = (diff / 3600000) | 0;
  const dia = (diff / 86400000) | 0;
  let rel;
  if (min < 1) rel = t('fechaAhora');
  else if (min < 60) rel = t('fechaHaceMin', { n: min });
  else if (hr < 24) rel = t('fechaHaceH', { n: hr });
  else rel = t('fechaHaceD', { n: dia });
  return abs + ' · ' + rel;
}

function accesPrimeraVisita(){
  const o = { ...ACCES_DEF };
  if (Object.keys(localStorage).some(k => k.startsWith('voceiro-'))) return o;
  const langs = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || ''];
  for (const l of langs){
    const c = String(l).toLowerCase().split('-')[0];
    if (I18N[c]){ o.lang = c; break; }

  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) o.tema = 'dark';
  localStorage.setItem('voceiro-acces-v2', JSON.stringify(o));

               ? p.overrides : {},

      const p = JSON.parse(raw);
      if (p && Array.isArray(p.lista) && p.lista.length){
        const lista = p.lista.map(normalizarPreset);
        const activo = (typeof p.activo === 'string' && lista.some(x => x.id === p.activo))
                       ? p.activo : lista[0].id;
        const borrados = (p.borrados && typeof p.borrados === 'object') ? p.borrados : {};
        return { lista, activo, borrados };
      }
    }
  }catch(e){}
  // Sin datos previos → crear "General" vacío
  return {

    borrados: {}

// Cada modo lleva la fecha de su último cambio y cada borrado la suya: así
// la sincronización junta los modos de varios dispositivos uno a uno.
function huellasDeModos(){
  return new Map(((PRESETS && PRESETS.lista) || []).map(m => [m.id, huellaModo(m)]));
}
// Sella los modos que cambiaron desde el último guardado y apunta los que
// desaparecieron. Devuelve si hubo algún cambio.
function sellarModos(){
  const antes = _huellasModos || huellasDeModos();
  const ahora = Date.now();
  if (!PRESETS.borrados || typeof PRESETS.borrados !== 'object') PRESETS.borrados = {};
  let cambio = false;
  const vivos = new Set();
  PRESETS.lista.forEach(m => {
    vivos.add(m.id);
    if (antes.get(m.id) !== huellaModo(m)){ m.actualizado = ahora; cambio = true; }
    delete PRESETS.borrados[m.id];
  });
  antes.forEach((h, id) => {
    if (!vivos.has(id)){ PRESETS.borrados[id] = ahora; cambio = true; }
  });
  _huellasModos = huellasDeModos();
  return cambio;
}

// Guarda el modo activo. PRESET es el mismo objeto que su entrada en la

function guardarPreset(){
  if (!PRESETS || !Array.isArray(PRESETS.lista)) return;
  const idx = PRESETS.lista.findIndex(p => p.id === PRESETS.activo);
  if (idx >= 0 && PRESETS.lista[idx] !== PRESET){
    PRESET = Object.assign(PRESETS.lista[idx], PRESET);
  }
  guardarPresets();
  actualizarBotonPreset();
}

function setOverride(domain, value, modo = PRESET){
  if (!modo) return;
  if (!modo.overrides || typeof modo.overrides !== 'object') modo.overrides = {};
  if (!value){
    delete modo.overrides[domain];
  } else if (value === 'first' || value === 'ignore'){
    modo.overrides[domain] = value;
  }
  if (modo === PRESET) guardarPreset();
  else guardarPresets();
}

let _relanzarTimer = null;

function actualizarBotonPreset(){
  const btn = $('#btn-preset');
  if (!btn) return;

  const activo = PRESET_ACTIVO && PRESET;
  const temas = vistaTemasActiva();
  const nombre = temas  ? t('presetVistaTemas')
               : activo ? (PRESET.nombre || 'General') : t('presetSinFiltro');

  btn.innerHTML = (temas ? ico('hash') : '')
    + `<span class="preset-nombre">${escapeHtml(nombre)}</span>` + ico('chevron-down');
  btn.classList.toggle('active', !!activo || temas);

  const menu = $('#preset-menu');
  if (menu && menu.style.display !== 'none'){
    renderPresetMenu();
  }
}
function renderPresetMenu(){
  const menu = $('#preset-menu');
  if (!menu) return;

  const lista = (PRESETS && PRESETS.lista) || [];
  const activo = PRESETS ? PRESETS.activo : '';

  let html = '';
  lista.forEach(p => {
    const isActive = PRESET_ACTIVO && p.id === activo;
    html += `<button type="button" class="preset-item${isActive ? ' active' : ''}" data-preset-id="${escapeHtml(p.id)}">
      <span class="preset-check">${ico('check')}</span>
      <span>${escapeHtml(p.nombre)}</span>
    </button>`;
  });

  if (!lista.some(p => presetTieneReglas(p))){
    html += `<button type="button" class="preset-item preset-empezar" data-preset-id="__empezar">
      ${ico('plus')}<span>${escapeHtml(t('pistaEmpezar'))}</span>
    </button>`;
  }
  html += '<div class="preset-sep"></div>';
  const enTemas = vistaTemasActiva();
  if (TEMAS_TODOS.length){
    html += `<button type="button" class="preset-item${enTemas ? ' active' : ''}" data-preset-id="__temas">
    <span class="preset-check">${ico('check')}</span>
    ${ico('hash')}<span>${escapeHtml(t('presetVistaTemas'))}</span>
  </button>`;
  }
  html += `<button type="button" class="preset-item${!PRESET_ACTIVO && !enTemas ? ' active' : ''}" data-preset-id="__sinfiltro">
    <span class="preset-check">${ico('check')}</span>
    <span>${escapeHtml(t('presetSinFiltro'))}</span>
  </button>`;
  html += '<div class="preset-sep"></div>';
  html += `<button type="button" class="preset-item preset-manage" data-preset-id="__gestionar">
    ${ico('settings')}
    <span>${escapeHtml(t('presetGestionar'))}</span>
  </button>`;

  menu.innerHTML = html;

  menu.querySelectorAll('.preset-item').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.presetId;
      if (id === '__gestionar'){
        cerrarPresetMenu();
        abrirAjustes('modos');
        return;
      }
      if (id === '__empezar'){
        cerrarPresetMenu();
        MODO_EDITADO = PRESETS.activo;
        abrirAjustes('modo');
        return;
      }
      if (id === '__temas'){
        PRESET_ACTIVO = false;
        guardarPresetActivo();
        ponerVistaTemas(true);
        actualizarBotonPreset();
        aplicarFiltros();
        cerrarPresetMenu();
        return;
      }
      if (id === '__sinfiltro'){
        PRESET_ACTIVO = false;
        guardarPresetActivo();
        ponerVistaTemas(false);
        actualizarBotonPreset();
        aplicarFiltros();
        cerrarPresetMenu();
        return;
      }
      const target = PRESETS.lista.find(p => p.id === id);
      if (!target) return;
      PRESETS.activo = id;
      PRESET = target;
      PRESET_ACTIVO = true;
      guardarPresets();
      guardarPresetActivo();
      recompilarPreset();
      actualizarBotonPreset();
      aplicarFiltros();
      cerrarPresetMenu();
    });
  });
}

let _destinoIdxAbierto = -1;

function cerrarDestinoInline(){
  if (_destinoIdxAbierto < 0) return;
  const el = document.querySelector('.destino-inline[data-idx="' + _destinoIdxAbierto + '"]');
  if (el){ el.hidden = true; el.innerHTML = ''; }
  _destinoIdxAbierto = -1;
}

function abrirDestinoInline(idx, accion){
  // Toggle: si ya estaba abierto en esta tarjeta, cerrar
  if (_destinoIdxAbierto === idx){
    cerrarDestinoInline();
    return;
  }
  cerrarDestinoInline();

  const cont = document.querySelector('.destino-inline[data-idx="' + idx + '"]');
  if (!cont) return;

  const activoId = PRESET_ACTIVO && PRESETS ? PRESETS.activo : null;

  let html = `<span class="destino-lbl">${
    escapeHtml(accion === 'first' ? t('destinoAnadirA') : t('destinoBloquearEn'))
  }</span>`;

  if (accion === 'ignore'){
    html += `<button type="button" class="destino-btn" data-destino-id="__todos">${escapeHtml(t('destinoTodosModos'))}</button>`;
  }
  PRESETS.lista.forEach(p => {
    const activo = p.id === activoId;
    html += `<button type="button" class="destino-btn${activo ? ' activo' : ''}"
                    data-destino-id="${escapeHtml(p.id)}">${escapeHtml(p.nombre)}</button>`;
  });

  html += `<button type="button" class="destino-btn nuevo" data-destino-id="__nuevo">+ ${escapeHtml(t('destinoNuevoModo'))}</button>`;

  cont.innerHTML = html;
  cont.hidden = false;
  _destinoIdxAbierto = idx;

  cont.querySelectorAll('.destino-btn').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      const id = b.dataset.destinoId;
      const n = ULT_FILTRADAS[idx];
      if (!n) { cerrarDestinoInline(); return; }

      if (id === '__todos'){
        PRESETS.lista.forEach(p => {
          if (!p.overrides) p.overrides = {};
          p.overrides[n.dominio] = 'ignore';
        });
        guardarPresets();
        ajRefrescar();
        toast(`${t('destinoOkTodos')} · ${n.medio || n.dominio}`, 2400);
        cerrarDestinoInline();
        return;
      }
      if (id === '__nuevo'){
        const nuevo = crearModoYDevolver();
        if (nuevo) aplicarOverrideEnModo(nuevo, accion, n.dominio, n.medio || n.dominio);
        cerrarDestinoInline();
        return;
      }
      const target = PRESETS.lista.find(p => p.id === id);
      if (target) aplicarOverrideEnModo(target, accion, n.dominio, n.medio || n.dominio);
      cerrarDestinoInline();
    });
  });
}

function aplicarOverrideEnModo(targetPreset, accion, dominio, medioNombre){
  if (!targetPreset) return;

  if (targetPreset === PRESET){
    // Ruta normal: reusa setOverride (persiste, refresca botón de preset)
    setOverride(dominio, accion);
  } else {
    if (!targetPreset.overrides || typeof targetPreset.overrides !== 'object'){
      targetPreset.overrides = {};
    }
    targetPreset.overrides[dominio] = accion;
    guardarPresets();
  }

  ajRefrescar();

  if (PRESET_ACTIVO && targetPreset === PRESET){
    aplicarFiltros();
    const ok = accion === 'first' ? t('destinoOkAnadido') : t('destinoOkBloqueado');
    toast(`${ok} · ${medioNombre}`, 2000);
  } else {
    const ok = accion === 'first' ? t('destinoOkAnadidoEn') : t('destinoOkBloqueadoEn');
    toast(`${ok} «${targetPreset.nombre}» · ${medioNombre}`, 2400);
  }
}

function crearModoYDevolver(){
  const nombre = prompt(t('cfgModoNombrePrompt'), '');
  if (nombre == null) return null;
  const limpio = nombre.trim();
  if (!limpio) return null;

  const nuevo = {
    id: 'm-' + Date.now().toString(36),
    nombre: limpio,
    grupos: [],
    palabras: [],
    overrides: {},
  };
  PRESETS.lista.push(nuevo);
  guardarPresets();
  ajRefrescar();
  return nuevo;
} 
/* ═══════════════════════════════════════════════════════════════
   BIONIC
   ═══════════════════════════════════════════════════════════════ */
const BIONIC_CACHE = new Map();
const BIONIC_CACHE_MAX = 8000;

function bionicize(html){
  if (!ACCES.bionic) return html;
  const cached = BIONIC_CACHE.get(html);
  if (cached !== undefined) return cached;
  let result = html;
  try{
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const root = doc.body.firstChild;
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => {
      const raw = tn.textContent;
      if (!raw || !/[\wÁÉÍÓÚÑáéíóúñ]/.test(raw)) return;
      const frag = doc.createDocumentFragment();
      const re = /([\wÁÉÍÓÚÑáéíóúñ]+)/g;
      let last = 0, m;
      while ((m = re.exec(raw)) !== null){
        if (m.index > last) frag.appendChild(doc.createTextNode(raw.slice(last, m.index)));
        const w = m[1];
        const half = Math.max(1, Math.ceil(w.length / 2));
        const b = doc.createElement('b');
        b.textContent = w.slice(0, half);
        frag.appendChild(b);
        frag.appendChild(doc.createTextNode(w.slice(half)));
        last = m.index + w.length;
      }
      if (last < raw.length) frag.appendChild(doc.createTextNode(raw.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    result = root.innerHTML;
  }catch(e){ result = html; }
  if (BIONIC_CACHE.size >= BIONIC_CACHE_MAX) BIONIC_CACHE.clear();
  BIONIC_CACHE.set(html, result);
  return result;
}

function updateFocus(){
  const items = document.querySelectorAll('.noticia');
  if (!ACCES.focus){
    items.forEach(el => el.classList.remove('foco-dim','foco-active'));
    return;
  }
  if (!items.length) return;
  const mid = window.innerHeight / 2;
  let best = null, bd = Infinity;
  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bd){ bd = d; best = el; }
  });
  items.forEach(el => {
    el.classList.toggle('foco-dim', el !== best);
    el.classList.toggle('foco-active', el === best);
  });
}
window.addEventListener('scroll', () => {
  if (ACCES.focus) requestAnimationFrame(updateFocus);
}, { passive: true });




/* ═══════════════════════════════════════════════════════════════
   RESALTADO + IDIOMA
   El resaltado marca exactamente lo que casó con el texto de la búsqueda
   (rangosResaltado, shared/busqueda/texto.js): misma regla que el filtro.
   ═══════════════════════════════════════════════════════════════ */
function resaltarTitular(texto, compilado){
  if (!texto) return '';
  let out = '', last = 0;
  for (const [i, j] of rangosResaltado(texto, compilado)){
    out += escapeHtml(texto.slice(last, i)) + '<mark>' + escapeHtml(texto.slice(i, j)) + '</mark>';
    last = j;
  }
  return out + escapeHtml(texto.slice(last));
}
