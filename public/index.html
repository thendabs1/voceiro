function importarDesdeFormatoVoceiro(data){
  if (data.acces && typeof data.acces === 'object'){
    ACCES = { ...ACCES_DEF, ...data.acces };
    if (!I18N[ACCES.lang]) ACCES.lang = 'es';
    guardarAcces();
  }

  if (Array.isArray(data.sites)){
    setSitesFromArray(data.sites);
    guardarSitesCache();
    if (USCRIPT_OK){
      SITES.forEach((s, d) => {
        document.dispatchEvent(new CustomEvent('voceiro-update-site', {
          detail: { domain: d, lang: s.lang, type: s.type, tags: s.tags }
        }));
      });
    }
  }

  if (data.voceiro && Array.isArray(data.voceiro.presets) && data.voceiro.presets.length){
    const lista = data.voceiro.presets.map(normalizarPreset);
    PRESETS = { lista, activo: lista[0].id };
    PRESET = PRESETS.lista[0];
    guardarPresets();
    recompilarPreset();
  }

  if (typeof data.presetActivo === 'boolean'){
    PRESET_ACTIVO = data.presetActivo && presetTieneReglas();
  } else {
    PRESET_ACTIVO = presetTieneReglas();
  }
  guardarPresetActivo();
}

function importarDesdeFormatoLector(data){
  if (data.prefs && typeof data.prefs === 'object'){
    const p = data.prefs;
    if (['light','sepia','dark','contrast'].includes(p.theme)) ACCES.tema = p.theme;
    if (FONT_MAP_FROM_LECTOR[p.font]) ACCES.fuente = FONT_MAP_FROM_LECTOR[p.font];
    if (typeof p.fs === 'number' && p.fs >= LIM.fs.min && p.fs <= LIM.fs.max) ACCES.fs = p.fs;
    if (typeof p.width === 'number'){
      ACCES.width = Math.max(LIM.width.min, Math.min(LIM.width.max, p.width));
    }
    if (typeof p.just === 'boolean') ACCES.just = p.just;
    if (typeof p.bionic === 'boolean') ACCES.bionic = p.bionic;
    if (typeof p.focus === 'boolean') ACCES.focus = p.focus;
  }
  if (typeof data.lang === 'string' && I18N[data.lang]) ACCES.lang = data.lang;
  guardarAcces();

  const known = new Set(MEDIOS_UNICOS.map(m => m.dominio));
  const arr = [];
  (data.sites || []).forEach(s => {
    if (!s || !s.domain) return;
    const d = String(s.domain).toLowerCase().trim();
    if (!known.has(d)) return;
    arr.push({
      domain: d,
      lang: s.lang || 'auto',
      type: s.type || '',
      tags: s.tags || []
    });
  });
  (data.disabledDomains || []).forEach(d0 => {
    const d = String(d0).toLowerCase().trim();
    if (!known.has(d)) return;
    if (!arr.some(x => x.domain === d)){
      arr.push({
        domain: d,
        lang: 'auto',
        type: '',
        tags: []
      });
    }
  });
  setSitesFromArray(arr);
  guardarSitesCache();
  if (data.voceiro && Array.isArray(data.voceiro.presets) && data.voceiro.presets.length){
    const lista = data.voceiro.presets.map(normalizarPreset);
    PRESETS = { lista, activo: lista[0].id };
    PRESET = PRESETS.lista[0];
    guardarPresets();
    recompilarPreset();
  }
  PRESET_ACTIVO = presetTieneReglas();
  guardarPresetActivo();
}

function importarConfig(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('JSON inválido');
      if (!confirm(t('impConfirm'))) return;

      const formato = detectarFormato(data);
      let msgOk = t('impOk');

      if (formato === 'voceiro' || formato === 'combo'){
        importarDesdeFormatoVoceiro(data);
        msgOk = t('impFromVoceiro');
      } else if (formato === 'userscript'){
        importarDesdeFormatoLector(data);
        msgOk = t('impFromLector');
      } else {
        throw new Error('Formato no reconocido');
      }

      aplicarAcces();
      aplicarTextos();
      reconstruirSelectores();
      construirIndicesBusqueda();
      actualizarBotonPreset();
      if (MEDIOS_UNICOS.length) escribirPanel(PRESET);
      aplicarFiltros();
      toast(msgOk, 2400);
    }catch(e){
      toast(t('impErr', { msg: e.message || String(e) }), 3000);
    }
  };
  reader.onerror = () => toast(t('impErr', { msg: 'read error' }), 3000);
  reader.readAsText(file);
}

/* ─── Fetch FreeNewsAPI ─── */
async function bsFetchFreenews(reset){
  const params = new URLSearchParams();
  params.set('q', BS_STATE.q);
  params.set('size', String(BS_STATE.size));
  params.set('offset', String(reset ? 0 : BS_STATE.freenews.offset));
  params.set('sort', 'date');
  if (BS_STATE.lang)    params.set('lang', BS_STATE.lang);
  if (BS_STATE.country) params.set('country', BS_STATE.country);
  if (BS_STATE.date && BS_STATE.date !== 'todo') params.set('date', BS_STATE.date);
  if (BS_STATE.country === 'ES') params.set('tld', 'es,cat,gal');

  const res = await fetch(`${FREENEWS_URL}?${params.toString()}`);
  if (!res.ok) throw new Error('FreeNews HTTP ' + res.status);
  const data = await res.json();

  const nuevos = (data.results || []).map(r => ({
    _src: 'freenews',
    title: bsLimpiarTitulo(r.title),
    url: r.url,
    host: bsHostLimpio(r.host),
    pubDate: r.published_at,
    description: r.description || '',
    image: r.image || '',
  }));

  BS_STATE.freenews.items = BS_STATE.freenews.items.concat(nuevos);
  BS_STATE.freenews.total = data.total || 0;
  BS_STATE.freenews.offset = (reset ? 0 : BS_STATE.freenews.offset) + nuevos.length;
  BS_STATE.freenews.hayMas = BS_STATE.freenews.offset < BS_STATE.freenews.total;
}

/* ─── Fetch Google News (vía rss2json) ─── */
async function bsFetchGnews(){
  const lang = BS_STATE.lang || 'es';
  const country = BS_STATE.country || 'ES';
  const ceid = country + ':' + lang;

  const feedUrl = 'https://news.google.com/rss/search?q='
    + encodeURIComponent(BS_STATE.q)
    + '&hl=' + lang + '&gl=' + country + '&ceid=' + ceid;

  const url = GNEWS_PROXY + encodeURIComponent(feedUrl);
  const res = await fetch(url);
  if (!res.ok) throw new Error('GNews HTTP ' + res.status);
  const data = await res.json();
  if (data.status !== 'ok') throw new Error('GNews: ' + (data.message || 'error'));

  const nuevos = (data.items || []).map(it => ({
    _src: 'gnews',
    title: it.title,                       // ya viene limpio del Worker
    url: it.link,
    host: bsHostLimpio(it.source || ''),   // nombre del medio
    sourceName: it.source || '',           // campo explícito para mostrar
    pubDate: it.pubDate,
    description: '',
    image: '',
  }));

  BS_STATE.gnews.items = bsFiltrarPorFecha(nuevos, BS_STATE.date);
  BS_STATE.gnews.total = BS_STATE.gnews.items.length;
}

/* ─── Dedup por título normalizado ─── */
function bsDedup(items){
  const visto = new Map();
  const out = [];
  for (const item of items){
    const key = normStrict(item.title);
    if (!key){ out.push(item); continue; }
    const existente = visto.get(key);
    if (!existente){
      visto.set(key, item);
      out.push(item);
      continue;
    }
    // Preferimos FreeNewsAPI (URL directa) sobre Google News (redirect)
    if (existente._src === 'gnews' && item._src === 'freenews'){
      const idx = out.indexOf(existente);
      if (idx >= 0){
        item._dup = item._dup || [];
        item._dup.push(existente);
        out[idx] = item;
        visto.set(key, item);
      }
    } else {
      existente._dup = existente._dup || [];
      existente._dup.push(item);
    }
  }
  return out;
}

/* ─── Buscar ─── */
async function bsBuscar(reset){
  const q = document.getElementById('bs-q').value.trim();
  if (!q){ toast(t('bsErrorQ'), 1800); return; }
  if (BS_STATE.cargando) return;

  BS_STATE.q       = q;
  BS_STATE.lang    = document.getElementById('bs-lang').value;
  BS_STATE.country = document.getElementById('bs-country').value;
  BS_STATE.date    = document.getElementById('bs-date').value;
  BS_STATE.fuentes.freenews = document.getElementById('bs-f-freenews').checked;
  BS_STATE.fuentes.gnews    = document.getElementById('bs-f-gnews').checked;

  if (reset){
    BS_STATE.freenews = { items: [], total: 0, offset: 0, hayMas: false };
    BS_STATE.gnews    = { items: [], total: 0 };
  }

  BS_STATE.cargando = true;
  const estado = document.getElementById('bs-estado');
  estado.textContent = t('bsCargando');
  document.getElementById('bs-go').disabled = true;

  const promesas = [];
  if (BS_STATE.fuentes.freenews) promesas.push(bsFetchFreenews(reset));
  if (BS_STATE.fuentes.gnews && reset) promesas.push(bsFetchGnews());

  const settled = await Promise.allSettled(promesas);
  settled.forEach(s => { if (s.status === 'rejected') console.error('Fuente falló:', s.reason); });

  bsCombinarYRender();

  BS_STATE.cargando = false;
  document.getElementById('bs-go').disabled = false;
}

/* ─── Combinar + ordenar + dedup + render ─── */
function bsCombinarYRender(){
  const todos = [...BS_STATE.freenews.items, ...BS_STATE.gnews.items];

  todos.sort((a, b) => {
    const ta = Date.parse(a.pubDate) || 0;
    const tb = Date.parse(b.pubDate) || 0;
    return tb - ta;
  });

  BS_STATE.resultados = bsDedup(todos);

  bsRender();
  try{ sessionStorage.setItem(BS_SESSION_KEY, JSON.stringify({
    q: BS_STATE.q, lang: BS_STATE.lang, country: BS_STATE.country, date: BS_STATE.date,
    fuentes: BS_STATE.fuentes,
    freenews: BS_STATE.freenews,
    gnews: BS_STATE.gnews
  })); }catch(e){}
}

function bsRender(){
  const cont = document.getElementById('bs-resultados');
  const estado = document.getElementById('bs-estado');
  const resultados = BS_STATE.resultados;

  if (!resultados.length){
    cont.innerHTML = '';
    estado.textContent = t('bsSinResultados');
    document.getElementById('bs-mas-wrap').style.display = 'none';
    return;
  }

  const total = resultados.length;
  const dupCount = (BS_STATE.freenews.total + BS_STATE.gnews.total) - total;
  estado.textContent = t('bsResultados', { n: total })
    + (dupCount > 0 ? ' · ' + dupCount + ' duplicados' : '');

  cont.innerHTML = resultados.map((r, i) => bsRenderItem(r, i)).join('');

  const puedeMas = BS_STATE.fuentes.freenews && BS_STATE.freenews.hayMas;
  document.getElementById('bs-mas-wrap').style.display = puedeMas ? '' : 'none';
}

function bsRenderItem(r, i){
  const enCatalogo = r._src === 'freenews'
    && r.host
    && MEDIOS_UNICOS.some(m => m.dominio === r.host);
  const fechaRel = bsFechaRel(r.pubDate);
  const srcLabel = r._src === 'freenews' ? 'FreeNews' : 'Google News';
  const srcClass = r._src === 'freenews' ? 'bs-badge-fn' : 'bs-badge-gn';
  const hostMostrar = r.sourceName || r.host || (r._src === 'gnews' ? 'Google News' : '');

  let dupHtml = '';
  if (r._dup && r._dup.length){
    const etiquetas = r._dup.map(d => d.host || (d._src === 'freenews' ? 'FreeNews' : 'Google News')).join(', ');
    dupHtml = `<div class="bs-dup">🔁 También en: ${escapeHtml(etiquetas)}</div>`;
  }

  const desc = r.description ? `<div class="bs-desc">${escapeHtml(bsLimpiarTitulo(r.description))}</div>` : '';

  return `<article class="bs-resultado" data-idx="${i}">
    <div class="bs-meta">
      <span class="bs-medio">${escapeHtml(hostMostrar)}</span>
      ${enCatalogo ? `<span class="bs-badge">✓ ${escapeHtml(t('bsVerificado'))}</span>` : ''}
      <span class="bs-badge ${srcClass}">${escapeHtml(srcLabel)}</span>
      ${fechaRel ? `<span>· ${escapeHtml(fechaRel)}</span>` : ''}
    </div>
    <a class="bs-titular" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>
    ${desc}
    ${dupHtml}
    <div class="bs-acciones">
      <button class="btn-mini btn-bs-guardar" data-idx="${i}">${t('bsGuardar')}</button>
    </div>
  </article>`;
}

/* ─── Sesión ─── */
function bsCargarSesion(){
  try{
    const raw = sessionStorage.getItem(BS_SESSION_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s) return;
    if (s.freenews) BS_STATE.freenews = s.freenews;
    if (s.gnews)    BS_STATE.gnews = s.gnews;
    if (s.q)        document.getElementById('bs-q').value = s.q;
    if (s.lang)     document.getElementById('bs-lang').value = s.lang;
    if (s.country)  document.getElementById('bs-country').value = s.country;
    if (s.date)     document.getElementById('bs-date').value = s.date;
    if (s.fuentes){
      document.getElementById('bs-f-freenews').checked = s.fuentes.freenews !== false;
      document.getElementById('bs-f-gnews').checked    = s.fuentes.gnews !== false;
    }
    if (BS_STATE.freenews.items.length || BS_STATE.gnews.items.length){
      bsCombinarYRender();
    }
  }catch(e){}
}

/* ─── Eventos ─── */
function bsWireEventos(){
  document.getElementById('bs-go').addEventListener('click', () => bsBuscar(true));
  document.getElementById('bs-q').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); bsBuscar(true); }
  });
  document.getElementById('bs-mas').addEventListener('click', () => bsBuscar(false));

  document.getElementById('bs-f-freenews').addEventListener('change', () => bsBuscar(true));
  document.getElementById('bs-f-gnews').addEventListener('change',    () => bsBuscar(true));

  document.getElementById('bs-resultados').addEventListener('click', e => {
    const b = e.target.closest('.btn-bs-guardar');
    if (!b) return;
    e.preventDefault();
    const r = BS_STATE.resultados[parseInt(b.dataset.idx, 10)];
    if (!r) return;

    if (!USCRIPT_OK){
      const texto = `${r.title}\n${r.url}`;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(
          () => toast(t('saveCopied'), 2400),
          () => toast('No se pudo copiar', 2000)
        );
      }
      return;
    }

    document.dispatchEvent(new CustomEvent('voceiro-save-later', {
      detail: { url: r.url, title: r.title, description: r.description || '', image: r.image || '' }
    }));
  });
}

function bsAbrir(){

  abrirPanel('panel-buscar');
  if (!BS_STATE.resultados.length) bsCargarSesion();
}
/* ═══════════════════════════════════════════════════════════════
   FILTRADO + RENDER
   ═══════════════════════════════════════════════════════════════ */
let ULT_FILTRADAS = [];
let ULT_RX = null;
let ULT_PRESET_EFECTIVO = false;

const RENDER_BATCH = 150;
let RENDER_OFFSET = 0;
let SENTINEL_OBSERVER = null;

function aplicarFiltros(){
  const raw = $('#buscar').value.trim();
  const parsed = parseQuery(raw);
  renderChips(parsed, raw);

  const g = $('#grupo').value;
  const t2 = $('#tipo').value;
  const m = $('#medio').value;
  const dias = parseInt($('#rango').value, 10) || 0;
  const orden = $('#orden').value || 'recientes';

  const ahora = Date.now();
  const limiteMs = dias ? dias * 24 * 3600 * 1000 : 0;
  const presetEfectivo = PRESET_ACTIVO && presetTieneReglas();

  const hayMedio   = parsed.medios.length   > 0;
  const hayDominio = parsed.dominios.length > 0;
  const hayGrupo   = parsed.grupos.length   > 0;
  const hayTipo    = parsed.tipos.length    > 0;
  const hayTag     = parsed.tags.length     > 0;
  const hayTitulo  = parsed.titulo.length   > 0;

  let filtradas = NOTICIAS.filter(n => {
    const cumple = presetEfectivo ? cumplePreset(n) : false;
    n._esPreset = cumple;
    if (presetEfectivo && !cumple) return false;

    if (g && n.grupo !== g) return false;
    if (t2 && n.tipo  !== t2) return false;
    if (m && !(n._medioStrict || (n._medioStrict = normStrict(n.medio))).includes(normStrict(m))) return false;
    if (limiteMs){
      const ts = n._tsOrden;
      if (isNaN(ts)) return false;
      if (ahora - ts > limiteMs) return false;
    }
    if (HIDE_MODE !== 'off'){
      const key = normalizeUrlForMatch(n.enlace);
      const pluginItem = PENDIENTES_MAP.get(key);
      const esLeida = LEIDAS_LOCAL.has(key) || (pluginItem && pluginItem.read);
      if ((HIDE_MODE === 'read' || HIDE_MODE === 'both') && esLeida) return false;
      if ((HIDE_MODE === 'viewed' || HIDE_MODE === 'both') && VISTAS_LOCAL.has(key)) return false;
    }

    if (hayMedio){
      const ms = n._medioStrict || (n._medioStrict = normStrict(n.medio));
      for (let i = 0; i < parsed.medios.length; i++){
        if (ms.indexOf(parsed.medios[i]) === -1) return false;
      }
    }
    if (hayDominio){
      const ds = n._domStrict || (n._domStrict = normDomain(n.dominio));
      for (let i = 0; i < parsed.dominios.length; i++){
        if (ds.indexOf(parsed.dominios[i]) === -1) return false;
      }
    }
    if (hayGrupo){
      const gs = n._grupoStrict || (n._grupoStrict = normStrict(n.grupo));
      for (let i = 0; i < parsed.grupos.length; i++){
        if (gs.indexOf(parsed.grupos[i]) === -1) return false;
      }
    }
    if (hayTipo){
      const ts = n._tipoStrict || (n._tipoStrict = normStrict(n.tipo));
      for (let i = 0; i < parsed.tipos.length; i++){
        if (ts.indexOf(parsed.tipos[i]) === -1) return false;
      }
    }
    if (hayTag){
      const tags = n._tagsStrict || (n._tagsStrict = (n.tags || []).map(normStrict));
      for (let i = 0; i < parsed.tags.length; i++){
        if (!tags.some(x => x.indexOf(parsed.tags[i]) !== -1)) return false;
      }
    }
    if (hayTitulo){
      const tn = n._titNorm || (n._titNorm = normalize(n.titular));
      for (let i = 0; i < parsed.titulo.length; i++){
        if (tn.indexOf(parsed.titulo[i]) === -1) return false;
      }
    }
    return true;
  });

  const FAV_WINDOW_MS = 24 * 3600 * 1000;   // 24 h

  filtradas.sort((a, b) => {
    // Favoritos (✓ en Modo Personalizado), solo si son recientes y el modo está activo
    if (presetEfectivo){
      const aFav = getOverride(a.dominio) === 'first'
                   && !isNaN(a._tsOrden)
                   && (ahora - a._tsOrden) < FAV_WINDOW_MS;
      const bFav = getOverride(b.dominio) === 'first'
                   && !isNaN(b._tsOrden)
                   && (ahora - b._tsOrden) < FAV_WINDOW_MS;
      const fa = aFav ? 1 : 0;
      const fb = bFav ? 1 : 0;
      if (fa !== fb) return fb - fa;
    }

    // Programadas lejanas al final (>6h en el futuro)
    const H6 = 6 * 3600 * 1000;
    const aLejos = a._esFuturo && !isNaN(a._tsShow) && (a._tsShow - ahora > H6);
    const bLejos = b._esFuturo && !isNaN(b._tsShow) && (b._tsShow - ahora > H6);
    if (aLejos !== bLejos) return aLejos - bLejos;

    // Orden normal por fecha
    const ta = isNaN(a._tsOrden) ? 0 : a._tsOrden;
    const tb = isNaN(b._tsOrden) ? 0 : b._tsOrden;
    if (ta !== tb) return orden === 'antiguos' ? ta - tb : tb - ta;
    const da = a.dominio || '';
    const db = b.dominio || '';
    if (da !== db) return da < db ? -1 : 1;
    const xa = a.titular || '';
    const xb = b.titular || '';
    if (xa !== xb) return xa < xb ? -1 : 1;
    return 0;
  });

  ULT_FILTRADAS = filtradas;
  ULT_RX = buildHighlightRegex(parsed.titulo);
  ULT_PRESET_EFECTIVO = presetEfectivo;

  renderizar();
}

function renderizar(){
  const lista = ULT_FILTRADAS;
  const totalHistorico = (_manifest && _manifest.total) || NOTICIAS.length;
  const cargadas = NOTICIAS.length;

  let txt = `Mostrando ${lista.length.toLocaleString()} de ${cargadas.toLocaleString()} cargados`;
  if (totalHistorico !== cargadas){
    txt += ` · ${totalHistorico.toLocaleString()} en total`;
  }
  if (ULT_PRESET_EFECTIVO) txt += t('contadorPreset');
  $('#contador').textContent = txt;
  const cont = $('#resultados');
  cont.innerHTML = '';
  RENDER_OFFSET = 0;

  if (!lista.length){
    cont.innerHTML = `<div class="vacio">${escapeHtml(t('vacio'))}</div>`;
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    return;
  }

  const sentinel = document.createElement('div');
  sentinel.id = 'render-sentinel';
  cont.appendChild(sentinel);

  appendBatch();

  if (SENTINEL_OBSERVER) SENTINEL_OBSERVER.disconnect();
  SENTINEL_OBSERVER = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) appendBatch();
  }, { rootMargin: '400px' });
  SENTINEL_OBSERVER.observe(sentinel);

  if (ACCES.focus) requestAnimationFrame(updateFocus);
}

function renderItemHtml(n, idx){
  let fechaHtml = '';
  if (n._tipoShow === 'pub'){
    const esFuturo = n._esFuturo;
    fechaHtml = `<span class="badge${esFuturo ? ' futuro' : ''}">· ${escapeHtml(formatearFecha(n._tsShow))}</span>`;
  } else if (n._tipoShow === 'est'){
    fechaHtml = `<span class="badge estimada" title="${escapeHtml(t('sinFechaReal'))}">🕓 ${escapeHtml(formatearFecha(n._tsShow))}</span>`;
  } else if (!isNaN(n._tsShow)){
    const fecha = `${t('recolectado')} ${formatearFecha(n._tsShow)}`;
    fechaHtml = `<span class="badge recolectado">${escapeHtml(fecha)}</span>`;
  } else {
    fechaHtml = `<span class="badge recolectado">${escapeHtml(t('recolectado'))}</span>`;
  }

  let tituloHtml;
  if (ULT_RX) tituloHtml = resaltar(n.titular, ULT_RX);
  else        tituloHtml = n._titularEsc;
  if (ACCES.bionic) tituloHtml = bionicize(tituloHtml);
  const key = normalizeUrlForMatch(n.enlace);
  const guardada = PENDIENTES_URLS.has(key);
  const item = PENDIENTES_MAP.get(key);
  const leida = (guardada && item && item.read) || LEIDAS_LOCAL.has(key);
  const vista = !leida && VISTAS_LOCAL.has(key);

  let saveLabel, saveTitle;
  if (leida){
    saveLabel = t('saveLabelRead');
    saveTitle = t('markUnread');
  } else if (guardada){
    saveLabel = t('saveLabelPending');
    saveTitle = t('markRead');
  } else {
    saveLabel = t('saveLabelSave');
    saveTitle = t('saveForLaterTitle');
  }

  const presetBadge = n._esPreset
    ? `<span class="badge preset">${n._grupoEsc}</span>`
    : `<span class="badge">${n._grupoEsc}</span>`;

  const blockTitle = t('blockMedia');

  // Bloque de duplicados (solo si los hay y AGRUPAR_DUPS está activo)
  let dupsHtml = '';
  if (AGRUPAR_DUPS && n._dupHidden && n._dupHidden.length){
    const otros = n._dupHidden.map(o => {
      return `<div class="dup-item">
        <span class="dup-medio">${escapeHtml(o.medio)}</span>
        <a href="${escapeHtml(o.enlace)}" target="_blank" rel="noopener">Abrir</a>
      </div>`;
    }).join('');
    const nLabel = n._dupHidden.length;
    dupsHtml = `<details class="dups-details">
      <summary>${escapeHtml(t('dupsMore', { n: nLabel }))}</summary>
      <div class="dups-list">
        <div style="font-size:.85em;color:var(--muted);margin-bottom:4px;">${escapeHtml(t('dupsTitle'))}</div>
        ${otros}
      </div>
    </details>`;
  }

  return `<article class="noticia${leida ? ' leida' : (vista ? ' vista' : '')}" data-idx="${idx}">
    <div class="cabecera">
      <span class="medio">${n._medioEsc}</span>
      <span class="badge">${n._tipoEsc}</span>
      ${presetBadge}
      ${fechaHtml}
      <button class="btn-save-text btn-save-item" type="button" data-idx="${idx}" title="${escapeHtml(saveTitle)}" aria-label="${escapeHtml(saveTitle)}">${escapeHtml(saveLabel)}</button>
      <span class="cab-spacer"></span>
      <button class="btn-mini btn-block-item" type="button" data-idx="${idx}" title="${escapeHtml(blockTitle)}" aria-label="${escapeHtml(blockTitle)}">🚫</button>
      <button class="btn-mini btn-report-item" type="button" data-idx="${idx}" title="${escapeHtml(t('repBtnTitle'))}" aria-label="${escapeHtml(t('repBtnTitle'))}">🐞</button>
    </div>
    <a class="titular" href="${n._enlaceEsc}" target="_blank" rel="noopener">${tituloHtml}</a>
    ${dupsHtml}
  </article>`;
}

function appendBatch(){
  const cont = $('#resultados');
  const sentinel = document.getElementById('render-sentinel');
  if (!sentinel) return;

  const total = ULT_FILTRADAS.length;
  const end = Math.min(RENDER_OFFSET + RENDER_BATCH, total);
  if (RENDER_OFFSET >= end) {
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    sentinel.remove();
    return;
  }

  let html = '';
  for (let i = RENDER_OFFSET; i < end; i++){
    html += renderItemHtml(ULT_FILTRADAS[i], i);
  }
  sentinel.insertAdjacentHTML('beforebegin', html);
  RENDER_OFFSET = end;
  observarNoticias();

  if (RENDER_OFFSET >= total){
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    sentinel.remove();
  }
}
function wireResultadosDelegation(){
  const cont = $('#resultados');
  // ── Vista por hover ──
  const VISTA_HOVER_MS = 1200;

  cont.addEventListener('mouseover', e => {
    const art = e.target.closest('.noticia');
    if (!art) return;
    if (art.classList.contains('vista') || art.classList.contains('leida')) return;
    if (VISTAS_TIMERS.has(art)) return;

    const i = parseInt(art.dataset.idx, 10);
    const n = ULT_FILTRADAS[i];
    if (!n) return;

    const tmr = setTimeout(() => {
      VISTAS_TIMERS.delete(art);
      if (art.classList.contains('vista') || art.classList.contains('leida')) return;
      marcarVistaLocal(n.enlace);
      art.classList.add('vista');
      persistirVistas();
    }, VISTA_HOVER_MS);
    VISTAS_TIMERS.set(art, tmr);
  });

  cont.addEventListener('mouseout', e => {
    const art = e.target.closest('.noticia');
    if (!art) return;
    // Si el ratón sigue dentro de la tarjeta (movimiento entre hijos), no cancelamos
    if (e.relatedTarget && art.contains(e.relatedTarget)) return;
    const tmr = VISTAS_TIMERS.get(art);
    if (tmr){ clearTimeout(tmr); VISTAS_TIMERS.delete(art); }
  });
  cont.addEventListener('click', e => {
    // Al clicar un titular: guardar como leída automáticamente
    const link = e.target.closest('a.titular');
    if (link){
      const art = link.closest('.noticia');
      const i = parseInt(art.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (n){
        marcarLeidaLocal(n.enlace);
        setLocalPendienteRead(n.enlace, true); 
        art.classList.remove('vista');
        art.classList.add('leida');
        if (USCRIPT_OK){
          document.dispatchEvent(new CustomEvent('voceiro-save-later', {
            detail: {
              url: n.enlace,
              title: n.titular,
              description: n.grupo || '',
              image: '',
              read: true
            }
          }));
        }
      }
      return;   // dejamos que abra normalmente
    }

    const saveBtn = e.target.closest('.btn-save-item');
    if (saveBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(saveBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (n) guardarParaLeerDespues(n);
      return;
    }

    const blockBtn = e.target.closest('.btn-block-item');
    if (blockBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(blockBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (!n) return;

      const dominio = n.dominio;
      const medioNombre = n.medio || dominio;

      setOverride(dominio, 'ignore');
      if (!PRESET_ACTIVO){
        PRESET_ACTIVO = true;
        guardarPresetActivo();
        actualizarBotonPreset();
      }

      aplicarFiltros();
      toast(t('blockMediaDone') + ' · ' + medioNombre, 2000);
      return;
    }

    const repBtn = e.target.closest('.btn-report-item');
    if (repBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(repBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (!n) return;
      abrirReporte({
        medio:   n.medio,
        dominio: n.dominio,
        grupo:   n.grupo,
        tipo:    n.tipo,
        titular: n.titular,
        enlace:  n.enlace,
        fecha:   n.fecha_pub || n.fecha_estimada || n.fecha || '',
        fuente:  n.fuente || ''
      });
    }
  });
}
let VISTAS_OBSERVER = null;
const VISTAS_TIMERS = new WeakMap();

const VISTA_SCROLL_MS = 2500;   // 2,5 s visible antes de marcar

function marcarVista(art, n){
  const tmr = VISTAS_TIMERS.get(art);
  if (tmr){ clearTimeout(tmr); VISTAS_TIMERS.delete(art); }
  if (art.classList.contains('vista') || art.classList.contains('leida')) return;
  marcarVistaLocal(n.enlace);
  art.classList.add('vista');
  persistirVistas();
}

function programarVista(art, n, ms){
  if (art.classList.contains('vista') || art.classList.contains('leida')) return;
  if (VISTAS_TIMERS.has(art)) return;
  const tmr = setTimeout(() => marcarVista(art, n), ms);
  VISTAS_TIMERS.set(art, tmr);
}

function cancelarVista(art){
  const tmr = VISTAS_TIMERS.get(art);
  if (tmr){ clearTimeout(tmr); VISTAS_TIMERS.delete(art); }
}

const VISTAS_SEEN = new WeakSet();

function wireVistasObserver(){
  if (VISTAS_OBSERVER) VISTAS_OBSERVER.disconnect();
  VISTAS_OBSERVER = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const art = entry.target;
      if (art.classList.contains('vista') || art.classList.contains('leida')) return;

      const i = parseInt(art.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (!n) return;

      if (entry.isIntersecting){
        // La tarjeta ha estado visible al menos una vez → candidata
        VISTAS_SEEN.add(art);
      } else {
        // Solo marcamos si YA había estado visible y sale por ARRIBA
        if (VISTAS_SEEN.has(art) && entry.boundingClientRect.top < 0){
          marcarVistaLocal(n.enlace);
          art.classList.add('vista');
          persistirVistas();
        }
      }
    });
  }, { threshold: 0 });
}

function observarNoticias(){
  if (!VISTAS_OBSERVER) return;
  document.querySelectorAll('.noticia').forEach(el => VISTAS_OBSERVER.observe(el));
}

function abrirPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  document.querySelectorAll('.panel.open').forEach(o => { if (o !== p) o.classList.remove('open'); });
  p.classList.add('open');
  const body = p.querySelector('.panel-body');
  if (body) body.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function cerrarPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  p.classList.remove('open');
  if (!document.querySelector('.panel.open')){
    document.body.style.overflow = '';
  }
}

const aplicarFiltrosDebounced = debounce(aplicarFiltros, 180);
  
function wireStaticEvents(){
  const btnP = $('#btn-preset');
  actualizarBotonPreset();

  const hTitle = document.getElementById('h-title');

    hTitle.style.cursor = 'pointer';

    e.stopPropagation();

    if (menu.style.display !== 'none'){
      cerrarPresetMenu();
    } else {
      abrirPresetMenu();
    }
  });
  // ── Botón "Vista" + desplegable ──
  const btnVS = $('#btn-view-settings');
  if (btnVS){
    btnVS.addEventListener('click', e => {
      e.stopPropagation();
      const menu = $('#view-settings-menu');
      if (!menu) return;
      if (menu.style.display !== 'none'){
        cerrarViewSettingsMenu();
      } else {
        abrirViewSettingsMenu();
      }
    });
  }

  const dupChk = $('#vs-dup');
  if (dupChk){
    dupChk.addEventListener('change', () => {
      AGRUPAR_DUPS = dupChk.checked;
      guardarDupPref();
      actualizarBotonViewSettings();
      aplicarFiltros();
    });
  }

  document.querySelectorAll('input[name="vs-hide"]').forEach(r => {
    r.addEventListener('change', () => {
      if (!r.checked) return;
      HIDE_MODE = r.value;
      guardarHideMode();
      actualizarBotonViewSettings();
      aplicarFiltros();
    });
  });

  const vsReset = $('#vs-reset');
  if (vsReset){
    vsReset.addEventListener('click', () => {
      AGRUPAR_DUPS = true;
      HIDE_MODE = 'off';
      guardarDupPref();
      guardarHideMode();
      renderViewSettingsMenu();
      actualizarBotonViewSettings();
      aplicarFiltros();
    });
  }
  // ── Botones que abren paneles ──
  $('#btn-pendientes').addEventListener('click', abrirPendientes);
  $('#btn-buscar').addEventListener('click', bsAbrir);
  $('#btn-acces').addEventListener('click', () => abrirPanel('panel-acces'));
  $('#btn-config').addEventListener('click', () => {
    abrirPanel('panel-config');
    escribirPanel(PRESET);
  });


  document.querySelectorAll('.panel-close').forEach(b => {
    b.addEventListener('click', () => cerrarPanel(b.dataset.close));
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target === p) cerrarPanel(p.id);
    });
  });

  document.addEventListener('keydown', e => {
      if (e.key === 'Escape'){
        cerrarPresetMenu();
        cerrarViewSettingsMenu();
        const abierto = document.querySelector('.panel.open');
        if (abierto){ cerrarPanel(abierto.id); return; }
      }
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
    if (e.altKey && e.key.toLowerCase() === 'a'){ e.preventDefault(); abrirPanel('panel-acces'); }
    if (e.altKey && e.key.toLowerCase() === 'c'){ e.preventDefault(); abrirPanel('panel-config'); escribirPanel(PRESET); }
    if (e.altKey && e.key.toLowerCase() === 'p'){ e.preventDefault(); abrirPendientes(); }
    if (e.altKey && e.key.toLowerCase() === 'b'){ e.preventDefault(); bsAbrir(); }
    if (e.altKey && e.key.toLowerCase() === 'm'){
      e.preventDefault();
      if (!PRESET_ACTIVO && !presetTieneReglas()){
        toast(t('presetVacio'), 3200);
        return;
      }
      PRESET_ACTIVO = !PRESET_ACTIVO;
      guardarPresetActivo();
      actualizarBotonPreset();
      aplicarFiltros();

  $('#lang-select').addEventListener('change', e => {
    const v = e.target.value;
    if (!I18N[v]) return;

    aplicarTextos();
    reconstruirSelectores();
    construirIndicesBusqueda();

  document.querySelectorAll('.opt-group[data-grupo]').forEach(g => {
    const clave = g.dataset.grupo;

      const b = e.target.closest('button');

      const v = b.dataset.val;
      if (clave === 'tema' || clave === 'fuente') ACCES[clave] = v;
      if (clave === 'extra') ACCES[v] = !ACCES[v];

      if (clave === 'extra' && (v === 'focus' || v === 'bionic')) renderizar();
    });

  $('#fs-menos').addEventListener('click', () => ajustarFs(-1));
  $('#fs-mas').addEventListener('click', () => ajustarFs(+1));
  $('#w-menos').addEventListener('click', () => ajustarWidth(-1));
  $('#w-mas').addEventListener('click', () => ajustarWidth(+1));

  $('#preset-guardar').addEventListener('click', () => {
    const panel = leerPanel();
    PRESET.grupos = panel.grupos;
    PRESET.palabras = panel.palabras;
    guardarPreset(); recompilarPreset();

    if (presetTieneReglas() && !PRESET_ACTIVO){
      PRESET_ACTIVO = true;
      guardarPresetActivo();
      toast(t('presetGuardadoActivado'), 2200);
    } else if (!presetTieneReglas() && PRESET_ACTIVO){
      PRESET_ACTIVO = false;
      guardarPresetActivo();
    }
    actualizarBotonPreset();

    cerrarPanel('panel-config');
    aplicarFiltros();
  });

  $('#preset-cancelar').addEventListener('click', () => {
    escribirPanel(PRESET);
    cerrarPanel('panel-config');
  });
  $('#preset-reset').addEventListener('click', () => {
    const id = PRESET.id;
    const nombre = PRESET.nombre;
    PRESET = { id, nombre, grupos: [], palabras: [], overrides: {} };
    guardarPreset(); recompilarPreset();
    PRESET_ACTIVO = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    escribirPanel(PRESET);
    aplicarFiltros();
  });

  const filtrarMediosDebounced = debounce(filtrarMedios, 120);
  $('#filtro-medio').addEventListener('input', filtrarMediosDebounced);
  $('#filtro-grupo-medio').addEventListener('change', filtrarMedios);

  $('#buscar').addEventListener('input', aplicarFiltrosDebounced);
  ['grupo','tipo','rango','orden'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', aplicarFiltros);
  el.addEventListener('input',  aplicarFiltros);
  });
  const elMedio = document.getElementById('medio');
  if (elMedio){
    const debMedio = debounce(aplicarFiltros, 220);
    elMedio.addEventListener('input',  debMedio);
    elMedio.addEventListener('change', aplicarFiltros);
  }

  $('#limpiar').addEventListener('click', () => {
    ['buscar','grupo','tipo','medio','rango'].forEach(id => document.getElementById(id).value = '');
    PRESET_ACTIVO = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    aplicarFiltros();
  });
  const btnNuevoModo = $('#btn-nuevo-modo');
  if (btnNuevoModo) btnNuevoModo.addEventListener('click', crearModo);

  const ovFirst = $('#ov-add-first');
  const ovIgnore = $('#ov-add-ignore');
  const ovDomain = $('#ov-domain');
  if (ovFirst) ovFirst.addEventListener('click', () => {
    const v = ovDomain.value;
    const d = normalizarDominioInput(v);
    if (!d || !/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$/.test(d)){
      toast(t('cfgOverrideBad', { X: v }), 2400);
      return;
    }
    setOverride(d, 'first');
    ovDomain.value = '';
    renderModosPanel();
    renderListaMedios();
    aplicarFiltros();
  });
  if (ovIgnore) ovIgnore.addEventListener('click', () => {
    const v = ovDomain.value;
    const d = normalizarDominioInput(v);
    if (!d || !/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$/.test(d)){
      toast(t('cfgOverrideBad', { X: v }), 2400);
      return;
    }
    setOverride(d, 'ignore');
    ovDomain.value = '';
    renderModosPanel();
    renderListaMedios();
    aplicarFiltros();
  });
  const ovAplicar = $('#ov-pegar-aplicar');
  if (ovAplicar) ovAplicar.addEventListener('click', aplicarListaOverrides);
  wireResultadosDelegation();
    // Delegación para #lista-medios (un único listener en todo el contenedor)
  const contMedios = $('#lista-medios');
  if (contMedios){
    contMedios.addEventListener('change', e => {
      const fila = e.target.closest('.medio-fila');
      if (!fila) return;
      const inc = fila.querySelector('.chk-incluir');
      const ign = fila.querySelector('.chk-ignorar');

      if (e.target === inc){
        if (inc.checked) ign.checked = false;
        marca(fila);
        setOverride(fila.dataset.dominio, inc.checked ? 'first' : '');
      } else if (e.target === ign){
        if (ign.checked) inc.checked = false;
        marca(fila);
        setOverride(fila.dataset.dominio, ign.checked ? 'ignore' : '');
      }
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════ */
async function init(){
  // ── 0) UI inmediata: tema, textos y listeners ANTES de tocar la red ──
  aplicarAcces();

  PRESETS = cargarPresets();
  const _activeId = localStorage.getItem(PRESET_ID_KEY) || PRESETS.activo;
  const _active = PRESETS.lista.find(p => p.id === _activeId) || PRESETS.lista[0];
  PRESETS.activo = _active.id;
  PRESET = _active;

  recompilarPreset();
  PRESET_ACTIVO  = cargarPresetActivo() && presetTieneReglas();
  AGRUPAR_DUPS   = cargarDupPref();
  HIDE_MODE      = cargarHideMode();

  rebuildPendientes();

  const cachedSites = cargarSitesCache();
  setSitesFromArray(cachedSites);
  cachedSites.forEach(s => {
    if (s && s.domain){
      window.__lastLocal.set(s.domain, {
        lang: s.lang || 'auto',
        type: s.type || '',
        tags: Array.isArray(s.tags) ? s.tags.slice() : []
      });
    }
  });

  // Textos + listeners: ya con esto la UI está viva y clicable
  aplicarTextos();
  wireStickyOffsets();
  wireBackToTop();
  wireStaticEvents();
  wireVistasObserver();
  bsWireEventos();

  // ── 1) Bridge con el plugin ──
  initUserScriptBridge();

  // ── 2) Portada (await): primer render real de noticias ──
  try {
    await cargarPortada();
  } catch(err){
    $('#resultados').innerHTML =
      '<div class="vacio">Error cargando datos: ' + escapeHtml(err.message) + '</div>';
    return;
  }

  // ── 3) Tipos (ahora sí tenemos MEDIOS_UNICOS) ──
  const selT = $('#tipo');
  while (selT.options.length > 1) selT.remove(1);
  [...new Set(MEDIOS_UNICOS.map(m => m.tipo).filter(Boolean))].sort()
    .forEach(t2 => selT.add(new Option(t2, t2)));
  if (selT.options[0]) selT.options[0].text = t('fltTipo');

  reconstruirSelectores();
  aplicarFiltros();

  // ── 4) Histórico en background (no bloquea la UI) ──
  cargarHistoricoEnBackground();
}

init().catch(err => {
  $('#resultados').innerHTML =
    '<div class="vacio">Error cargando datos: ' + escapeHtml(err.message) + '</div>';
});
</script>
