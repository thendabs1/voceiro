<!DOCTYPE html>
<html lang="es" data-theme="light" data-font="sans" data-just="0" data-bionic="0" data-focus="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  :root{
    --bg:#fff; --fg:#222; --muted:#888; --accent:#d32f2f;
    --border:#eee; --quote-bg:#f9f9f9;
    --btn-bg:#f7f7f7; --btn-border:#ccc;
    --shadow:rgba(0,0,0,.08);
    --fs:18px; --lh:1.55; --w:1100px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --preset:#0a7d3f; --preset-bg:#e8f5e9;
    --block:#b00020; --block-bg:#fde8ec;
    --save:#1565c0; --save-bg:#e3f2fd;
    --mark:#ffe680; --mark-fg:#111;
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --fg:#3b2f1e; --muted:#8a7a5c; --accent:#a0522d;
    --border:#e0d5b8; --quote-bg:#ede0c4;
    --btn-bg:#ede0c4; --btn-border:#c8b88a;
    --shadow:rgba(59,47,30,.15);
    --preset:#3e7a2f; --preset-bg:#e4ebd0;
    --block:#8b2020; --block-bg:#ebd5d0;
    --save:#2e5a8b; --save-bg:#d8e3ee;
    --mark:#c9a227; --mark-fg:#2c1c08;
  }
  [data-theme="dark"]{
    --bg:#1a1a1a; --fg:#e0e0e0; --muted:#999; --accent:#ff6b6b;
    --border:#333; --quote-bg:#252525;
    --btn-bg:#2a2a2a; --btn-border:#444;
    --shadow:rgba(0,0,0,.5);
    --preset:#4cc97a; --preset-bg:#173524;
    --block:#ff8a9c; --block-bg:#3d1a20;
    --save:#6cb3ff; --save-bg:#1e3550;
    --mark:#b58600; --mark-fg:#fff;
  }
  [data-theme="contrast"]{
    --bg:#000; --fg:#fff; --muted:#ff0; --accent:#0ff;
    --border:#fff; --quote-bg:#111;
    --btn-bg:#111; --btn-border:#fff;
    --shadow:rgba(255,255,255,.2);
    --preset:#0f0; --preset-bg:#003300;
    --block:#f00; --block-bg:#330000;
    --save:#0ff; --save-bg:#003333;
    --mark:#ff0; --mark-fg:#000;
  }
  [data-font="serif"]{ --ff: Georgia, "Times New Roman", serif }
  [data-font="sans"]{ --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
  [data-font="dyslexic"]{
    --ff: Verdana, Tahoma, "Comic Sans MS", sans-serif;
    letter-spacing: .03em; word-spacing: .1em;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ff);
    background:var(--bg); color:var(--fg);
    font-size:var(--fs); line-height:var(--lh);
    max-width:var(--w); margin:0 auto; padding:20px;
    transition:background .15s, color .15s;
  }
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}
  header{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding: 12px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  header .header-top{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 8px;
  }
  header .header-top h1{
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: none;
    font-size: 1.6em;
    line-height: 1.2;
  }
  header .header-top .lang-select,
  header .header-top > button{
    flex-shrink: 0;
  }
  header .header-actions{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 0 0 6px;
  }
  header .header-actions button{
    font-size: .78em;
    padding: 6px 12px;
  }
  header .meta{
    color: var(--muted);
    font-size: .72em;
    margin: 0;
  }

  button{
    cursor:pointer; padding:8px 14px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg);
    border-radius:6px;
    font-family:inherit; font-size:.8em; font-weight:500;
    transition:filter .1s, background .1s;
  }
  button:hover{filter:brightness(.95)}
  button.primary{
    background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold;
  }
  button.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  [data-theme="contrast"] button.active,
  [data-theme="contrast"] button.primary{color:#000}

  .btn-preset{
    border:2px solid var(--preset); background:transparent; color:var(--preset);
    font-weight:600;
  }
  .btn-preset:hover{background:var(--preset-bg)}
  .btn-preset.active{background:var(--preset); color:#fff}
  .preset-wrap{
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .preset-menu{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px var(--shadow);
    min-width: 220px;
    padding: 6px;
    z-index: 50;
  }
  .preset-item{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: .82em;
    text-align: left;
    font-weight: 500;
  }
  .preset-item:hover{ background: var(--quote-bg); }
  .preset-item.active{
    background: var(--preset-bg);
    color: var(--preset);
    font-weight: 600;
  }
  .preset-item .preset-check{
    display: inline-block;
    width: 14px;
    flex-shrink: 0;
    color: var(--preset);
    opacity: 0;
  }
  .preset-item.active .preset-check{ opacity: 1; }
  .preset-sep{
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }
  .preset-item.preset-manage{
    color: var(--muted);
    font-size: .78em;
  }

  .btn-pendientes{
    border:2px solid var(--save); background:transparent; color:var(--save);
    font-weight:600;
  }
  .btn-pendientes:hover{background:var(--save-bg)}
  .btn-pendientes.no-userscript{opacity:.55}

  .btn-buscar{
    border:2px solid var(--accent); background:transparent; color:var(--accent);
    font-weight:600;
  }
  .btn-buscar:hover{background:var(--quote-bg)}

  select.lang-select{
    padding:7px 10px; border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg); border-radius:6px;
    font-family:inherit; font-size:.78em;
  }

  /* ═══ Paneles ═══ */
  .panel{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:100; display:none; padding:20px;
    overflow-y:auto;
  }
  .panel.open{display:flex}
  .panel-inner{
    background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:12px;
    max-width:1200px; width:100%;
    max-height:calc(100vh - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative; margin:auto;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .panel-header{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px;
    padding:18px 24px 12px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .panel-header h2{margin:0; font-size:1em; letter-spacing:.03em}
  .panel-close{
    background:transparent; border:1px solid var(--btn-border);
    padding:4px 10px; font-size:1em; line-height:1; border-radius:6px;
    flex-shrink:0;
  }
  .panel-body{
    padding:14px 24px 20px;
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .panel-body h3{
    margin:16px 0 6px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .panel-body h3:first-of-type{border-top:none; padding-top:0; margin-top:0}
  .panel-acciones{
    display:flex; justify-content:flex-end; gap:8px;
    flex-wrap:wrap;
    padding:12px 24px 18px;
    border-top:1px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
  }

  .opt-row{
    display:flex; align-items:center; gap:14px;
    padding:8px 0; border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .opt-row:first-of-type{border-top:none}
  .opt-label{
    color:var(--muted); font-size:.65em; letter-spacing:.05em;
    text-transform:uppercase; min-width:110px;
  }
  .opt-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .opt-val{
    font-weight:bold; min-width:44px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em;
  }

  .list-grupos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:4px;
    max-height:260px; overflow-y:auto;
    padding:8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .list-modos{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .modo-fila{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
    font-size:.78em;
  }
  .modo-fila:last-child{border-bottom:none}
  .modo-fila.activo{background:var(--preset-bg);}
  .modo-fila .modo-nombre{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .modo-fila .modo-acciones{display:flex; gap:4px; flex-shrink:0;}
  .modo-fila .modo-acciones button{
    padding:2px 8px; font-size:.85em;
    background:transparent; border:1px solid var(--border);
    color:var(--muted); border-radius:6px; cursor:pointer;
    font-family:inherit;
  }
  .modo-fila .modo-acciones button:hover{
    color:var(--accent); border-color:var(--accent);
  }
  .modo-fila .modo-acciones button.danger:hover{
    color:var(--block); border-color:var(--block);
  }
  .ctrl-override{
    display:grid; grid-template-columns:1fr 40px 40px; gap:6px;
    margin-bottom:8px;
  }
  .ctrl-override input{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .ctrl-override button{
    padding:0; font-size:.9em; font-weight:700;
    border:1px solid var(--border); border-radius:6px;
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .ctrl-override button:hover{ color:var(--accent); border-color:var(--accent); }
  .ctrl-override button.ignorar:hover{ color:var(--block); border-color:var(--block); }
  .ov-list{
    display:flex; flex-wrap:wrap; gap:4px;
    min-height:24px;
  }
  .ov-item{
    display:inline-flex; align-items:center; gap:6px;
    padding:2px 4px 2px 10px;
    border-radius:12px; font-size:.72em;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .ov-item.first{ background:var(--preset-bg); color:var(--preset); border:1px solid var(--preset); }
  .ov-item.ignore{ background:var(--block-bg); color:var(--block); border:1px solid var(--block); }
  .ov-item button{
    background:transparent; border:none; cursor:pointer;
    color:inherit; padding:0 6px; font-size:1.1em; line-height:1;
    border-radius:8px;
  }
  .ov-item button:hover{ background:rgba(0,0,0,.08); }
  .grupo-item{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; cursor:pointer;
    padding:5px 8px; border-radius:4px;
  }
  .grupo-item:hover{background:var(--quote-bg)}
  .grupo-item input{accent-color:var(--accent); width:1.1em; height:1.1em}
  .grupo-item .flag{
    font-size:.85em; color:var(--accent); opacity:.7;
    margin-left:auto; padding-left:6px;
  }

  .ctrl-medios{
    display:grid; grid-template-columns:1fr auto; gap:8px;
    margin-bottom:8px;
  }
  .ctrl-medios input,
  .ctrl-medios select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }

  .list-medios{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
    max-height:420px; overflow-y:auto;
  }
  .medio-fila{
    display:grid;
    grid-template-columns:34px 34px minmax(140px,1.2fr) 1.6fr 1.4fr;
    gap:8px; align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .medio-fila:last-child{border-bottom:none}
  .medio-fila.estado-incluir{background:var(--preset-bg)}
  .medio-fila.estado-ignorar{background:var(--block-bg)}
  .medio-fila .celda{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .medio-fila .celda-grupo{color:var(--muted); font-size:.9em}
  .medio-fila.no-config .celda-dominio{opacity:.75}

  .known-dot{
    display:inline-block;
    width:6px; height:6px; border-radius:50%;
    background:var(--save);
    margin-right:6px;
    vertical-align:middle;
    flex-shrink:0;
  }

  .chk{display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none}
  .chk input{display:none}
  .chk span{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--btn-border);
    font-size:.9em; font-weight:700;
    background:transparent; color:var(--muted);
    transition:all .1s;
  }
  .chk:hover span{border-color:var(--accent)}
  .chk.incluir input:checked + span{
    background:var(--preset); border-color:var(--preset); color:#fff;
  }
  .chk.ignorar input:checked + span{
    background:var(--block); border-color:var(--block); color:#fff;
  }

  textarea.preset-texto{
    width:100%; min-height:180px; padding:12px;
    border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg);
    font-family:var(--ff); font-size:.82em;
    line-height:1.6; resize:vertical;
  }

  .backup-box{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.75em;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:space-between;
  }
  .backup-box .msg{color:var(--muted); flex:1; min-width:180px}
  .backup-box .acciones{display:flex; gap:8px; flex-wrap:wrap}

  /* ═══ Filtros ═══ */
  .filtros{
    display:grid;
    grid-template-columns:2.5fr 1fr 1fr 1.2fr .9fr 1.1fr auto;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    position: sticky;
    top: var(--header-h, 130px);
    background: var(--bg);
    z-index: 9;
  }
  .filtros input,
  .filtros select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
    min-width:0;
  }

  /* ═══ Chips de filtros activos ═══ */
  .chips-busqueda{
    display:flex; flex-wrap:wrap; gap:6px;
    padding:8px 0 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 4px 3px 10px;
    border-radius:12px;
    background:var(--save-bg); color:var(--save);
    border:1px solid var(--save);
    font-weight:500;
    line-height:1.4;
  }
  .chip-tipo{
    opacity:.75; text-transform:uppercase; letter-spacing:.05em;
    font-size:.85em;
  }
  .chip-x{
    background:transparent; border:none;
    color:inherit; cursor:pointer;
    padding:0 6px; font-size:1.15em; line-height:1;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
  }
  .chip-x:hover{background:rgba(0,0,0,.1)}
  [data-theme="dark"] .chip-x:hover{background:rgba(255,255,255,.15)}
  [data-theme="contrast"] .chip-x:hover{background:#333}

  #contador{
    color:var(--muted); font-size:.68em;
    margin:10px 0 14px;
  }

  .noticia{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:8px;
    transition:opacity .25s;
    position:relative;
    contain:content;
  }
  .noticia.foco-dim{opacity:.28}
  .noticia.foco-active{opacity:1}
  .noticia.vista{opacity:.80}
  .noticia.leida{opacity:.5}
  .noticia.leida a.titular{color:var(--muted)}
  .noticia .cabecera{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-bottom:5px; font-size:.62em; color:var(--muted);
  }
  .noticia .medio{
    font-weight:bold; color:var(--fg); font-size:1.1em;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .badge{
    background:var(--quote-bg); border:1px solid var(--border);
    padding:1px 8px; border-radius:10px; color:var(--muted);
  }
  .badge.preset{
    background:var(--preset-bg);
    border-color:var(--preset);
    color:var(--preset);
  }
  .badge.futuro{
    background:#fff3e0; border-color:#ffb74d; color:#b45309;
  }
  [data-theme="dark"] .badge.futuro,
  [data-theme="sepia"] .badge.futuro{
    background:#3d2f14; border-color:#b58600; color:#ffcc66;
  }
  [data-theme="contrast"] .badge.futuro{background:#000; border-color:#ff0; color:#ff0}

  .badge.recolectado{
    background:#fef3c7; border-color:#fbbf24; color:#92400e;
  }
  [data-theme="dark"] .badge.recolectado{
    background:#3d2f14; border-color:#b58600; color:#ffcc66;
  }
  [data-theme="sepia"] .badge.recolectado{
    background:#f5e6c3; border-color:#c9a227; color:#5c4a1c;
  }
  [data-theme="contrast"] .badge.recolectado{
    background:#000; border-color:#ff0; color:#ff0;
  }

  .badge.estimada{
    background:#e8f0fe; border-color:#a0c4f8; color:#0d47a1;
  }
  [data-theme="dark"] .badge.estimada{
    background:#1a2d47; border-color:#4a7ab5; color:#a0c4f8;
  }
  [data-theme="sepia"] .badge.estimada{
    background:#dae4ef; border-color:#8fa9c4; color:#2e5a8b;
  }
  [data-theme="contrast"] .badge.estimada{
    background:#003; border-color:#0ff; color:#0ff;
  }

  .noticia a.titular{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:1em; display:block; margin-top:2px;
  }
  .noticia a.titular:hover{text-decoration:underline}
  [data-just="1"] .noticia a.titular{text-align:justify; hyphens:auto}
  mark{background:var(--mark); color:var(--mark-fg); padding:0 3px; border-radius:2px}

  /* Botones mini (mariquita, bloquear) */
  .btn-mini{
    margin-left:2px;
    padding:2px 8px !important;
    font-size:.85em !important;
    background:transparent !important;
    border:1px solid var(--border) !important;
    color:var(--muted) !important;
    line-height:1.2;
    opacity:.6;
    transition:opacity .15s, color .15s, border-color .15s;
  }
  .btn-mini:hover{
    opacity:1 !important;
    color:var(--accent) !important;
    border-color:var(--accent) !important;
  }
  .btn-block-item:hover{
    color:var(--block) !important;
    border-color:var(--block) !important;
  }

  /* Spacer: empuja 🚫 y 🐞 a la derecha */
  .cab-spacer{flex:1 0 0; min-width:0}

  /* Botón "Guardar" en texto, junto a la fecha */
  .btn-save-text{
    margin-left:8px;
    padding:2px 10px;
    font-size:.85em;
    background:transparent;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--save);
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    opacity:.85;
    transition:opacity .15s, background .15s, border-color .15s;
    line-height:1.3;
  }
  .btn-save-text:hover{
    opacity:1;
    background:var(--save-bg);
    border-color:var(--save);
  }

  .vacio{
    text-align:center; color:var(--muted);
    padding:40px 0; font-size:.85em;
  }

  .pendiente-item{
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    background:var(--bg);
  }
  .pendiente-item a{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:.95em;
    display:block;
  }
  .pendiente-item a:hover{text-decoration:underline}
  .pendiente-meta{
    font-size:.65em; color:var(--muted);
    margin-top:4px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .pendiente-actions{
    display:flex; justify-content:flex-end; gap:6px;
    margin-top:8px;
  }
  .pendiente-actions button{
    padding:4px 10px; font-size:.75em; border-radius:6px;
    border:1px solid var(--border); background:var(--btn-bg); color:var(--fg);
    cursor:pointer; font-family:inherit;
  }
  .pendiente-actions button:hover{filter:brightness(.95)}
  .btn-pend-toggle{border-color:var(--preset) !important; color:var(--preset) !important}
  .btn-pend-remove{color:var(--block) !important}

  .btn-top{
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 1.15em;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .2s, transform .2s, filter .15s;
    z-index: 80;
    pointer-events: none;
  }
  .btn-top.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .btn-top:hover{ filter: brightness(1.1); }
  [data-theme="contrast"] .btn-top{
    background: #ff0;
    color: #000;
    border: 2px solid #000;
  }
  #toast-wrap{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:8px;
    pointer-events:none;
  }
  .toast{
    background:#222; color:#fff; padding:10px 16px; border-radius:8px;
    font-size:.78em; box-shadow:0 6px 20px rgba(0,0,0,.35);
    opacity:0; transform:translateY(12px);
    transition:opacity .2s, transform .2s;
    max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateY(0)}
  [data-theme="dark"] .toast{background:#eee; color:#222}
  [data-theme="contrast"] .toast{background:#ff0; color:#000; border:2px solid #000}

  .rep-ctx{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.72em;
    line-height:1.6;
    margin-bottom:14px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    word-break:break-word;
  }
  .rep-ctx strong{color:var(--muted); font-weight:600; margin-right:4px}
  .rep-ctx.empty{color:var(--muted); font-style:italic; font-family:var(--ff); text-align:center}

  .rep-row{display:grid; gap:6px; margin-bottom:14px}
  .rep-row label{
    font-size:.7em; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .rep-row select,
  .rep-row textarea{
    font-size:.8em; padding:9px 12px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
    width:100%;
  }
  .rep-row textarea{min-height:80px; resize:vertical; line-height:1.5}

  .rep-check{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px;
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:6px;
    font-size:.72em;
    cursor:pointer;
  }
  .rep-check input{
    accent-color:var(--accent);
    width:1.15em; height:1.15em;
    margin-top:.15em; flex-shrink:0;
  }
  .rep-check span{color:var(--muted); line-height:1.5}

  .rep-acciones{
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:space-between;
    margin-top:16px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .rep-acciones .grupo{display:flex; gap:8px; flex-wrap:wrap}

  .sync-banner{
    background:#e3f2fd; color:#0d47a1;
    border:1px solid #90caf9; border-radius:6px;
    padding:8px 12px; font-size:.72em;
    margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  [data-theme="dark"] .sync-banner{background:#0d2a45; color:#90caf9; border-color:#1565c0}
  [data-theme="sepia"] .sync-banner{background:#d8e3ee; color:#2e5a8b; border-color:#8fa9c4}
  [data-theme="contrast"] .sync-banner{background:#003; color:#0ff; border-color:#0ff}
  .sync-dot{
    width:8px; height:8px; border-radius:50%;
    background:#4caf50; flex-shrink:0;
    animation:pulse 2s infinite;
  }
  .sync-dot.offline{background:#f44336; animation:none}
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.4}
  }

  #render-sentinel{
    height:1px;
    margin-top:8px;
  }

  /* ═══ Buscador FreeNewsAPI ═══ */
  .bs-aviso{
    background:var(--save-bg); color:var(--save);
    border:1px solid var(--save); border-radius:6px;
    padding:8px 12px; font-size:.7em; line-height:1.5;
    margin-bottom:14px;
  }
  .bs-filtros{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
  .bs-filtros input,
  .bs-filtros select{
    font-size:.82em; padding:9px 12px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .bs-fila{display:flex; gap:8px; flex-wrap:wrap}
  .bs-fila select{flex:1 1 120px; min-width:120px}
  .bs-estado{
    font-size:.72em; color:var(--muted);
    margin-bottom:10px; min-height:1.2em;
  }
  .bs-resultado{
    background:var(--bg);
    border:1px solid var(--border);
    border-left:3px solid var(--save);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:8px;
  }
  .bs-resultado .bs-meta{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    font-size:.62em; color:var(--muted); margin-bottom:5px;
  }
  .bs-resultado .bs-medio{
    font-weight:bold; color:var(--fg); font-size:1.1em;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .bs-resultado .bs-badge{
    background:var(--save-bg); border:1px solid var(--save);
    padding:1px 8px; border-radius:10px; color:var(--save);
    font-size:.9em;
  }
  .bs-resultado a.bs-titular{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:1em; display:block; margin-top:2px;
  }
  .bs-resultado a.bs-titular:hover{text-decoration:underline}
  .bs-resultado .bs-desc{
    font-size:.75em; color:var(--muted);
    margin-top:6px; line-height:1.4;
  }
  .bs-resultado .bs-acciones{
    display:flex; gap:6px; justify-content:flex-end; margin-top:8px;
  }
  #bs-mas-wrap{text-align:center; margin-top:14px}
  .bs-fuentes {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin: 4px 0 12px;
  font-size: .78em;
  }
  .bs-fuente-chk {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    color: var(--muted);
  }
  .bs-fuente-chk input {
    accent-color: var(--save);
    width: 1.1em; height: 1.1em;
  }
  .bs-fuente-chk input:checked + span {
    color: var(--fg);
    font-weight: 600;
  }
  
  .bs-badge-fn {
    background: #e8f5e9; color: #2e7d32; border-color: #66bb6a;
  }
  .bs-badge-gn {
    background: #e3f2fd; color: #1565c0; border-color: #64b5f6;
  }
  [data-theme="dark"] .bs-badge-fn {
    background: #1b3a1e; color: #81c784; border-color: #4caf50;
  }
  [data-theme="dark"] .bs-badge-gn {
    background: #1a2d47; color: #90caf9; border-color: #1976d2;
  }
  [data-theme="sepia"] .bs-badge-fn {
    background: #e4ebd0; color: #3e7a2f; border-color: #8fa9c4;
  }
  [data-theme="sepia"] .bs-badge-gn {
    background: #d8e3ee; color: #2e5a8b; border-color: #8fa9c4;
  }
  [data-theme="contrast"] .bs-badge-fn {
    background: #003300; color: #0f0; border-color: #0f0;
  }
  [data-theme="contrast"] .bs-badge-gn {
    background: #003; color: #0ff; border-color: #0ff;
  }
  .bs-dup {
    font-size: .68em; color: var(--muted);
    margin-top: 4px; font-style: italic;
  }
  /* ═══ Cabecera en una sola fila en escritorio ═══ */
  @media (min-width: 820px){
    header{
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    /* Los dos wrappers desaparecen del layout: sus hijos pasan al <header> */
    header .header-top,
    header .header-actions{
      display: contents;
    }
    /* Título a la izquierda, ocupando el hueco libre */
    #h-title{
      order: 1;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      font-size: 1.5em;
    }
    /* Orden pedido: Modo · Configurar · Pendientes · Investigar · Accesibilidad · Idioma */
    header .preset-wrap{ order: 2; }
    #btn-config     { order: 3; }
    #btn-pendientes { order: 4; }
    #btn-buscar     { order: 5; }
    #btn-acces      { order: 6; }
    #lang-select    { order: 7; }
    /* La línea de "Actualizado · N titulares" pasa a su propia fila */
    header .meta{
      order: 8;
      flex-basis: 100%;
      margin: 4px 0 0;
    }
    /* Botones un poco más compactos para que quepan en una sola fila */
    #btn-preset,
    #btn-config,
    #btn-pendientes,
    #btn-buscar,
    #btn-acces{
      font-size: .74em;
      padding: 6px 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #lang-select{
      font-size: .74em;
      padding: 6px 8px;
      flex-shrink: 0;
    }
  }
  
  @media (max-width:900px){
    .filtros{grid-template-columns:1fr 1fr 1fr; position:static}
    #buscar{grid-column:1/-1}
    .medio-fila{grid-template-columns:34px 34px 1fr 1.2fr}
    .medio-fila .celda-grupo{display:none}
    .opt-row{gap:8px}
    .opt-label{min-width:100%}
    .panel-inner{max-width:none}
  }
  @media (max-width:560px){
    .filtros{grid-template-columns:1fr 1fr}
    .medio-fila{grid-template-columns:34px 34px 1fr}
    .medio-fila .celda-nombre{display:none}
    .panel-header{padding:14px 16px 10px}
    .panel-body{padding:12px 16px 16px}
    .panel-acciones{padding:10px 16px 14px}
    .rep-acciones{flex-direction:column}
    .rep-acciones .grupo{width:100%}
    .rep-acciones button{flex:1}
  }

  /* ═══ Toggle duplicados (inline junto al contador) + desplegable ═══ */
  .contador-row{
    position: sticky;
    top: calc(var(--header-h, 130px) + var(--filtros-h, 0px));
    background: var(--bg);
    z-index: 8;
    padding: 6px 0;
    margin: 0 0 14px;
    border-bottom: 1px solid var(--border);
  }
  .contador-row #contador{margin:0}

  .btn-dup-inline{
    padding:1px 7px;
    font-size:.62em;
    line-height:1.25;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    font-weight:500;
    opacity:.65;
    letter-spacing:.01em;
    transition:opacity .15s, background .15s, color .15s, border-color .15s;
  }
  .btn-dup-inline:hover{
    opacity:1;
    background:var(--quote-bg);
    color:var(--accent);
    border-color:var(--accent);
  }
  .btn-dup-inline.active{
    background:var(--save);
    color:#fff;
    border-color:var(--save);
    opacity:1;
    font-weight:600;
  }
  .view-settings-wrap{
    position: relative;
    display: inline-flex;
  }
  .btn-view-settings{
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-view-settings .vs-count{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--save);
    color: #fff;
    font-size: .85em;
    font-weight: 700;
    line-height: 1;
  }
  .btn-view-settings .vs-count[data-count="0"]{
    display: none;
  }

  .view-settings-menu{
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 250px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 8px;
    z-index: 60;
  }
  .vs-caret{
    display: inline-block;
    font-size: .9em;
    line-height: 1;
    transition: transform .18s ease;
    transform-origin: 50% 45%;
  }
  .btn-view-settings[aria-expanded="true"] .vs-caret{
    transform: rotate(180deg);
  }
  .vs-group{ padding: 4px 6px; }
  .vs-title{
    font-size: .62em;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .vs-item,
  .vs-radio{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: .78em;
    cursor: pointer;
    user-select: none;
    line-height: 1.3;
  }
  .vs-item:hover,
  .vs-radio:hover{ background: var(--quote-bg); }
  .vs-item input,
  .vs-radio input{
    accent-color: var(--save);
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
    margin: 0;
  }
  .vs-radio span{ flex: 1; }
  .vs-radio small{
    display: block;
    font-size: .85em;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }
  .vs-sep{
    height: 1px;
    background: var(--border);
    margin: 6px 4px;
  }
  .vs-reset{
    width: 100%;
    padding: 6px 10px;
    font-size: .74em;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .vs-reset:hover{
    color: var(--accent);
    border-color: var(--accent);
  }
  @media (max-width: 560px){
    .view-settings-menu{
      right: auto;
      left: 0;
      min-width: 220px;
    }
  }
  .dups-details{
    margin-top:8px;
    font-size:.72em;
  }
  .dups-details summary{
    cursor:pointer;
    color:var(--save);
    font-weight:600;
    padding:3px 8px;
    display:inline-block;
    border:1px solid var(--save);
    border-radius:10px;
    background:var(--save-bg);
    list-style:none;
    user-select:none;
  }
  .dups-details summary::-webkit-details-marker{display:none}
  .dups-details summary::before{
    content:'▸ ';
    display:inline-block;
    transition:transform .15s;
  }
  .dups-details[open] summary::before{content:'▾ '}
  .dups-details summary:hover{filter:brightness(.95)}

  .dups-list{
    margin-top:6px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--quote-bg);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .dups-list .dup-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.92em;
    color:var(--muted);
  }
  .dups-list .dup-item .dup-medio{
    font-weight:600;
    color:var(--fg);
  }
  .dups-list .dup-item a{
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
    margin-left:auto;
  }
  .dups-list .dup-item a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 id="h-title">Voceiro</h1>
    <button id="btn-acces" type="button"></button>
    <select id="lang-select" class="lang-select" aria-label="Language"></select>
  </div>
  <div class="header-actions">
    <span class="preset-wrap">
      <button id="btn-preset" class="btn-preset" type="button"
              aria-expanded="false" aria-haspopup="true"></button>
      <div id="preset-menu" class="preset-menu" style="display:none"></div>
    </span>
    <button id="btn-config" type="button"></button>
    <button id="btn-pendientes" class="btn-pendientes" type="button"></button>
    <button id="btn-buscar" class="btn-buscar" type="button"></button>
  </div>
  <p class="meta">
    <span id="meta-prefix"></span>
    <span id="fecha">02/10/2026 22:25</span>
    <span>·</span>
    <span id="total">91050</span>
    <span id="meta-suffix"></span>
  </p>
</header>
<!-- CONFIG -->
<section id="panel-config" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="cfg-title"></h2>
      <button class="panel-close" type="button" data-close="panel-config">✕</button>
    </div>
    <div class="panel-body">
      <div id="sync-banner" class="sync-banner" style="display:none">
        <span class="sync-dot"></span>
        <span id="sync-banner-text"></span>
      </div>

      <h3 id="cfg-modos"></h3>
      <p id="cfg-modos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
      <div id="lista-modos" class="list-modos"></div>
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="btn-nuevo-modo" type="button" style="font-size:.75em;">+ <span id="btn-nuevo-modo-lbl"></span></button>
      </div>

      <div id="modo-overrides-wrap" style="margin-top:16px;">
        <p id="modo-overrides-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <div class="ctrl-override">
          <input type="text" id="ov-domain" placeholder="dominio.com" autocomplete="off">
          <button id="ov-add-first" type="button" title="first">✓</button>
          <button id="ov-add-ignore" type="button" title="ignore">✗</button>
        </div>
        <div id="ov-list" class="ov-list"></div>
        <details id="ov-pegar-wrap" style="margin-top:8px;">
          <summary style="cursor:pointer; color:var(--save); font-size:.75em; font-weight:600;"></summary>
          <textarea id="ov-pegar" class="preset-texto" style="min-height:80px; font-family:ui-monospace,monospace; font-size:.78em;" placeholder="+ dominio.com&#10;- otro.com"></textarea>
          <div style="margin-top:6px; display:flex; gap:8px; justify-content:flex-end;">
            <button id="ov-pegar-aplicar" type="button" class="primary" style="font-size:.75em;"></button>
          </div>
        </details>
      </div>

      <h3 id="cfg-grupos"></h3>
      <p id="cfg-grupos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
      <div id="lista-grupos" class="list-grupos"></div>

      <h3 id="cfg-medios"></h3>
      <p id="cfg-medios-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
      <p id="cfg-medios-legend" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
      <div class="ctrl-medios">
        <input type="search" id="filtro-medio">
        <select id="filtro-grupo-medio"><option value=""></option></select>
      </div>
      <div id="lista-medios" class="list-medios"></div>
      <p id="resumen-medios" style="font-size:.68em; color:var(--muted); margin:6px 0 0;"></p>

      <h3 id="cfg-palabras"></h3>
      <p id="cfg-palabras-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
      <textarea id="preset-palabras" class="preset-texto"></textarea>

      <h3 id="cfg-backup"></h3>
      <div class="backup-box">
        <span class="msg" id="cfg-backup-msg"></span>
        <div class="acciones">
          <button id="btn-export" type="button"></button>
          <button id="btn-import" type="button"></button>
        </div>
      </div>

      <h3 id="cfg-help-lbl"></h3>
      <div class="backup-box">
        <span class="msg" id="cfg-help-msg"></span>
        <div class="acciones">
          <button id="btn-report-generic" type="button">🐞 <span id="cfg-help-btn"></span></button>
        </div>
      </div>
    </div>
    <div class="panel-acciones">
      <button id="preset-reset" type="button"></button>
      <button id="preset-cancelar" type="button"></button>
      <button id="preset-guardar" type="button" class="primary"></button>
    </div>
  </div>
</section>

<!-- ACCESIBILIDAD -->
<section id="panel-acces" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="ac-title"></h2>
      <button class="panel-close" type="button" data-close="panel-acces">✕</button>
    </div>
    <div class="panel-body">
      <div class="opt-row">
        <span class="opt-label" id="ac-tema"></span>

function t(key, vars){
  const lang = (ACCES && ACCES.lang) || 'es';
  const dict = I18N[lang] || I18N.es;
  let s = dict[key] != null ? dict[key] : (I18N.es[key] != null ? I18N.es[key] : key);
  if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  return s;
}

const $ = sel => document.querySelector(sel);

function normalize(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function normStrict(s){
  return normalize(s).replace(/[^a-z0-9]/g, '');
}
function normDomain(s){
  return normalize(s).replace(/[^a-z0-9.\-]/g, '');
}
function normalizeUrlForMatch(u){
  try {
    const url = new URL(u, location.href);
    url.hash = '';
    url.hostname = url.hostname.toLowerCase().replace(/^www\./, '');
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content',
     'fbclid','gclid','mc_cid','mc_eid','igshid','_ga','_gl','ref','referrer']
      .forEach(k => url.searchParams.delete(k));
    if (url.pathname.length > 1 && url.pathname.endsWith('/')){
      url.pathname = url.pathname.slice(0, -1);
    }
    return url.href;
  } catch(e){ return String(u || ''); }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function limpiarCdata(s){
  if (!s) return '';
  let x = String(s).trim();
  let changed = true;
  while (changed){
    changed = false;
    if (x.startsWith('<![CDATA[')){ x = x.slice(9); changed = true; }
    if (x.endsWith(']]>')){ x = x.slice(0, -3); changed = true; }
    x = x.trim();
  }
  return x;
}
function _escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function parseLista(txt){
  return txt.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
function toast(msg, ms){
  ms = ms || 2400;
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, ms);
}
function debounce(fn, ms){
  let t;
  const wrapped = function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(() => { t = null; fn.apply(ctx, args); }, ms);
  };
  wrapped.cancel = () => { clearTimeout(t); t = null; };
  return wrapped;
}

/* ═══════════════════════════════════════════════════════════════
   FECHAS
   ═══════════════════════════════════════════════════════════════ */
const HORIZONTE_FUTURO_MS = 6 * 60 * 60 * 1000;

let ABS_FMT = null;
let ABS_FMT_LANG = null;
const ABS_CACHE = new Map();

function getAbsFmt(){
  if (ABS_FMT_LANG !== ACCES.lang){
    ABS_FMT = new Intl.DateTimeFormat(ACCES.lang, {
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    ABS_FMT_LANG = ACCES.lang;
    ABS_CACHE.clear();
  }
  return ABS_FMT;
}

  
function parseFecha(s){
  if (!s) return NaN;
  const str = String(s).trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m){
    const [, d, mo, y, h = 0, mi = 0, se = 0] = m;
    const t = new Date(+y, +mo - 1, +d, +h, +mi, +se).getTime();
    return isNaN(t) ? NaN : t;
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(str)){
    const t = Date.parse(str);
    if (!isNaN(t)) return t;
  }
  const t = Date.parse(str);
  return !isNaN(t) ? t : NaN;
}

function formatearFecha(ts){
  if (isNaN(ts)) return '';
  let abs = ABS_CACHE.get(ts);
  if (abs === undefined){
    abs = getAbsFmt().format(ts);
    ABS_CACHE.set(ts, abs);
  }
  const diff = Date.now() - ts;
  if (diff < 0) return abs + ' · ' + t('fechaProgramado');
  if (diff >= 7 * 86400000) return abs;
  const min = (diff / 60000) | 0;
  const hr  = (diff / 3600000) | 0;
  const dia = (diff / 86400000) | 0;
  let rel;
  if (min < 1) rel = t('fechaAhora');
  else if (min < 60) rel = t('fechaHaceMin', { n: min });
  else if (hr < 24) rel = t('fechaHaceH', { n: hr });
  else rel = t('fechaHaceD', { n: dia });
  return abs + ' · ' + rel;
}

const ACCES_DEF = {
  lang: 'es', tema: 'light', fuente: 'sans',
  fs: 18, width: 1100,
  just: false, bionic: false, focus: false,
};
const LIM = {
  fs: { min: 14, max: 32, step: 1 },
  width: { min: 480, max: 1600, step: 40 },
};

let ACCES = cargarAcces();

function cargarAcces(){
  try{
    const raw = localStorage.getItem('voceiro-acces-v2');
    const o = raw ? { ...ACCES_DEF, ...JSON.parse(raw) } : { ...ACCES_DEF };
    if (!I18N[o.lang]) o.lang = 'es';
    return o;
  }catch(e){ return { ...ACCES_DEF }; }
}
function guardarAcces(){
  try{ localStorage.setItem('voceiro-acces-v2', JSON.stringify(ACCES)); }catch(e){}
}
function aplicarAcces(){
  const h = document.documentElement;
  h.lang = ACCES.lang;
  h.dataset.theme  = ACCES.tema;
  h.dataset.font   = ACCES.fuente;
  h.dataset.just   = ACCES.just ? '1' : '0';
  h.dataset.bionic = ACCES.bionic ? '1' : '0';
  h.dataset.focus  = ACCES.focus ? '1' : '0';
  h.style.setProperty('--fs', ACCES.fs + 'px');
  h.style.setProperty('--w', ACCES.width + 'px');

  document.querySelectorAll('.opt-group').forEach(g => {
    const clave = g.dataset.grupo;
    if (!clave) return;
    g.querySelectorAll('button').forEach(b => {
      if (clave === 'extra') b.classList.toggle('active', !!ACCES[b.dataset.val]);
      else                   b.classList.toggle('active', b.dataset.val === String(ACCES[clave]));
    });
  });

  $('#fs-val').textContent = ACCES.fs;
  $('#w-val').textContent  = ACCES.width;

  if (ACCES.focus) setTimeout(updateFocus, 30);
}
function ajustarFs(d){
  ACCES.fs = Math.max(LIM.fs.min, Math.min(LIM.fs.max, ACCES.fs + d * LIM.fs.step));
  guardarAcces(); aplicarAcces();
}
function ajustarWidth(d){
  ACCES.width = Math.max(LIM.width.min, Math.min(LIM.width.max, ACCES.width + d * LIM.width.step));
  guardarAcces(); aplicarAcces();
}

const PRESET_KEY = 'voceiro-presets-v4';

const PRESET_DEF = { grupos: [], palabras: [] };
const PRESET_UNICO_DEF = { id: 'general', nombre: 'General', grupos: [], palabras: [], overrides: {} };

const HIDE_MODE_KEY = 'voceiro-hide-mode';
const HIDE_MODES = ['off', 'read', 'viewed', 'both'];
let HIDE_MODE = 'off';

function cargarHideMode(){
  try {
    const raw = localStorage.getItem(HIDE_MODE_KEY);
    if (HIDE_MODES.includes(raw)) return raw;
    // migración desde el booleano antiguo
    const old = localStorage.getItem('voceiro-hide-read');
    if (old === 'true') return 'read';
  }catch(e){}
  return 'off';
}
function guardarHideMode(){
  try{ localStorage.setItem(HIDE_MODE_KEY, HIDE_MODE); }catch(e){}
}
function normalizarPreset(p){
  return {
    id:        String(p.id || 'general'),
    nombre:    String(p.nombre || p.id || 'General'),
    grupos:    Array.isArray(p.grupos)   ? p.grupos   : [],
    palabras:  Array.isArray(p.palabras) ? p.palabras : [],
    overrides: (p.overrides && typeof p.overrides === 'object' && !Array.isArray(p.overrides))
               ? p.overrides : {}
  };
}

function cargarPresets(){
  try{
    const raw = localStorage.getItem(PRESET_KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.lista) && p.lista.length){
        const lista = p.lista.map(normalizarPreset);
        const activo = (typeof p.activo === 'string' && lista.some(x => x.id === p.activo))
                       ? p.activo : lista[0].id;
        return { lista, activo };
      }
    }
  }catch(e){}
  // Sin datos previos → crear "General" vacío
  return {
    lista: [ structuredClone(PRESET_UNICO_DEF) ],
    activo: 'general'
  };
}

function guardarPresets(){
  try{ localStorage.setItem(PRESET_KEY, JSON.stringify(PRESETS)); }catch(e){}
  try{ localStorage.setItem(PRESET_ID_KEY, PRESETS.activo); }catch(e){}
  // Replicar al plugin para sync entre dispositivos
  if (typeof USCRIPT_OK !== 'undefined' && USCRIPT_OK){
    document.dispatchEvent(new CustomEvent('voceiro-save-voceiro-state', {
      detail: { presets: PRESETS.lista }
    }));
  }
}

// Compatibilidad: guarda el preset activo en la lista y persiste.
function guardarPreset(){
  if (!PRESETS || !Array.isArray(PRESETS.lista)) return;
  const idx = PRESETS.lista.findIndex(p => p.id === PRESETS.activo);
  if (idx >= 0){
    PRESETS.lista[idx] = { ...PRESETS.lista[idx], ...PRESET };
  }
  guardarPresets();
  actualizarBotonPreset();
}
function getOverride(domain){
  if (!PRESET || !PRESET.overrides) return '';
  return PRESET.overrides[domain] || '';
}

function setOverride(domain, value){
  if (!PRESET) return;
  if (!PRESET.overrides || typeof PRESET.overrides !== 'object') PRESET.overrides = {};
  if (!value){
    delete PRESET.overrides[domain];
  } else if (value === 'first' || value === 'ignore'){
    PRESET.overrides[domain] = value;
  }
  guardarPreset();
}

function aplicarPresetsDesdePlugin(d){
  if (!d || typeof d !== 'object') return false;
  if (!d.voceiro || typeof d.voceiro !== 'object') return false;
  const incoming = d.voceiro.presets;
  if (!Array.isArray(incoming) || !incoming.length) return false;

  const lista = incoming.map(normalizarPreset);
  const activoLocal = (PRESETS && PRESETS.activo) || 'general';
  const activoSigue = lista.some(p => p.id === activoLocal);
  const activoNuevo = activoSigue ? activoLocal : lista[0].id;

  PRESETS = { lista, activo: activoNuevo };
  PRESET = PRESETS.lista.find(p => p.id === activoNuevo);

  try{ localStorage.setItem(PRESET_KEY, JSON.stringify(PRESETS)); }catch(e){}
  try{ localStorage.setItem(PRESET_ID_KEY, activoNuevo); }catch(e){}

  recompilarPreset();
  actualizarBotonPreset();
  return true;
}

function cargarPresetActivo(){
  try{
    const raw = localStorage.getItem(PRESET_ACTIVO_KEY);
    if (raw === 'true') return true;
    if (raw === 'false') return false;
  }catch(e){}
  return presetTieneReglas();
}
function guardarPresetActivo(){
  try{ localStorage.setItem(PRESET_ACTIVO_KEY, PRESET_ACTIVO ? 'true' : 'false'); }catch(e){}
}
function presetTieneReglas(p){
  p = p || PRESET;
  if (!p) return false;
  const ov = p.overrides || {};
  return !!(
    (p.grupos && p.grupos.length) ||
    (p.palabras && p.palabras.length) ||
    Object.keys(ov).some(d => ov[d] === 'first' || ov[d] === 'ignore')
  );
}

function cargarSitesCache(){
  try{
    const raw = localStorage.getItem(SITES_CACHE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function guardarSitesCache(){
  try{
    const arr = [...SITES.entries()].map(([d, s]) => ({ domain: d, ...s }));
    localStorage.setItem(SITES_CACHE_KEY, JSON.stringify(arr));
  }catch(e){}
}
function setSitesFromArray(arr){
  SITES = new Map();
  SITES_LIST = [];
  (arr || []).forEach(s => {
    if (!s || !s.domain) return;
    SITES.set(s.domain, {
      lang: s.lang || 'auto',
      type: s.type || '',
      tags: Array.isArray(s.tags) ? s.tags.slice() : []
    });
    SITES_LIST.push({ domain: s.domain, ...SITES.get(s.domain) });
  });
}

      guardarPresets();
      guardarPresetActivo();
      recompilarPreset();
      actualizarBotonPreset();
      aplicarFiltros();
      cerrarPresetMenu();
    });
  });

/* ═══════════════════════════════════════════════════════════════
   BIONIC
   ═══════════════════════════════════════════════════════════════ */
const BIONIC_CACHE = new Map();
const BIONIC_CACHE_MAX = 8000;

function bionicize(html){
  if (!ACCES.bionic) return html;
  const cached = BIONIC_CACHE.get(html);
  if (cached !== undefined) return cached;
  let result = html;
  try{
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const root = doc.body.firstChild;
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => {
      const raw = tn.textContent;
      if (!raw || !/[\wÁÉÍÓÚÑáéíóúñ]/.test(raw)) return;
      const frag = doc.createDocumentFragment();
      const re = /([\wÁÉÍÓÚÑáéíóúñ]+)/g;
      let last = 0, m;
      while ((m = re.exec(raw)) !== null){
        if (m.index > last) frag.appendChild(doc.createTextNode(raw.slice(last, m.index)));
        const w = m[1];
        const half = Math.max(1, Math.ceil(w.length / 2));
        const b = doc.createElement('b');
        b.textContent = w.slice(0, half);
        frag.appendChild(b);
        frag.appendChild(doc.createTextNode(w.slice(half)));
        last = m.index + w.length;
      }
      if (last < raw.length) frag.appendChild(doc.createTextNode(raw.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    result = root.innerHTML;
  }catch(e){ result = html; }
  if (BIONIC_CACHE.size >= BIONIC_CACHE_MAX) BIONIC_CACHE.clear();
  BIONIC_CACHE.set(html, result);
  return result;
}

function updateFocus(){
  const items = document.querySelectorAll('.noticia');
  if (!ACCES.focus){
    items.forEach(el => el.classList.remove('foco-dim','foco-active'));
    return;
  }
  if (!items.length) return;
  const mid = window.innerHeight / 2;
  let best = null, bd = Infinity;
  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bd){ bd = d; best = el; }
  });
  items.forEach(el => {
    el.classList.toggle('foco-dim', el !== best);
    el.classList.toggle('foco-active', el === best);
  });
}
window.addEventListener('scroll', () => {
  if (ACCES.focus) requestAnimationFrame(updateFocus);
}, { passive: true });

const ACCENT_MAP = {a:'aáàäâ', e:'eéèëê', i:'iíìïî', o:'oóòöô', u:'uúùüû', n:'nñ'};
function buildHighlightRegex(tokens){
  if (!tokens.length) return null;
  const patterns = tokens.map(tok => {
    let p = '';
    for (const c of tok){
      let hit = false;
      for (const k in ACCENT_MAP){
        if (ACCENT_MAP[k].includes(c)){ p += '[' + ACCENT_MAP[k] + ']'; hit = true; break; }
      }
      if (!hit) p += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }
    return p;
  });
  return new RegExp('(' + patterns.join('|') + ')', 'gi');
}

function resaltar(texto, rx, fallbackEsc){
  if (!rx) return fallbackEsc != null ? fallbackEsc : escapeHtml(texto || '');
  if (!texto) return '';
  let out = '', last = 0;
  const matches = texto.matchAll(rx);
  for (const mm of matches){
    out += escapeHtml(texto.slice(last, mm.index));
    out += '<mark>' + escapeHtml(mm[0]) + '</mark>';
    last = mm.index + mm[0].length;
  }
  out += escapeHtml(texto.slice(last));
  return out;
}

let USCRIPT_OK = false;

let PENDIENTES_CACHE = [];
let PENDIENTES_URLS = new Set();
let PENDIENTES_MAP  = new Map();

const LOCAL_TOUCH = new Map();
const LOCAL_TOUCH_TTL = 10000;
const PEND_LOCAL_KEY = 'voceiro-pendientes-local-v1';
let PENDIENTES_LOCAL = (() => {
  try {
    const raw = localStorage.getItem(PEND_LOCAL_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
})();
function guardarPendientesLocal(){
  try { localStorage.setItem(PEND_LOCAL_KEY, JSON.stringify(PENDIENTES_LOCAL)); } catch(e){}
}

// El plugin ya no escribe directamente: guardamos su último snapshot
let PENDIENTES_PLUGIN = [];

function touchLocal(domain){
  LOCAL_TOUCH.set(domain, Date.now());
}
function isLocalTouched(domain){
  const ts = LOCAL_TOUCH.get(domain);
  if (!ts) return false;
  if (Date.now() - ts > LOCAL_TOUCH_TTL){
    LOCAL_TOUCH.delete(domain);
    return false;
  }
  return true;
}

function aplicarSitesDesdeUserscript(arr){
  const incoming = new Map();
  (arr || []).forEach(s => {
    if (!s || !s.domain) return;
    incoming.set(s.domain, {
      lang: s.lang || 'auto',
      type: s.type || '',
      tags: Array.isArray(s.tags) ? s.tags.slice() : []
    });
  });

  SITES = new Map();
  SITES_LIST = [];

  incoming.forEach((v, d) => {
    // Si el dominio fue tocado en esta pestaña hace poco (TTL),
    // damos prioridad a lo local. Si no, gana el userscript.
    if (isLocalTouched(d)){
      const local = window.__lastLocal.get(d);
      if (local){
        SITES.set(d, local);
        SITES_LIST.push({ domain: d, ...local });
        return;
      }
    }
    SITES.set(d, v);
    SITES_LIST.push({ domain: d, ...v });
  });

  // Reañadir los dominios que solo existen localmente
  // (creados aquí sin userscript, o con el plugin desconectado)
  window.__lastLocal.forEach((v, d) => {
    if (!SITES.has(d)){
      SITES.set(d, v);
      SITES_LIST.push({ domain: d, ...v });
    }
  });

  guardarSitesCache();
}

 function rebuildPendientes(){
  const winner = new Map();
  function consider(i, src){
    if (!i || !i.url) return;
    const k = normalizeUrlForMatch(i.url);
    const prev = winner.get(k);
    let gana;
    if (!prev)                          gana = true;
    else if (prev.read && !i.read)      gana = false;
    else if (!prev.read && i.read)      gana = true;
    else                                gana = (src === 'plugin');
    if (gana) winner.set(k, { ...i, _src: src });
  }
  PENDIENTES_LOCAL.forEach(i => consider(i, 'local'));
  PENDIENTES_PLUGIN.forEach(i => consider(i, 'plugin'));

  const items = [...winner.values()];
  PENDIENTES_CACHE = items;

  const map = new Map();
  items.forEach(i => {
    map.set(normalizeUrlForMatch(i.url), i);
    if (Array.isArray(i.aliasUrls)){
      i.aliasUrls.forEach(u => {
        if (!u) return;
        const k = normalizeUrlForMatch(u);
        const ex = map.get(k);
        if (!ex || (!ex.read && i.read)) map.set(k, i);
      });
    }
  });
  PENDIENTES_MAP  = map;
  PENDIENTES_URLS = new Set(map.keys());

  refrescarBotonesGuardar();
  if ($('#panel-pendientes').classList.contains('open')){
    renderPendientes(PENDIENTES_CACHE);
  }
}

function addLocalPendiente({ url, title, description, image }){
  if (!url) return false;
  const k = normalizeUrlForMatch(url);
  if (PENDIENTES_LOCAL.some(i => normalizeUrlForMatch(i.url) === k)) return false;
  let domain = '';
  try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch(e){}
  PENDIENTES_LOCAL.push({
    url, title: title || '', description: description || '', image: image || '',
    domain, date: Date.now(), read: false, readAt: null
  });
  guardarPendientesLocal();
  rebuildPendientes();
  return true;
}
function setLocalPendienteRead(url, read){
  const k = normalizeUrlForMatch(url);
  let changed = false;
  PENDIENTES_LOCAL.forEach(i => {
    if (normalizeUrlForMatch(i.url) === k){
      i.read = read;
      i.readAt = read ? new Date().toISOString() : null;
      changed = true;
    }
  });
  if (changed){ guardarPendientesLocal(); rebuildPendientes(); }
  return changed;
}
function removeLocalPendiente(url){
  const k = normalizeUrlForMatch(url);
  const n = PENDIENTES_LOCAL.length;
  PENDIENTES_LOCAL = PENDIENTES_LOCAL.filter(i => normalizeUrlForMatch(i.url) !== k);
  if (PENDIENTES_LOCAL.length !== n){ guardarPendientesLocal(); rebuildPendientes(); }
}
function desmarcarLeidaLocal(url){
  const k = normalizeUrlForMatch(url);
  if (!LEIDAS_LOCAL.has(k)) return;
  LEIDAS_LOCAL.delete(k);
  try { localStorage.setItem(LEIDAS_KEY, JSON.stringify([...LEIDAS_LOCAL])); } catch(e){}
}

function emitirUpdateSite(domain, patch){
  const prev = SITES.get(domain) || { lang: 'auto', type: '', tags: [] };
  const next = { ...prev, ...patch };
  SITES.set(domain, next);

  const idx = SITES_LIST.findIndex(s => s.domain === domain);
  if (idx >= 0) SITES_LIST[idx] = { domain, ...next };
  else SITES_LIST.push({ domain, ...next });

  window.__lastLocal.set(domain, next);
  touchLocal(domain);
  guardarSitesCache();

  if (USCRIPT_OK){
    document.dispatchEvent(new CustomEvent('voceiro-update-site', {
      detail: { domain, ...patch }
    }));
  }
}

function guardarParaLeerDespues(n){
  const url = n.enlace;
  const key = normalizeUrlForMatch(url);
  const item = PENDIENTES_MAP.get(key);
  const guardada = !!item;

  // Caso 1: no está → añadir
  if (!guardada){
    if (USCRIPT_OK){
      document.dispatchEvent(new CustomEvent('voceiro-save-later', {
        detail: { url, title: n.titular, description: n.grupo || '', image: '' }
      }));
    } else {
      addLocalPendiente({ url, title: n.titular, description: n.grupo || '' });
      toast(t('savedToReader'), 1800);
    }
    return;
  }

  // Caso 2: ya está → alternar leída/no leída
  const nuevaLeida = !item.read;

  if (USCRIPT_OK && item._src === 'plugin'){
    document.dispatchEvent(new CustomEvent('voceiro-mark-read', { detail: { url } }));
  }

  // Espejo local siempre (para que LEIDAS_LOCAL y pendientes locales queden coherentes)
  if (nuevaLeida) marcarLeidaLocal(url);
  else            desmarcarLeidaLocal(url);

  if (item._src === 'local' || !USCRIPT_OK){
    setLocalPendienteRead(url, nuevaLeida);
  }
}

  let html = '';
  if (noLeidas.length){
    html += `<div style="font-size:.68em; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 6px;">${escapeHtml(t('readItemsNo'))} (${noLeidas.length})</div>`;

  if (leidas.length){
    html += `<div style="font-size:.68em; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 6px;">${escapeHtml(t('readItems'))} (${leidas.length})</div>`;

  cont.innerHTML = html;

cont.querySelectorAll('.btn-pend-toggle').forEach(b => {

let NOTICIAS = [];
let MEDIOS = {};
let MEDIOS_UNICOS = [];

let _manifest = null;   // guardamos el manifest para la fase 2

async function cargarPortada(){
  const manifestRes = await fetch(`${DATA_BASE}/manifest.json`, { cache: 'no-cache' });
  if (!manifestRes.ok) throw new Error('manifest HTTP ' + manifestRes.status);
  _manifest = await manifestRes.json();
  const ficheros = _manifest.ficheros || [];
  if (!ficheros.length) throw new Error('manifest sin ficheros');

  MEDIOS = {};
  NOTICIAS = [];
  _hidratadasHasta = 0;
  _dupsHechosHasta = 0;
  _dupsLogged = false;

  const portadaFile = (_manifest.portada && _manifest.portada.file)
                      ? _manifest.portada.file
                      : 'portada.json';   // fallback por si hay manifest viejo cacheado

  try {
    const r = await fetch(`${DATA_BASE}/${portadaFile}`, { cache: 'force-cache' });
    if (r.ok){
      const data = await r.json();
      if (data.medios) for (const d in data.medios) MEDIOS[d] = data.medios[d];
      const dia = data.generado ? data.generado.slice(0, 10) : '';
      for (const n of (data.noticias || [])){
        n._dia = dia;
        n._generado = data.generado || '';
        NOTICIAS.push(n);
      }
    }
  } catch(e){
    console.warn('[carga] portada falló, sigo con histórico:', e.message);
  }

  refrescarVistaCompleta();
}

const VENTANA_CLIENTE_HORAS = 72;

function cargarHistoricoEnBackground(){
  if (!_manifest) return;
  const todos = _manifest.ficheros || [];
  if (!todos.length) return;

  const corte = Date.now() - VENTANA_CLIENTE_HORAS * 3600 * 1000;
  const ficheros = todos.filter(f => {
    const ts = Date.parse(f.fecha + 'T00:00:00+02:00');
    return !isNaN(ts) && ts >= corte;
  });
  if (!ficheros.length) return;

  const urlsCargadas = new Set();
  for (const n of NOTICIAS){
    const u = n.u || '';
    if (u){
      const full = u.startsWith('http') ? u
                 : (u.startsWith('/') ? `https://${n.d || ''}${u}` : u);
      urlsCargadas.add(normalizeUrlForMatch(full));
    }
  }

  const ficherosOrdenados = [...ficheros].sort((a, b) =>
    String(b.fecha).localeCompare(String(a.fecha))
  );

  let totalAñadidas = 0;
  const refrescarDebounced = debounce(refrescarVistaCompleta, 350);

  async function procesarFichero(f){
    let r;
    try {
      r = await fetch(`${DATA_BASE}/${f.file}`, { cache: 'force-cache' });
    } catch(e){ return; }
    if (!r.ok) return;

    let data;
    try { data = await r.json(); } catch(e){ return; }

    const diaFichero      = data.fecha    || '';
    const generadoFichero = data.generado || '';
    if (data.medios){
      for (const d in data.medios) MEDIOS[d] = data.medios[d];
    }

    let añadidas = 0;
    for (const n of (data.noticias || [])){
      const u = n.u || '';
      const full = u.startsWith('http') ? u
                 : (u.startsWith('/') ? `https://${n.d || ''}${u}` : u);
      const clave = normalizeUrlForMatch(full);
      if (urlsCargadas.has(clave)) continue;
      urlsCargadas.add(clave);
      n._dia = diaFichero;
      n._generado = generadoFichero;
      NOTICIAS.push(n);
      añadidas++;
    }
    totalAñadidas += añadidas;
    if (añadidas > 0) refrescarDebounced();
  }

  const CONCURRENCIA = 6;
  const cola = ficherosOrdenados.slice();
  async function worker(){
    while (cola.length){
      const f = cola.shift();
      if (!f) break;
      await procesarFichero(f);
    }
  }
  Promise.all(
    Array.from({ length: Math.min(CONCURRENCIA, ficherosOrdenados.length) }, worker)
  ).then(() => {
    refrescarDebounced.cancel();
    refrescarVistaCompleta();
    console.log(`[carga] histórico: +${totalAñadidas} noticias · total ${NOTICIAS.length}`);
  });
}

function refrescarVistaCompleta(){
  hidratarNoticias();
  construirMediosUnicos();
  construirGruposDuplicados();
  construirIndicesBusqueda();
  reconstruirSelectores();
  aplicarFiltros();
}

function reconstruirFecha(raw, dia){
  if (!raw) return '';
  const s = String(raw).trim();
  if (s.includes('T') && s.length > 10) return s;
  if (/^\d{2}:\d{2}$/.test(s) && dia){
    return `${dia}T${s}:00+02:00`;
  }
  return s;
}
let _hidratadasHasta = 0;
function hidratarNoticias(){
  const ahora = Date.now();
  const horizonte = ahora + HORIZONTE_FUTURO_MS;

  for (let i = _hidratadasHasta; i < NOTICIAS.length; i++){
    const n = NOTICIAS[i];
    if (n._hidratada) continue;
    n._hidratada = true;
    if (n.dominio === undefined) n.dominio = n.d || '';
    if (n.titular === undefined) n.titular = n.t || '';
    if (n.fuente === undefined) n.fuente = n.f || '';

    // ── URL: path (nuevo) o completa (viejo) ──
        // ── URL: path (nuevo) o completa (viejo) ──
    const u_raw = n.u || '';
    if (u_raw.startsWith('http://') || u_raw.startsWith('https://')){
      n.enlace = u_raw;
    } else if (u_raw.startsWith('/')){
      const m = MEDIOS[n.dominio] || {};
      const host = m.h || `www.${n.dominio}`;
      n.enlace = `https://${host}${u_raw}`;
    } else {
      n.enlace = u_raw;
    }

    // ── Fechas: HH:MM (nuevo) o ISO (viejo) ──
    n.fecha_pub      = reconstruirFecha(n.p, n._dia);
    n.fecha_estimada = reconstruirFecha(n.e, n._dia);
    // `c` ya no existe: usamos el `generado` del fichero
    n.fecha          = n._generado || '';

    n.titular = limpiarCdata(n.titular);

    const m = MEDIOS[n.dominio] || {};
    if (n.medio === undefined || !n.medio) n.medio = m.n || '';
    if (n.grupo === undefined || !n.grupo) n.grupo = m.g || '';
    if (n.tipo  === undefined || !n.tipo ) n.tipo  = m.t || '';
    if (n.lang  === undefined || !n.lang ) n.lang  = m.l || '';
    if (!Array.isArray(n.tags) || !n.tags.length) n.tags = m.tags || [];

    n._titularEsc = escapeHtml(n.titular);
    n._medioEsc   = escapeHtml(n.medio);
    n._tipoEsc    = escapeHtml(n.tipo);
    n._grupoEsc   = escapeHtml(n.grupo);
    n._enlaceEsc  = escapeHtml(n.enlace);
    n._esPreset   = false;

    const tsPub = parseFecha(n.fecha_pub);
    const tsEst = parseFecha(n.fecha_estimada);
    const tsRec = parseFecha(n.fecha);

    let tsOrden = NaN;
    if (!isNaN(tsPub) && tsPub <= horizonte) tsOrden = tsPub;
    else if (!isNaN(tsEst)) tsOrden = tsEst;
    else if (!isNaN(tsRec)) tsOrden = tsRec;

    let tsShow = NaN;
    let tipoShow = 'none';
    if (!isNaN(tsPub)){ tsShow = tsPub; tipoShow = 'pub'; }
    else if (!isNaN(tsEst)){ tsShow = tsEst; tipoShow = 'est'; }
    else if (!isNaN(tsRec)){ tsShow = tsRec; tipoShow = 'rec'; }

    n._tsOrden    = tsOrden;
    n._tsShow     = tsShow;
    n._tipoShow   = tipoShow;
    n._esFuturo   = !isNaN(tsPub) && (tsPub > horizonte);
    n._tieneFecha = !isNaN(tsOrden);
  }
  _hidratadasHasta = NOTICIAS.length;
}

function construirMediosUnicos(){
  MEDIOS_UNICOS = Object.entries(MEDIOS).map(([dominio, m]) => ({
    dominio,
    medio: m.n || '',
    grupo: m.g || '',
    tipo:  m.t || '',
    lang:  m.l || '',
    tags:  Array.isArray(m.tags) ? m.tags : [],
  })).sort((a,b) =>
    a.grupo.localeCompare(b.grupo) || a.medio.localeCompare(b.medio)
  );
}
let _dupsHechosHasta = 0;
let _dupsLogged = false;
function construirGruposDuplicados(){
  let total = 0;
  for (let i = _dupsHechosHasta; i < NOTICIAS.length; i++){
    const n = NOTICIAS[i];
    if (n._dupsHecho) continue;
    n._dupsHecho = true;

    if (Array.isArray(n.a) && n.a.length){
      n._dupHidden = n.a.map(o => {
        const dom = o.d || '';
        const u_raw = o.u || '';
        let enlace;
        if (u_raw.startsWith('http://') || u_raw.startsWith('https://')){
          enlace = u_raw;
        } else if (u_raw.startsWith('/')){
          const m = MEDIOS[dom] || {};
          const host = m.h || `www.${dom}`;
          enlace = `https://${host}${u_raw}`;
        } else {
          enlace = u_raw;
        }
        return {
          dominio: dom,
          medio:   (MEDIOS[dom] && MEDIOS[dom].n) || dom,
          enlace:  enlace,
        };
      });
      total += n.a.length;
    } else {
      n._dupHidden = null;
    }
  }
  _dupsHechosHasta = NOTICIAS.length;

  if (total && !_dupsLogged){
    console.log(`[dups] ${total} noticias referenciadas como 'alt'`);
    _dupsLogged = true;
  }
}

function construirIndicesBusqueda(){
  MEDIOS_STRICT   = new Map();
  DOMINIOS_STRICT = new Map();
  MEDIOS_UNICOS.forEach(m => {
    if (m.medio)   MEDIOS_STRICT.set(normStrict(m.medio), m.medio);
    if (m.dominio) DOMINIOS_STRICT.set(normDomain(m.dominio), m.dominio);
  });
}

/* ═══════════════════════════════════════════════════════════════
   PARSER DE BÚSQUEDA + CHIPS
   Autodetección: SOLO medio y dominio. Todo lo demás → título.
   ═══════════════════════════════════════════════════════════════ */
function parseQuery(raw){
  const tokens = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(raw)) !== null){
    tokens.push({ text: m[1] != null ? m[1] : m[2], raw: m[0], quoted: m[1] != null });
  }

  const titulo = [], medios = [], dominios = [], grupos = [], tipos = [], tags = [];
  const chips = [];

  for (const tk of tokens){
    const low = tk.text.toLowerCase();

    if (!tk.quoted){
      if (low.startsWith('medio:')){
        const v = normStrict(tk.text.slice(6));
        if (v){ medios.push(v); chips.push({ type: 'medio', value: tk.text.slice(6), raw: tk.raw }); }
        continue;
      }
      if (low.startsWith('dominio:')){
        const v = normDomain(tk.text.slice(8));
        if (v){ dominios.push(v); chips.push({ type: 'dominio', value: tk.text.slice(8), raw: tk.raw }); }
        continue;
      }
      if (low.startsWith('domain:')){
        const v = normDomain(tk.text.slice(7));
        if (v){ dominios.push(v); chips.push({ type: 'dominio', value: tk.text.slice(7), raw: tk.raw }); }
        continue;
      }
      if (low.startsWith('grupo:')){
        const v = normStrict(tk.text.slice(6));
        if (v){ grupos.push(v); chips.push({ type: 'grupo', value: tk.text.slice(6), raw: tk.raw }); }
        continue;
      }
      if (low.startsWith('tipo:')){
        const v = normStrict(tk.text.slice(5));
        if (v){ tipos.push(v); chips.push({ type: 'tipo', value: tk.text.slice(5), raw: tk.raw }); }
        continue;
      }
      if (low.startsWith('tag:')){
        const v = normStrict(tk.text.slice(4));
        if (v){ tags.push(v); chips.push({ type: 'tag', value: tk.text.slice(4), raw: tk.raw }); }
        continue;
      }
    }

    if (tk.quoted){
      const n = normalize(tk.text);
      if (n) titulo.push(n);
      continue;
    }

    if (tk.text.includes('.')){
      const d = normDomain(tk.text).replace(/^www\./, '');
      if (d){
        dominios.push(d);
        chips.push({ type: 'dominio', value: tk.text, raw: tk.raw });
        continue;
      }
    }
    const strict = normStrict(tk.text);
    if (strict.length >= 3 && MEDIOS_STRICT.has(strict)){
      medios.push(strict);
      chips.push({ type: 'medio', value: MEDIOS_STRICT.get(strict), raw: tk.raw });
      continue;
    }

    const n = normalize(tk.text);
    if (n) titulo.push(n);
  }

  return { titulo, medios, dominios, grupos, tipos, tags, chips };
}

function renderChips(parsed, rawQuery){
  const cont = $('#chips-busqueda');
  if (!cont) return;

  if (!parsed.chips.length){
    cont.style.display = 'none';
    cont.innerHTML = '';
    return;
  }

  cont.style.display = '';
  cont.innerHTML = parsed.chips.map((c, i) =>
    `<span class="chip">
      <span class="chip-tipo">${escapeHtml(c.type)}</span>
      <span>${escapeHtml(c.value)}</span>
      <button type="button" class="chip-x" data-idx="${i}" title="${escapeHtml(t('chipLiteral'))}">×</button>
    </span>`
  ).join('');

  cont.querySelectorAll('.chip-x').forEach(b => {
    b.addEventListener('click', () => {
      const i = parseInt(b.dataset.idx, 10);
      const chip = parsed.chips[i];
      if (!chip) return;
      const esc = _escapeRegex(chip.raw);
      const rx = new RegExp('(^|\\s)(' + esc + ')(?=\\s|$)', 'g');
      const nueva = rawQuery.replace(rx, (m, pre) => pre + '"' + chip.value + '"');
      $('#buscar').value = nueva;
      aplicarFiltros();
    });
  });
}

function ordenarGruposPorIdioma(grupos){
  const target = (ACCES && ACCES.lang) || 'es';
  const stats = {};
  MEDIOS_UNICOS.forEach(m => {
    if (!stats[m.grupo]) stats[m.grupo] = { total: 0, matches: 0 };
    stats[m.grupo].total++;
    if (m.lang === target) stats[m.grupo].matches++;
  });
  return grupos.slice().sort((a, b) => {
    const sa = stats[a] || { total: 0, matches: 0 };
    const sb = stats[b] || { total: 0, matches: 0 };
    if (sa.matches !== sb.matches) return sb.matches - sa.matches;
    const ra = sa.total ? sa.matches / sa.total : 0;
    const rb = sb.total ? sb.matches / sb.total : 0;
    if (ra !== rb) return rb - ra;
    return a.localeCompare(b);
  });
}
function gruposAfinesAlIdioma(){
  const target = (ACCES && ACCES.lang) || 'es';
  const set = new Set();
  MEDIOS_UNICOS.forEach(m => { if (m.lang === target) set.add(m.grupo); });
  return set;
}

function reconstruirSelectores(){
  const grupos = ordenarGruposPorIdioma([...new Set(MEDIOS_UNICOS.map(m => m.grupo))]);

  const selG_prev  = $('#grupo').value;
  const selM_prev  = $('#medio').value;
  const selFG_prev = $('#filtro-grupo-medio').value;

  // <select id="grupo">
  const selG = $('#grupo');
  while (selG.options.length > 1) selG.remove(1);
  if (selG.options[0]) selG.options[0].text = t('fltGrupo');
  grupos.forEach(g => selG.add(new Option(g, g)));
  if (selG_prev && [...selG.options].some(o => o.value === selG_prev)) selG.value = selG_prev;

  // <select id="filtro-grupo-medio">
  const selFG = $('#filtro-grupo-medio');
  while (selFG.options.length > 1) selFG.remove(1);
  if (selFG.options[0]) selFG.options[0].text = t('cfgTodosGrupos');
  grupos.forEach(g => selFG.add(new Option(g, g)));
  if (selFG_prev && [...selFG.options].some(o => o.value === selFG_prev)) selFG.value = selFG_prev;

  // <datalist id="medio-datalist">
  const dlM = $('#medio-datalist');
  if (dlM){
    const setMedios = new Set();
    MEDIOS_UNICOS.forEach(m => { if (m.medio) setMedios.add(m.medio); });
    dlM.innerHTML = [...setMedios].sort().map(m =>
      `<option value="${escapeHtml(m)}"></option>`
    ).join('');
  }
  const inpM = $('#medio');
  if (inpM){
    inpM.placeholder = t('fltMedio');
    if (selM_prev) inpM.value = selM_prev;
  }
}

function activarModo(id){
  const target = PRESETS.lista.find(p => p.id === id);
  if (!target) return;
  PRESETS.activo = id;
  PRESET = target;
  PRESET_ACTIVO = true;
  guardarPresets();
  guardarPresetActivo();
  recompilarPreset();
  actualizarBotonPreset();
  renderModosPanel();
  renderListaMedios();
  escribirPanel(PRESET);
  aplicarFiltros();
}

function renombrarModo(id){
  const p = PRESETS.lista.find(x => x.id === id);
  if (!p) return;
  const nuevo = prompt(t('cfgModoRenombrarPrompt', { X: p.nombre }), p.nombre);
  if (nuevo == null) return;
  const limpio = nuevo.trim();
  if (!limpio) return;
  p.nombre = limpio;
  if (PRESET.id === id) PRESET.nombre = limpio;
  guardarPresets();
  actualizarBotonPreset();
  renderModosPanel();
}

function duplicarModo(id){
  const p = PRESETS.lista.find(x => x.id === id);
  if (!p) return;
  const copia = structuredClone(p);
  copia.id = 'm-' + Date.now().toString(36);
  copia.nombre = p.nombre + ' ' + t('cfgModoDuplicarSufijo');
  PRESETS.lista.push(copia);
  guardarPresets();
  renderModosPanel();
}

function borrarModo(id){
  if (PRESETS.lista.length <= 1){
    toast(t('cfgModoUnicoNoBorrar'), 2400);
    return;
  }
  const p = PRESETS.lista.find(x => x.id === id);
  if (!p) return;
  if (!confirm(t('cfgModoConfirmBorrar', { X: p.nombre }))) return;

  PRESETS.lista = PRESETS.lista.filter(x => x.id !== id);
  if (PRESETS.activo === id){
    PRESETS.activo = PRESETS.lista[0].id;

function normalizarDominioInput(s){
  return String(s || '').trim().toLowerCase()
    .replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
}



function aplicarListaOverrides(){
  const txt = $('#ov-pegar').value || '';
  const lineas = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let ok = 0, ko = 0;
  lineas.forEach(l => {
    const m = l.match(/^([+-]?)\s*(.+)$/);
    if (!m){ ko++; return; }
    const signo = m[1] || '-';
    const d = normalizarDominioInput(m[2]);
    if (!d || !/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$/.test(d)){ ko++; return; }
    setOverride(d, signo === '+' ? 'first' : 'ignore');
    ok++;
  });
  $('#ov-pegar').value = '';
  renderModosPanel();
  renderListaMedios();
  aplicarFiltros();
  toast(`OK: ${ok} · KO: ${ko}`, 2200);
}

/* ═══════════════════════════════════════════════════════════════
   CUMPLE PRESET
   ═══════════════════════════════════════════════════════════════ */
let RX_PRESET = null;
let SET_GRUPOS = new Set();

function recompilarPreset(){
  SET_GRUPOS = new Set(PRESET.grupos);
  const words = PRESET.palabras.map(p => normalize(p).trim()).filter(Boolean)
    .map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  RX_PRESET = words.length ? new RegExp('\\b(' + words.join('|') + ')\\b') : null;
}
function cumplePreset(n){
  const ov = getOverride(n.dominio);
  if (ov === 'ignore') return false;
  if (ov === 'first')  return true;
  if (SET_GRUPOS.has(n.grupo)) return true;
  if (RX_PRESET){
    const tn = n._titNorm || (n._titNorm = normalize(n.titular));
    if (RX_PRESET.test(tn)) return true;
  }
  return false;
}

const FONT_MAP_TO_LECTOR = { serif: 'georgia', sans: 'sans', dyslexic: 'dyslexic' };
const FONT_MAP_FROM_LECTOR = { georgia: 'serif', serif: 'serif', sans: 'sans', dyslexic: 'dyslexic' };

function detectarFormato(data){
  if (!data || typeof data !== 'object') return 'invalid';
  if (data._app === 'voceiro') return 'voceiro';
  if (Array.isArray(data.sites) || data.prefs || Array.isArray(data.disabledDomains)) return 'userscript';
  if (data.acces || data.preset) return 'voceiro';
  return 'unknown';
}

function exportarConfig(){
  const sitesArr = [...SITES.entries()].map(([d, s]) => ({
    domain: d,
    lang: s.lang || 'auto',
    type: s.type || '',
    tags: s.tags || [],
    ignorePatterns: [],
    readerSource: 'auto',
    textOnly: false
  }));

  const lectorPrefs = {

    focus: ACCES.focus,

  };

  const payload = {
    _app: 'voceiro',
    _version: 5,
    _format: 'combo',
    _exported: new Date().toISOString(),

  a.click();
