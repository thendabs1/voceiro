name = "voceiro-sync"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Dominio propio: el WAF de la zona voceiro.eu (límite por IP) va delante.
# workers.dev sigue abierto mientras queden clientes viejos que lo usan;
# cuando no, workers_dev = false (si no, se puede saltar el WAF).
routes = [{ pattern = "sync.voceiro.eu", custom_domain = true }]
workers_dev = true

# Sincronización de Voceiro entre dispositivos: guarda un bloque cifrado en
# el navegador por cada código. El servidor no puede leer lo que guarda.
[[d1_databases]]
binding = "DB"
database_name = "voceiro-sync"
database_id = "1db3d775-d97d-454a-891e-346a56eef456"

# Limpieza diaria: códigos sin uso en 12 meses y contadores viejos.
[triggers]
crons = ["17 3 * * *"]

# Secreto obligatorio para altas: SYNC_IP_SECRET (64 caracteres hex aleatorios).
# Configurar el mismo valor en Deno; ver SEGURIDAD.md antes de desplegar.
