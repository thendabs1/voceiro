name = "voceiro-sync"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sincronización de Voceiro entre dispositivos: guarda un bloque cifrado en
# el navegador por cada código. El servidor no puede leer lo que guarda.
[[d1_databases]]
binding = "DB"
database_name = "voceiro-sync"
database_id = "1db3d775-d97d-454a-891e-346a56eef456"

# Limpieza diaria: códigos sin uso en 12 meses y contadores viejos.
[triggers]
crons = ["17 3 * * *"]
