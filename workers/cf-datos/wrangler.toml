name = "voceiro-datos"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Dominio propio: el WAF de la zona voceiro.eu (límite por IP) va delante.
# workers.dev sigue abierto mientras queden clientes viejos que lo usan;
# cuando no, workers_dev = false (si no, se puede saltar el WAF).
routes = [{ pattern = "datos.voceiro.eu", custom_domain = true }]
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "voceiro-datos"