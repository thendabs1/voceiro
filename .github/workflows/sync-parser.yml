name: Sync parser

on:
  push:
    branches: [main]
    paths:
      - 'shared/parser.js'
      - 'scripts/sync-parser.mjs'
      - 'scripts/test-parser.mjs'
      - '.github/workflows/sync-parser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar parser
        run: node scripts/sync-parser.mjs

      - name: Verificar sincronización
        run: node scripts/test-parser.mjs

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/parser.js \
                  workers/deno-buscar/src/shared/parser.js \
                  workers/cf-buscar/src/parser-source.js \
                  workers/deno-buscar/src/parser-source.js
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: sync parser"
            git pull --rebase origin main
            git push
          fi