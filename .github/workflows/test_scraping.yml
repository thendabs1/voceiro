name: Diagnóstico de dominio

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL completa de página, feed o sitemap (también fuera del catálogo)'
        required: true
        default: 'https://www.revistamongolia.com/'
      tipo:
        description: 'auto descubre feeds y prueba fuentes del catálogo; otros prueban un método'
        type: choice
        default: auto
        options: [auto, rss, sitemap, scrape, wp, gn]
      lang:
        description: 'Idioma de Google News para dominios nuevos'
        default: es

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspeccionar estructura y extracción
        run: python diagnosticar_dominio.py "$URL" --tipo "$TIPO" --lang "$IDIOMA" --json diagnostico.json
        env:
          URL: ${{ inputs.url }}
          TIPO: ${{ inputs.tipo }}
          IDIOMA: ${{ inputs.lang }}
          RELAY_CLAVE: ${{ secrets.RELAY_CLAVE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-dominio
          path: diagnostico.json
