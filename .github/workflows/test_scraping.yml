name: Test scraping

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a probar'
        required: true
        default: 'https://www.revistamongolia.com/'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar test
        run: python test_scraping.py "${{ github.event.inputs.url }}"
