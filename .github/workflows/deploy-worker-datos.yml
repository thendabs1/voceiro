name: Deploy Worker Datos

on:
  push:
    branches: [main]
    paths:
      - 'workers/cf-datos/**'
      - 'workers/comun/**'
      - 'scripts/sync-workers.mjs'
      - '.github/workflows/deploy-worker-datos.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy a Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Preparar módulos comunes locales
        run: node scripts/sync-workers.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'workers/cf-datos'
          command: deploy

