name: Actualizar Titulares

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write        # ← CAMBIO: necesitamos escribir en el repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ← necesario para hacer commit desde el runner

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector
        run: python recolector.py

      - name: Verificar public/
        run: |
          ls -la public/
          du -h public/datos.json public/index.html

      # ═══════════════════════════════════════════════════════════
      # Persistir el histórico: commitear datos.json de vuelta al repo
      # ═══════════════════════════════════════════════════════════
      - name: Guardar histórico en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/datos.json
          if git diff --staged --quiet; then
            echo "Sin cambios en datos.json"
          else
            git commit -m "Actualizar histórico [skip ci]"
            git push
            echo "Histórico guardado en el repo"
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
