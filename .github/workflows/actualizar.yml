name: Actualizar Titulares

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar recolector
        run: python recolector.py

      # 👇 DEPURACIÓN: esto te dirá si public/ existe y qué contiene
      - name: Verificar que public/ existe
        run: |
          echo "=== Contenido de public/ ==="
          ls -la public/ || echo "ERROR: la carpeta public NO existe"
          echo "=== Tamaño de index.html ==="
          wc -c public/index.html || echo "ERROR: index.html NO existe"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
