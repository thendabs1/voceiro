name: Actualizar Titulares

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta en el minuto 0 de cada hora
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar el recolector de titulares
        run: python recolector.py

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
