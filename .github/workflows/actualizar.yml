name: Actualizar Titulares

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # La punta de la rama al empezar, no el commit del lanzamiento: un
          # run encolado tras otro (cron cada 10 min) partiría del
          # state.json anterior al del run que le precede.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Setup Node (tests del buscador)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Si fallan, no se para el run: los datos se siguen publicando, pero
      # el recolector no regenera el front (VOCEIRO_FRONT_CONGELADO) y se
      # publica el último front bueno, el que está en el repo.
      - name: Construir y comprobar el frontend candidato
        id: tests
        continue-on-error: true
        run: |
          cp -a public "$RUNNER_TEMP/front-anterior"
          node scripts/sync-workers.mjs --check
          python3 scripts/generar_front.py
          node --check public/app.js
          node --test 'tests/**/*.test.mjs'

      - name: Recuperar el frontend anterior si falla el candidato
        if: steps.tests.outcome == 'failure'
        run: |
          test -d "$RUNNER_TEMP/front-anterior"
          rm -rf public
          cp -a "$RUNNER_TEMP/front-anterior" public

      - name: Ejecutar recolector
        run: python recolector.py
        env:
          VOCEIRO_FRONT_CONGELADO: ${{ steps.tests.outcome == 'failure' && '1' || '' }}
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # El lector (lector/) se sirve en Pages: …/voceiro/lector.user.js, y
      # Violentmonkey lo actualiza solo desde ahí. Solo se sustituye si se
      # construye y pasa las comprobaciones; si no, se publica el anterior.
      - name: Construir el lector
        run: |
          if node lector/build.mjs "$RUNNER_TEMP/lector.user.js" \
             && node --check "$RUNNER_TEMP/lector.user.js" \
             && node lector/comprobar.mjs "$RUNNER_TEMP/lector.user.js"; then
            cp "$RUNNER_TEMP/lector.user.js" public/lector.user.js
          else
            echo "::warning::El lector no pasó las comprobaciones; se publica el anterior"
          fi

      - name: Limpiar datos.json obsoleto (formato antiguo)
        run: rm -f public/datos.json

      - name: Verificar public/
        run: |
          ls -la public/
          ls -la public/datos/ 2>/dev/null || echo "⚠ public/datos/ no existe"
          du -sh public/index.html public/datos/ 2>/dev/null
          [ -f state.json ] && du -sh state.json || echo "(sin state.json)"

      - name: Guardar histórico en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/parser.js
          git add public/app.js public/estilos.css public/idiomas
          # Módulos del núcleo: hacen falta en el repo para poder publicar el
          # front anterior si fallan los tests.
          if [ -d public/busqueda ]; then git add public/busqueda; fi
          if [ -d public/sync ]; then git add public/sync; fi
          if [ -d public/tema ]; then git add public/tema; fi
          if [ -d public/tiempo ]; then git add public/tiempo; fi
          if [ -f public/lector.user.js ]; then git add public/lector.user.js; fi
          if [ -f state.json ]; then git add state.json; fi
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualizar histórico [skip ci]"
            # Si se ha mergeado algo mientras corría el run, el push se
            # rechazaría sin el pull. En conflicto gana lo de este run (en
            # un rebase, -X theirs es el commit que se reaplica): state.json
            # y el front que acaba de generar son lo más reciente.
            guardado=
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                guardado=1; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ -n "$guardado" ] || { echo "No se pudo guardar el histórico"; exit 1; }
            echo "Histórico guardado en el repo"
          fi

      # La web lee los datos de R2 (workers de datos): en Pages solo
      # sumaban ~50 MB al artefacto de cada run.
      - name: Quitar los datos del artefacto de Pages
        run: rm -rf public/datos

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
