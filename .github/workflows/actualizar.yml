name: Actualizar Titulares

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector
        run: python recolector.py
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Limpiar datos.json obsoleto (formato antiguo)
        run: rm -f public/datos.json

      - name: Verificar public/
        run: |
          ls -la public/
          ls -la public/datos/ 2>/dev/null || echo "⚠ public/datos/ no existe"
          du -sh public/index.html public/datos/ 2>/dev/null
          [ -f state.json ] && du -sh state.json || echo "(sin state.json)"

      - name: Guardar histórico en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git add state.json
          if [ -f state.json ]; then git add state.json; fi
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualizar histórico [skip ci]"
            git push
            echo "Histórico guardado en el repo"
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
