name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'cosecha/**'
      - 'agenda/**'
      - 'requirements.txt'
      - 'shared/**'
      - 'front/**'
      - 'tests/**'
      - 'public/**'
      - 'workers/**'
      - 'scripts/**'
      - 'plantilla.html'
      - 'lector/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/calendario.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Comprobar copias locales de los workers
        run: node scripts/sync-workers.mjs --check

      - name: Construir y comprobar el módulo del frontend
        run: |
          python3 scripts/generar_front.py
          node --check public/app.js

      - name: Tests de buscador, lector, temas y sincronización
        run: node --test 'tests/**/*.test.mjs'

      # Las copias del parser las sincroniza sync-parser.yml tras el merge;
      # aquí se sincroniza en local para comprobar que el script sigue
      # dejándolas idénticas.
      - name: Sincronizar y verificar parser
        run: |
          node scripts/sync-parser.mjs
          node scripts/test-parser.mjs

  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extracción y diagnóstico sin red
        run: python -m unittest discover -s tests/fuentes -v
