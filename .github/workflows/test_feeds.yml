name: Salud de fuentes

# Prueba las fuentes del catálogo desde la IP de GitHub Actions con la
# misma lógica que el recolector. Tabla en el resumen del run.
# Para probar una rama: gh workflow run test_feeds.yml --ref <rama>

on:
  workflow_dispatch:
    inputs:
      tipos:
        description: 'Tipos de fuente (rss,sitemap,wp,scrape,gn)'
        required: false
        default: 'rss,sitemap,wp'
      exigir_ok:
        description: 'Marcar el run como fallido si alguna fuente tiene problemas'
        type: boolean
        default: false
      dominios:
        description: 'Limitar a estos dominios (coma; vacío = todos)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar fuentes
        run: |
          opciones=()
          if [ "$EXIGIR_OK" = true ]; then opciones+=(--exigir-ok); fi
          python salud_fuentes.py --tipos "$TIPOS" --dominios "$DOMINIOS" --muestras 3 --json salud.json "${opciones[@]}"
        env:
          EXIGIR_OK: ${{ inputs.exigir_ok }}
          TIPOS: ${{ inputs.tipos }}
          DOMINIOS: ${{ inputs.dominios }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salud-fuentes
          path: salud.json
