name: Deploy Deno relay

# Regenera la allowlist del relay (workers/deno-relay/src/permitidos.json)
# desde medios.py y despliega voceiro-relay en Deno Deploy, solo si cambió el
# relay o su allowlist. La integración Git de Deno desplegaba las 3 apps en
# cada commit y agotaba el límite de 15 despliegues por hora.
#
# Regenerar y desplegar van en el mismo workflow porque el commit del bot
# (GITHUB_TOKEN) no dispara otros workflows.

on:
  push:
    branches: [main]
    paths:
      - 'workers/deno-relay/**'
      - 'medios.py'
      - 'scripts/sync_relay.py'
      - '.github/workflows/deploy-deno-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-deno-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar allowlist
        run: python scripts/sync_relay.py

      - name: Commit si hay cambios
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/deno-relay/src/permitidos.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la allowlist"
          else
            git commit -m "chore: sync relay"
            git pull --rebase origin main
            git push
            echo "cambio=1" >> "$GITHUB_OUTPUT"
          fi

      # Un cambio en medios.py que no toca la allowlist no despliega.
      - name: ¿Hay que desplegar?
        id: decidir
        env:
          ANTES: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "${{ steps.sync.outputs.cambio }}" ]; then
            echo "desplegar=1" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$ANTES" 2>/dev/null; then
            echo "Sin commit anterior con el que comparar: se despliega"
            echo "desplegar=1" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$ANTES" "$GITHUB_SHA" -- workers/deno-relay .github/workflows/deploy-deno-relay.yml; then
            echo "El relay no ha cambiado: no se despliega"
          else
            echo "desplegar=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.decidir.outputs.desplegar
        with:
          deno-version: v2.x

      - name: Deploy
        if: steps.decidir.outputs.desplegar
        working-directory: workers/deno-relay
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --org thendabs1 --app voceiro-relay --prod
