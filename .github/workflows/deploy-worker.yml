name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/cf-buscar/**'
      # Solo los módulos comunes que usa (scripts/sync-workers.mjs): otro
      # cambio en workers/comun no gasta un despliegue.
      - 'workers/comun/buscar.js'
      - 'workers/comun/turso.js'
      - 'workers/comun/gnews.js'
      - 'scripts/sync-workers.mjs'
      # El worker empaqueta ../../../shared/parser.js (y shared/busqueda/):
      # un cambio solo en shared/ también tiene que redesplegar CF.
      - 'shared/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy a Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Preparar módulos comunes locales
        run: node scripts/sync-workers.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'workers/cf-buscar'
          command: deploy
