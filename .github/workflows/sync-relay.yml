name: Sync relay

# Regenera la allowlist del relay (workers/deno-relay/src/permitidos.json)
# desde medios.py. Deno Deploy redespliega al ver el commit.

on:
  push:
    branches: [main]
    paths:
      - 'medios.py'
      - 'scripts/sync_relay.py'
      - '.github/workflows/sync-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar allowlist
        run: python scripts/sync_relay.py

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/deno-relay/src/permitidos.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: sync relay"
            git pull --rebase origin main
            git push
          fi
