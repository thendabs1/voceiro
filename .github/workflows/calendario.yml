name: Calendario

# Recogida → Turso → lectura pública. Sin copias ni artefactos intermedios.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Recoger, reclasificar, preparar el núcleo o publicar el estado guardado'
        type: choice
        options: [recoger, deportes, reclasificar, preparar-nucleo, publicar]
        default: recoger
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días; máximo 91 días)'
        required: false
      idioma:
        description: 'Idioma de la fuente'
        type: choice
        options: [gl, es]
        default: gl
      fuente:
        description: 'Fuente del piloto (F1 recoge el ICS completo)'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas, ninguna]
        default: cultura-galicia
      cultura:
        description: 'Agendas culturales adicionales (recogida completa paginada)'
        type: choice
        options: [ninguna, madrid, kulturklik, zaragoza, madrid-y-kulturklik, todas]
        default: ninguna
      aceptar_inventario:
        description: 'Cultura: aceptar un inventario que cae más del 30 % (retirada real)'
        type: boolean
        default: false
      colecciones:
        description: 'Deportes: colecciones separadas por comas (vacío = todas; p. ej. wrc,nba,feb-endesa)'
        required: false
      forzar:
        description: 'Deportes: revisar ya, sin esperar su cadencia (requiere colecciones)'
        type: boolean
        default: false
      publicar:
        description: 'Publicar la lectura en R2 (por defecto Galicia, Madrid, Kulturklik y Zaragoza)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendario-turso
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CALENDARIO_TURSO_URL: ${{ secrets.CALENDARIO_TURSO_URL }}
      CALENDARIO_TURSO_TOKEN: ${{ secrets.CALENDARIO_TURSO_TOKEN }}
      OCBLACKTOP_API_KEY: ${{ secrets.OCBLACKTOP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias de las recogidas y publicación
        run: pip install beautifulsoup4 boto3
      - name: Límites municipales del IGN (se descargan de R2 solo las provincias usadas)
        uses: actions/cache@v4
        with:
          path: ~/.cache/voceiro/limites
          key: limites-${{ hashFiles('shared/territorios/limites.json') }}
      - name: Recoger directamente en Turso
        env:
          OPERACION: ${{ inputs.operacion || 'recoger' }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          IDIOMA: ${{ inputs.idioma || 'gl' }}
          FUENTE: ${{ inputs.fuente || 'cultura-galicia' }}
          CULTURA: ${{ inputs.cultura || 'todas' }}
          ACEPTAR_INVENTARIO: ${{ inputs.aceptar_inventario }}
        run: |
          if [ "$OPERACION" = reclasificar ]; then
            python calendario.py --turso --reclasificar
          fi
          if [ "$OPERACION" = recoger ]; then
            if [ "$FUENTE" != ninguna ]; then
              args=(--turso --idioma "$IDIOMA")
              if [ "$FUENTE" = ambas ]; then
                args+=(--fuente cultura-galicia --fuente vidmar-f1)
              else
                args+=(--fuente "$FUENTE")
              fi
              if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
              if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
              python calendario.py "${args[@]}"
            fi
            args=(--turso)
            if [ "$CULTURA" = madrid ] || [ "$CULTURA" = madrid-y-kulturklik ] || [ "$CULTURA" = todas ]; then
              args+=(--recoger-cultura madrid)
              if [ "$ACEPTAR_INVENTARIO" = true ]; then args+=(--aceptar-inventario madrid); fi
            fi
            if [ "$CULTURA" = kulturklik ] || [ "$CULTURA" = madrid-y-kulturklik ] || [ "$CULTURA" = todas ]; then
              args+=(--recoger-cultura kulturklik)
              if [ "$ACEPTAR_INVENTARIO" = true ]; then args+=(--aceptar-inventario kulturklik); fi
            fi
            if [ "$CULTURA" = zaragoza ] || [ "$CULTURA" = todas ]; then
              args+=(--recoger-cultura zaragoza)
              if [ "$ACEPTAR_INVENTARIO" = true ]; then args+=(--aceptar-inventario zaragoza); fi
            fi
            if [ "$CULTURA" != ninguna ]; then
              if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
              if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
              python calendario.py "${args[@]}"
            fi
          fi
          python calendario.py --turso --preparar-nucleo
      - name: Revisar temporadas y descubrir los próximos calendarios deportivos
        id: temporadas
        # Cada colección decide si le toca (cadencia, reintentos y presupuesto en
        # agenda/temporadas.py). Un cron diario cabe en el presupuesto de ESPN: 3
        # colecciones por fecha × 14 días = 42 de 64 peticiones.
        if: github.event_name == 'schedule' || inputs.operacion == 'deportes'
        continue-on-error: true
        env:
          COLECCIONES: ${{ inputs.colecciones }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=(--turso --ejecutar --descubrir)
          for c in ${COLECCIONES//,/ }; do args+=(--coleccion "$c"); done
          if [ "$FORZAR" = true ]; then args+=(--forzar); fi
          python -m agenda.operacion "${args[@]}"
      - name: Revisar clasificación y relaciones de todas las fuentes guardadas
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m agenda.revision --turso
      - name: Validar y publicar la lectura desde Turso
        env:
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar || inputs.operacion == 'publicar' || inputs.operacion == 'deportes' }}
          FUENTES_PUBLICAS: ${{ vars.CALENDARIO_FUENTES_PUBLICAS || 'cultura-galicia,madrid,kulturklik,zaragoza' }}
          LECTURA_SQL: ${{ vars.CALENDARIO_LECTURA_SQL || 'false' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          args=(--turso)
          if [ "$PUBLICAR" = true ]; then args+=(--fuentes "$FUENTES_PUBLICAS" --fuentes-control --publicar); fi
          if [ "$PUBLICAR" = true ] && [ "$LECTURA_SQL" = true ]; then args+=(--lectura-sql); fi
          python -m agenda.publicacion "${args[@]}"
      - name: Señalar incidencias de la recogida deportiva después de publicar el estado válido
        if: steps.temporadas.outcome == 'failure'
        run: exit 1
