name: Calendario (piloto)

# Recogida manual para revisar datos antes de decidir publicación y consumo.
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días; máximo 91 días)'
        required: false
      idioma:
        description: 'Idioma de la fuente'
        type: choice
        options: [gl, es]
        default: gl
      fuente:
        description: 'Fuente del piloto (F1 recoge el ICS completo)'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas]
        default: cultura-galicia

permissions:
  contents: read

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recoger fuentes en el modelo común y guardar la base
        env:
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          IDIOMA: ${{ inputs.idioma }}
          FUENTE: ${{ inputs.fuente }}
        run: |
          args=(--db "$RUNNER_TEMP/calendario/calendario.sqlite" --salida "$RUNNER_TEMP/calendario/calendario.json" --idioma "$IDIOMA")
          if [ "$FUENTE" = ambas ]; then
            args+=(--fuente cultura-galicia --fuente vidmar-f1)
          else
            args+=(--fuente "$FUENTE")
          fi
          if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
          if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
          python calendario.py "${args[@]}"
      - name: Guardar calendario para revisión
        uses: actions/upload-artifact@v4
        with:
          name: calendario-piloto
          path: ${{ runner.temp }}/calendario/
          if-no-files-found: error
          retention-days: 14
