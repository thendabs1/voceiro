name: Calendario

# Recogida → Turso → lectura pública. Sin copias ni artefactos intermedios.
on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Recoger, reclasificar, preparar el núcleo o publicar el estado guardado'
        type: choice
        options: [recoger, deportes, reclasificar, preparar-nucleo, publicar, migrar-nucleo]
        default: recoger
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días, atletismo 60; máximo 91 días)'
        required: false
      fuente:
        description: 'Galicia solo en gallego, o ICS completo de Vidmar F1'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas, ninguna]
        default: cultura-galicia
      cultura:
        description: 'Agendas culturales adicionales (recogida completa paginada)'
        type: choice
        options: [ninguna, madrid, kulturklik, zaragoza, cyl, madrid-y-kulturklik, todas]
        default: ninguna
      aceptar_inventario:
        description: 'Cultura: aceptar un inventario que cae más del 30 % (retirada real)'
        type: boolean
        default: false
      colecciones:
        description: 'Deportes: colecciones separadas por comas (vacío = todas; p. ej. wrc,nba,feb-endesa)'
        required: false
      forzar:
        description: 'Deportes: revisar ya, sin esperar su cadencia (requiere colecciones)'
        type: boolean
        default: false
      atletismo:
        description: 'Recoger RFEA/Nivel II, Galicia, Cataluña y World Athletics (no habilita su publicación)'
        type: boolean
        default: false
      publicar:
        description: 'Publicar la lectura en R2 (por defecto Galicia, Madrid, Kulturklik, Zaragoza y CyL)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: calendario-turso
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CALENDARIO_TURSO_URL: ${{ secrets.CALENDARIO_TURSO_URL }}
      CALENDARIO_TURSO_TOKEN: ${{ secrets.CALENDARIO_TURSO_TOKEN }}
      OCBLACKTOP_API_KEY: ${{ secrets.OCBLACKTOP_API_KEY }}
      # Núcleo en el bucket privado (objetos por huella, manifiesto en Turso); nunca en R2_BUCKET, que es público.
      AGENDA_R2_BUCKET: voceiro-agenda
      AGENDA_R2_ACCESS_KEY_ID: ${{ secrets.AGENDA_R2_ACCESS_KEY_ID }}
      AGENDA_R2_SECRET_ACCESS_KEY: ${{ secrets.AGENDA_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias de las recogidas y publicación
        run: pip install beautifulsoup4 boto3
      - name: Extracción de Nivel II
        if: inputs.atletismo || (github.event_name == 'schedule' && vars.CALENDARIO_ATLETISMO_RECOGIDA == 'true')
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Límites municipales del IGN (se descargan de R2 solo las provincias usadas)
        uses: actions/cache@v4
        with:
          path: ~/.cache/voceiro/limites
          key: limites-${{ hashFiles('shared/territorios/limites.json') }}
      - name: Fichas de RFEA (caducan con el reloj de 21 horas de la fuente)
        if: inputs.atletismo || (github.event_name == 'schedule' && vars.CALENDARIO_ATLETISMO_RECOGIDA == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/voceiro/atletismo
          key: atletismo-fichas-${{ github.run_id }}
          restore-keys: atletismo-fichas-
      - name: Recoger, revisar temporadas y publicar con una sola carga del núcleo
        id: pasada
        # Cada fuente guarda al terminar. Si una falla, las demás siguen, se publica
        # cuando toca y el job se marca fallido al final (agenda/pasada.py).
        env:
          EVENTO: ${{ github.event_name }}
          OPERACION: ${{ inputs.operacion || 'recoger' }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          FUENTE: ${{ inputs.fuente || 'cultura-galicia' }}
          CULTURA: ${{ inputs.cultura || 'todas' }}
          ACEPTAR_INVENTARIO: ${{ inputs.aceptar_inventario }}
          # Temporadas: cada colección decide si le toca (cadencia, reintentos y
          # presupuesto en agenda/temporadas.py y agenda/cadencias.py). Cuatro ticks
          # diarios no multiplican la ventana de ESPN: un día cercano caduca a las
          # 21 h y uno lejano a las 69 h; límites: 32 peticiones/pasada y 64/día.
          DEPORTES: ${{ github.event_name == 'schedule' || inputs.operacion == 'deportes' }}
          COLECCIONES: ${{ inputs.colecciones }}
          FORZAR: ${{ inputs.forzar }}
          ATLETISMO: ${{ inputs.atletismo || (github.event_name == 'schedule' && vars.CALENDARIO_ATLETISMO_RECOGIDA == 'true') }}
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar || inputs.operacion == 'publicar' || inputs.operacion == 'deportes' }}
          FUENTES_PUBLICAS: ${{ vars.CALENDARIO_FUENTES_PUBLICAS || 'cultura-galicia,madrid,kulturklik,zaragoza,cyl' }}
          LECTURA_SQL: ${{ vars.CALENDARIO_LECTURA_SQL || 'false' }}
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "$OPERACION" = migrar-nucleo ]; then
            # Una vez: núcleo R2 v1 → objetos por huella y esquema 5. Repetible; no recoge ni publica.
            python -m agenda.nucleo_r2 --migrar
            exit
          fi
          fechas=""
          if [ -n "$INICIO" ]; then fechas+=" --inicio $INICIO"; fi
          if [ -n "$FIN" ]; then fechas+=" --fin $FIN"; fi
          pasos=()
          if [ "$EVENTO" = schedule ]; then pasos+=(--cadencia); fi
          if [ "$OPERACION" = reclasificar ]; then
            pasos+=(--paso "calendario --turso --reclasificar")
          fi
          if [ "$OPERACION" = recoger ]; then
            case "$FUENTE" in
              cultura-galicia|ambas)
                pasos+=(--paso-reloj "cultura-galicia::calendario --turso --recoger-cultura cultura-galicia$fechas") ;;
            esac
            case "$FUENTE" in
              vidmar-f1|ambas)
                pasos+=(--paso-tolerado "calendario --turso --fuente vidmar-f1$fechas") ;;
            esac
            case "$CULTURA" in
              ninguna) culturas="" ;;
              todas) culturas="madrid kulturklik zaragoza cyl" ;;
              madrid-y-kulturklik) culturas="madrid kulturklik" ;;
              *) culturas="$CULTURA" ;;
            esac
            for c in $culturas; do
              paso="calendario --turso --recoger-cultura $c$fechas"
              if [ "$ACEPTAR_INVENTARIO" = true ]; then paso+=" --aceptar-inventario $c"; fi
              pasos+=(--paso-reloj "$c::$paso")
            done
          fi
          pasos+=(--paso "calendario --turso --preparar-nucleo")
          if [ "$DEPORTES" = true ]; then
            paso="operacion --turso --ejecutar --descubrir"
            for c in ${COLECCIONES//,/ }; do paso+=" --coleccion $c"; done
            if [ "$FORZAR" = true ]; then paso+=" --forzar"; fi
            pasos+=(--paso-tolerado "$paso")
          fi
          if [ "$ATLETISMO" = true ]; then
            # Primero las fichas territoriales: dan referencias a Nivel II.
            # Cada fuente conserva su última lectura válida si falla otra.
            for a in fga fca rfea wa; do
              pasos+=(--paso-reloj "atletismo-$a::atletismo-recogida --turso --fuente $a$fechas")
            done
          fi
          paso="publicacion --turso --revisar"
          if [ "$PUBLICAR" = true ]; then paso+=" --fuentes $FUENTES_PUBLICAS --fuentes-control --publicar"; fi
          if [ "$PUBLICAR" = true ] && [ "$LECTURA_SQL" = true ]; then paso+=" --lectura-sql"; fi
          pasos+=(--paso-final "$paso")
          # Revisa lo ya guardado; no recoge ni activa las fuentes de atletismo.
          # Sin incidencias no consulta GitHub. El grupo de concurrencia del
          # workflow serializa la comprobación y creación de issues.
          pasos+=(--paso-final-tolerado "atletismo-revision --turso --issues --repo $GITHUB_REPOSITORY")
          python -m agenda.pasada "${pasos[@]}"
      - name: Vigilar los pasos que fallan seguidos
        # También tras una pasada fallida: abre un issue por paso con fallos
        # seguidos y lo cierra cuando se recupera (agenda/vigilancia.py).
        if: always() && steps.pasada.outcome != 'skipped' && inputs.operacion != 'migrar-nucleo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m agenda.vigilancia --turso --issues --repo "$GITHUB_REPOSITORY"
