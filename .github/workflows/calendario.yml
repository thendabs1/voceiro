name: Calendario

# Recogida → Turso → lectura pública. Sin copias ni artefactos intermedios.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Recoger, reclasificar, preparar el núcleo o publicar el estado guardado'
        type: choice
        options: [recoger, reclasificar, preparar-nucleo, publicar]
        default: recoger
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días; máximo 91 días)'
        required: false
      idioma:
        description: 'Idioma de la fuente'
        type: choice
        options: [gl, es]
        default: gl
      fuente:
        description: 'Fuente del piloto (F1 recoge el ICS completo)'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas, ninguna]
        default: cultura-galicia
      deportes:
        description: 'Recogida deportiva manual adicional'
        type: choice
        options: [ninguno, feb, tenis, feb-y-tenis]
        default: ninguno
      cultura:
        description: 'Agendas culturales adicionales (recogida completa paginada)'
        type: choice
        options: [ninguna, madrid, kulturklik, madrid-y-kulturklik]
        default: ninguna
      temporada_feb:
        description: 'Año inicial explícito de la temporada FEB'
        default: '2026'
      competicion_feb:
        description: 'FEB: 4 LF Endesa, 1 Primera FEB, 67 LF Challenge'
        type: choice
        options: ['4', '1', '67']
        default: '4'
      publicar:
        description: 'Publicar la lectura en R2 (por defecto Galicia, Madrid y Kulturklik)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendario-turso
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CALENDARIO_TURSO_URL: ${{ secrets.CALENDARIO_TURSO_URL }}
      CALENDARIO_TURSO_TOKEN: ${{ secrets.CALENDARIO_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias de las recogidas y publicación
        run: pip install beautifulsoup4 boto3
      - name: Recoger directamente en Turso
        env:
          OPERACION: ${{ inputs.operacion || 'recoger' }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          IDIOMA: ${{ inputs.idioma || 'gl' }}
          FUENTE: ${{ inputs.fuente || 'cultura-galicia' }}
          CULTURA: ${{ inputs.cultura || 'madrid-y-kulturklik' }}
          DEPORTES: ${{ inputs.deportes || 'ninguno' }}
          TEMPORADA_FEB: ${{ inputs.temporada_feb }}
          COMPETICION_FEB: ${{ inputs.competicion_feb || '4' }}
        run: |
          if [ "$OPERACION" = reclasificar ]; then
            python calendario.py --turso --reclasificar
          fi
          if [ "$OPERACION" = recoger ]; then
            if [ "$FUENTE" != ninguna ]; then
              args=(--turso --idioma "$IDIOMA")
              if [ "$FUENTE" = ambas ]; then
                args+=(--fuente cultura-galicia --fuente vidmar-f1)
              else
                args+=(--fuente "$FUENTE")
              fi
              if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
              if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
              python calendario.py "${args[@]}"
            fi
            args=(--turso)
            if [ "$CULTURA" = madrid ] || [ "$CULTURA" = madrid-y-kulturklik ]; then
              args+=(--recoger-cultura madrid)
            fi
            if [ "$CULTURA" = kulturklik ] || [ "$CULTURA" = madrid-y-kulturklik ]; then
              args+=(--recoger-cultura kulturklik)
            fi
            if [ "$CULTURA" != ninguna ]; then
              if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
              if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
            fi
            if [ "$DEPORTES" = feb ] || [ "$DEPORTES" = feb-y-tenis ]; then
              args+=(--recoger-deporte feb --temporada-feb "$TEMPORADA_FEB" --competicion-feb "$COMPETICION_FEB")
            fi
            if [ "$DEPORTES" = tenis ] || [ "$DEPORTES" = feb-y-tenis ]; then
              args+=(--recoger-deporte espn-atp --recoger-deporte espn-wta --fecha-deporte "${INICIO:-$(date -u +%F)}")
            fi
            if [ "$CULTURA" != ninguna ] || [ "$DEPORTES" != ninguno ]; then
              python calendario.py "${args[@]}"
            fi
          fi
          python calendario.py --turso --preparar-nucleo
      - name: Revisar clasificación y relaciones de todas las fuentes guardadas
        run: python -m agenda.revision --turso
      - name: Validar y publicar la lectura desde Turso
        env:
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar || inputs.operacion == 'publicar' }}
          FUENTES_PUBLICAS: ${{ vars.CALENDARIO_FUENTES_PUBLICAS || 'cultura-galicia,madrid,kulturklik' }}
          LECTURA_SQL: ${{ vars.CALENDARIO_LECTURA_SQL || 'false' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          args=(--turso)
          if [ "$PUBLICAR" = true ]; then args+=(--fuentes "$FUENTES_PUBLICAS" --publicar); fi
          if [ "$PUBLICAR" = true ] && [ "$LECTURA_SQL" = true ]; then args+=(--lectura-sql); fi
          python -m agenda.publicacion "${args[@]}"
