name: Calendario

# Recogida → Turso → lectura pública. Sin copias ni artefactos intermedios.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Recoger, reclasificar, preparar el núcleo o publicar el estado guardado'
        type: choice
        options: [recoger, deportes, reclasificar, preparar-nucleo, publicar]
        default: recoger
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días; máximo 91 días)'
        required: false
      fuente:
        description: 'Galicia solo en gallego, o ICS completo de Vidmar F1'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas, ninguna]
        default: cultura-galicia
      cultura:
        description: 'Agendas culturales adicionales (recogida completa paginada)'
        type: choice
        options: [ninguna, madrid, kulturklik, zaragoza, cyl, madrid-y-kulturklik, todas]
        default: ninguna
      aceptar_inventario:
        description: 'Cultura: aceptar un inventario que cae más del 30 % (retirada real)'
        type: boolean
        default: false
      colecciones:
        description: 'Deportes: colecciones separadas por comas (vacío = todas; p. ej. wrc,nba,feb-endesa)'
        required: false
      forzar:
        description: 'Deportes: revisar ya, sin esperar su cadencia (requiere colecciones)'
        type: boolean
        default: false
      publicar:
        description: 'Publicar la lectura en R2 (por defecto Galicia, Madrid, Kulturklik, Zaragoza y CyL)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendario-turso
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CALENDARIO_TURSO_URL: ${{ secrets.CALENDARIO_TURSO_URL }}
      CALENDARIO_TURSO_TOKEN: ${{ secrets.CALENDARIO_TURSO_TOKEN }}
      OCBLACKTOP_API_KEY: ${{ secrets.OCBLACKTOP_API_KEY }}
      # Núcleo en el bucket privado (un fichero por fuente); nunca en R2_BUCKET, que es público.
      AGENDA_R2_BUCKET: voceiro-agenda
      AGENDA_R2_ACCESS_KEY_ID: ${{ secrets.AGENDA_R2_ACCESS_KEY_ID }}
      AGENDA_R2_SECRET_ACCESS_KEY: ${{ secrets.AGENDA_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias de las recogidas y publicación
        run: pip install beautifulsoup4 boto3
      - name: Límites municipales del IGN (se descargan de R2 solo las provincias usadas)
        uses: actions/cache@v4
        with:
          path: ~/.cache/voceiro/limites
          key: limites-${{ hashFiles('shared/territorios/limites.json') }}
      - name: Recoger, revisar temporadas y publicar con una sola carga del núcleo
        # Cada fuente guarda al terminar. Si una falla, las demás siguen, se publica
        # el estado válido y el job se marca fallido al final (agenda/pasada.py).
        env:
          OPERACION: ${{ inputs.operacion || 'recoger' }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          FUENTE: ${{ inputs.fuente || 'cultura-galicia' }}
          CULTURA: ${{ inputs.cultura || 'todas' }}
          ACEPTAR_INVENTARIO: ${{ inputs.aceptar_inventario }}
          # Temporadas: cada colección decide si le toca (cadencia, reintentos y
          # presupuesto en agenda/temporadas.py). Un cron diario cabe en el
          # presupuesto de ESPN: 3 colecciones por fecha × 14 días = 42 de 64.
          DEPORTES: ${{ github.event_name == 'schedule' || inputs.operacion == 'deportes' }}
          COLECCIONES: ${{ inputs.colecciones }}
          FORZAR: ${{ inputs.forzar }}
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar || inputs.operacion == 'publicar' || inputs.operacion == 'deportes' }}
          FUENTES_PUBLICAS: ${{ vars.CALENDARIO_FUENTES_PUBLICAS || 'cultura-galicia,madrid,kulturklik,zaragoza,cyl' }}
          LECTURA_SQL: ${{ vars.CALENDARIO_LECTURA_SQL || 'false' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          fechas=""
          if [ -n "$INICIO" ]; then fechas+=" --inicio $INICIO"; fi
          if [ -n "$FIN" ]; then fechas+=" --fin $FIN"; fi
          pasos=()
          if [ "$OPERACION" = reclasificar ]; then
            pasos+=(--paso "calendario --turso --reclasificar")
          fi
          if [ "$OPERACION" = recoger ]; then
            case "$FUENTE" in
              cultura-galicia|ambas)
                pasos+=(--paso-tolerado "calendario --turso --recoger-cultura cultura-galicia$fechas") ;;
            esac
            case "$FUENTE" in
              vidmar-f1|ambas)
                pasos+=(--paso-tolerado "calendario --turso --fuente vidmar-f1$fechas") ;;
            esac
            case "$CULTURA" in
              ninguna) culturas="" ;;
              todas) culturas="madrid kulturklik zaragoza cyl" ;;
              madrid-y-kulturklik) culturas="madrid kulturklik" ;;
              *) culturas="$CULTURA" ;;
            esac
            for c in $culturas; do
              paso="calendario --turso --recoger-cultura $c$fechas"
              if [ "$ACEPTAR_INVENTARIO" = true ]; then paso+=" --aceptar-inventario $c"; fi
              pasos+=(--paso-tolerado "$paso")
            done
          fi
          pasos+=(--paso "calendario --turso --preparar-nucleo")
          if [ "$DEPORTES" = true ]; then
            paso="operacion --turso --ejecutar --descubrir"
            for c in ${COLECCIONES//,/ }; do paso+=" --coleccion $c"; done
            if [ "$FORZAR" = true ]; then paso+=" --forzar"; fi
            pasos+=(--paso-tolerado "$paso")
          fi
          paso="publicacion --turso --revisar"
          if [ "$PUBLICAR" = true ]; then paso+=" --fuentes $FUENTES_PUBLICAS --fuentes-control --publicar"; fi
          if [ "$PUBLICAR" = true ] && [ "$LECTURA_SQL" = true ]; then paso+=" --lectura-sql"; fi
          pasos+=(--paso "$paso")
          python -m agenda.pasada "${pasos[@]}"
