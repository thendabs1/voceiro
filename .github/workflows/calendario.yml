name: Calendario

# Turso es el estado de trabajo. Las SQLite del artefacto son copias de recuperación.
on:
  workflow_dispatch:
    inputs:
      operacion:
        description: 'Recoger, reclasificar, preparar el núcleo o publicar el estado guardado'
        type: choice
        options: [recoger, reclasificar, preparar-nucleo, publicar]
        default: recoger
      inicio:
        description: 'Primer día (AAAA-MM-DD, vacío = hoy)'
        required: false
      fin:
        description: 'Último día incluido (vacío = inicio + 30 días; máximo 91 días)'
        required: false
      idioma:
        description: 'Idioma de la fuente'
        type: choice
        options: [gl, es]
        default: gl
      fuente:
        description: 'Fuente del piloto (F1 recoge el ICS completo)'
        type: choice
        options: [cultura-galicia, vidmar-f1, ambas]
        default: cultura-galicia
      deportes:
        description: 'Recogida deportiva manual adicional (FEB: solo LF Endesa)'
        type: choice
        options: [ninguno, feb, tenis, feb-y-tenis]
        default: ninguno
      temporada_feb:
        description: 'Año inicial explícito de la temporada LF Endesa'
        default: '2026'
      publicar:
        description: 'Publicar la lectura en R2 (fuentes de CALENDARIO_FUENTES_PUBLICAS; por defecto Galicia)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendario-turso
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CALENDARIO_TURSO_URL: ${{ secrets.CALENDARIO_TURSO_URL }}
      CALENDARIO_TURSO_TOKEN: ${{ secrets.CALENDARIO_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de las recogidas y publicación
        run: pip install beautifulsoup4 boto3
      - name: Copia previa a modificar el modelo
        if: inputs.operacion != 'recoger'
        run: python calendario.py --turso --copia "$RUNNER_TEMP/antes/calendario.sqlite"
      - name: Conservar copia antes de modificar Turso
        if: inputs.operacion != 'recoger'
        uses: actions/upload-artifact@v4
        with:
          name: calendario-antes-de-modificar
          path: ${{ runner.temp }}/antes/
          if-no-files-found: error
          retention-days: 14
      - name: Recoger fuentes en el modelo común y guardar la base
        env:
          OPERACION: ${{ inputs.operacion }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
          IDIOMA: ${{ inputs.idioma }}
          FUENTE: ${{ inputs.fuente }}
        run: |
          if [ "$OPERACION" = publicar ]; then
            python calendario.py --turso --exportar --salida "$RUNNER_TEMP/calendario/calendario.json"
            exit 0
          fi
          if [ "$OPERACION" = preparar-nucleo ]; then
            python calendario.py --turso --preparar-nucleo --exportar-nucleo --salida "$RUNNER_TEMP/calendario/nucleo.json"
            python calendario.py --turso --exportar --salida "$RUNNER_TEMP/calendario/calendario.json"
            exit 0
          fi
          if [ "$OPERACION" = reclasificar ]; then
            python calendario.py --turso --reclasificar --salida "$RUNNER_TEMP/calendario/calendario.json"
            exit 0
          fi
          args=(--turso --salida "$RUNNER_TEMP/calendario/calendario.json" --idioma "$IDIOMA")
          if [ "$FUENTE" = ambas ]; then
            args+=(--fuente cultura-galicia --fuente vidmar-f1)
          else
            args+=(--fuente "$FUENTE")
          fi
          if [ -n "$INICIO" ]; then args+=(--inicio "$INICIO"); fi
          if [ -n "$FIN" ]; then args+=(--fin "$FIN"); fi
          python calendario.py "${args[@]}"
      - name: Recoger deportes elegidos, con una sola escritura al terminar
        if: inputs.operacion == 'recoger' && inputs.deportes != 'ninguno'
        env:
          DEPORTES: ${{ inputs.deportes }}
          TEMPORADA_FEB: ${{ inputs.temporada_feb }}
        run: |
          args=(--turso --salida "$RUNNER_TEMP/calendario/calendario.json")
          if [ "$DEPORTES" = feb ] || [ "$DEPORTES" = feb-y-tenis ]; then
            args+=(--recoger-deporte feb --temporada-feb "$TEMPORADA_FEB")
          fi
          if [ "$DEPORTES" = tenis ] || [ "$DEPORTES" = feb-y-tenis ]; then
            args+=(--recoger-deporte espn-atp --recoger-deporte espn-wta)
          fi
          python calendario.py "${args[@]}"
      - name: Preparar lectura común desde el estado remoto
        run: |
          python calendario.py --turso --preparar-nucleo --exportar-nucleo --salida "$RUNNER_TEMP/calendario/nucleo.json"
          python -m agenda.publicacion --entrada "$RUNNER_TEMP/calendario/nucleo.json" --salida "$RUNNER_TEMP/calendario/lectura-revision.json"
      - name: Copiar el estado completo con su historial
        run: python calendario.py --turso --copia "$RUNNER_TEMP/calendario/calendario.sqlite"
      - name: Comprobar conservación tras modificar el modelo
        if: inputs.operacion != 'recoger'
        env:
          OPERACION: ${{ inputs.operacion }}
        run: |
          python - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path
          from agenda import almacen
          from agenda.clasificacion import temas_de

          base = Path(os.environ['RUNNER_TEMP'])
          with almacen.abrir(base / 'antes/calendario.sqlite') as db:
              antes = almacen.cargar(db)
              historial = {t: db.execute(f'SELECT * FROM {t} ORDER BY 1').fetchall()
                           for t in ('agenda_registros', 'agenda_revisiones', 'agenda_recogidas')}
          with almacen.abrir(base / 'calendario/calendario.sqlite') as db:
              despues = almacen.cargar(db)
              for tabla, filas in historial.items():
                  if db.execute(f'SELECT * FROM {tabla} ORDER BY 1').fetchall() != filas:
                      raise ValueError(f'Cambió el historial de {tabla}')
          campos = {'nucleo'} if os.environ['OPERACION'] == 'preparar-nucleo' else {'clasificacion', 'nucleo'}
          contenido_piloto = lambda c: {k: v for k, v in c.items() if k not in campos}
          if contenido_piloto(antes) != contenido_piloto(despues):
              raise ValueError('Cambió contenido u observación del calendario al modificar el modelo')
          if 'nucleo' in despues:
              from agenda import nucleo
              n = nucleo.validar(despues['nucleo'])
              ids = {e['id'] for e in n['entidades'].values() if e['tipo'] == 'evento'}
              if not {e['id'] for e in despues['eventos']} <= ids:
                  raise ValueError('Faltan identidades del piloto en el núcleo')
              for ref, evento in despues['vinculos'].items():
                  if n['referencias'].get(ref, {}).get('destino') != nucleo.objetivo('evento', evento):
                      raise ValueError('Cambió un vínculo del piloto al preparar el núcleo')
              print(f"Núcleo v2: {len(ids)} eventos, {len(n['referencias'])} referencias tipadas")
          cuentas = Counter(t for e in despues['eventos'] for t in temas_de(despues, e['id']))
          asignados = len(despues['clasificacion']['asignaciones'])
          print(f"Conservados {len(despues['eventos'])} eventos, IDs, originales y revisiones")
          print(f"Clasificados: {asignados}; sin correspondencia: {len(despues['eventos']) - asignados}")
          print(dict(sorted(cuentas.items())))
          PY
      - name: Publicar la lectura seleccionada en R2
        if: inputs.publicar || inputs.operacion == 'publicar'
        env:
          FUENTES_PUBLICAS: ${{ vars.CALENDARIO_FUENTES_PUBLICAS || 'cultura-galicia' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python -m agenda.publicacion
          --entrada "$RUNNER_TEMP/calendario/nucleo.json"
          --salida "$RUNNER_TEMP/calendario/lectura-publica.json"
          --fuentes "$FUENTES_PUBLICAS" --publicar
      - name: Guardar calendario para revisión
        uses: actions/upload-artifact@v4
        with:
          name: calendario-piloto
          path: ${{ runner.temp }}/calendario/
          if-no-files-found: error
          retention-days: 14
