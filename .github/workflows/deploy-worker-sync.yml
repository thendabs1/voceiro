name: Deploy Worker Sync

# Sincronización entre dispositivos (workers/cf-sync, D1 voceiro-sync).
# El esquema (schema.sql) se aplica a mano con wrangler: no cambia con cada
# despliegue.
on:
  push:
    branches: [main]
    paths:
      - 'workers/cf-sync/**'
      - 'workers/comun/sync.js'
      - 'scripts/sync-workers.mjs'
      - '.github/workflows/deploy-worker-sync.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy a Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Preparar módulos comunes locales
        run: node scripts/sync-workers.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'workers/cf-sync'
          command: deploy
