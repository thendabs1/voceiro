name: Deploy Deno buscar

# Despliega voceiro-buscar en Deno Deploy solo cuando cambia el worker o el
# parser. La integración Git de Deno desplegaba en cada commit y agotaba el
# límite de 15 despliegues por hora.

on:
  push:
    branches: [main]
    paths:
      - 'workers/deno-buscar/**'
      - 'workers/comun/**'
      - 'scripts/sync-workers.mjs'
      # Las copias del parser las commitea sync-parser.yml con GITHUB_TOKEN, y
      # ese commit no dispara workflows: se sincronizan aquí antes de desplegar.
      - 'shared/parser.js'
      - 'scripts/sync-parser.mjs'
      - '.github/workflows/deploy-deno-buscar.yml'
  workflow_dispatch:

concurrency:
  group: deploy-deno-buscar
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar parser
        run: node scripts/sync-parser.mjs

      - name: Preparar módulos comunes locales
        run: node scripts/sync-workers.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy
        working-directory: workers/deno-buscar
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --org thendabs1 --app voceiro-buscar --prod
