name: Lector

# Comprobaciones del lector (lector/). Va aparte de los tests del buscador
# para que un fallo del lector no congele el front de Voceiro.
on:
  pull_request:
    paths:
      - 'lector/**'
      - 'shared/sync/**'
      - 'shared/tema/**'
      - 'medios.py'
      - 'plantilla.html'
      - '.github/workflows/lector.yml'
  push:
    branches: [main]
    paths:
      - 'lector/**'
      - 'shared/sync/**'
      - 'shared/tema/**'
      - 'medios.py'
      - 'plantilla.html'
      - '.github/workflows/lector.yml'
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La versión (2.0.N) sale de contar commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Construir
        run: node lector/build.mjs

      - name: Sintaxis
        run: node --check lector/dist/lector.user.js

      - name: Cabecera y dominios permitidos
        run: node lector/comprobar.mjs

      - name: Construir la extensión de Firefox y la variante Chrome
        run: |
          node lector/extension/build.mjs firefox
          node lector/extension/build.mjs chrome
          node --check lector/dist/firefox/lector.js
          node --check lector/dist/firefox/fondo.js
          node --check lector/dist/chrome/fondo.js

      - name: Validar el paquete Firefox
        run: npx --yes web-ext@10.5.0 lint --source-dir lector/dist/firefox

      - name: Empaquetar Firefox para pruebas
        run: npx --yes web-ext@10.5.0 build --source-dir lector/dist/firefox --artifacts-dir lector/dist/paquetes

      - uses: actions/upload-artifact@v4
        with:
          name: lector-firefox-pruebas
          # Un único directorio: manifest.json queda en la raíz de la descarga.
          path: lector/dist/firefox/
