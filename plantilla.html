<!DOCTYPE html>
<html lang="es" data-theme="light" data-font="sans" data-just="0" data-bionic="0" data-focus="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  :root{
    --bg:#fff; --fg:#222; --muted:#888; --accent:#d32f2f;
    --border:#eee; --quote-bg:#f9f9f9;
    --btn-bg:#f7f7f7; --btn-border:#ccc;
    --shadow:rgba(0,0,0,.08);
    --fs:18px; --lh:1.55; --w:1100px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --preset:#0a7d3f; --preset-bg:#e8f5e9;
    --block:#b00020; --block-bg:#fde8ec;
    --mark:#ffe680; --mark-fg:#111;
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --fg:#3b2f1e; --muted:#8a7a5c; --accent:#a0522d;
    --border:#e0d5b8; --quote-bg:#ede0c4;
    --btn-bg:#ede0c4; --btn-border:#c8b88a;
    --shadow:rgba(59,47,30,.15);
    --preset:#3e7a2f; --preset-bg:#e4ebd0;
    --block:#8b2020; --block-bg:#ebd5d0;
    --mark:#c9a227; --mark-fg:#2c1c08;
  }
  [data-theme="dark"]{
    --bg:#1a1a1a; --fg:#e0e0e0; --muted:#999; --accent:#ff6b6b;
    --border:#333; --quote-bg:#252525;
    --btn-bg:#2a2a2a; --btn-border:#444;
    --shadow:rgba(0,0,0,.5);
    --preset:#4cc97a; --preset-bg:#173524;
    --block:#ff8a9c; --block-bg:#3d1a20;
    --mark:#b58600; --mark-fg:#fff;
  }
  [data-theme="contrast"]{
    --bg:#000; --fg:#fff; --muted:#ff0; --accent:#0ff;
    --border:#fff; --quote-bg:#111;
    --btn-bg:#111; --btn-border:#fff;
    --shadow:rgba(255,255,255,.2);
    --preset:#0f0; --preset-bg:#003300;
    --block:#f00; --block-bg:#330000;
    --mark:#ff0; --mark-fg:#000;
  }
  [data-font="serif"]{ --ff: Georgia, "Times New Roman", serif }
  [data-font="sans"]{ --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
  [data-font="dyslexic"]{
    --ff: Verdana, Tahoma, "Comic Sans MS", sans-serif;
    letter-spacing: .03em; word-spacing: .1em;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ff);
    background:var(--bg); color:var(--fg);
    font-size:var(--fs); line-height:var(--lh);
    max-width:var(--w); margin:0 auto; padding:20px;
    transition:background .15s, color .15s;
  }
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}

  header h1{
    border-bottom:1px solid var(--border);
    padding-bottom:8px; margin:0 0 4px;
    font-size:1.6em; line-height:1.2;
  }
  header .meta{color:var(--muted); font-size:.72em; margin:0}

  .topbar{
    position:sticky; top:0; background:var(--bg);
    z-index:10; padding:10px 0;
    border-bottom:1px solid var(--border);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }

  button{
    cursor:pointer; padding:8px 14px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg);
    border-radius:6px;
    font-family:inherit; font-size:.8em; font-weight:500;
    transition:filter .1s, background .1s;
  }
  button:hover{filter:brightness(.95)}
  button.primary{
    background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold;
  }
  button.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  [data-theme="contrast"] button.active,
  [data-theme="contrast"] button.primary{color:#000}

  .btn-preset{
    border:2px solid var(--preset); background:transparent; color:var(--preset);
    font-weight:600;
  }
  .btn-preset:hover{background:var(--preset-bg)}
  .btn-preset.active{background:var(--preset); color:#fff}
  .btn-preset.active::after{content:' ✓'}

  select.lang-select{
    padding:7px 10px; border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg); border-radius:6px;
    font-family:inherit; font-size:.78em;
  }

  .panel{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:100; display:none; padding:20px;
    overflow-y:auto;
  }
  .panel.open{display:flex}
  .panel-inner{
    background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:12px;
    padding:20px 24px;
    max-width:920px; width:100%;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative; margin:auto;
  }
  .panel-header{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; margin-bottom:14px; padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .panel-header h2{margin:0; font-size:1em; letter-spacing:.03em}
  .panel-close{
    background:transparent; border:1px solid var(--btn-border);
    padding:4px 10px; font-size:1em; line-height:1; border-radius:6px;
  }
  .panel h3{
    margin:16px 0 6px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .panel h3:first-of-type{border-top:none; padding-top:0; margin-top:0}

  .opt-row{
    display:flex; align-items:center; gap:14px;
    padding:8px 0; border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .opt-row:first-of-type{border-top:none}
  .opt-label{
    color:var(--muted); font-size:.65em; letter-spacing:.05em;
    text-transform:uppercase; min-width:110px;
  }
  .opt-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .opt-val{
    font-weight:bold; min-width:44px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em;
  }

  .list-grupos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:4px;
    max-height:200px; overflow-y:auto;
    padding:8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .grupo-item{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; cursor:pointer;
    padding:5px 8px; border-radius:4px;
  }
  .grupo-item:hover{background:var(--quote-bg)}
  .grupo-item input{accent-color:var(--accent); width:1.1em; height:1.1em}
  .grupo-item .flag{
    font-size:.85em; color:var(--accent); opacity:.7;
    margin-left:auto; padding-left:6px;
  }

  .ctrl-medios{
    display:grid; grid-template-columns:1fr auto; gap:8px;
    margin-bottom:8px;
  }
  .ctrl-medios input,
  .ctrl-medios select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }

  .list-medios{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
    max-height:340px; overflow-y:auto;
  }
  .medio-fila{
    display:grid;
    grid-template-columns:34px 34px minmax(140px,1.2fr) 1.6fr 1.4fr;
    gap:8px; align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .medio-fila:last-child{border-bottom:none}
  .medio-fila.estado-incluir{background:var(--preset-bg)}
  .medio-fila.estado-ignorar{background:var(--block-bg)}
  .medio-fila .celda{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .medio-fila .celda-grupo{color:var(--muted); font-size:.9em}

  .chk{display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none}
  .chk input{display:none}
  .chk span{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--btn-border);
    font-size:.9em; font-weight:700;
    background:transparent; color:var(--muted);
    transition:all .1s;
  }
  .chk:hover span{border-color:var(--accent)}
  .chk.incluir input:checked + span{
    background:var(--preset); border-color:var(--preset); color:#fff;
  }
  .chk.ignorar input:checked + span{
    background:var(--block); border-color:var(--block); color:#fff;
  }

  textarea.preset-texto{
    width:100%; min-height:70px; padding:10px;
    border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg);
    font-family:var(--ff); font-size:.78em;
    line-height:1.5; resize:vertical;
  }

  .panel-acciones{
    display:flex; justify-content:flex-end; gap:8px;
    flex-wrap:wrap;
    margin-top:16px; padding-top:12px;
    border-top:1px solid var(--border);
  }

  .backup-box{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.75em;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:space-between;
  }
  .backup-box .msg{color:var(--muted); flex:1; min-width:180px}
  .backup-box .acciones{display:flex; gap:8px; flex-wrap:wrap}

  .filtros{
    display:grid;
    grid-template-columns:2.5fr 1fr 1fr 1.2fr .9fr 1.1fr auto;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    position:sticky; top:56px; background:var(--bg);
    z-index:9;
  }
  .filtros input,
  .filtros select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
    min-width:0;
  }
  #contador{
    color:var(--muted); font-size:.68em;
    margin:10px 0 14px;
  }

  .noticia{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:8px;
    transition:opacity .25s;
    position:relative;
  }
  .noticia.foco-dim{opacity:.28}
  .noticia.foco-active{opacity:1}
  .noticia .cabecera{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-bottom:5px; font-size:.62em; color:var(--muted);
  }
  .noticia .medio{
    font-weight:bold; color:var(--fg); font-size:1.1em;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .badge{
    background:var(--quote-bg); border:1px solid var(--border);
    padding:1px 8px; border-radius:10px; color:var(--muted);
  }
  .badge.preset{
    background:var(--preset-bg);
    border-color:var(--preset);
    color:var(--preset);
  }
  .badge.futuro{
    background:#fff3e0;
    border-color:#ffb74d;
    color:#b45309;
  }
  [data-theme="dark"] .badge.futuro,
  [data-theme="sepia"] .badge.futuro{
    background:#3d2f14;
    border-color:#b58600;
    color:#ffcc66;
  }
  [data-theme="contrast"] .badge.futuro{
    background:#000;
    border-color:#ff0;
    color:#ff0;
  }
  .noticia a.titular{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:1em; display:block; margin-top:2px;
  }
  .noticia a.titular:hover{text-decoration:underline}
  [data-just="1"] .noticia a.titular{text-align:justify; hyphens:auto}
  mark{background:var(--mark); color:var(--mark-fg); padding:0 3px; border-radius:2px}

  .btn-report-item{
    margin-left:auto;
    padding:2px 8px !important;
    font-size:.85em !important;
    background:transparent !important;
    border:1px solid var(--border) !important;
    color:var(--muted) !important;
    line-height:1.2;
    opacity:.6;
    transition:opacity .15s;
  }
  .btn-report-item:hover{
    opacity:1 !important;
    color:var(--accent) !important;
    border-color:var(--accent) !important;
  }

  .vacio{
    text-align:center; color:var(--muted);
    padding:40px 0; font-size:.85em;
  }

  #toast-wrap{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:8px;
    pointer-events:none;
  }
  .toast{
    background:#222; color:#fff; padding:10px 16px; border-radius:8px;
    font-size:.78em; box-shadow:0 6px 20px rgba(0,0,0,.35);
    opacity:0; transform:translateY(12px);
    transition:opacity .2s, transform .2s;
    max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateY(0)}
  [data-theme="dark"] .toast{background:#eee; color:#222}
  [data-theme="contrast"] .toast{background:#ff0; color:#000; border:2px solid #000}

  .rep-ctx{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.72em;
    line-height:1.6;
    margin-bottom:14px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    word-break:break-word;
  }
  .rep-ctx strong{color:var(--muted); font-weight:600; margin-right:4px}
  .rep-ctx.empty{color:var(--muted); font-style:italic; font-family:var(--ff); text-align:center}

  .rep-row{display:grid; gap:6px; margin-bottom:14px}
  .rep-row label{
    font-size:.7em; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .rep-row select,
  .rep-row textarea{
    font-size:.8em; padding:9px 12px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
    width:100%;
  }
  .rep-row textarea{min-height:80px; resize:vertical; line-height:1.5}

  .rep-check{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px;
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:6px;
    font-size:.72em;
    cursor:pointer;
  }
  .rep-check input{
    accent-color:var(--accent);
    width:1.15em; height:1.15em;
    margin-top:.15em; flex-shrink:0;
  }
  .rep-check span{color:var(--muted); line-height:1.5}

  .rep-acciones{
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:space-between;
    margin-top:16px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .rep-acciones .grupo{display:flex; gap:8px; flex-wrap:wrap}

  @media (max-width:900px){
    .filtros{grid-template-columns:1fr 1fr 1fr; position:static}
    #buscar{grid-column:1/-1}
    .medio-fila{grid-template-columns:34px 34px 1fr 1.2fr}
    .medio-fila .celda-grupo{display:none}
    .opt-row{gap:8px}
    .opt-label{min-width:100%}
  }
  @media (max-width:560px){
    .filtros{grid-template-columns:1fr 1fr}
    .medio-fila{grid-template-columns:34px 34px 1fr}
    .medio-fila .celda-nombre{display:none}
    .panel-inner{padding:16px}
    .rep-acciones{flex-direction:column}
    .rep-acciones .grupo{width:100%}
    .rep-acciones button{flex:1}
  }
</style>
</head>
<body>

<header>
  <h1 id="h-title">Voceiro</h1>
  <p class="meta">
    <span id="meta-prefix"></span>
    <span id="fecha">{{FECHA}}</span>
    <span>·</span>
    <span id="total">{{TOTAL}}</span>
    <span id="meta-suffix"></span>
  </p>
</header>

<section class="topbar">
  <button id="btn-preset" class="btn-preset" type="button"></button>
  <button id="btn-config" type="button"></button>
  <span style="flex:1"></span>
  <select id="lang-select" class="lang-select" aria-label="Language"></select>
  <button id="btn-acces" type="button"></button>
</section>

<section id="panel-config" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="cfg-title"></h2>
      <button class="panel-close" type="button" data-close="panel-config">✕</button>
    </div>

    <h3 id="cfg-grupos"></h3>
    <p id="cfg-grupos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
    <div id="lista-grupos" class="list-grupos"></div>

    <h3 id="cfg-medios"></h3>
    <p id="cfg-medios-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
    <div class="ctrl-medios">
      <input type="search" id="filtro-medio">
      <select id="filtro-grupo-medio"><option value=""></option></select>
    </div>
    <div id="lista-medios" class="list-medios"></div>
    <p id="resumen-medios" style="font-size:.68em; color:var(--muted); margin:6px 0 0;"></p>

    <h3 id="cfg-palabras"></h3>
    <p id="cfg-palabras-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
    <textarea id="preset-palabras" class="preset-texto"></textarea>

    <h3 id="cfg-backup"></h3>
    <div class="backup-box">
      <span class="msg" id="cfg-backup-msg"></span>
      <div class="acciones">
        <button id="btn-export" type="button"></button>
        <button id="btn-import" type="button"></button>
      </div>
    </div>

    <h3 id="cfg-help-lbl"></h3>
    <div class="backup-box">
      <span class="msg" id="cfg-help-msg"></span>
      <div class="acciones">
        <button id="btn-report-generic" type="button">🐞 <span id="cfg-help-btn"></span></button>
      </div>
    </div>

    <div class="panel-acciones">
      <button id="preset-reset" type="button"></button>
      <button id="preset-cancelar" type="button"></button>
      <button id="preset-guardar" type="button" class="primary"></button>
    </div>
  </div>
</section>

<section id="panel-acces" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="ac-title"></h2>
      <button class="panel-close" type="button" data-close="panel-acces">✕</button>
    </div>

    <div class="opt-row">
      <span class="opt-label" id="ac-tema"></span>
      <div class="opt-group" data-grupo="tema">
        <button data-val="light"></button>
        <button data-val="sepia"></button>
        <button data-val="dark"></button>
        <button data-val="contrast"></button>
      </div>
    </div>

    <div class="opt-row">
      <span class="opt-label" id="ac-fuente"></span>
      <div class="opt-group" data-grupo="fuente">
        <button data-val="serif"></button>
        <button data-val="sans"></button>
        <button data-val="dyslexic"></button>
      </div>
    </div>

    <div class="opt-row">
      <span class="opt-label" id="ac-tamano"></span>
      <div class="opt-group">
        <button id="fs-menos">A−</button>
        <span class="opt-val" id="fs-val">18</span>
        <button id="fs-mas">A+</button>
      </div>
    </div>

    <div class="opt-row">
      <span class="opt-label" id="ac-ancho"></span>
      <div class="opt-group">
        <button id="w-menos">−</button>
        <span class="opt-val" id="w-val">1100</span>
        <button id="w-mas">+</button>
      </div>
    </div>

    <div class="opt-row">
      <span class="opt-label" id="ac-extra"></span>
      <div class="opt-group" data-grupo="extra">
        <button data-val="just"></button>
        <button data-val="bionic"></button>
        <button data-val="focus"></button>
      </div>
    </div>

    <div class="panel-acciones">
      <button id="acces-reset" type="button"></button>
    </div>
  </div>
</section>

<section id="panel-reporte" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="rep-title"></h2>
      <button class="panel-close" type="button" data-close="panel-reporte">✕</button>
    </div>

    <div id="rep-contexto" class="rep-ctx"></div>

    <div class="rep-row">
      <label for="rep-motivo" id="rep-motivo-lbl"></label>
      <select id="rep-motivo">
        <option value="no_se_muestra"></option>
        <option value="enlace_roto"></option>
        <option value="paywall"></option>
        <option value="medio_incorrecto"></option>
        <option value="duplicado"></option>
        <option value="contenido_inapropiado"></option>
        <option value="fecha_incorrecta"></option>
        <option value="otro"></option>
      </select>
    </div>

    <div class="rep-row">
      <label for="rep-detalles" id="rep-detalles-lbl"></label>
      <textarea id="rep-detalles"></textarea>
    </div>

    <label class="rep-check">
      <input type="checkbox" id="rep-config-incluir">
      <span id="rep-config-lbl"></span>
    </label>

    <div class="rep-acciones">
      <div class="grupo">
        <button id="rep-copy" type="button"></button>
      </div>
      <div class="grupo">
        <button id="rep-mail" type="button"></button>
        <button id="rep-github" type="button" class="primary"></button>
      </div>
    </div>
  </div>
</section>

<section class="filtros">

/* ═══════════════════════════════════════════════════════════════
   PARSER DE FECHAS ROBUSTO
   ═══════════════════════════════════════════════════════════════
   Prioridad:
     1) DD/MM/YYYY [HH:MM[:SS]] — nuestro formato localizado
        (¡SIEMPRE antes de Date.parse para evitar que JS lo lea como MM/DD!)
     2) ISO 8601 con año primero — "2026-09-28T19:25:51+02:00"
     3) Cualquier otra cosa vía Date.parse (RFC 822, etc.)

   Si una fecha resulta estar a más de FUTURO_MAX_MS en el futuro, se
   considera error del medio (RSS programado en el futuro) y se sustituye
   por la fecha de recolección.
   ─────────────────────────────────────────────────────────── */
const FUTURO_MAX_MS = 24 * 60 * 60 * 1000; // 24h de margen

function parseFecha(s){
  if (!s) return NaN;
  const str = String(s).trim();

  // 1) DD/MM/YYYY [HH:MM[:SS]]
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m){
    const [, d, mo, y, h = 0, mi = 0, se = 0] = m;
    const t = new Date(+y, +mo - 1, +d, +h, +mi, +se).getTime();
    return isNaN(t) ? NaN : t;
  }

  // 2) ISO 8601 con año primero (Date.parse lo maneja bien)
  if (/^\d{4}-\d{2}-\d{2}/.test(str)){
    const t = Date.parse(str);
    if (!isNaN(t)) return t;
  }

  // 3) Cualquier otro (RFC 822, MM/DD/YYYY gringo, etc.)
  const t = Date.parse(str);
  return !isNaN(t) ? t : NaN;
}

/* Normaliza un timestamp: si está "demasiado" en el futuro, lo trae al presente */
function sanearTs(ts, fallbackTs){
  if (isNaN(ts)) return isNaN(fallbackTs) ? NaN : fallbackTs;
  if (ts - Date.now() > FUTURO_MAX_MS){
    return isNaN(fallbackTs) ? Date.now() : fallbackTs;
  }
  return ts;
}

/* Formatea una fecha con prefijo relativo si es reciente */
function formatearFecha(ts){
  if (isNaN(ts)) return '';
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  const hr  = Math.floor(diff / 3600000);
  const dia = Math.floor(diff / 86400000);

  let rel = '';
  if (diff < -FUTURO_MAX_MS)       rel = t('fechaProgramado');
  else if (diff < 0)                rel = t('fechaProgramado');
  else if (min < 1)                 rel = t('fechaAhora');
  else if (min < 60)                rel = t('fechaHaceMin', { n: min });
  else if (hr < 24)                 rel = t('fechaHaceH', { n: hr });
  else if (dia < 7)                 rel = t('fechaHaceD', { n: dia });

  const abs = new Date(ts).toLocaleString(ACCES.lang, {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  return rel ? `${abs} · ${rel}` : abs;
}

/* ═══════════════════════════════════════════════════════════════
   ORDEN POR IDIOMA
   ═══════════════════════════════════════════════════════════════ */
function ordenarGruposPorIdioma(grupos){
  const target = (ACCES && ACCES.lang) || 'es';
  const stats = {};
  NOTICIAS.forEach(n => {
    if (!stats[n.grupo]) stats[n.grupo] = { total: 0, matches: 0 };
    stats[n.grupo].total++;
    if (n.lang === target) stats[n.grupo].matches++;
  });
  return grupos.slice().sort((a, b) => {
    const sa = stats[a] || { total: 0, matches: 0 };
    const sb = stats[b] || { total: 0, matches: 0 };
    if (sa.matches !== sb.matches) return sb.matches - sa.matches;
    const ra = sa.total ? sa.matches / sa.total : 0;
    const rb = sb.total ? sb.matches / sb.total : 0;
    if (ra !== rb) return rb - ra;
    return a.localeCompare(b);
  });
}
function gruposAfinesAlIdioma(){
  const target = (ACCES && ACCES.lang) || 'es';
  const set = new Set();
  NOTICIAS.forEach(n => { if (n.lang === target) set.add(n.grupo); });
  return set;
}

}
function ajustarWidth(d){
  ACCES.width = Math.max(LIM.width.min, Math.min(LIM.width.max, ACCES.width + d * LIM.width.step));

}

const PRESET_DEF = { grupos: [], mediosIncluir: [], mediosIgnorar: [], palabras: [] };
const PRESET_KEY = 'voceiro-preset-v2';
const PRESET_ACTIVO_KEY = 'voceiro-preset-activo';

let PRESET = null;
let RX_PRESET = null;
let SET_GRUPOS = new Set();
let SET_INCLUIR = new Set();
let SET_IGNORAR = new Set();
let presetActivo = false;

function cargarPreset(){
  try{
    const raw = localStorage.getItem(PRESET_KEY);
    if (raw){
      const p = JSON.parse(raw);
      return {
        grupos:        Array.isArray(p.grupos)        ? p.grupos        : [],
        mediosIncluir: Array.isArray(p.mediosIncluir) ? p.mediosIncluir : [],
        mediosIgnorar: Array.isArray(p.mediosIgnorar) ? p.mediosIgnorar : [],
        palabras:      Array.isArray(p.palabras)      ? p.palabras      : [],
      };
    }
  }catch(e){}
  return structuredClone(PRESET_DEF);
}
function guardarPreset(){
  try{ localStorage.setItem(PRESET_KEY, JSON.stringify(PRESET)); }catch(e){}
}
function cargarPresetActivo(){
  try{
    const raw = localStorage.getItem(PRESET_ACTIVO_KEY);
    if (raw === 'true') return true;
    if (raw === 'false') return false;
  }catch(e){}
  return presetTieneReglas(PRESET);
}
function guardarPresetActivo(){
  try{ localStorage.setItem(PRESET_ACTIVO_KEY, presetActivo ? 'true' : 'false'); }catch(e){}
}
function presetTieneReglas(p){
  p = p || PRESET;
  if (!p) return false;
  return !!(
    (p.grupos && p.grupos.length) ||
    (p.mediosIncluir && p.mediosIncluir.length) ||
    (p.mediosIgnorar && p.mediosIgnorar.length) ||
    (p.palabras && p.palabras.length)
  );
}
function recompilarPreset(){
  SET_GRUPOS  = new Set(PRESET.grupos);
  SET_INCLUIR = new Set(PRESET.mediosIncluir);
  SET_IGNORAR = new Set(PRESET.mediosIgnorar);
  const words = PRESET.palabras.map(p => normalize(p).trim()).filter(Boolean)
    .map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  RX_PRESET = words.length ? new RegExp('\\b(' + words.join('|') + ')\\b') : null;
}
function cumplePreset(n){
  if (SET_IGNORAR.has(n.dominio)) return false;
  if (SET_INCLUIR.has(n.dominio)) return true;
  if (SET_GRUPOS.has(n.grupo)) return true;
  if (RX_PRESET && RX_PRESET.test(n._titNorm)) return true;
  return false;
}

  $('#btn-preset').classList.toggle('active', presetActivo);
}

let MEDIOS_UNICOS = [];

    c.checked = gSet.has(c.dataset.grupo);
  });

  const selM = $('#medio');

/* ═══════════════════════════════════════════════════════════════
   BIONIC + FOCO
   ═══════════════════════════════════════════════════════════════ */
function bionicize(html){
  if (!ACCES.bionic) return html;
  try{
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const root = doc.body.firstChild;
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => {
      const raw = tn.textContent;
      if (!raw || !/[\wÁÉÍÓÚÑáéíóúñ]/.test(raw)) return;
      const frag = doc.createDocumentFragment();
      const re = /([\wÁÉÍÓÚÑáéíóúñ]+)/g;
      let last = 0, m;
      while ((m = re.exec(raw)) !== null){
        if (m.index > last) frag.appendChild(doc.createTextNode(raw.slice(last, m.index)));
        const w = m[1];
        const half = Math.max(1, Math.ceil(w.length / 2));
        const b = doc.createElement('b');
        b.textContent = w.slice(0, half);
        frag.appendChild(b);
        frag.appendChild(doc.createTextNode(w.slice(half)));
        last = m.index + w.length;
      }
      if (last < raw.length) frag.appendChild(doc.createTextNode(raw.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    return root.innerHTML;
  }catch(e){ return html; }
}

function updateFocus(){
  const items = Array.from(document.querySelectorAll('.noticia'));
  if (!ACCES.focus){
    items.forEach(el => el.classList.remove('foco-dim','foco-active'));
    return;
  }
  if (!items.length) return;
  const mid = window.innerHeight / 2;
  let best = null, bd = Infinity;
  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bd){ bd = d; best = el; }
  });
  items.forEach(el => {
    el.classList.toggle('foco-dim', el !== best);
    el.classList.toggle('foco-active', el === best);
  });
}
window.addEventListener('scroll', () => {
  if (ACCES.focus) requestAnimationFrame(updateFocus);
}, { passive: true });

function resaltar(texto, tokens){
  if (!tokens.length || !texto) return escapeHtml(texto || '');
  const map = {a:'aáàäâ', e:'eéèëê', i:'iíìïî', o:'oóòöô', u:'uúùüû', n:'nñ'};
  const patterns = tokens.map(tok => {
    let p = '';
    for (const c of tok){
      let hit = false;
      for (const k in map){
        if (map[k].includes(c)){ p += '[' + map[k] + ']'; hit = true; break; }
      }
      if (!hit) p += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }
    return p;
  });
  const re = new RegExp('(' + patterns.join('|') + ')', 'gi');
  let out = '', last = 0;
  for (const mm of texto.matchAll(re)){
    out += escapeHtml(texto.slice(last, mm.index));
    out += '<mark>' + escapeHtml(mm[0]) + '</mark>';
    last = mm.index + mm[0].length;
  }
  out += escapeHtml(texto.slice(last));
  return out;
}

let REPORTE_CONTEXTO = null;

function abrirReporte(contexto){
  REPORTE_CONTEXTO = contexto || null;
  const ctxBox = $('#rep-contexto');
  if (!ctxBox) return;
  const ctx = REPORTE_CONTEXTO;
  if (!ctx){
    ctxBox.className = 'rep-ctx empty';
    ctxBox.textContent = t('repCtxEmpty');
  } else {
    ctxBox.className = 'rep-ctx';
    const rows = [
      ctx.medio     ? `<div><strong>${escapeHtml(t('repCtxMedio'))}:</strong> ${escapeHtml(ctx.medio)}</div>` : '',
      ctx.dominio   ? `<div><strong>Domain:</strong> ${escapeHtml(ctx.dominio)}</div>` : '',
      ctx.grupo     ? `<div><strong>${escapeHtml(t('repCtxGrupo'))}:</strong> ${escapeHtml(ctx.grupo)}</div>` : '',
      ctx.tipo      ? `<div><strong>${escapeHtml(t('repCtxTipo'))}:</strong> ${escapeHtml(ctx.tipo)}</div>` : '',
      ctx.titular   ? `<div><strong>${escapeHtml(t('repCtxTitular'))}:</strong> ${escapeHtml(ctx.titular)}</div>` : '',
      ctx.enlace    ? `<div><strong>${escapeHtml(t('repCtxEnlace'))}:</strong> <a href="${escapeHtml(ctx.enlace)}" target="_blank" rel="noopener" style="color:var(--accent)">${escapeHtml(ctx.enlace)}</a></div>` : '',
      ctx.fecha     ? `<div><strong>${escapeHtml(t('repCtxFecha'))}:</strong> ${escapeHtml(ctx.fecha)}</div>` : '',
      ctx.fuente    ? `<div><strong>${escapeHtml(t('repCtxFuente'))}:</strong> ${escapeHtml(ctx.fuente)}</div>` : '',
    ].filter(Boolean).join('');
    ctxBox.innerHTML = rows || `<div>${escapeHtml(t('repCtxEmpty'))}</div>`;
  }
  $('#rep-motivo').value = 'no_se_muestra';
  $('#rep-detalles').value = '';
  abrirPanel('panel-reporte');
}

function construirTextoReporte(){
  const motivoSel = $('#rep-motivo');
  const motivoTxt = motivoSel.options[motivoSel.selectedIndex].textContent;
  const detalles = $('#rep-detalles').value.trim();
  const incluirConfig = $('#rep-config-incluir').checked;

  const L = [];
  L.push(`### ${t('repTitle')}`);
  L.push('');
  L.push(`**${t('repMotivoLbl')}:** ${motivoTxt}`);
  L.push(`**${t('repFecha')}:** ${new Date().toISOString()}`);
  L.push('');

  if (detalles){
    L.push(`**${t('repDetallesLbl')}:**`);
    L.push(detalles);
    L.push('');
  }

  if (REPORTE_CONTEXTO){
    const c = REPORTE_CONTEXTO;
    L.push(`### ${t('repContexto')}`);
    if (c.medio)   L.push(`- **${t('repCtxMedio')}:** ${c.medio}`);
    if (c.dominio) L.push(`- **Domain:** ${c.dominio}`);
    if (c.grupo)   L.push(`- **${t('repCtxGrupo')}:** ${c.grupo}`);
    if (c.tipo)    L.push(`- **${t('repCtxTipo')}:** ${c.tipo}`);
    if (c.fuente)  L.push(`- **${t('repCtxFuente')}:** ${c.fuente}`);
    if (c.fecha)   L.push(`- **${t('repCtxFecha')}:** ${c.fecha}`);
    if (c.titular) L.push(`- **${t('repCtxTitular')}:** ${c.titular}`);
    if (c.enlace)  L.push(`- **${t('repCtxEnlace')}:** ${c.enlace}`);
    L.push('');
  }

  L.push(`- **${t('repCtxIdioma')}:** ${ACCES.lang}`);

  if (incluirConfig){
    L.push('');
    L.push(`### ${t('repCtxConfig')}`);
    L.push('```json');
    L.push(JSON.stringify({
      acces: { lang: ACCES.lang, tema: ACCES.tema, fuente: ACCES.fuente, fs: ACCES.fs, width: ACCES.width, just: ACCES.just, bionic: ACCES.bionic, focus: ACCES.focus },
      preset: PRESET,
      presetActivo: presetActivo
    }, null, 2));
    L.push('```');
  }

  return L.join('\n');
}

function construirTituloReporte(){
  const motivoSel = $('#rep-motivo');
  const motivoTxt = motivoSel.options[motivoSel.selectedIndex].textContent;
  if (REPORTE_CONTEXTO && REPORTE_CONTEXTO.medio){
    return `[Reporte] ${motivoTxt} — ${REPORTE_CONTEXTO.medio}${REPORTE_CONTEXTO.grupo ? ' (' + REPORTE_CONTEXTO.grupo + ')' : ''}`;
  }
  return `[Reporte] ${motivoTxt}`;
}

function reportarViaGithub(){
  const title = encodeURIComponent(construirTituloReporte());
  const body  = encodeURIComponent(construirTextoReporte());
  const url = `https://github.com/${REPORT_REPO}/issues/new?title=${title}&body=${body}`;
  try{
    const w = window.open(url, '_blank', 'noopener,noreferrer');
    if (!w) throw new Error('popup blocked');
  }catch(e){
    toast(t('repErrGithub'), 3200);
  }
}
function reportarViaEmail(){
  const subject = encodeURIComponent(construirTituloReporte());
  const body    = encodeURIComponent(construirTextoReporte());
  window.location.href = `mailto:${REPORT_EMAIL}?subject=${subject}&body=${body}`;
}
function copiarReporte(){
  const texto = construirTextoReporte();
  const done = () => toast(t('repCopiado'), 1800);
  const fb = () => {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('No se pudo copiar', 2000); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(done, fb);
  } else fb();
}

function exportarConfig(){
  const payload = {
    _app: 'voceiro',
    _version: 3,
    _exported: new Date().toISOString(),
    acces: ACCES,
    preset: PRESET,
    presetActivo: presetActivo,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `voceiro-config-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(t('expOk'), 1800);
}

function importarConfig(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('JSON inválido');
      if (!confirm(t('impConfirm'))) return;

      if (data.acces && typeof data.acces === 'object'){
        ACCES = { ...ACCES_DEF, ...data.acces };
        if (!I18N[ACCES.lang]) ACCES.lang = 'es';
        guardarAcces();
      }
      if (data.preset && typeof data.preset === 'object'){
        PRESET = {
          grupos:        Array.isArray(data.preset.grupos)        ? data.preset.grupos        : [],
          mediosIncluir: Array.isArray(data.preset.mediosIncluir) ? data.preset.mediosIncluir : [],
          mediosIgnorar: Array.isArray(data.preset.mediosIgnorar) ? data.preset.mediosIgnorar : [],
          palabras:      Array.isArray(data.preset.palabras)      ? data.preset.palabras      : [],
        };
        guardarPreset();
        recompilarPreset();
      }
      if (typeof data.presetActivo === 'boolean'){
        presetActivo = data.presetActivo && presetTieneReglas();
      } else {
        presetActivo = presetTieneReglas();
      }
      guardarPresetActivo();

      aplicarAcces();
      aplicarTextos();
      reconstruirListas();
      actualizarBotonPreset();
      if (MEDIOS_UNICOS.length) escribirPanel(PRESET);
      aplicarFiltros();
      toast(t('impOk'), 2200);
    }catch(e){
      toast(t('impErr', { msg: e.message || String(e) }), 3000);
    }
  };
  reader.onerror = () => toast(t('impErr', { msg: 'read error' }), 3000);
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════
   FILTRADO + ORDENACIÓN + RENDER
   ═══════════════════════════════════════════════════════════════ */
let NOTICIAS = [];
let ULT_FILTRADAS = [];
let ULT_TOKENS = [];

function aplicarFiltros(){
  const q = normalize($('#buscar').value.trim());
  const g = $('#grupo').value;
  const t2 = $('#tipo').value;
  const m = $('#medio').value;
  const dias = parseInt($('#rango').value, 10) || 0;
  const orden = $('#orden').value || 'recientes';
  const tokens = q.split(/\s+/).filter(Boolean);

  const ahora = Date.now();
  const limiteMs = dias ? dias * 24 * 3600 * 1000 : 0;
  const presetEfectivo = presetActivo && presetTieneReglas();

  let filtradas = NOTICIAS.filter(n => {
    if (presetEfectivo && !cumplePreset(n)) return false;
    if (g && n.grupo !== g) return false;
    if (t2 && n.tipo  !== t2) return false;
    if (m && n.medio !== m) return false;
    if (limiteMs) {
      const ts = n._ts;
      if (isNaN(ts)) return false;
      if (ahora - ts > limiteMs) return false;
    }
    if (tokens.length){
      for (const tok of tokens) if (!n._norm.includes(tok)) return false;
    }
    return true;
  });

  filtradas.sort((a, b) => {
    const ta = isNaN(a._ts) ? -Infinity : a._ts;
    const tb = isNaN(b._ts) ? -Infinity : b._ts;
    return orden === 'antiguos' ? ta - tb : tb - ta;
  });

  ULT_FILTRADAS = filtradas;
  ULT_TOKENS = tokens;
  renderizar();
}

function renderizar(){
  const lista = ULT_FILTRADAS;
  const tokens = ULT_TOKENS;
  const presetEfectivo = presetActivo && presetTieneReglas();

  let txt = t('contador', { n: lista.length, total: NOTICIAS.length });
  if (presetEfectivo) txt += t('contadorPreset');
  $('#contador').textContent = txt;

  const cont = $('#resultados');
  if (!lista.length){
    cont.innerHTML = `<div class="vacio">${escapeHtml(t('vacio'))}</div>`;
    return;
  }

  const ahora = Date.now();

  cont.innerHTML = lista.map((n, idx) => {
    const ts = n._ts;
    const fecha = !isNaN(ts) ? formatearFecha(ts) : '';
    const esPreset = presetEfectivo && cumplePreset(n);
    const esFuturo = !isNaN(ts) && (ts - ahora > FUTURO_MAX_MS);
    const tituloHtml = bionicize(resaltar(n.titular, tokens));
    return `
      <article class="noticia" data-idx="${idx}">
        <div class="cabecera">
          <span class="medio">${escapeHtml(n.medio)}</span>
          <span class="badge">${escapeHtml(n.tipo)}</span>
          <span class="badge${esPreset ? ' preset' : ''}">${escapeHtml(n.grupo)}</span>
          ${fecha ? `<span${esFuturo ? ' class="badge futuro"' : ''}>· ${escapeHtml(fecha)}</span>` : ''}
          <button class="btn-report-item" type="button" data-idx="${idx}" title="${escapeHtml(t('repBtnTitle'))}" aria-label="${escapeHtml(t('repBtnTitle'))}">🐞</button>
        </div>
        <a class="titular" href="${escapeHtml(n.enlace)}" target="_blank" rel="noopener">${tituloHtml}</a>
      </article>`;
  }).join('');

  cont.querySelectorAll('.btn-report-item').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      e.preventDefault();
      const i = parseInt(b.dataset.idx, 10);
      const n = lista[i];
      if (!n) return;
      abrirReporte({
        medio:   n.medio,
        dominio: n.dominio,
        grupo:   n.grupo,
        tipo:    n.tipo,
        titular: n.titular,
        enlace:  n.enlace,
        fecha:   n.fecha_pub || n.fecha || '',
        fuente:  n.fuente || ''
      });
    });
  });

  if (ACCES.focus) setTimeout(updateFocus, 30);
}

   MODALES
   ═══════════════════════════════════════════════════════════════ */
function abrirPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  document.querySelectorAll('.panel.open').forEach(o => { if (o !== p) o.classList.remove('open'); });
  p.classList.add('open');
  const inner = p.querySelector('.panel-inner');
  if (inner) inner.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function cerrarPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  p.classList.remove('open');
  if (!document.querySelector('.panel.open')){
    document.body.style.overflow = '';
  }
}

   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
function wireStaticEvents(){
  const btnP = $('#btn-preset');
  actualizarBotonPreset();

  btnP.addEventListener('click', () => {
    if (!presetActivo && !presetTieneReglas()){
      toast(t('presetVacio'), 3200);
      abrirPanel('panel-config');
      escribirPanel(PRESET);
      return;
    }
    presetActivo = !presetActivo;
    guardarPresetActivo();
    actualizarBotonPreset();
    aplicarFiltros();
    toast(presetActivo ? t('presetActivado') : t('presetDesactivado'), 1500);
  });

  $('#btn-config').addEventListener('click', () => {
    abrirPanel('panel-config');
    escribirPanel(PRESET);
  });
  $('#btn-acces').addEventListener('click', () => abrirPanel('panel-acces'));

  document.querySelectorAll('.panel-close').forEach(b => {
    b.addEventListener('click', () => cerrarPanel(b.dataset.close));
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target === p) cerrarPanel(p.id);
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      const abierto = document.querySelector('.panel.open');
      if (abierto){ cerrarPanel(abierto.id); return; }
    }
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
    if (e.altKey && e.key.toLowerCase() === 'a'){ e.preventDefault(); abrirPanel('panel-acces'); }
    if (e.altKey && e.key.toLowerCase() === 'c'){ e.preventDefault(); abrirPanel('panel-config'); escribirPanel(PRESET); }
    if (e.altKey && e.key.toLowerCase() === 'm'){
      e.preventDefault();
      if (!presetActivo && !presetTieneReglas()){
        toast(t('presetVacio'), 3200);
        return;
      }
      presetActivo = !presetActivo;
      guardarPresetActivo();
      actualizarBotonPreset();
      aplicarFiltros();
    }
  });

  $('#lang-select').addEventListener('change', e => {
    const v = e.target.value;
    if (!I18N[v]) return;
    ACCES.lang = v;
    guardarAcces();
    aplicarTextos();
    reconstruirListas();
    if (MEDIOS_UNICOS.length) escribirPanel(PRESET);
    renderizar();
  });

  $('#btn-export').addEventListener('click', exportarConfig);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importarConfig(f);
    e.target.value = '';
  });

  $('#btn-report-generic').addEventListener('click', () => abrirReporte(null));
  $('#rep-copy').addEventListener('click', copiarReporte);
  $('#rep-mail').addEventListener('click', reportarViaEmail);
  $('#rep-github').addEventListener('click', reportarViaGithub);

  $('#acces-reset').addEventListener('click', () => {
    const lang = ACCES.lang;
    ACCES = { ...ACCES_DEF, lang };
    guardarAcces(); aplicarAcces(); renderizar();
  });

  document.querySelectorAll('.opt-group[data-grupo]').forEach(g => {
    const clave = g.dataset.grupo;
    g.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const v = b.dataset.val;
      if (clave === 'tema' || clave === 'fuente') ACCES[clave] = v;
      if (clave === 'extra') ACCES[v] = !ACCES[v];
      guardarAcces(); aplicarAcces();
      if (clave === 'extra' && (v === 'focus' || v === 'bionic')) renderizar();
    });
  });

  $('#fs-menos').addEventListener('click', () => ajustarFs(-1));
  $('#fs-mas').addEventListener('click', () => ajustarFs(+1));
  $('#w-menos').addEventListener('click', () => ajustarWidth(-1));
  $('#w-mas').addEventListener('click', () => ajustarWidth(+1));

  $('#preset-guardar').addEventListener('click', () => {
    PRESET = leerPanel();
    guardarPreset(); recompilarPreset();

    if (presetTieneReglas() && !presetActivo){
      presetActivo = true;
      guardarPresetActivo();
      toast(t('presetGuardadoActivado'), 2200);
    } else if (!presetTieneReglas() && presetActivo){
      presetActivo = false;
      guardarPresetActivo();
    }
    actualizarBotonPreset();

    cerrarPanel('panel-config');
    aplicarFiltros();
  });

  $('#preset-cancelar').addEventListener('click', () => {
    escribirPanel(PRESET);
    cerrarPanel('panel-config');
  });

  $('#preset-reset').addEventListener('click', () => {
    PRESET = structuredClone(PRESET_DEF);
    guardarPreset(); recompilarPreset();
    presetActivo = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    escribirPanel(PRESET);
    aplicarFiltros();
  });

  $('#filtro-medio').addEventListener('input', filtrarMedios);
  $('#filtro-grupo-medio').addEventListener('change', filtrarMedios);

  ['buscar','grupo','tipo','medio','rango','orden'].forEach(id =>
    document.getElementById(id).addEventListener('input', aplicarFiltros)
  );
  $('#limpiar').addEventListener('click', () => {
    ['buscar','grupo','tipo','medio','rango'].forEach(id => document.getElementById(id).value = '');
    presetActivo = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    aplicarFiltros();
  });
}

/* ═══════════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════ */
async function init(){
  aplicarAcces();

  try{
    const res = await fetch('datos.json?' + Date.now());
    const data = await res.json();
    NOTICIAS = data.noticias || [];
  }catch(e){
    NOTICIAS = [];
  }

  // ── Normalización de fechas ────────────────────────────────
  NOTICIAS.forEach(n => {
    n._norm    = normalize(n.titular + ' ' + n.medio);
    n._titNorm = normalize(n.titular);

    const tsPub = parseFecha(n.fecha_pub);
    const tsRec = parseFecha(n.fecha);
    // Si tsPub no existe o está en el futuro lejano → usar tsRec
    n._ts = sanearTs(tsPub, tsRec);
  });

  construirMediosUnicos();
  PRESET = cargarPreset();
  recompilarPreset();
  presetActivo = cargarPresetActivo() && presetTieneReglas();

  aplicarTextos();

  const selT = $('#tipo');
  [...new Set(NOTICIAS.map(n=>n.tipo).filter(Boolean))].sort().forEach(t2 => selT.add(new Option(t2,t2)));
  if (selT.options[0]) selT.options[0].text = t('fltTipo');

  reconstruirListas();

  escribirPanel(PRESET);

  wireStaticEvents();

  aplicarFiltros();

  if (!NOTICIAS.length){
    $('#resultados').innerHTML = `<div class="vacio">${escapeHtml(t('errCarga'))}datos.json</div>`;
  }
}

init().catch(err => {
  $('#resultados').innerHTML =
    '<div class="vacio">Error cargando datos: ' + escapeHtml(err.message) + '</div>';
});
</script>
</body>
</html>
