let ULT_FILTRADAS = [];
let ULT_RX = null;
let ULT_PRESET_EFECTIVO = false;

const RENDER_BATCH = 150;
let RENDER_OFFSET = 0;
let SENTINEL_OBSERVER = null;

function aplicarFiltros(){
  const raw = $('#buscar').value.trim();
  const parsed = parseQuery(raw);
  renderChips(parsed, raw);

  const g = $('#grupo').value;
  const t2 = $('#tipo').value;
  const m = $('#medio').value;
  const dias = parseInt($('#rango').value, 10) || 0;
  const orden = $('#orden').value || 'recientes';

  const ahora = Date.now();
  const limiteMs = dias ? dias * 24 * 3600 * 1000 : 0;
  const presetEfectivo = PRESET_ACTIVO && presetTieneReglas();

  const hayMedio   = parsed.medios.length   > 0;
  const hayDominio = parsed.dominios.length > 0;
  const hayGrupo   = parsed.grupos.length   > 0;
  const hayTipo    = parsed.tipos.length    > 0;
  const hayTag     = parsed.tags.length     > 0;
  const hayTitulo  = parsed.titulo.length   > 0;

  let filtradas = NOTICIAS.filter(n => {
    const cumple = presetEfectivo ? cumplePreset(n) : false;
    n._esPreset = cumple;
    if (presetEfectivo && !cumple) return false;

    if (g && n.grupo !== g) return false;
    if (t2 && n.tipo  !== t2) return false;
    if (m && n.medio !== m) return false;
    if (limiteMs){
      const ts = n._tsOrden;
      if (isNaN(ts)) return false;
      if (ahora - ts > limiteMs) return false;
    }

    if (hayMedio){
      const ms = n._medioStrict || (n._medioStrict = normStrict(n.medio));
      for (let i = 0; i < parsed.medios.length; i++){
        if (ms.indexOf(parsed.medios[i]) === -1) return false;
      }
    }
    if (hayDominio){
      const ds = n._domStrict || (n._domStrict = normDomain(n.dominio));
      for (let i = 0; i < parsed.dominios.length; i++){
        if (ds.indexOf(parsed.dominios[i]) === -1) return false;
      }
    }
    if (hayGrupo){
      const gs = n._grupoStrict || (n._grupoStrict = normStrict(n.grupo));
      for (let i = 0; i < parsed.grupos.length; i++){
        if (gs.indexOf(parsed.grupos[i]) === -1) return false;
      }
    }
    if (hayTipo){
      const ts = n._tipoStrict || (n._tipoStrict = normStrict(n.tipo));
      for (let i = 0; i < parsed.tipos.length; i++){
        if (ts.indexOf(parsed.tipos[i]) === -1) return false;
      }
    }
    if (hayTag){
      const tags = n._tagsStrict || (n._tagsStrict = (n.tags || []).map(normStrict));
      for (let i = 0; i < parsed.tags.length; i++){
        if (!tags.some(x => x.indexOf(parsed.tags[i]) !== -1)) return false;
      }
    }
    if (hayTitulo){
      const tn = n._titNorm || (n._titNorm = normalize(n.titular));
      for (let i = 0; i < parsed.titulo.length; i++){
        if (tn.indexOf(parsed.titulo[i]) === -1) return false;
      }
    }
    return true;
  });

  filtradas.sort((a, b) => {
    const ta = isNaN(a._tsOrden) ? 0 : a._tsOrden;
    const tb = isNaN(b._tsOrden) ? 0 : b._tsOrden;
    if (ta !== tb) return orden === 'antiguos' ? ta - tb : tb - ta;
    const da = a.dominio || '';
    const db = b.dominio || '';
    if (da !== db) return da < db ? -1 : 1;
    const xa = a.titular || '';
    const xb = b.titular || '';
    if (xa !== xb) return xa < xb ? -1 : 1;
    return 0;
  });

  ULT_FILTRADAS = filtradas;
  ULT_RX = buildHighlightRegex(parsed.titulo);
  ULT_PRESET_EFECTIVO = presetEfectivo;

  renderizar();
}

function renderizar(){
  const lista = ULT_FILTRADAS;
  let txt = t('contador', { n: lista.length, total: NOTICIAS.length });
  if (ULT_PRESET_EFECTIVO) txt += t('contadorPreset');
  $('#contador').textContent = txt;

  const cont = $('#resultados');
  cont.innerHTML = '';
  RENDER_OFFSET = 0;

  if (!lista.length){
    cont.innerHTML = `<div class="vacio">${escapeHtml(t('vacio'))}</div>`;
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    return;
  }

  const sentinel = document.createElement('div');
  sentinel.id = 'render-sentinel';
  cont.appendChild(sentinel);

  appendBatch();

  if (SENTINEL_OBSERVER) SENTINEL_OBSERVER.disconnect();
  SENTINEL_OBSERVER = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) appendBatch();
  }, { rootMargin: '400px' });
  SENTINEL_OBSERVER.observe(sentinel);

  if (ACCES.focus) requestAnimationFrame(updateFocus);
}

function renderItemHtml(n, idx){
  let fechaHtml = '';
  if (n._tipoShow === 'pub'){
    const esFuturo = n._esFuturo;
    fechaHtml = `<span class="badge${esFuturo ? ' futuro' : ''}">· ${escapeHtml(formatearFecha(n._tsShow))}</span>`;
  } else if (n._tipoShow === 'est'){
    fechaHtml = `<span class="badge estimada" title="${escapeHtml(t('sinFechaReal'))}">🕓 ${escapeHtml(formatearFecha(n._tsShow))}</span>`;
  } else if (!isNaN(n._tsShow)){
    const fecha = `${t('recolectado')} ${formatearFecha(n._tsShow)}`;
    fechaHtml = `<span class="badge recolectado">${escapeHtml(fecha)}</span>`;
  } else {
    fechaHtml = `<span class="badge recolectado">${escapeHtml(t('recolectado'))}</span>`;
  }

  let tituloHtml;
  if (ULT_RX) tituloHtml = resaltar(n.titular, ULT_RX);
  else        tituloHtml = n._titularEsc;
  if (ACCES.bionic) tituloHtml = bionicize(tituloHtml);

  const guardada = PENDIENTES_URLS.has(n.enlace);
  const item = PENDIENTES_MAP.get(n.enlace);
  const leida = guardada && item && item.read;

  let saveLabel, saveTitle;
  if (leida){
    saveLabel = t('saveLabelRead');
    saveTitle = t('markUnread');
  } else if (guardada){
    saveLabel = t('saveLabelPending');
    saveTitle = t('markRead');
  } else {
    saveLabel = t('saveLabelSave');
    saveTitle = t('saveForLaterTitle');
  }

  const presetBadge = n._esPreset
    ? `<span class="badge preset">${n._grupoEsc}</span>`
    : `<span class="badge">${n._grupoEsc}</span>`;

  const blockTitle = t('blockMedia');

  return `<article class="noticia" data-idx="${idx}">
    <div class="cabecera">
      <span class="medio">${n._medioEsc}</span>
      <span class="badge">${n._tipoEsc}</span>
      ${presetBadge}
      ${fechaHtml}
      <button class="btn-save-text btn-save-item" type="button" data-idx="${idx}" title="${escapeHtml(saveTitle)}" aria-label="${escapeHtml(saveTitle)}">${escapeHtml(saveLabel)}</button>
      <span class="cab-spacer"></span>
      <button class="btn-mini btn-block-item" type="button" data-idx="${idx}" title="${escapeHtml(blockTitle)}" aria-label="${escapeHtml(blockTitle)}">🚫</button>
      <button class="btn-mini btn-report-item" type="button" data-idx="${idx}" title="${escapeHtml(t('repBtnTitle'))}" aria-label="${escapeHtml(t('repBtnTitle'))}">🐞</button>
    </div>
    <a class="titular" href="${n._enlaceEsc}" target="_blank" rel="noopener">${tituloHtml}</a>
  </article>`;
}

function appendBatch(){
  const cont = $('#resultados');
  const sentinel = document.getElementById('render-sentinel');
  if (!sentinel) return;

  const total = ULT_FILTRADAS.length;
  const end = Math.min(RENDER_OFFSET + RENDER_BATCH, total);
  if (RENDER_OFFSET >= end) {
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    sentinel.remove();
    return;
  }

  let html = '';
  for (let i = RENDER_OFFSET; i < end; i++){
    html += renderItemHtml(ULT_FILTRADAS[i], i);
  }
  sentinel.insertAdjacentHTML('beforebegin', html);
  RENDER_OFFSET = end;

  if (RENDER_OFFSET >= total){
    if (SENTINEL_OBSERVER){ SENTINEL_OBSERVER.disconnect(); SENTINEL_OBSERVER = null; }
    sentinel.remove();
  }
}

function wireResultadosDelegation(){
  const cont = $('#resultados');
  cont.addEventListener('click', e => {
    const saveBtn = e.target.closest('.btn-save-item');
    if (saveBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(saveBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (n) guardarParaLeerDespues(n);
      return;
    }

    const blockBtn = e.target.closest('.btn-block-item');
    if (blockBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(blockBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (!n) return;

      const dominio = n.dominio;
      const medioNombre = n.medio || dominio;

      // 1. Bloquear el medio (mode: off)
      emitirUpdateSite(dominio, { mode: 'off' });

      // 2. Si el Modo Personalizado no está activo, activarlo,
      //    porque si no, bloquear no tendría efecto visible.
      if (!PRESET_ACTIVO){
        PRESET_ACTIVO = true;
        guardarPresetActivo();
        actualizarBotonPreset();
      }

      // 3. Refrescar filtros (las noticias del medio desaparecen)
      aplicarFiltros();

      toast(t('blockMediaDone') + ' · ' + medioNombre, 2000);
      return;
    }

    const repBtn = e.target.closest('.btn-report-item');
    if (repBtn){
      e.preventDefault();
      e.stopPropagation();
      const i = parseInt(repBtn.dataset.idx, 10);
      const n = ULT_FILTRADAS[i];
      if (!n) return;
      abrirReporte({
        medio:   n.medio,
        dominio: n.dominio,
        grupo:   n.grupo,
        tipo:    n.tipo,
        titular: n.titular,
        enlace:  n.enlace,
        fecha:   n.fecha_pub || n.fecha_estimada || n.fecha || '',
        fuente:  n.fuente || ''
      });
    }
  });
}

function abrirPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  document.querySelectorAll('.panel.open').forEach(o => { if (o !== p) o.classList.remove('open'); });
  p.classList.add('open');
  const body = p.querySelector('.panel-body');
  if (body) body.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function cerrarPanel(id){
  const p = document.getElementById(id);
  if (!p) return;
  p.classList.remove('open');
  if (!document.querySelector('.panel.open')){
    document.body.style.overflow = '';
  }
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
function wireStaticEvents(){
  const btnP = $('#btn-preset');
  actualizarBotonPreset();

  btnP.addEventListener('click', () => {
    if (!PRESET_ACTIVO && !presetTieneReglas()){
      toast(t('presetVacio'), 3200);
      abrirPanel('panel-config');
      escribirPanel(PRESET);
      return;
    }
    PRESET_ACTIVO = !PRESET_ACTIVO;
    guardarPresetActivo();
    actualizarBotonPreset();
    aplicarFiltros();
    toast(PRESET_ACTIVO ? t('presetActivado') : t('presetDesactivado'), 1500);
  });

  $('#btn-config').addEventListener('click', () => {
    abrirPanel('panel-config');
    escribirPanel(PRESET);
    if (USCRIPT_OK) document.dispatchEvent(new CustomEvent('voceiro-get-config'));
  });
  $('#btn-pendientes').addEventListener('click', abrirPendientes);
  $('#btn-buscar').addEventListener('click', bsAbrir);
  $('#btn-acces').addEventListener('click', () => abrirPanel('panel-acces'));

  document.querySelectorAll('.panel-close').forEach(b => {
    b.addEventListener('click', () => cerrarPanel(b.dataset.close));
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target === p) cerrarPanel(p.id);
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      const abierto = document.querySelector('.panel.open');
      if (abierto){ cerrarPanel(abierto.id); return; }
    }
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
    if (e.altKey && e.key.toLowerCase() === 'a'){ e.preventDefault(); abrirPanel('panel-acces'); }
    if (e.altKey && e.key.toLowerCase() === 'c'){ e.preventDefault(); abrirPanel('panel-config'); escribirPanel(PRESET); }
    if (e.altKey && e.key.toLowerCase() === 'p'){ e.preventDefault(); abrirPendientes(); }
    if (e.altKey && e.key.toLowerCase() === 'b'){ e.preventDefault(); bsAbrir(); }
    if (e.altKey && e.key.toLowerCase() === 'm'){
      e.preventDefault();
      if (!PRESET_ACTIVO && !presetTieneReglas()){
        toast(t('presetVacio'), 3200);
        return;
      }
      PRESET_ACTIVO = !PRESET_ACTIVO;
      guardarPresetActivo();
      actualizarBotonPreset();
      aplicarFiltros();
    }
  });

  $('#lang-select').addEventListener('change', e => {
    const v = e.target.value;
    if (!I18N[v]) return;
    ACCES.lang = v;
    guardarAcces();
    aplicarTextos();
    reconstruirListas();
    construirIndicesBusqueda();
    if (MEDIOS_UNICOS.length) escribirPanel(PRESET);
    renderizar();
  });

  $('#btn-export').addEventListener('click', exportarConfig);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importarConfig(f);
    e.target.value = '';
  });

  $('#pend-refresh').addEventListener('click', abrirPendientes);

  $('#btn-report-generic').addEventListener('click', () => abrirReporte(null));
  $('#rep-copy').addEventListener('click', copiarReporte);
  $('#rep-mail').addEventListener('click', reportarViaEmail);
  $('#rep-github').addEventListener('click', reportarViaGithub);

  $('#acces-reset').addEventListener('click', () => {
    const lang = ACCES.lang;
    ACCES = { ...ACCES_DEF, lang };
    guardarAcces(); aplicarAcces(); renderizar();
  });

  document.querySelectorAll('.opt-group[data-grupo]').forEach(g => {
    const clave = g.dataset.grupo;
    g.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const v = b.dataset.val;
      if (clave === 'tema' || clave === 'fuente') ACCES[clave] = v;
      if (clave === 'extra') ACCES[v] = !ACCES[v];
      guardarAcces(); aplicarAcces();
      if (clave === 'extra' && (v === 'focus' || v === 'bionic')) renderizar();
    });
  });

  $('#fs-menos').addEventListener('click', () => ajustarFs(-1));
  $('#fs-mas').addEventListener('click', () => ajustarFs(+1));
  $('#w-menos').addEventListener('click', () => ajustarWidth(-1));
  $('#w-mas').addEventListener('click', () => ajustarWidth(+1));

  $('#preset-guardar').addEventListener('click', () => {
    PRESET = leerPanel();
    guardarPreset(); recompilarPreset();

    if (presetTieneReglas() && !PRESET_ACTIVO){
      PRESET_ACTIVO = true;
      guardarPresetActivo();
      toast(t('presetGuardadoActivado'), 2200);
    } else if (!presetTieneReglas() && PRESET_ACTIVO){
      PRESET_ACTIVO = false;
      guardarPresetActivo();
    }
    actualizarBotonPreset();

    cerrarPanel('panel-config');
    aplicarFiltros();
  });

  $('#preset-cancelar').addEventListener('click', () => {
    escribirPanel(PRESET);
    cerrarPanel('panel-config');
  });

  $('#preset-reset').addEventListener('click', () => {
    PRESET = structuredClone(PRESET_DEF);
    guardarPreset(); recompilarPreset();
    if (USCRIPT_OK){
      [...SITES.entries()].forEach(([d, s]) => {
        document.dispatchEvent(new CustomEvent('voceiro-update-site', {
          detail: { domain: d, mode: 'prompt' }
        }));
      });
    }
    SITES.forEach(s => { s.mode = 'prompt'; });
    window.__lastLocal.clear();
    guardarSitesCache();
    PRESET_ACTIVO = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    escribirPanel(PRESET);
    aplicarFiltros();
  });

  const filtrarMediosDebounced = debounce(filtrarMedios, 120);
  $('#filtro-medio').addEventListener('input', filtrarMediosDebounced);
  $('#filtro-grupo-medio').addEventListener('change', filtrarMedios);

  const aplicarFiltrosDebounced = debounce(aplicarFiltros, 180);
  $('#buscar').addEventListener('input', aplicarFiltrosDebounced);
  ['grupo','tipo','medio','rango','orden'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', aplicarFiltros);
    el.addEventListener('input', aplicarFiltros);
  });

  $('#limpiar').addEventListener('click', () => {
    ['buscar','grupo','tipo','medio','rango'].forEach(id => document.getElementById(id).value = '');
    PRESET_ACTIVO = false;
    guardarPresetActivo();
    actualizarBotonPreset();
    aplicarFiltros();
  });

  wireResultadosDelegation();
}

/* ═══════════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════ */
async function init(){
  aplicarAcces();
  initUserScriptBridge();

  await cargarDatos();
  hidratarNoticias();

  construirMediosUnicos();
  construirIndicesBusqueda();

  PRESET = cargarPreset();
  recompilarPreset();
  PRESET_ACTIVO = cargarPresetActivo() && presetTieneReglas();

  const cachedSites = cargarSitesCache();
  setSitesFromArray(cachedSites);
  cachedSites.forEach(s => {
    if (s && s.domain){
      window.__lastLocal.set(s.domain, {
        mode: s.mode || 'prompt',
        lang: s.lang || 'auto',
        type: s.type || '',
        tags: Array.isArray(s.tags) ? s.tags.slice() : []
      });
    }
  });

  aplicarTextos();

  const selT = $('#tipo');
  while (selT.options.length > 1) selT.remove(1);
  [...new Set(MEDIOS_UNICOS.map(m => m.tipo).filter(Boolean))].sort()
    .forEach(t2 => selT.add(new Option(t2, t2)));
  if (selT.options[0]) selT.options[0].text = t('fltTipo');

  reconstruirListas();
  escribirPanel(PRESET);
  wireStaticEvents();
  bsWireEventos();
  aplicarFiltros();

  if (!NOTICIAS.length){
    $('#resultados').innerHTML = `<div class="vacio">${escapeHtml(t('errCarga'))}sin datos</div>`;
  }
}

init().catch(err => {
  $('#resultados').innerHTML =
    '<div class="vacio">Error cargando datos: ' + escapeHtml(err.message) + '</div>';
});
