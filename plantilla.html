<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  :root{
    --bg:#f4f4f9; --card:#fff; --text:#111; --muted:#666;
    --primary:#0056b3; --primary-hover:#e6f2ff; --border:#ddd; --badge:#eef;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    max-width:960px; margin:0 auto; padding:20px;
    line-height:1.55; font-size:18px;
  }
  h1{border-bottom:2px solid var(--border); padding-bottom:8px; margin-bottom:4px}
  .meta{color:var(--muted); font-size:15px; margin-top:4px}

  .filtros{
    position:sticky; top:0; background:var(--bg);
    padding:12px 0; display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
    gap:8px; border-bottom:1px solid var(--border); z-index:10;
  }
  .filtros input, .filtros select, .filtros button{
    font-size:15px; padding:8px 10px; border:1px solid var(--border);
    border-radius:6px; background:#fff; font-family:inherit;
  }
  .filtros button{cursor:pointer; background:#eee}
  .filtros button:hover{background:#ddd}
  #contador{color:var(--muted); font-size:14px; margin:8px 0 16px}

  .noticia{
    background:var(--card); padding:14px 16px; margin-bottom:10px;
    border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .cabecera{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-bottom:6px; font-size:12px; color:var(--muted);
  }
  .badge{background:var(--badge); padding:2px 8px; border-radius:10px; color:#445}
  .medio{font-weight:bold; color:#333; font-size:15px; text-transform:uppercase; letter-spacing:.3px}
  .titular{color:var(--primary); text-decoration:none; font-weight:600; font-size:19px; display:block; margin-top:2px}
  .titular:hover{background:var(--primary-hover)}
  .resumen{color:#333; font-size:16px; margin-top:8px}
  .texto{color:#444; font-size:15px; margin-top:8px; display:none; white-space:pre-line}
  .texto.abierto{display:block}
  .toggle{
    margin-top:8px; font-size:13px; background:none; border:none;
    color:var(--primary); cursor:pointer; padding:0;
  }
  .toggle:hover{text-decoration:underline}
  .kw{font-size:12px; color:var(--muted); margin-top:6px}
  .kw span{background:#eef; padding:1px 6px; border-radius:8px; margin-right:4px}
  mark{background:#ffe680; padding:0 2px; border-radius:2px}
  .vacio{text-align:center; color:var(--muted); padding:40px 0}

  @media (max-width:850px){
    .filtros{grid-template-columns:1fr 1fr 1fr}
    #buscar{grid-column:1/-1}
  }
  @media (max-width:500px){
    .filtros{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<header>
  <h1>Voceiro</h1>
  <p class="meta">Actualizado: <span id="fecha">{{FECHA}}</span> · <span id="total">{{TOTAL}}</span> noticias en histórico</p>
</header>

<section class="filtros">
  <input type="search" id="buscar" placeholder="🔍 Buscar en titular, resumen y texto…" autocomplete="off">
  <select id="grupo"><option value="">Todos los grupos</option></select>
  <select id="tipo"><option value="">Todos los tipos</option></select>
  <select id="medio"><option value="">Todos los medios</option></select>
  <select id="rango">
    <option value="">Todo el histórico</option>
    <option value="1">Últimas 24 h</option>
    <option value="2">Últimas 48 h</option>
    <option value="7">Últimos 7 días</option>
  </select>
  <button id="limpiar" type="button">Limpiar</button>
</section>

<div id="contador"></div>
<main id="resultados"></main>

<script>
let NOTICIAS = [];

function normalize(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function init(){
  const res = await fetch('datos.json?' + Date.now());
  const data = await res.json();
  NOTICIAS = data.noticias || [];

  // Índice de búsqueda precalculado
  NOTICIAS.forEach(n => {
    n._norm = normalize(n.titular + ' ' + (n.resumen || '') + ' ' + (n.texto || ''));
  });

  // Rellenar selects
  const selGrupo = document.getElementById('grupo');
  [...new Set(NOTICIAS.map(n=>n.grupo))].sort().forEach(g => selGrupo.add(new Option(g,g)));

  const selTipo = document.getElementById('tipo');
  [...new Set(NOTICIAS.map(n=>n.tipo))].sort().forEach(t => selTipo.add(new Option(t,t)));

  const selMedio = document.getElementById('medio');
  const porGrupo = {};
  NOTICIAS.forEach(n => (porGrupo[n.grupo] = porGrupo[n.grupo] || new Set()).add(n.medio));
  Object.keys(porGrupo).sort().forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g;
    [...porGrupo[g]].sort().forEach(m => og.appendChild(new Option(m,m)));
    selMedio.appendChild(og);
  });

  ['buscar','grupo','tipo','medio','rango'].forEach(id =>
    document.getElementById(id).addEventListener('input', aplicarFiltros)
  );
  document.getElementById('limpiar').addEventListener('click', () => {
    ['buscar','grupo','tipo','medio','rango'].forEach(id => document.getElementById(id).value = '');
    aplicarFiltros();
  });

  aplicarFiltros();
}

function aplicarFiltros(){
  const q = normalize(document.getElementById('buscar').value.trim());
  const g = document.getElementById('grupo').value;
  const t = document.getElementById('tipo').value;
  const m = document.getElementById('medio').value;
  const dias = parseInt(document.getElementById('rango').value, 10) || 0;
  const tokens = q.split(/\s+/).filter(Boolean);

  const ahora = Date.now();
  const limiteMs = dias ? dias * 24 * 3600 * 1000 : 0;

  const filtradas = NOTICIAS.filter(n => {
    if (g && n.grupo !== g) return false;
    if (t && n.tipo  !== t) return false;
    if (m && n.medio !== m) return false;
    if (limiteMs && (ahora - new Date(n.fecha).getTime()) > limiteMs) return false;
    if (tokens.length) {
      for (const tok of tokens) if (!n._norm.includes(tok)) return false;
    }
    return true;
  });

  render(filtradas, tokens);
}

function resaltar(texto, tokens){
  if (!tokens.length || !texto) return escapeHtml(texto || '');
  const map = {a:'aáàäâ', e:'eéèëê', i:'iíìïî', o:'oóòöô', u:'uúùüû', n:'nñ'};
  const patterns = tokens.map(tok => {
    let p = '';
    for (const c of tok){
      let hit = false;
      for (const k in map){
        if (map[k].includes(c)){ p += '[' + map[k] + ']'; hit = true; break; }
      }
      if (!hit) p += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }
    return p;
  });
  const re = new RegExp('(' + patterns.join('|') + ')','gi');
  let out = '', last = 0;
  for (const m of texto.matchAll(re)){
    out += escapeHtml(texto.slice(last, m.index));
    out += '<mark>' + escapeHtml(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  out += escapeHtml(texto.slice(last));
  return out;
}

function render(lista, tokens){
  document.getElementById('contador').textContent =
    `Mostrando ${lista.length} de ${NOTICIAS.length} noticias`;

  const cont = document.getElementById('resultados');
  if (!lista.length){
    cont.innerHTML = '<div class="vacio">Sin resultados</div>';
    return;
  }

  cont.innerHTML = lista.map((n, i) => {
    const tieneTexto = (n.texto || '').length > 200;
    return `
      <article class="noticia">
        <div class="cabecera">
          <span class="medio">${escapeHtml(n.medio)}</span>
          <span class="badge">${escapeHtml(n.tipo)}</span>
          <span class="badge">${escapeHtml(n.grupo)}</span>
          <span>· ${escapeHtml(n.fuente)}</span>
          <span>· ${new Date(n.fecha).toLocaleString('es-ES')}</span>
        </div>
        <a class="titular" href="${escapeHtml(n.enlace)}" target="_blank" rel="noopener">${resaltar(n.titular, tokens)}</a>
        ${n.resumen ? `<p class="resumen">${resaltar(n.resumen, tokens)}</p>` : ''}
        ${tieneTexto ? `<div class="texto" id="t${i}">${resaltar(n.texto, tokens)}</div>` : ''}
        ${tieneTexto ? `<button class="toggle" type="button" onclick="document.getElementById('t${i}').classList.toggle('abierto'); this.textContent = this.textContent === 'Ver más ▾' ? 'Ver menos ▴' : 'Ver más ▾'">Ver más ▾</button>` : ''}
        ${n.palabras_clave && n.palabras_clave.length ? `<div class="kw">${n.palabras_clave.map(k=>`<span>${escapeHtml(k)}</span>`).join('')}</div>` : ''}
      </article>
    `;
  }).join('');
}

init().catch(err => {
  document.getElementById('resultados').innerHTML =
    '<div class="vacio">Error cargando datos: ' + err.message + '</div>';
});
</script>
</body>
</html>
