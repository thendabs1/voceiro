<!DOCTYPE html>
<html lang="es" data-theme="light" data-font="sans" data-just="0" data-bionic="0" data-focus="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  :root{
    --bg:#fff; --fg:#222; --muted:#888; --accent:#d32f2f;
    --border:#eee; --quote-bg:#f9f9f9;
    --btn-bg:#f7f7f7; --btn-border:#ccc;
    --shadow:rgba(0,0,0,.08);
    --fs:18px; --lh:1.55; --w:820px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --preset:#0a7d3f; --preset-bg:#e8f5e9;
    --block:#b00020; --block-bg:#fde8ec;
    --mark:#ffe680; --mark-fg:#111;
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --fg:#3b2f1e; --muted:#8a7a5c; --accent:#a0522d;
    --border:#e0d5b8; --quote-bg:#ede0c4;
    --btn-bg:#ede0c4; --btn-border:#c8b88a;
    --shadow:rgba(59,47,30,.15);
    --preset:#3e7a2f; --preset-bg:#e4ebd0;
    --block:#8b2020; --block-bg:#ebd5d0;
    --mark:#c9a227; --mark-fg:#2c1c08;
  }
  [data-theme="dark"]{
    --bg:#1a1a1a; --fg:#e0e0e0; --muted:#999; --accent:#ff6b6b;
    --border:#333; --quote-bg:#252525;
    --btn-bg:#2a2a2a; --btn-border:#444;
    --shadow:rgba(0,0,0,.5);
    --preset:#4cc97a; --preset-bg:#173524;
    --block:#ff8a9c; --block-bg:#3d1a20;
    --mark:#b58600; --mark-fg:#fff;
  }
  [data-theme="contrast"]{
    --bg:#000; --fg:#fff; --muted:#ff0; --accent:#0ff;
    --border:#fff; --quote-bg:#111;
    --btn-bg:#111; --btn-border:#fff;
    --shadow:rgba(255,255,255,.2);
    --preset:#0f0; --preset-bg:#003300;
    --block:#f00; --block-bg:#330000;
    --mark:#ff0; --mark-fg:#000;
  }
  [data-font="serif"]{ --ff: Georgia, "Times New Roman", serif }
  [data-font="sans"]{ --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
  [data-font="dyslexic"]{
    --ff: Verdana, Tahoma, "Comic Sans MS", sans-serif;
    letter-spacing: .03em; word-spacing: .1em;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ff);
    background:var(--bg); color:var(--fg);
    font-size:var(--fs); line-height:var(--lh);
    max-width:var(--w); margin:0 auto; padding:20px;
    transition:background .15s, color .15s;
  }
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}

  /* HEADER */
  header h1{
    border-bottom:1px solid var(--border);
    padding-bottom:8px; margin:0 0 4px;
    font-size:1.6em; line-height:1.2;
  }
  header .meta{color:var(--muted); font-size:.72em; margin:0}

  /* TOPBAR */
  .topbar{
    position:sticky; top:0; background:var(--bg);
    z-index:10; padding:10px 0;
    border-bottom:1px solid var(--border);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .topbar .info{
    flex:1; min-width:120px;
    font-size:.65em; color:var(--muted);
  }

  /* BOTONES */
  button{
    cursor:pointer; padding:8px 14px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg);
    border-radius:6px;
    font-family:inherit; font-size:.8em; font-weight:500;
    transition:filter .1s, background .1s;
  }
  button:hover{filter:brightness(.95)}
  button.primary{
    background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold;
  }
  button.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  [data-theme="contrast"] button.active,
  [data-theme="contrast"] button.primary{color:#000}
  button.icon{padding:6px 10px; font-size:.85em}

  .btn-preset{
    border:2px solid var(--preset); background:transparent; color:var(--preset);
    font-weight:600;
  }
  .btn-preset:hover{background:var(--preset-bg)}
  .btn-preset.active{background:var(--preset); color:#fff}
  .btn-preset.active::after{content:' ✓'}

  select.lang-select{
    padding:7px 10px; border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg); border-radius:6px;
    font-family:inherit; font-size:.78em;
  }

  /* PANELES */
  .panel{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin:10px 0;
    display:none;
  }
  .panel.open{display:block}
  .panel h2{
    margin:0 0 12px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); font-weight:bold;
  }
  .panel h3{
    margin:16px 0 6px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .panel h3:first-of-type{border-top:none; padding-top:0; margin-top:0}

  .opt-row{
    display:flex; align-items:center; gap:14px;
    padding:8px 0;
    border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .opt-row:first-of-type{border-top:none}
  .opt-label{
    color:var(--muted); font-size:.65em; letter-spacing:.05em;
    text-transform:uppercase; min-width:110px;
  }
  .opt-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .opt-val{
    font-weight:bold; min-width:44px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em;
  }

  .list-grupos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:4px;
    max-height:200px; overflow-y:auto;
    padding:8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .grupo-item{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; cursor:pointer;
    padding:5px 8px; border-radius:4px;
  }
  .grupo-item:hover{background:var(--quote-bg)}
  .grupo-item input{accent-color:var(--accent); width:1.1em; height:1.1em}

  .ctrl-medios{
    display:grid; grid-template-columns:1fr auto; gap:8px;
    margin-bottom:8px;
  }
  .ctrl-medios input,
  .ctrl-medios select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }

  .list-medios{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
    max-height:340px; overflow-y:auto;
  }
  .medio-fila{
    display:grid;
    grid-template-columns:34px 34px minmax(140px,1.2fr) 1.6fr 1.4fr;
    gap:8px; align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .medio-fila:last-child{border-bottom:none}
  .medio-fila.estado-incluir{background:var(--preset-bg)}
  .medio-fila.estado-ignorar{background:var(--block-bg)}
  .medio-fila .celda{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .medio-fila .celda-grupo{color:var(--muted); font-size:.9em}

  .chk{display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none}
  .chk input{display:none}
  .chk span{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--btn-border);
    font-size:.9em; font-weight:700;
    background:transparent; color:var(--muted);
    transition:all .1s;
  }
  .chk:hover span{border-color:var(--accent)}
  .chk.incluir input:checked + span{
    background:var(--preset); border-color:var(--preset); color:#fff;
  }
  .chk.ignorar input:checked + span{
    background:var(--block); border-color:var(--block); color:#fff;
  }

  textarea.preset-texto{
    width:100%; min-height:70px; padding:10px;
    border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg);
    font-family:var(--ff); font-size:.78em;
    line-height:1.5; resize:vertical;
  }

  .panel-acciones{
    display:flex; justify-content:flex-end; gap:8px;
    flex-wrap:wrap;
    margin-top:16px; padding-top:12px;
    border-top:1px solid var(--border);
  }

  .filtros{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    position:sticky; top:56px; background:var(--bg);
    z-index:9;
  }
  .filtros input,
  .filtros select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  #contador{
    color:var(--muted); font-size:.68em;
    margin:10px 0 14px;
  }

  .noticia{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:8px;
    transition:opacity .25s;
  }
  .noticia.foco-dim{opacity:.28}
  .noticia.foco-active{opacity:1}
  .noticia .cabecera{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-bottom:5px; font-size:.62em; color:var(--muted);
  }
  .noticia .medio{
    font-weight:bold; color:var(--fg); font-size:1.1em;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .badge{
    background:var(--quote-bg); border:1px solid var(--border);
    padding:1px 8px; border-radius:10px; color:var(--muted);
  }
  .badge.preset{
    background:var(--preset-bg);
    border-color:var(--preset);
    color:var(--preset);
  }
  .noticia a.titular{
    color:var(--accent); text-decoration:none;
    font-weight:600; font-size:1em; display:block; margin-top:2px;
  }
  .noticia a.titular:hover{text-decoration:underline}
  [data-just="1"] .noticia a.titular{text-align:justify; hyphens:auto}
  mark{background:var(--mark); color:var(--mark-fg); padding:0 3px; border-radius:2px}
  .vacio{
    text-align:center; color:var(--muted);
    padding:40px 0; font-size:.85em;
  }

  /* TOAST */
  #toast-wrap{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:9999; display:flex; flex-direction:column; gap:8px;
    pointer-events:none;
  }
  .toast{
    background:#222; color:#fff; padding:10px 16px; border-radius:8px;
    font-size:.78em; box-shadow:0 6px 20px rgba(0,0,0,.35);
    opacity:0; transform:translateY(12px);
    transition:opacity .2s, transform .2s;
    max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateY(0)}
  [data-theme="dark"] .toast{background:#eee; color:#222}
  [data-theme="contrast"] .toast{background:#ff0; color:#000; border:2px solid #000}

  @media (max-width:850px){
    .filtros{grid-template-columns:1fr 1fr 1fr; position:static}
    #buscar{grid-column:1/-1}
    .medio-fila{grid-template-columns:34px 34px 1fr 1.2fr}
    .medio-fila .celda-grupo{display:none}
    .opt-row{gap:8px}
    .opt-label{min-width:100%}
  }
  @media (max-width:520px){
    .filtros{grid-template-columns:1fr 1fr}
    .medio-fila{grid-template-columns:34px 34px 1fr}
    .medio-fila .celda-nombre{display:none}
  }
</style>
</head>
<body>

<header>
  <h1 id="h-title">Voceiro</h1>
  <p class="meta">
    <span id="meta-prefix"></span>
    <span id="fecha">{{FECHA}}</span>
    <span>·</span>
    <span id="total">{{TOTAL}}</span>
    <span id="meta-suffix"></span>
  </p>
</header>

<!-- TOPBAR -->
<section class="topbar">
  <button id="btn-preset" class="btn-preset" type="button"></button>
  <button id="btn-config" type="button"></button>
  <span class="info" id="preset-info"></span>
  <select id="lang-select" class="lang-select" aria-label="Language"></select>
  <button id="btn-export" class="icon" type="button"></button>
  <button id="btn-import" class="icon" type="button"></button>
  <button id="btn-acces" type="button"></button>
</section>

<!-- PANEL MI ZONA -->
<section id="panel-config" class="panel" role="region">
  <h2 id="cfg-title"></h2>

  <h3 id="cfg-grupos"></h3>
  <p id="cfg-grupos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
  <div id="lista-grupos" class="list-grupos"></div>

  <h3 id="cfg-medios"></h3>
  <p id="cfg-medios-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
  <div class="ctrl-medios">
    <input type="search" id="filtro-medio">
    <select id="filtro-grupo-medio"><option value=""></option></select>
  </div>
  <div id="lista-medios" class="list-medios"></div>
  <p id="resumen-medios" style="font-size:.68em; color:var(--muted); margin:6px 0 0;"></p>

  <h3 id="cfg-palabras"></h3>
  <p id="cfg-palabras-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
  <textarea id="preset-palabras" class="preset-texto"></textarea>

  <div class="panel-acciones">
    <button id="preset-reset" type="button"></button>
    <button id="preset-cancelar" type="button"></button>
    <button id="preset-guardar" type="button" class="primary"></button>
  </div>
</section>

<!-- PANEL ACCESIBILIDAD -->
<section id="panel-acces" class="panel" role="region">
  <h2 id="ac-title"></h2>

  <div class="opt-row">
    <span class="opt-label" id="ac-tema"></span>
    <div class="opt-group" data-grupo="tema">
      <button data-val="light"></button>
      <button data-val="sepia"></button>
      <button data-val="dark"></button>
      <button data-val="contrast"></button>
    </div>
  </div>

  <div class="opt-row">
    <span class="opt-label" id="ac-fuente"></span>
    <div class="opt-group" data-grupo="fuente">
      <button data-val="serif"></button>
      <button data-val="sans"></button>
      <button data-val="dyslexic"></button>
    </div>
  </div>

  <div class="opt-row">
    <span class="opt-label" id="ac-tamano"></span>
    <div class="opt-group">
      <button id="fs-menos">A−</button>
      <span class="opt-val" id="fs-val">18</span>
      <button id="fs-mas">A+</button>
    </div>
  </div>

  <div class="opt-row">
    <span class="opt-label" id="ac-ancho"></span>
    <div class="opt-group">
      <button id="w-menos">−</button>
      <span class="opt-val" id="w-val">820</span>
      <button id="w-mas">+</button>
    </div>
  </div>

  <div class="opt-row">
    <span class="opt-label" id="ac-extra"></span>
    <div class="opt-group" data-grupo="extra">
      <button data-val="just"></button>
      <button data-val="bionic"></button>
      <button data-val="focus"></button>
    </div>
  </div>

  <div class="panel-acciones">
    <button id="acces-reset" type="button"></button>
  </div>
</section>

<!-- FILTROS -->
<section class="filtros">
  <input type="search" id="buscar" autocomplete="off">
  <select id="grupo"><option value=""></option></select>
  <select id="tipo"><option value=""></option></select>
  <select id="medio"><option value=""></option></select>
  <select id="rango">
    <option value=""></option>
    <option value="1"></option>
    <option value="2"></option>
    <option value="7"></option>
  </select>
  <button id="limpiar" type="button"></button>
</section>

<div id="contador"></div>
<main id="resultados"></main>

<div id="toast-wrap"></div>

<input type="file" id="file-import" accept=".json,application/json" style="display:none">

function t(key, vars){
  const lang = (ACCES && ACCES.lang) || 'es';
  const dict = I18N[lang] || I18N.es;
  let s = dict[key] != null ? dict[key] : (I18N.es[key] != null ? I18N.es[key] : key);
  if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  return s;
}

   ═══════════════════════════════════════════════════════════════ */
const $ = sel => document.querySelector(sel);

function normalize(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseLista(txt){
  return txt.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
function toast(msg, ms){
  ms = ms || 2400;
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, ms);
}

   ═══════════════════════════════════════════════════════════════ */
const ACCES_DEF = {
  lang: 'es',
  tema: 'light', fuente: 'sans',
  fs: 18, width: 820,
  just: false, bionic: false, focus: false,
};
const LIM = {
  fs: { min: 14, max: 32, step: 1 },
  width: { min: 480, max: 1400, step: 40 },
};

let ACCES = cargarAcces();

function cargarAcces(){
  try{
    const raw = localStorage.getItem('voceiro-acces-v2');
    const o = raw ? { ...ACCES_DEF, ...JSON.parse(raw) } : { ...ACCES_DEF };
    if (!I18N[o.lang]) o.lang = 'es';
    return o;
  }catch(e){ return { ...ACCES_DEF }; }
}
function guardarAcces(){
  try{ localStorage.setItem('voceiro-acces-v2', JSON.stringify(ACCES)); }catch(e){}
}
function aplicarAcces(){
  const h = document.documentElement;
  h.lang = ACCES.lang;
  h.dataset.theme  = ACCES.tema;
  h.dataset.font   = ACCES.fuente;
  h.dataset.just   = ACCES.just ? '1' : '0';
  h.dataset.bionic = ACCES.bionic ? '1' : '0';
  h.dataset.focus  = ACCES.focus ? '1' : '0';
  h.style.setProperty('--fs', ACCES.fs + 'px');
  h.style.setProperty('--w', ACCES.width + 'px');

  document.querySelectorAll('.opt-group').forEach(g => {
    const clave = g.dataset.grupo;
    if (!clave) return;
    g.querySelectorAll('button').forEach(b => {
      if (clave === 'extra') b.classList.toggle('active', !!ACCES[b.dataset.val]);
      else                   b.classList.toggle('active', b.dataset.val === String(ACCES[clave]));
    });
  });

  $('#fs-val').textContent = ACCES.fs;
  $('#w-val').textContent  = ACCES.width;

  if (ACCES.focus) setTimeout(updateFocus, 30);
}
function ajustarFs(d){
  ACCES.fs = Math.max(LIM.fs.min, Math.min(LIM.fs.max, ACCES.fs + d * LIM.fs.step));
  guardarAcces(); aplicarAcces();
}
function ajustarWidth(d){
  ACCES.width = Math.max(LIM.width.min, Math.min(LIM.width.max, ACCES.width + d * LIM.width.step));
  guardarAcces(); aplicarAcces();
}

const PRESET_DEF = {
  grupos:        ['Galicia'],
  mediosIncluir: ['elpais.com', 'eldiario.es', 'infolibre.es'],
  mediosIgnorar: [],
  palabras:      ['poio', 'pontevedra', 'caldas de reis', 'caldas de rei',
                  'caldas de resi', 'galicia'],
};

let PRESET = null;
let RX_PRESET = null;
let SET_GRUPOS = new Set();
let SET_INCLUIR = new Set();
let SET_IGNORAR = new Set();
let presetActivo = true;

function cargarPreset(){
  try{
    const raw = localStorage.getItem('voceiro-preset-v2');
    if (raw){
      const p = JSON.parse(raw);
      return {
        grupos:        Array.isArray(p.grupos)        ? p.grupos        : PRESET_DEF.grupos,
        mediosIncluir: Array.isArray(p.mediosIncluir) ? p.mediosIncluir : PRESET_DEF.mediosIncluir,
        mediosIgnorar: Array.isArray(p.mediosIgnorar) ? p.mediosIgnorar : PRESET_DEF.mediosIgnorar,
        palabras:      Array.isArray(p.palabras)      ? p.palabras      : PRESET_DEF.palabras,
      };
    }
    return structuredClone(PRESET_DEF);
  }catch(e){ return structuredClone(PRESET_DEF); }
}
function guardarPreset(){
  try{ localStorage.setItem('voceiro-preset-v2', JSON.stringify(PRESET)); }catch(e){}
}
function recompilarPreset(){
  SET_GRUPOS  = new Set(PRESET.grupos);
  SET_INCLUIR = new Set(PRESET.mediosIncluir);
  SET_IGNORAR = new Set(PRESET.mediosIgnorar);
  const words = PRESET.palabras.map(p => normalize(p).trim()).filter(Boolean)
    .map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  RX_PRESET = words.length ? new RegExp('\\b(' + words.join('|') + ')\\b') : null;
}
function cumplePreset(n){
  if (SET_IGNORAR.has(n.dominio)) return false;
  if (SET_INCLUIR.has(n.dominio)) return true;
  if (SET_GRUPOS.has(n.grupo)) return true;
  if (RX_PRESET && RX_PRESET.test(n._titNorm)) return true;
  return false;
}
function actualizarInfoPreset(){
  const g = PRESET.grupos.length, i = PRESET.mediosIncluir.length,
        x = PRESET.mediosIgnorar.length, p = PRESET.palabras.length;
  $('#preset-info').textContent = t('presetInfo', { g, i, x, p });
}

let MEDIOS_UNICOS = [];
function construirMediosUnicos(){
  const map = {};
  NOTICIAS.forEach(n => {
    if (!map[n.dominio]) map[n.dominio] = { dominio: n.dominio, medio: n.medio, grupo: n.grupo };
  });
  MEDIOS_UNICOS = Object.values(map).sort((a,b) =>
    a.grupo.localeCompare(b.grupo) || a.medio.localeCompare(b.medio)
  );
}
function renderListaGrupos(){
  const cont = $('#lista-grupos');
  const grupos = [...new Set(NOTICIAS.map(n => n.grupo))].sort();
  cont.innerHTML = grupos.map(g => `
    <label class="grupo-item">
      <input type="checkbox" data-grupo="${escapeHtml(g)}">
      <span>${escapeHtml(g)}</span>
    </label>`).join('');

  const sel = $('#filtro-grupo-medio');
  [...sel.querySelectorAll('option:not(:first-child)')].forEach(o => o.remove());
  sel.options[0].text = t('cfgTodosGrupos');
  grupos.forEach(g => sel.add(new Option(g, g)));
}
function renderListaMedios(){
  const cont = $('#lista-medios');
  cont.innerHTML = MEDIOS_UNICOS.map(m => `
    <div class="medio-fila" data-dominio="${escapeHtml(m.dominio)}"
         data-grupo="${escapeHtml(m.grupo)}"
         data-buscar="${escapeHtml(normalize(m.dominio + ' ' + m.medio + ' ' + m.grupo))}">
      <label class="chk incluir"><input type="checkbox" class="chk-incluir"><span>✓</span></label>
      <label class="chk ignorar"><input type="checkbox" class="chk-ignorar"><span>✗</span></label>
      <span class="celda celda-dominio"><code>${escapeHtml(m.dominio)}</code></span>
      <span class="celda celda-nombre">${escapeHtml(m.medio)}</span>
      <span class="celda celda-grupo">${escapeHtml(m.grupo)}</span>
    </div>`).join('');

  cont.querySelectorAll('.medio-fila').forEach(fila => {
    const inc = fila.querySelector('.chk-incluir');
    const ign = fila.querySelector('.chk-ignorar');
    inc.addEventListener('change', () => { if (inc.checked) ign.checked = false; marca(fila); });
    ign.addEventListener('change', () => { if (ign.checked) inc.checked = false; marca(fila); });
  });

}
function marca(fila){
  const inc = fila.querySelector('.chk-incluir').checked;
  const ign = fila.querySelector('.chk-ignorar').checked;
  fila.classList.toggle('estado-incluir', inc);
  fila.classList.toggle('estado-ignorar', ign);
  actualizarResumen();

function filtrarMedios(){
  const q = normalize($('#filtro-medio').value.trim());
  const g = $('#filtro-grupo-medio').value;
  document.querySelectorAll('#lista-medios .medio-fila').forEach(f => {
    const okQ = !q || f.dataset.buscar.includes(q);
    const okG = !g || f.dataset.grupo === g;
    f.style.display = (okQ && okG) ? '' : 'none';
  });

function actualizarResumen(){
  const total = MEDIOS_UNICOS.length;
  const visibles = document.querySelectorAll('#lista-medios .medio-fila:not([style*="display: none"])').length;
  const inc = document.querySelectorAll('#lista-medios .chk-incluir:checked').length;
  const ign = document.querySelectorAll('#lista-medios .chk-ignorar:checked').length;
  $('#resumen-medios').textContent = t('cfgResumen', {
    vis: visibles, total: total, inc: inc, ign: ign
  });
}
function escribirPanel(p){
  const gSet = new Set(p.grupos);
  document.querySelectorAll('#lista-grupos input[data-grupo]').forEach(c => {
    c.checked = gSet.has(c.dataset.grupo);
  });
  const iSet = new Set(p.mediosIncluir), xSet = new Set(p.mediosIgnorar);
  document.querySelectorAll('#lista-medios .medio-fila').forEach(f => {
    const d = f.dataset.dominio;
    f.querySelector('.chk-incluir').checked = iSet.has(d);
    f.querySelector('.chk-ignorar').checked = xSet.has(d);
    marca(f);
  });
  $('#preset-palabras').value = p.palabras.join('\n');
  $('#filtro-medio').value = '';
  $('#filtro-grupo-medio').value = '';
  filtrarMedios();
}
function leerPanel(){
  const grupos = [];
  document.querySelectorAll('#lista-grupos input[data-grupo]:checked').forEach(c =>
    grupos.push(c.dataset.grupo));
  const mediosIncluir = [], mediosIgnorar = [];
  document.querySelectorAll('#lista-medios .medio-fila').forEach(f => {
    if (f.querySelector('.chk-incluir').checked) mediosIncluir.push(f.dataset.dominio);
    if (f.querySelector('.chk-ignorar').checked) mediosIgnorar.push(f.dataset.dominio);
  });
  const palabras = parseLista($('#preset-palabras').value);
  return { grupos, mediosIncluir, mediosIgnorar, palabras };
}

/* ═══════════════════════════════════════════════════════════════
   BIONIC + FOCO
   ═══════════════════════════════════════════════════════════════ */
function bionicize(html){
  if (!ACCES.bionic) return html;
  try{
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const root = doc.body.firstChild;
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => {
      const raw = tn.textContent;
      if (!raw || !/[\wÁÉÍÓÚÑáéíóúñ]/.test(raw)) return;
      const frag = doc.createDocumentFragment();
      const re = /([\wÁÉÍÓÚÑáéíóúñ]+)/g;
      let last = 0, m;
      while ((m = re.exec(raw)) !== null){
        if (m.index > last) frag.appendChild(doc.createTextNode(raw.slice(last, m.index)));
        const w = m[1];
        const half = Math.max(1, Math.ceil(w.length / 2));
        const b = doc.createElement('b');
        b.textContent = w.slice(0, half);
        frag.appendChild(b);
        frag.appendChild(doc.createTextNode(w.slice(half)));
        last = m.index + w.length;
      }
      if (last < raw.length) frag.appendChild(doc.createTextNode(raw.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    return root.innerHTML;
  }catch(e){ return html; }
}

function updateFocus(){
  const items = Array.from(document.querySelectorAll('.noticia'));
  if (!ACCES.focus){
    items.forEach(el => el.classList.remove('foco-dim','foco-active'));
    return;
  }
  if (!items.length) return;
  const mid = window.innerHeight / 2;
  let best = null, bd = Infinity;
  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bd){ bd = d; best = el; }
  });
  items.forEach(el => {
    el.classList.toggle('foco-dim', el !== best);
    el.classList.toggle('foco-active', el === best);
  });
}
window.addEventListener('scroll', () => {
  if (ACCES.focus) requestAnimationFrame(updateFocus);
}, { passive: true });

/* ═══════════════════════════════════════════════════════════════
   RESALTADO
   ═══════════════════════════════════════════════════════════════ */
function resaltar(texto, tokens){
  if (!tokens.length || !texto) return escapeHtml(texto || '');
  const map = {a:'aáàäâ', e:'eéèëê', i:'iíìïî', o:'oóòöô', u:'uúùüû', n:'nñ'};
  const patterns = tokens.map(tok => {
    let p = '';
    for (const c of tok){
      let hit = false;
      for (const k in map){
        if (map[k].includes(c)){ p += '[' + map[k] + ']'; hit = true; break; }
      }
      if (!hit) p += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }
    return p;
  });
  const re = new RegExp('(' + patterns.join('|') + ')', 'gi');
  let out = '', last = 0;
  for (const mm of texto.matchAll(re)){
    out += escapeHtml(texto.slice(last, mm.index));
    out += '<mark>' + escapeHtml(mm[0]) + '</mark>';
    last = mm.index + mm[0].length;
  }
  out += escapeHtml(texto.slice(last));
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   IMPORT / EXPORT
   ═══════════════════════════════════════════════════════════════ */
function exportarConfig(){
  const payload = {
    _app: 'voceiro',
    _version: 1,
    _exported: new Date().toISOString(),
    acces: ACCES,
    preset: PRESET,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `voceiro-config-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(t('expOk'), 1800);
}

function importarConfig(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('JSON inválido');
      if (!confirm(t('impConfirm'))) return;

      if (data.acces && typeof data.acces === 'object'){
        ACCES = { ...ACCES_DEF, ...data.acces };
        if (!I18N[ACCES.lang]) ACCES.lang = 'es';
        guardarAcces();
      }
      if (data.preset && typeof data.preset === 'object'){
        PRESET = {
          grupos:        Array.isArray(data.preset.grupos)        ? data.preset.grupos        : PRESET_DEF.grupos,
          mediosIncluir: Array.isArray(data.preset.mediosIncluir) ? data.preset.mediosIncluir : PRESET_DEF.mediosIncluir,
          mediosIgnorar: Array.isArray(data.preset.mediosIgnorar) ? data.preset.mediosIgnorar : PRESET_DEF.mediosIgnorar,
          palabras:      Array.isArray(data.preset.palabras)      ? data.preset.palabras      : PRESET_DEF.palabras,
        };
        guardarPreset();
        recompilarPreset();
      }

      aplicarAcces();
      aplicarTextos();
      if (MEDIOS_UNICOS.length){
        escribirPanel(PRESET);
        actualizarInfoPreset();
      }
      renderizar();
      toast(t('impOk'), 2200);
    }catch(e){
      toast(t('impErr', { msg: e.message || String(e) }), 3000);
    }
  };
  reader.onerror = () => toast(t('impErr', { msg: 'read error' }), 3000);
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════
   FILTRADO + RENDER
   ═══════════════════════════════════════════════════════════════ */
let NOTICIAS = [];
let ULT_FILTRADAS = [];
let ULT_TOKENS = [];

function aplicarFiltros(){
  const q = normalize($('#buscar').value.trim());
  const g = $('#grupo').value;
  const t2 = $('#tipo').value;
  const m = $('#medio').value;
  const dias = parseInt($('#rango').value, 10) || 0;
  const tokens = q.split(/\s+/).filter(Boolean);

  const ahora = Date.now();
  const limiteMs = dias ? dias * 24 * 3600 * 1000 : 0;

  const filtradas = NOTICIAS.filter(n => {
    if (presetActivo && !cumplePreset(n)) return false;
    if (g && n.grupo !== g) return false;
    if (t2 && n.tipo  !== t2) return false;
    if (m && n.medio !== m) return false;
    if (limiteMs) {
      const f = n.fecha_pub || n.fecha;
      if (f && (ahora - new Date(f).getTime()) > limiteMs) return false;
    }
    if (tokens.length){
      for (const tok of tokens) if (!n._norm.includes(tok)) return false;
    }
    return true;
  });

  ULT_FILTRADAS = filtradas;
  ULT_TOKENS = tokens;
  renderizar();
}

function renderizar(){
  const lista = ULT_FILTRADAS;
  const tokens = ULT_TOKENS;

  let txt = t('contador', { n: lista.length, total: NOTICIAS.length });
  if (presetActivo) txt += t('contadorPreset');
  $('#contador').textContent = txt;

  const cont = $('#resultados');
  if (!lista.length){
    cont.innerHTML = `<div class="vacio">${escapeHtml(t('vacio'))}</div>`;
    return;
  }

  cont.innerHTML = lista.map(n => {
    const f = n.fecha_pub || n.fecha;
    const fecha = f ? new Date(f).toLocaleString(ACCES.lang) : '';
    const esPreset = presetActivo && cumplePreset(n);
    const tituloHtml = bionicize(resaltar(n.titular, tokens));
    return `
      <article class="noticia">
        <div class="cabecera">
          <span class="medio">${escapeHtml(n.medio)}</span>
          <span class="badge">${escapeHtml(n.tipo)}</span>
          <span class="badge${esPreset ? ' preset' : ''}">${escapeHtml(n.grupo)}</span>
          ${fecha ? `<span>· ${escapeHtml(fecha)}</span>` : ''}
        </div>
        <a class="titular" href="${escapeHtml(n.enlace)}" target="_blank" rel="noopener">${tituloHtml}</a>
      </article>`;
  }).join('');

  if (ACCES.focus) setTimeout(updateFocus, 30);
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
function wireStaticEvents(){
  // Preset
  const btnP = $('#btn-preset');
  btnP.classList.toggle('active', presetActivo);
  btnP.addEventListener('click', () => {
    presetActivo = !presetActivo;
    btnP.classList.toggle('active', presetActivo);
    renderizar();
  });

  // Config
  const btnC = $('#btn-config'), panelC = $('#panel-config');
  btnC.addEventListener('click', () => {
    const open = panelC.classList.toggle('open');
    btnC.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) escribirPanel(PRESET);
  });

  // Accesibilidad
  const btnA = $('#btn-acces'), panelA = $('#panel-acces');
  btnA.addEventListener('click', () => {
    const open = panelA.classList.toggle('open');
    btnA.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Idioma
  $('#lang-select').addEventListener('change', e => {
    const v = e.target.value;
    if (!I18N[v]) return;
    ACCES.lang = v;
    guardarAcces();
    aplicarTextos();
    renderizar();
    if (MEDIOS_UNICOS.length){
      // Re-render panel por si cambian textos dinámicos
      escribirPanel(PRESET);
      actualizarInfoPreset();
    }
  });

  // Import / Export
  $('#btn-export').addEventListener('click', exportarConfig);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importarConfig(f);
    e.target.value = '';
  });

  // Reset panel accesibilidad (mantiene idioma)
  $('#acces-reset').addEventListener('click', () => {
    const lang = ACCES.lang;
    ACCES = { ...ACCES_DEF, lang };
    guardarAcces(); aplicarAcces(); renderizar();
  });

  // Botones dinámicos de opciones
  document.querySelectorAll('.opt-group[data-grupo]').forEach(g => {
    const clave = g.dataset.grupo;
    g.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const v = b.dataset.val;
      if (clave === 'tema' || clave === 'fuente') ACCES[clave] = v;
      if (clave === 'extra') ACCES[v] = !ACCES[v];
      guardarAcces(); aplicarAcces();
      if (clave === 'extra' && (v === 'focus' || v === 'bionic')) renderizar();
    });
  });

  $('#fs-menos').addEventListener('click', () => ajustarFs(-1));
  $('#fs-mas').addEventListener('click', () => ajustarFs(+1));
  $('#w-menos').addEventListener('click', () => ajustarWidth(-1));
  $('#w-mas').addEventListener('click', () => ajustarWidth(+1));

  // Config panel: acciones
  $('#preset-guardar').addEventListener('click', () => {
    PRESET = leerPanel();
    guardarPreset(); recompilarPreset(); actualizarInfoPreset();
    panelC.classList.remove('open');
    renderizar();
  });
  $('#preset-cancelar').addEventListener('click', () => {
    escribirPanel(PRESET);
    panelC.classList.remove('open');
  });
  $('#preset-reset').addEventListener('click', () => {
    PRESET = structuredClone(PRESET_DEF);
    guardarPreset(); recompilarPreset(); escribirPanel(PRESET);
    actualizarInfoPreset(); renderizar();
  });

  $('#filtro-medio').addEventListener('input', filtrarMedios);
  $('#filtro-grupo-medio').addEventListener('change', filtrarMedios);

  // Filtros
  ['buscar','grupo','tipo','medio','rango'].forEach(id =>
    document.getElementById(id).addEventListener('input', aplicarFiltros)
  );
  $('#limpiar').addEventListener('click', () => {
    ['buscar','grupo','tipo','medio','rango'].forEach(id => document.getElementById(id).value = '');
    presetActivo = false;
    $('#btn-preset').classList.remove('active');
    renderizar();
  });
}

/* ═══════════════════════════════════════════════════════════════
   ATAJOS
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
  if (e.altKey && e.key.toLowerCase() === 'a'){
    e.preventDefault(); $('#panel-acces').classList.toggle('open');
  }
  if (e.altKey && e.key.toLowerCase() === 'c'){
    e.preventDefault(); $('#panel-config').classList.toggle('open');
  }
  if (e.altKey && e.key.toLowerCase() === 'm'){
    e.preventDefault();
    presetActivo = !presetActivo;
    $('#btn-preset').classList.toggle('active', presetActivo);
    renderizar();
  }
});

/* ═══════════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════ */
async function init(){
  aplicarAcces();

  try{
    const res = await fetch('datos.json?' + Date.now());
    const data = await res.json();
    NOTICIAS = data.noticias || [];
  }catch(e){
    NOTICIAS = [];
  }

  NOTICIAS.forEach(n => {
    n._norm    = normalize(n.titular + ' ' + n.medio);
    n._titNorm = normalize(n.titular);
  });

  // Preset
  construirMediosUnicos();
  PRESET = cargarPreset();
  recompilarPreset();

  // Textos (necesita I18N + ACCES ya cargados)
  aplicarTextos();

  // Paneles dinámicos
  renderListaGrupos();
  renderListaMedios();
  escribirPanel(PRESET);

  // Selects de filtros
  const selG = $('#grupo');
  [...new Set(NOTICIAS.map(n=>n.grupo))].sort().forEach(g => selG.add(new Option(g,g)));

  const selT = $('#tipo');
  [...new Set(NOTICIAS.map(n=>n.tipo).filter(Boolean))].sort().forEach(t2 => selT.add(new Option(t2,t2)));

  const selM = $('#medio');
  const porGrupo = {};
  NOTICIAS.forEach(n => (porGrupo[n.grupo] = porGrupo[n.grupo] || new Set()).add(n.medio));
  Object.keys(porGrupo).sort().forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g;
    [...porGrupo[g]].sort().forEach(m => og.appendChild(new Option(m,m)));
    selM.appendChild(og);
  });

  // Eventos estáticos
  wireStaticEvents();

  // Render inicial
  aplicarFiltros();

  if (!NOTICIAS.length){
    $('#resultados').innerHTML = `<div class="vacio">${escapeHtml(t('errCarga'))}datos.json</div>`;
  }
}

init().catch(err => {
  $('#resultados').innerHTML =
    '<div class="vacio">Error cargando datos: ' + escapeHtml(err.message) + '</div>';
});
</script>
