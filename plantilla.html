<!DOCTYPE html>
<html lang="es" data-theme="light" data-font="sans" data-just="0" data-bionic="0" data-focus="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voceiro · Titulares</title>
<style>
  :root{
    --bg:#fff; --fg:#222; --muted:#888; --accent:#d32f2f;
    --border:#eee; --quote-bg:#f9f9f9;
    --btn-bg:#f7f7f7; --btn-border:#ccc;
    --shadow:rgba(0,0,0,.08);
    --fs:18px; --lh:1.55; --w:1100px;
    --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --preset:#0a7d3f; --preset-bg:#e8f5e9;
    --block:#b00020; --block-bg:#fde8ec;
    --save:#1565c0; --save-bg:#e3f2fd;
    --mark:#ffe680; --mark-fg:#111;
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --fg:#3b2f1e; --muted:#8a7a5c; --accent:#a0522d;
    --border:#e0d5b8; --quote-bg:#ede0c4;
    --btn-bg:#ede0c4; --btn-border:#c8b88a;
    --shadow:rgba(59,47,30,.15);
    --preset:#3e7a2f; --preset-bg:#e4ebd0;
    --block:#8b2020; --block-bg:#ebd5d0;
    --save:#2e5a8b; --save-bg:#d8e3ee;
    --mark:#c9a227; --mark-fg:#2c1c08;
  }
  [data-theme="dark"]{
    --bg:#1a1a1a; --fg:#e0e0e0; --muted:#999; --accent:#ff6b6b;
    --border:#333; --quote-bg:#252525;
    --btn-bg:#2a2a2a; --btn-border:#444;
    --shadow:rgba(0,0,0,.5);
    --preset:#4cc97a; --preset-bg:#173524;
    --block:#ff8a9c; --block-bg:#3d1a20;
    --save:#6cb3ff; --save-bg:#1e3550;
    --mark:#b58600; --mark-fg:#fff;
  }
  [data-theme="contrast"]{
    --bg:#000; --fg:#fff; --muted:#ff0; --accent:#0ff;
    --border:#fff; --quote-bg:#111;
    --btn-bg:#111; --btn-border:#fff;
    --shadow:rgba(255,255,255,.2);
    --preset:#0f0; --preset-bg:#003300;
    --block:#f00; --block-bg:#330000;
    --save:#0ff; --save-bg:#003333;
    --mark:#ff0; --mark-fg:#000;
  }
  [data-font="serif"]{ --ff: Georgia, "Times New Roman", serif }
  [data-font="sans"]{ --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
  [data-font="dyslexic"]{
    --ff: Verdana, Tahoma, "Comic Sans MS", sans-serif;
    letter-spacing: .03em; word-spacing: .1em;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ff);
    background:var(--bg); color:var(--fg);
    font-size:var(--fs); line-height:var(--lh);
    max-width:var(--w); margin:0 auto; padding:20px;
    transition:background .15s, color .15s;
  }
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em}
  /* ═══ Cabecera ═══ */
  header{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding: 12px 0 0;
  }
  header .header-top{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin-bottom: 4px;
  }
  header #h-title{
    margin: 0;
    padding: 0;
    border: none;
    font-size: 1.6em;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  header .header-actions{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  header .header-actions button{
    font-size: .78em;
    padding: 6px 12px;
  }
  header .header-actions .lang-select{
    flex-shrink: 0;
  }
  header .header-actions-left{
    flex: 0 1 auto;
    min-width: 0;
  }
  header .header-actions-right{
    flex: 0 0 auto;
    margin-left: auto;   /* ← empuja el grupo a la derecha */
  }
  header .header-actions-left .btn-preset{
    flex-shrink: 1;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  header .meta{
    color: var(--muted);
    font-size: .72em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    min-width: 0;
  }
  header .meta .view-settings-wrap{
    flex: 0 0 auto;
   /* margin-left: auto;   /* ← empuja el botón al extremo derecho */
    font-size: 1.15em;
  }
  header .meta .meta-text{
    flex: 1 1 auto;
    min-width: 0;
  }
  header .meta .meta-text > span{
    margin-right: 4px;
  }
  button{
    cursor:pointer; padding:8px 14px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg);
    border-radius:6px;
    font-family:inherit; font-size:.8em; font-weight:500;
    transition:filter .1s, background .1s;
  }
  button:hover{filter:brightness(.95)}
  button.primary{
    background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold;
  }
  button.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  [data-theme="contrast"] button.active,
  [data-theme="contrast"] button.primary{color:#000}

  .btn-preset{
    border:2px solid var(--preset); background:transparent; color:var(--preset);
    font-weight:600;
  }
  .btn-preset:hover{background:var(--preset-bg)}
  .btn-preset.active{background:var(--preset); color:#fff}
  .preset-wrap{
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .preset-menu{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px var(--shadow);
    min-width: 220px;
    padding: 6px;
    z-index: 50;
  }
  .preset-item{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: .82em;
    text-align: left;
    font-weight: 500;
  }
  .preset-item:hover{ background: var(--quote-bg); }
  .preset-item.active{
    background: var(--preset-bg);
    color: var(--preset);
    font-weight: 600;
  }
  .preset-item .preset-check{
    display: inline-block;
    width: 14px;
    flex-shrink: 0;
    color: var(--preset);
    opacity: 0;
  }
  .preset-item.active .preset-check{ opacity: 1; }
  .preset-sep{
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }
  .preset-item.preset-manage{
    color: var(--muted);
    font-size: .78em;
  }

  .btn-pendientes{
    border:2px solid var(--save); background:transparent; color:var(--save);
    font-weight:600;
  }
  .btn-pendientes:hover{background:var(--save-bg)}
  .btn-pendientes.no-userscript{opacity:.55}
  .btn-pendientes{
    position: relative;
  }
  .pend-count{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    margin-left: 4px;
    border-radius: 8px;
    background: var(--save);
    color: #fff;
    font-size: .85em;
    font-weight: 700;
    line-height: 1;
    vertical-align: middle;
  }
  .pend-count[data-count="0"]{ display: none; }
  .btn-pendientes.has-pendientes{
    background: var(--save-bg);
  }
  .btn-pendientes.no-userscript.has-pendientes{
    opacity: 1;   /* si hay pendientes, no lo atenuamos aunque no haya plugin */
  }
  .btn-buscar{
    border:2px solid var(--accent); background:transparent; color:var(--accent);
    font-weight:600;
  }
  .btn-buscar:hover{background:var(--quote-bg)}

  select.lang-select{
    padding:7px 10px; border:1px solid var(--btn-border);
    background:var(--btn-bg); color:var(--fg); border-radius:6px;
    font-family:inherit; font-size:.78em;
  }

  /* ═══ Paneles ═══ */
  .panel{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:100; display:none; padding:20px;
    overflow-y:auto;
  }
  .panel.open{display:flex}
  .panel-inner{
    background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:12px;
    max-width:1200px; width:100%;
    max-height:calc(100vh - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative; margin:auto;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .panel-header{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px;
    padding:18px 24px 12px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .panel-header h2{margin:0; font-size:1em; letter-spacing:.03em}
  .panel-close{
    background:transparent; border:1px solid var(--btn-border);
    padding:4px 10px; font-size:1em; line-height:1; border-radius:6px;
    flex-shrink:0;
  }
  .panel-body{
    padding:14px 24px 20px;
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .panel-body h3{
    margin:16px 0 6px;
    font-size:.72em; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
    border-top:1px solid var(--border); padding-top:12px;
  }
  .panel-body h3:first-of-type{border-top:none; padding-top:0; margin-top:0}
  .panel-acciones{
    display:flex; justify-content:flex-end; gap:8px;
    flex-wrap:wrap;
    padding:12px 24px 18px;
    border-top:1px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
  }

  .opt-row{
    display:flex; align-items:center; gap:14px;
    padding:8px 0; border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .opt-row:first-of-type{border-top:none}
  .opt-label{
    color:var(--muted); font-size:.65em; letter-spacing:.05em;
    text-transform:uppercase; min-width:110px;
  }
  .opt-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .opt-val{
    font-weight:bold; min-width:44px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em;
  }

  .list-grupos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:4px;
    max-height:260px; overflow-y:auto;
    padding:8px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .list-modos{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
  }
  .modo-fila{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
    font-size:.78em;
  }
  .modo-fila:last-child{border-bottom:none}
  .modo-fila.activo{background:var(--preset-bg);}
  .modo-fila .modo-nombre{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .modo-fila .modo-acciones{display:flex; gap:4px; flex-shrink:0;}
  .modo-fila .modo-acciones button{
    padding:2px 8px; font-size:.85em;
    background:transparent; border:1px solid var(--border);
    color:var(--muted); border-radius:6px; cursor:pointer;
    font-family:inherit;
  }
  .modo-fila .modo-acciones button:hover{
    color:var(--accent); border-color:var(--accent);
  }
  .modo-fila .modo-acciones button.danger:hover{
    color:var(--block); border-color:var(--block);
  }
  .ctrl-override{
    display:grid; grid-template-columns:1fr 40px 40px; gap:6px;
    margin-bottom:8px;
  }
  .ctrl-override input{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .ctrl-override button{
    padding:0; font-size:.9em; font-weight:700;
    border:1px solid var(--border); border-radius:6px;
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .ctrl-override button:hover{ color:var(--accent); border-color:var(--accent); }
  .ctrl-override button.ignorar:hover{ color:var(--block); border-color:var(--block); }
  .ov-list{
    display:flex; flex-wrap:wrap; gap:4px;
    min-height:24px;
  }
  .ov-item{
    display:inline-flex; align-items:center; gap:6px;
    padding:2px 4px 2px 10px;
    border-radius:12px; font-size:.72em;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .ov-item.first{ background:var(--preset-bg); color:var(--preset); border:1px solid var(--preset); }
  .ov-item.ignore{ background:var(--block-bg); color:var(--block); border:1px solid var(--block); }
  .ov-item button{
    background:transparent; border:none; cursor:pointer;
    color:inherit; padding:0 6px; font-size:1.1em; line-height:1;
    border-radius:8px;
  }
  .ov-item button:hover{ background:rgba(0,0,0,.08); }
  .grupo-item{
    display:flex; align-items:center; gap:8px;
    font-size:.75em; cursor:pointer;
    padding:5px 8px; border-radius:4px;
  }
  .grupo-item:hover{background:var(--quote-bg)}
  .grupo-item input{accent-color:var(--accent); width:1.1em; height:1.1em}
  .grupo-item .flag{
    font-size:.85em; color:var(--accent); opacity:.7;
    margin-left:auto; padding-left:6px;
  }
/* ── Cabeceras de super-grupo (lista de grupos) ── */
.grupo-cat-header{
  grid-column: 1 / -1;
  padding: 8px 8px 4px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.grupo-cat-header:first-child{ border-top: none; margin-top: 0; }
.grupo-cat-toggle-wrap{
  display: flex; align-items: center; gap: 8px;
  font-size: .78em; color: var(--muted);
  cursor: pointer; user-select: none;
}
.grupo-cat-toggle-wrap input{ accent-color: var(--accent); }
.grupo-cat-toggle-wrap strong{ color: var(--fg); }
.grupo-cat-count{
  background: var(--quote-bg);
  border: 1px solid var(--border);
  padding: 0 6px;
  border-radius: 8px;
  font-size: .85em;
  color: var(--muted);
}
  .ctrl-medios{
    display:grid; grid-template-columns:1fr auto; gap:8px;
    margin-bottom:8px;
  }
  .ctrl-medios input,
  .ctrl-medios select{
    font-size:.78em; padding:8px 10px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--fg); font-family:inherit;
  }
  .filtro-medio-add{
    display: flex;
    align-items: center;
    gap: 8px;
    margin: -2px 0 8px;
    padding: 8px 10px;
    background: var(--quote-bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: .78em;
  }
  .filtro-medio-add-label{
    flex: 1;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filtro-medio-add-label code{
    color: var(--fg);
    font-weight: 600;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .filtro-medio-add-btn{
    padding: 4px 12px;
    font-size: .9em;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    background: transparent;
    white-space: nowrap;
  }
  .filtro-medio-add-btn.force{
    border: 1px solid var(--preset);
    color: var(--preset);
  }
  .filtro-medio-add-btn.force:hover{ background: var(--preset-bg); }
  .filtro-medio-add-btn.ignore{
    border: 1px solid var(--block);
    color: var(--block);
  }
  .filtro-medio-add-btn.ignore:hover{ background: var(--block-bg); }
  .list-medios{
    border:1px solid var(--border); border-radius:6px;
    background:var(--bg);
    max-height:420px; overflow-y:auto;
  }
  .medio-fila{
    display:grid;
    grid-template-columns:34px 34px minmax(140px,1.2fr) 1.6fr 1.4fr;
    gap:8px; align-items:center;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:.72em;
  }
  .medio-fila:last-child{border-bottom:none}
  .medio-fila.estado-incluir{background:var(--preset-bg)}
  .medio-fila.estado-ignorar{background:var(--block-bg)}
  .medio-fila .celda{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .medio-fila .celda-grupo{color:var(--muted); font-size:.9em}
  .medio-fila.no-config .celda-dominio{opacity:.75}
/* ── Cabeceras de super-grupo (lista de medios) ── */
.medio-cat-header{
  padding: 10px 10px 4px;
  font-size: .68em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  background: var(--quote-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}
  .known-dot{
    display:inline-block;
    width:6px; height:6px; border-radius:50%;
    background:var(--save);
    margin-right:6px;
    vertical-align:middle;
    flex-shrink:0;
  }

  .chk{display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none}
  .chk input{display:none}
  .chk span{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--btn-border);
    font-size:.9em; font-weight:700;
    background:transparent; color:var(--muted);
    transition:all .1s;
  }
  .chk:hover span{border-color:var(--accent)}
  .chk.incluir input:checked + span{
    background:var(--preset); border-color:var(--preset); color:#fff;
  }
  .chk.ignorar input:checked + span{
    background:var(--block); border-color:var(--block); color:#fff;
  }

  textarea.preset-texto{
    width:100%; min-height:180px; padding:12px;
    border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg);
    font-family:var(--ff); font-size:.82em;
    line-height:1.6; resize:vertical;
  }

  .backup-box{
    background:var(--quote-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:.75em;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:space-between;
  }
  .backup-box .msg{color:var(--muted); flex:1; min-width:180px}
  .backup-box .acciones{display:flex; gap:8px; flex-wrap:wrap}

  /* ═══ Filtros ═══ */
.filtros-wrap{
  position: sticky;
  top: var(--header-h, 130px);
  background: var(--bg);
  z-index: 9;
  padding: 6px 0 0;
}
.filtros-row{
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding-bottom: 10px;
}
.filtros-panel{
  padding-bottom: 10px;
  animation: filtros-in .15s ease-out;
}
.filtros-panel[hidden]{ display: none; }
@keyframes filtros-in{
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.filtros{
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr;
  gap: 8px;
}
.filtros select{
  font-size: .78em;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  min-width: 0;
}
.filtros input[type="date"]{
  font-size: .78em;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  min-width: 0;
}
/* ═══ Prensa externa en el panel ═══ */
.filtros-sep{
  height: 1px;
  background: var(--border);
  margin: 10px 0 8px;
}
.filtros-prensa{
  font-size: .78em;
}
.chk-prensa{
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  color: var(--muted);
  padding: 2px 0;
}
.chk-prensa input{
  accent-color: var(--save);
  width: 1.1em;
  height: 1.1em;
  margin: 0;
  cursor: pointer;
}
.chk-prensa input:checked + span{
  color: var(--fg);
  font-weight: 600;
}
.cfg-toggle{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--quote-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  font-size: .78em;
  margin-bottom: 8px;
}
.cfg-toggle input{
  accent-color: var(--save);
  width: 1.1em;

    font-size: .74em;
    padding: 6px 10px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  header .header-actions .lang-select{
    font-size: .74em;
    padding: 6px 8px;
    flex-shrink: 0;
  }
}
@media (max-width: 820px){
  /* En móvil el grupo derecho ya no se empuja a la derecha:
     si cae a una fila nueva, se alinea a la izquierda como el resto */
  header .header-actions-right{
    margin-left: 0;
  }
  header .header-actions-left .btn-preset{
    max-width: none;   /* en móvil no truncamos: hay ancho de sobra */
  }
}
  @media (max-width:900px){
.filtros-row{ position: static; }
.filtros{ grid-template-columns: 1fr 1fr; }
    .medio-fila{grid-template-columns:34px 34px 1fr 1.2fr}
    .medio-fila .celda-grupo{display:none}
    .opt-row{gap:8px}
    .opt-label{min-width:100%}
    .panel-inner{max-width:none}
  }
  @media (max-width:560px){
    .filtros{ grid-template-columns: 1fr; }
    .medio-fila{grid-template-columns:34px 34px 1fr}
    .medio-fila .celda-nombre{display:none}
    .panel-header{padding:14px 16px 10px}
    .panel-body{padding:12px 16px 16px}
    .panel-acciones{padding:10px 16px 14px}
    .rep-acciones{flex-direction:column}
    .rep-acciones .grupo{width:100%}
    .rep-acciones button{flex:1}
    header .meta{
      justify-content: flex-start;
      gap: 6px;
    }
  }

  .btn-dup-inline{
    padding:1px 7px;
    font-size:.62em;
    line-height:1.25;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    font-weight:500;
    opacity:.65;
    letter-spacing:.01em;
    transition:opacity .15s, background .15s, color .15s, border-color .15s;
  }
  .btn-dup-inline:hover{
    opacity:1;
    background:var(--quote-bg);
    color:var(--accent);
    border-color:var(--accent);
  }
  .btn-dup-inline.active{
    background:var(--save);
    color:#fff;
    border-color:var(--save);
    opacity:1;
    font-weight:600;
  }
  .btn-prensa{
    padding: 6px 12px;
    font-size: .74em;
    line-height: 1.3;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: .01em;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn-prensa:hover{
    color: var(--accent);
    border-color: var(--accent);
  }
  .btn-prensa.active{
    background: var(--save);
    color: #fff;
    border-color: var(--save);
  }
  .btn-prensa.cargando{
    opacity: .65;
    cursor: wait;
  }
  .btn-prensa.auto-activada{
    animation: prensa-pulse .8s ease-out;
  }
  @keyframes prensa-pulse {
    0%   { box-shadow: 0 0 0 0 var(--save); }
    70%  { box-shadow: 0 0 0 6px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  @media (max-width: 560px){
    .btn-prensa span { font-size: .95em; }
    .btn-prensa { padding: 6px 8px; }
  }
  .view-settings-wrap{
    position: relative;
    display: inline-flex;
  }
  .btn-view-settings{
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-view-settings .vs-count{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--save);
    color: #fff;
    font-size: .85em;
    font-weight: 700;
    line-height: 1;
  }
  .btn-view-settings .vs-count[data-count="0"]{
    display: none;
  }

  .view-settings-menu{
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 250px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 8px;
    z-index: 60;
  }
  .vs-caret{
    display: inline-block;
    font-size: .9em;
    line-height: 1;
    transition: transform .18s ease;
    transform-origin: 50% 45%;
  }
  .btn-view-settings[aria-expanded="true"] .vs-caret{
    transform: rotate(180deg);
  }
  .vs-group{ padding: 4px 6px; }
  .vs-title{
    font-size: .62em;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .vs-item,
  .vs-radio{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: .78em;
    cursor: pointer;
    user-select: none;
    line-height: 1.3;
  }
  .vs-item:hover,
  .vs-radio:hover{ background: var(--quote-bg); }
  .vs-item input,
  .vs-radio input{
    accent-color: var(--save);
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
    margin: 0;
  }
  .vs-radio span{ flex: 1; }
  .vs-radio small{
    display: block;
    font-size: .85em;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }
  .vs-sep{
    height: 1px;
    background: var(--border);
    margin: 6px 4px;
  }
  .vs-reset{
    width: 100%;
    padding: 6px 10px;
    font-size: .74em;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .vs-reset:hover{
    color: var(--accent);
    border-color: var(--accent);
  }
  @media (max-width: 560px){
    .view-settings-menu{
      right: auto;
      left: 0;
      min-width: 220px;
    }
  }
  .dups-details{
    margin-top:8px;
    font-size:.72em;
  }
  .dups-details summary{
    cursor:pointer;
    color:var(--save);
    font-weight:600;
    padding:3px 8px;
    display:inline-block;
    border:1px solid var(--save);
    border-radius:10px;
    background:var(--save-bg);
    list-style:none;
    user-select:none;
  }
  .dups-details summary::-webkit-details-marker{display:none}
  .dups-details summary::before{
    content:'▸ ';
    display:inline-block;
    transition:transform .15s;
  }
  .dups-details[open] summary::before{content:'▾ '}
  .dups-details summary:hover{filter:brightness(.95)}

  .dups-list{
    margin-top:6px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--quote-bg);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .dups-list .dup-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.92em;
    color:var(--muted);
  }
  .dups-list .dup-item .dup-medio{
    font-weight:600;
    color:var(--fg);
  }
  .dups-list .dup-item a{
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
    margin-left:auto;
  }
  .dups-list .dup-item a:hover{text-decoration:underline}
  /* ═══ Pestañas del panel de configuración ═══ */
  .cfg-tabs{
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    flex-shrink: 0;
    background: var(--bg);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cfg-tabs::-webkit-scrollbar{ display: none; }
  .cfg-tab{
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 10px 14px;
    font-size: .82em;
    font-weight: 600;
    font-family: inherit;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .cfg-tab:hover{ color: var(--fg); filter: none; }
  .cfg-tab.active{
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: transparent;
  }
  .cfg-tabpanel[hidden]{ display: none; }
  @media (max-width: 560px){
    .cfg-tabs{ padding: 0 16px; }
    .cfg-tab{ padding: 10px 10px; font-size: .78em; }
  }

  /* ═══ Destino inline (➕ / 🚫 sin modo activo) ═══ */
  .destino-inline{
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--quote-bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: .72em;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .destino-inline[hidden]{ display: none; }
  .destino-inline .destino-lbl{
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 600;
    margin-right: 4px;
  }
  .destino-inline .destino-btn{
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: 1em;
    line-height: 1.3;
  }
  .destino-inline .destino-btn:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
  .destino-inline .destino-btn.activo{
    background: var(--preset-bg);
    border-color: var(--preset);
    color: var(--preset);
    font-weight: 600;
  }
  .destino-inline .destino-btn.nuevo{
    border-style: dashed;
    color: var(--save);
  }
  .destino-inline .destino-btn.nuevo:hover{
    border-color: var(--save);
    background: var(--save-bg);
  }






</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1 id="h-title">Voceiro</h1>
    <div class="header-actions header-actions-left">
      <span class="preset-wrap">
        <button id="btn-preset" class="btn-preset" type="button"
                aria-expanded="false" aria-haspopup="true"></button>
        <div id="preset-menu" class="preset-menu" style="display:none"></div>
      </span>
      <button id="btn-pendientes" class="btn-pendientes" type="button"></button>
    </div>
    <div class="header-actions header-actions-right">
      <button id="btn-config" type="button"></button>
      <button id="btn-buscar" class="btn-buscar" type="button"></button>
      <button id="btn-acces" type="button"></button>
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
    </div>
  </div>
  <p class="meta">
    <span class="meta-text">
      <span id="meta-prefix"></span>
      <span id="fecha">06/10/2026 15:21</span>
      <span>·</span>
      <span id="contador"></span>
    </span>
    <span class="view-settings-wrap">
      <button id="btn-view-settings" class="btn-dup-inline btn-view-settings" type="button"
              aria-expanded="false" aria-haspopup="true">
        <span id="vs-label">⚙ Vista</span>
        <span id="vs-count" class="vs-count" data-count="0">0</span>
        <span class="vs-caret">▾</span>
      </button>
      <div id="view-settings-menu" class="view-settings-menu" style="display:none">
        <div class="vs-group">
          <div class="vs-title" id="vs-title-dup"></div>
          <label class="vs-item">
            <input type="checkbox" id="vs-dup">
            <span id="vs-dup-label"></span>
          </label>
        </div>
        <div class="vs-sep"></div>
        <div class="vs-group">
          <div class="vs-title" id="vs-title-hide"></div>
          <label class="vs-radio"><input type="radio" name="vs-hide" value="off">   <span id="vs-hide-off"></span></label>
          <label class="vs-radio"><input type="radio" name="vs-hide" value="read">  <span id="vs-hide-read"></span></label>
          <label class="vs-radio"><input type="radio" name="vs-hide" value="viewed"><span id="vs-hide-viewed"></span></label>
          <label class="vs-radio"><input type="radio" name="vs-hide" value="both">  <span id="vs-hide-both"></span></label>
        </div>
        <div class="vs-sep"></div>
        <button class="vs-reset" id="vs-reset" type="button"></button>
      </div>
    </span>
  </p>
</header>
<!-- CONFIG -->
<section id="panel-config" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="cfg-title"></h2>
      <button class="panel-close" type="button" data-close="panel-config">✕</button>
    </div>

    <div class="cfg-tabs" role="tablist">
      <button class="cfg-tab active" id="tab-feed"     type="button" role="tab" data-tab="feed"     aria-selected="true"></button>
      <button class="cfg-tab"        id="tab-medios"   type="button" role="tab" data-tab="medios"   aria-selected="false"></button>
      <button class="cfg-tab"        id="tab-avanzado" type="button" role="tab" data-tab="avanzado" aria-selected="false"></button>
    </div>

    <div class="panel-body">
      <div id="sync-banner" class="sync-banner" style="display:none">
        <span class="sync-dot"></span>
        <span id="sync-banner-text"></span>
      </div>

      <!-- ═══════════ TAB: FEED ═══════════ -->
      <div class="cfg-tabpanel" data-panel="feed">

        <h3 id="cfg-modos"></h3>
        <p id="cfg-modos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <div id="lista-modos" class="list-modos"></div>
        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
          <button id="btn-nuevo-modo" type="button" style="font-size:.75em;">+ <span id="btn-nuevo-modo-lbl"></span></button>
        </div>



        <h3 id="cfg-palabras"></h3>
        <p id="cfg-palabras-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <textarea id="preset-palabras" class="preset-texto"></textarea>

        <h3 id="cfg-feed"></h3>
        <p id="cfg-feed-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <label class="cfg-toggle">
          <input type="checkbox" id="cfg-recordar-filtros">
          <span class="cfg-toggle-txt">
            <span class="cfg-toggle-title" id="cfg-recordar-filtros-lbl"></span>
            <span class="cfg-toggle-hint"  id="cfg-recordar-filtros-hint"></span>
          </span>
        </label>




        <label class="cfg-toggle">
          <input type="checkbox" id="cfg-preset-busqueda">
          <span class="cfg-toggle-txt">
            <span class="cfg-toggle-title" id="cfg-preset-busqueda-lbl"></span>
            <span class="cfg-toggle-hint"  id="cfg-preset-busqueda-hint"></span>
          </span>
        </label>

        <h3 id="cfg-dias"></h3>
        <p id="cfg-dias-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <div class="opt-group" data-dias data-grupo="dias">
          <button type="button" data-val="1"></button>
          <button type="button" data-val="3"></button>
          <button type="button" data-val="7"></button>
          <button type="button" data-val="20"></button>
          <button type="button" data-val="30"></button>
        </div>
        <p id="cfg-dias-aviso" style="font-size:.68em; color:var(--muted); margin:6px 0 8px; display:none;"></p>

        <div class="filtros-prensa" style="margin-top:10px;">
          <label class="chk-prensa">
            <input type="checkbox" id="prensa-panel-toggle">
            <span id="prensa-panel-label">🌐 Prensa externa</span>
          </label>

          <div class="filtros-prensa-selects" id="prensa-selects" hidden>
            <label class="fp-fuentes">
              <span id="prensa-fuentes-label">Fuentes</span>
              <div class="fp-chks">
                <label class="fp-chk">
                  <input type="checkbox" id="prensa-f-gnews" checked>
                  <span>Google News</span>
                </label>
                <label class="fp-chk">
                  <input type="checkbox" id="prensa-f-freenews" checked>
                  <span>FreeNews</span>
                </label>
              </div>
            </label>

            <label class="fp-lang">
              <span id="prensa-lang-label">Idioma</span>
              <select id="prensa-lang"></select>
            </label>

            <label class="fp-region">
              <span id="prensa-region-label">País</span>
              <select id="prensa-region"></select>
            </label>

            <button type="button" id="prensa-reset" class="prensa-reset"
                    title="Restablecer prensa">↺</button>
          </div>
        </div>

      </div>

      <!-- ═══════════ TAB: MEDIOS ═══════════ -->
      <div class="cfg-tabpanel" data-panel="medios" hidden>

        <div id="modo-overrides-wrap">
          <p id="modo-overrides-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
          <div id="ov-list" class="ov-list"></div>
          <details id="ov-pegar-wrap" style="margin-top:8px;">
            <summary style="cursor:pointer; color:var(--save); font-size:.75em; font-weight:600;"></summary>
            <textarea id="ov-pegar" class="preset-texto" style="min-height:80px; font-family:ui-monospace,monospace; font-size:.78em;" placeholder="+ dominio.com&#10;- otro.com"></textarea>
            <div style="margin-top:6px; display:flex; gap:8px; justify-content:flex-end;">
              <button id="ov-pegar-aplicar" type="button" class="primary" style="font-size:.75em;"></button>
            </div>
          </details>
        </div>

        <h3 id="cfg-medios"></h3>
        <p id="cfg-medios-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <p id="cfg-medios-legend" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <div class="ctrl-medios">
          <input type="search" id="filtro-medio" autocomplete="off">
          <select id="filtro-grupo-medio"><option value=""></option></select>
        </div>
        <div id="filtro-medio-add" class="filtro-medio-add" hidden>
          <span class="filtro-medio-add-label" id="filtro-medio-add-label"></span>
          <button id="ov-add-first"  type="button" class="filtro-medio-add-btn force"></button>
          <button id="ov-add-ignore" type="button" class="filtro-medio-add-btn ignore"></button>
        </div>
        <div id="lista-medios" class="list-medios"></div>
        <p id="resumen-medios" style="font-size:.68em; color:var(--muted); margin:6px 0 0;"></p>

        <h3 id="cfg-grupos"></h3>
        <p id="cfg-grupos-hint" style="font-size:.68em; color:var(--muted); margin:0 0 8px;"></p>
        <div id="lista-grupos" class="list-grupos"></div>

      </div>

      <!-- ═══════════ TAB: AVANZADO ═══════════ -->
      <div class="cfg-tabpanel" data-panel="avanzado" hidden>

        <h3 id="cfg-backup"></h3>
        <div class="backup-box">
          <span class="msg" id="cfg-backup-msg"></span>
          <div class="acciones">
            <button id="btn-export" type="button"></button>
            <button id="btn-import" type="button"></button>
          </div>
        </div>

        <h3 id="cfg-help-lbl"></h3>
        <div class="backup-box">
          <span class="msg" id="cfg-help-msg"></span>
          <div class="acciones">
            <button id="btn-report-generic" type="button">🐞 <span id="cfg-help-btn"></span></button>
          </div>
        </div>

      </div>
    </div>

    <div class="panel-acciones">
      <button id="preset-reset" type="button"></button>
      <button id="preset-cancelar" type="button"></button>
      <button id="preset-guardar" type="button" class="primary"></button>
    </div>
  </div>
</section>

<!-- ACCESIBILIDAD -->
<section id="panel-acces" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="ac-title"></h2>
      <button class="panel-close" type="button" data-close="panel-acces">✕</button>
    </div>
    <div class="panel-body">
      <div class="opt-row">
        <span class="opt-label" id="ac-tema"></span>
        <div class="opt-group" data-grupo="tema">
          <button data-val="light"></button>
          <button data-val="sepia"></button>
          <button data-val="dark"></button>
          <button data-val="contrast"></button>
        </div>
      </div>

      <div class="opt-row">
        <span class="opt-label" id="ac-fuente"></span>
        <div class="opt-group" data-grupo="fuente">
          <button data-val="serif"></button>
          <button data-val="sans"></button>
          <button data-val="dyslexic"></button>
        </div>
      </div>

      <div class="opt-row">
        <span class="opt-label" id="ac-tamano"></span>
        <div class="opt-group">
          <button id="fs-menos">A−</button>
          <span class="opt-val" id="fs-val">18</span>
          <button id="fs-mas">A+</button>
        </div>
      </div>

      <div class="opt-row">
        <span class="opt-label" id="ac-ancho"></span>
        <div class="opt-group">
          <button id="w-menos">−</button>
          <span class="opt-val" id="w-val">1100</span>
          <button id="w-mas">+</button>
        </div>
      </div>

      <div class="opt-row">
        <span class="opt-label" id="ac-extra"></span>
        <div class="opt-group" data-grupo="extra">
          <button data-val="just"></button>
          <button data-val="bionic"></button>
          <button data-val="focus"></button>
        </div>
      </div>
    </div>
    <div class="panel-acciones">
      <button id="acces-reset" type="button"></button>
    </div>
  </div>
</section>

<!-- PENDIENTES -->
<section id="panel-pendientes" class="panel" role="dialog" aria-modal="true">
  <div class="panel-inner">

const DIAS_MEMORIA_DEF = 3;
const DIAS_MEMORIA_VALIDOS = [1, 3, 7, 20, 30];
const DIAS_MEMORIA_MAX_SCOPE = 30;
const DIAS_MEMORIA_MAX_ALL = 3;

function cargarDiasMemoria() {
  try {
    const raw = localStorage.getItem(DIAS_MEMORIA_KEY);
    const n = parseInt(raw, 10);
    if (DIAS_MEMORIA_VALIDOS.includes(n)) return n;
  } catch(e){}
  return DIAS_MEMORIA_DEF;
}

let DIAS_MEMORIA = cargarDiasMemoria();

function diasEfectivos(scope) {
  const max = (scope.tipo === 'all') ? DIAS_MEMORIA_MAX_ALL : DIAS_MEMORIA_MAX_SCOPE;
  return Math.min(DIAS_MEMORIA, max);
}

function t(key, vars){
  const lang = (ACCES && ACCES.lang) || 'es';
  const dict = I18N[lang] || I18N.es;
  let s = dict[key] != null ? dict[key] : (I18N.es[key] != null ? I18N.es[key] : key);
  if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  return s;
}

const $ = sel => document.querySelector(sel);


function normalizeUrlForMatch(u){
  try {
    const url = new URL(u, location.href);
    url.hash = '';
    url.hostname = url.hostname.toLowerCase().replace(/^www\./, '');
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content',
     'fbclid','gclid','mc_cid','mc_eid','igshid','_ga','_gl','ref','referrer']
      .forEach(k => url.searchParams.delete(k));
    if (url.pathname.length > 1 && url.pathname.endsWith('/')){
      url.pathname = url.pathname.slice(0, -1);
    }
    return url.href;
  } catch(e){ return String(u || ''); }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function limpiarCdata(s){
  if (!s) return '';
  let x = String(s).trim();
  let changed = true;
  while (changed){
    changed = false;
    if (x.startsWith('<![CDATA[')){ x = x.slice(9); changed = true; }
    if (x.endsWith(']]>')){ x = x.slice(0, -3); changed = true; }
    x = x.trim();
  }
  return x;
}
function _escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function parseLista(txt){
  return txt.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
function toast(msg, ms){
  ms = ms || 2400;
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, ms);
}
function debounce(fn, ms){
  let t;
  const wrapped = function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(() => { t = null; fn.apply(ctx, args); }, ms);
  };
  wrapped.cancel = () => { clearTimeout(t); t = null; };
  return wrapped;
}

const HORIZONTE_FUTURO_MS = 6 * 60 * 60 * 1000;

let ABS_FMT = null;
let ABS_FMT_LANG = null;
const ABS_CACHE = new Map();

function getAbsFmt(){
  if (ABS_FMT_LANG !== ACCES.lang){
    ABS_FMT = new Intl.DateTimeFormat(ACCES.lang, {
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    ABS_FMT_LANG = ACCES.lang;
    ABS_CACHE.clear();
  }
  return ABS_FMT;
}

  
function parseFecha(s){
  if (!s) return NaN;
  const str = String(s).trim();
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m){
    const [, d, mo, y, h = 0, mi = 0, se = 0] = m;
    const t = new Date(+y, +mo - 1, +d, +h, +mi, +se).getTime();
    return isNaN(t) ? NaN : t;
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(str)){
    const t = Date.parse(str);
    if (!isNaN(t)) return t;
  }
  const t = Date.parse(str);
  return !isNaN(t) ? t : NaN;
}

function formatearFecha(ts){
  if (isNaN(ts)) return '';
  let abs = ABS_CACHE.get(ts);
  if (abs === undefined){
    abs = getAbsFmt().format(ts);
    ABS_CACHE.set(ts, abs);
  }
  const diff = Date.now() - ts;
  if (diff < 0) return abs + ' · ' + t('fechaProgramado');
  if (diff >= 7 * 86400000) return abs;
  const min = (diff / 60000) | 0;
  const hr  = (diff / 3600000) | 0;
  const dia = (diff / 86400000) | 0;
  let rel;
  if (min < 1) rel = t('fechaAhora');
  else if (min < 60) rel = t('fechaHaceMin', { n: min });
  else if (hr < 24) rel = t('fechaHaceH', { n: hr });
  else rel = t('fechaHaceD', { n: dia });
  return abs + ' · ' + rel;
}

function cargarAcces(){
  try{
    const raw = localStorage.getItem('voceiro-acces-v2');
    const o = raw ? { ...ACCES_DEF, ...JSON.parse(raw) } : { ...ACCES_DEF };
    if (!I18N[o.lang]) o.lang = 'es';
    return o;
  }catch(e){ return { ...ACCES_DEF }; }
}
function guardarAcces(){
  try{ localStorage.setItem('voceiro-acces-v2', JSON.stringify(ACCES)); }catch(e){}
}
function aplicarAcces(){
  const h = document.documentElement;
  h.lang = ACCES.lang;
  h.dataset.theme  = ACCES.tema;
  h.dataset.font   = ACCES.fuente;
  h.dataset.just   = ACCES.just ? '1' : '0';
  h.dataset.bionic = ACCES.bionic ? '1' : '0';
  h.dataset.focus  = ACCES.focus ? '1' : '0';
  h.style.setProperty('--fs', ACCES.fs + 'px');
  h.style.setProperty('--w', ACCES.width + 'px');

  document.querySelectorAll('.opt-group').forEach(g => {
    const clave = g.dataset.grupo;
    if (!clave) return;
    g.querySelectorAll('button').forEach(b => {
      if (clave === 'extra') b.classList.toggle('active', !!ACCES[b.dataset.val]);
      else                   b.classList.toggle('active', b.dataset.val === String(ACCES[clave]));
    });
  });

  $('#fs-val').textContent = ACCES.fs;
  $('#w-val').textContent  = ACCES.width;

  if (ACCES.focus) setTimeout(updateFocus, 30);
}
function ajustarFs(d){
  ACCES.fs = Math.max(LIM.fs.min, Math.min(LIM.fs.max, ACCES.fs + d * LIM.fs.step));
  guardarAcces(); aplicarAcces();
}
function ajustarWidth(d){
  ACCES.width = Math.max(LIM.width.min, Math.min(LIM.width.max, ACCES.width + d * LIM.width.step));
  guardarAcces(); aplicarAcces();
}

function normalizarPreset(p){
  return {
    id:        String(p.id || 'general'),
    nombre:    String(p.nombre || p.id || 'General'),
    grupos:    Array.isArray(p.grupos)   ? p.grupos   : [],
    palabras:  Array.isArray(p.palabras) ? p.palabras : [],
    overrides: (p.overrides && typeof p.overrides === 'object' && !Array.isArray(p.overrides))
               ? p.overrides : {}
  };
}

function cargarPresets(){
  try{
    const raw = localStorage.getItem(PRESET_KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.lista) && p.lista.length){
        const lista = p.lista.map(normalizarPreset);
        const activo = (typeof p.activo === 'string' && lista.some(x => x.id === p.activo))
                       ? p.activo : lista[0].id;
        return { lista, activo };
      }
    }
  }catch(e){}
  // Sin datos previos → crear "General" vacío
  return {
    lista: [ structuredClone(PRESET_UNICO_DEF) ],
    activo: 'general'
  };
}

  if (idx >= 0){
    PRESETS.lista[idx] = { ...PRESETS.lista[idx], ...PRESET };
  }
  guardarPresets();
  actualizarBotonPreset();
}
function getOverride(domain){
  if (!PRESET || !PRESET.overrides) return '';
  return PRESET.overrides[domain] || '';
}

function setOverride(domain, value){
  if (!PRESET) return;
  if (!PRESET.overrides || typeof PRESET.overrides !== 'object') PRESET.overrides = {};
  if (!value){
    delete PRESET.overrides[domain];
  } else if (value === 'first' || value === 'ignore'){
    PRESET.overrides[domain] = value;
  }
  guardarPreset();
}

function aplicarPresetsDesdePlugin(d){
  if (!d || typeof d !== 'object') return false;
  if (!d.voceiro || typeof d.voceiro !== 'object') return false;
  const incoming = d.voceiro.presets;
  if (!Array.isArray(incoming) || !incoming.length) return false;

  const lista = incoming.map(normalizarPreset);
  const activoLocal = (PRESETS && PRESETS.activo) || 'general';
  const activoSigue = lista.some(p => p.id === activoLocal);
  const activoNuevo = activoSigue ? activoLocal : lista[0].id;

  PRESETS = { lista, activo: activoNuevo };
  PRESET = PRESETS.lista.find(p => p.id === activoNuevo);

  try{ localStorage.setItem(PRESET_KEY, JSON.stringify(PRESETS)); }catch(e){}
  try{ localStorage.setItem(PRESET_ID_KEY, activoNuevo); }catch(e){}

  recompilarPreset();
  actualizarBotonPreset();
  return true;
}

  );
}

let _destinoIdxAbierto = -1;

function cerrarDestinoInline(){
  if (_destinoIdxAbierto < 0) return;
  const el = document.querySelector('.destino-inline[data-idx="' + _destinoIdxAbierto + '"]');
  if (el){ el.hidden = true; el.innerHTML = ''; }
  _destinoIdxAbierto = -1;

function abrirDestinoInline(idx, accion){
  // Toggle: si ya estaba abierto en esta tarjeta, cerrar
  if (_destinoIdxAbierto === idx){
    cerrarDestinoInline();
    return;
  }
  cerrarDestinoInline();

  const cont = document.querySelector('.destino-inline[data-idx="' + idx + '"]');
  if (!cont) return;

  const activoId = PRESET_ACTIVO && PRESETS ? PRESETS.activo : null;

  let html = `<span class="destino-lbl">${
    escapeHtml(accion === 'first' ? t('destinoAnadirA') : t('destinoBloquearEn'))
  }</span>`;

  PRESETS.lista.forEach(p => {
    const activo = p.id === activoId;
    html += `<button type="button" class="destino-btn${activo ? ' activo' : ''}"
                    data-destino-id="${escapeHtml(p.id)}">${escapeHtml(p.nombre)}</button>`;
  });

  html += `<button type="button" class="destino-btn nuevo" data-destino-id="__nuevo">+ ${escapeHtml(t('destinoNuevoModo'))}</button>`;

  cont.innerHTML = html;
  cont.hidden = false;
  _destinoIdxAbierto = idx;

  cont.querySelectorAll('.destino-btn').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      const id = b.dataset.destinoId;
      const n = ULT_FILTRADAS[idx];
      if (!n) { cerrarDestinoInline(); return; }

      if (id === '__nuevo'){
        const nuevo = crearModoYDevolver();
        if (nuevo) aplicarOverrideEnModo(nuevo, accion, n.dominio, n.medio || n.dominio);
        cerrarDestinoInline();
        return;
      }
      const target = PRESETS.lista.find(p => p.id === id);
      if (target) aplicarOverrideEnModo(target, accion, n.dominio, n.medio || n.dominio);
      cerrarDestinoInline();
    });
  });
}

function aplicarOverrideEnModo(targetPreset, accion, dominio, medioNombre){
  if (!targetPreset) return;

  if (targetPreset === PRESET){
    // Ruta normal: reusa setOverride (persiste, refresca botón de preset)
    setOverride(dominio, accion);
  } else {
    if (!targetPreset.overrides || typeof targetPreset.overrides !== 'object'){
      targetPreset.overrides = {};
    }
    targetPreset.overrides[dominio] = accion;
    guardarPresets();
  }

  renderModosPanel();
  renderListaMedios();

  if (PRESET_ACTIVO && targetPreset === PRESET){
    aplicarFiltros();
    const ok = accion === 'first' ? t('destinoOkAnadido') : t('destinoOkBloqueado');
    toast(`${ok} · ${medioNombre}`, 2000);
  } else {
    const ok = accion === 'first' ? t('destinoOkAnadidoEn') : t('destinoOkBloqueadoEn');
    toast(`${ok} «${targetPreset.nombre}» · ${medioNombre}`, 2400);
  }
}

/* ═══════════════════════════════════════════════════════════════
   BIONIC
   ═══════════════════════════════════════════════════════════════ */
const BIONIC_CACHE = new Map();
const BIONIC_CACHE_MAX = 8000;

function bionicize(html){
  if (!ACCES.bionic) return html;
  const cached = BIONIC_CACHE.get(html);
  if (cached !== undefined) return cached;
  let result = html;
  try{
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    const root = doc.body.firstChild;
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => {
      const raw = tn.textContent;
      if (!raw || !/[\wÁÉÍÓÚÑáéíóúñ]/.test(raw)) return;
      const frag = doc.createDocumentFragment();
      const re = /([\wÁÉÍÓÚÑáéíóúñ]+)/g;
      let last = 0, m;
      while ((m = re.exec(raw)) !== null){
        if (m.index > last) frag.appendChild(doc.createTextNode(raw.slice(last, m.index)));
        const w = m[1];
        const half = Math.max(1, Math.ceil(w.length / 2));
        const b = doc.createElement('b');
        b.textContent = w.slice(0, half);
        frag.appendChild(b);
        frag.appendChild(doc.createTextNode(w.slice(half)));
        last = m.index + w.length;
      }
      if (last < raw.length) frag.appendChild(doc.createTextNode(raw.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    result = root.innerHTML;
  }catch(e){ result = html; }
  if (BIONIC_CACHE.size >= BIONIC_CACHE_MAX) BIONIC_CACHE.clear();
  BIONIC_CACHE.set(html, result);
  return result;
}

function updateFocus(){
  const items = document.querySelectorAll('.noticia');
  if (!ACCES.focus){
    items.forEach(el => el.classList.remove('foco-dim','foco-active'));
    return;
  }
  if (!items.length) return;
  const mid = window.innerHeight / 2;
  let best = null, bd = Infinity;
  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < bd){ bd = d; best = el; }
  });
  items.forEach(el => {
    el.classList.toggle('foco-dim', el !== best);
    el.classList.toggle('foco-active', el === best);
  });
}
window.addEventListener('scroll', () => {
  if (ACCES.focus) requestAnimationFrame(updateFocus);
}, { passive: true });




/* ═══════════════════════════════════════════════════════════════
   REGEX DE RESALTADO + IDIOMA
   ═══════════════════════════════════════════════════════════════ */
const ACCENT_MAP = {a:'aáàäâ', e:'eéèëê', i:'iíìïî', o:'oóòöô', u:'uúùüû', n:'nñ'};
function buildHighlightRegex(tokens){
  if (!tokens.length) return null;
  const patterns = tokens.map(tok => {
    let p = '';
    for (const c of tok){
      let hit = false;
      for (const k in ACCENT_MAP){
        if (ACCENT_MAP[k].includes(c)){ p += '[' + ACCENT_MAP[k] + ']'; hit = true; break; }
      }
      if (!hit) p += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }
    return p;
  });
  return new RegExp('(' + patterns.join('|') + ')', 'gi');
}

function resaltar(texto, rx, fallbackEsc){
  if (!rx) return fallbackEsc != null ? fallbackEsc : escapeHtml(texto || '');
  if (!texto) return '';
  let out = '', last = 0;
  const matches = texto.matchAll(rx);
  for (const mm of matches){
    out += escapeHtml(texto.slice(last, mm.index));
    out += '<mark>' + escapeHtml(mm[0]) + '</mark>';
    last = mm.index + mm[0].length;
  }
  out += escapeHtml(texto.slice(last));
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   BRIDGE CON EL LECTOR UNIVERSAL
   Protección contra sobreescritura: los cambios hechos en esta
   pestaña (ej. botón 🚫) se protegen durante TTL ms frente a
   los datos que devuelva el userscript.
   ═══════════════════════════════════════════════════════════════ */
const LEIDAS_KEY = 'voceiro-leidas-v1';
let LEIDAS_LOCAL = new Set();
try { LEIDAS_LOCAL = new Set(JSON.parse(localStorage.getItem(LEIDAS_KEY) || '[]')); } catch(e){}

function marcarLeidaLocal(url){
  const k = normalizeUrlForMatch(url);
  if (!k || LEIDAS_LOCAL.has(k)) return;
  LEIDAS_LOCAL.add(k);
  if (LEIDAS_LOCAL.size > 5000) LEIDAS_LOCAL = new Set([...LEIDAS_LOCAL].slice(-4000));
  try { localStorage.setItem(LEIDAS_KEY, JSON.stringify([...LEIDAS_LOCAL])); } catch(e){}
}

const VISTAS_KEY = 'voceiro-vistas-v1';
let VISTAS_LOCAL = new Set();
try { VISTAS_LOCAL = new Set(JSON.parse(localStorage.getItem(VISTAS_KEY) || '[]')); } catch(e){}

let VISTAS_DIRTY = false;
function marcarVistaLocal(url){
  const k = normalizeUrlForMatch(url);
  if (!k || VISTAS_LOCAL.has(k)) return;
  VISTAS_LOCAL.add(k);
  if (VISTAS_LOCAL.size > 10000) VISTAS_LOCAL = new Set([...VISTAS_LOCAL].slice(-8000));
  VISTAS_DIRTY = true;
}
const persistirVistas = debounce(() => {
  if (!VISTAS_DIRTY) return;

let USCRIPT_OK = false;
let USCRIPT_CHECKED = false;
let PENDIENTES_CACHE = [];
let PENDIENTES_URLS = new Set();
let PENDIENTES_MAP  = new Map();

const LOCAL_TOUCH = new Map();
const LOCAL_TOUCH_TTL = 10000;
const PEND_LOCAL_KEY = 'voceiro-pendientes-local-v1';
let PENDIENTES_LOCAL = (() => {
  try {
    const raw = localStorage.getItem(PEND_LOCAL_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
})();
function guardarPendientesLocal(){
  try { localStorage.setItem(PEND_LOCAL_KEY, JSON.stringify(PENDIENTES_LOCAL)); } catch(e){}
}

// El plugin ya no escribe directamente: guardamos su último snapshot
let PENDIENTES_PLUGIN = [];

function touchLocal(domain){
  LOCAL_TOUCH.set(domain, Date.now());
}
function isLocalTouched(domain){
  const ts = LOCAL_TOUCH.get(domain);
  if (!ts) return false;
  if (Date.now() - ts > LOCAL_TOUCH_TTL){
    LOCAL_TOUCH.delete(domain);
    return false;
  }
  return true;
}

function aplicarSitesDesdeUserscript(arr){
  const incoming = new Map();
  (arr || []).forEach(s => {
    if (!s || !s.domain) return;
    incoming.set(s.domain, {
      lang: s.lang || 'auto',
      type: s.type || '',
      tags: Array.isArray(s.tags) ? s.tags.slice() : []
    });
  });

  SITES = new Map();
  SITES_LIST = [];

  incoming.forEach((v, d) => {
    // Si el dominio fue tocado en esta pestaña hace poco (TTL),
    // damos prioridad a lo local. Si no, gana el userscript.
    if (isLocalTouched(d)){
      const local = window.__lastLocal.get(d);
      if (local){
        SITES.set(d, local);
        SITES_LIST.push({ domain: d, ...local });
        return;
      }
    }
    SITES.set(d, v);
    SITES_LIST.push({ domain: d, ...v });
  });

  // Reañadir los dominios que solo existen localmente
  // (creados aquí sin userscript, o con el plugin desconectado)
  window.__lastLocal.forEach((v, d) => {
    if (!SITES.has(d)){
      SITES.set(d, v);
      SITES_LIST.push({ domain: d, ...v });
    }
  });

  guardarSitesCache();
}

window.__lastLocal = new Map();

function actualizarSyncBanner(){

 function rebuildPendientes(){
  const winner = new Map();
  function consider(i, src){
    if (!i || !i.url) return;
    const k = normalizeUrlForMatch(i.url);
    const prev = winner.get(k);
    let gana;
    if (!prev)                          gana = true;
    else if (prev.read && !i.read)      gana = false;
    else if (!prev.read && i.read)      gana = true;
    else                                gana = (src === 'plugin');
    if (gana) winner.set(k, { ...i, _src: src });
  }
  PENDIENTES_LOCAL.forEach(i => consider(i, 'local'));
  PENDIENTES_PLUGIN.forEach(i => consider(i, 'plugin'));

  const items = [...winner.values()];
  PENDIENTES_CACHE = items;

  const map = new Map();
  items.forEach(i => {
    map.set(normalizeUrlForMatch(i.url), i);
    if (Array.isArray(i.aliasUrls)){
      i.aliasUrls.forEach(u => {
        if (!u) return;
        const k = normalizeUrlForMatch(u);
        const ex = map.get(k);
        if (!ex || (!ex.read && i.read)) map.set(k, i);
      });
    }
  });
  PENDIENTES_MAP  = map;
  PENDIENTES_URLS = new Set(map.keys());

  refrescarBotonesGuardar();
  actualizarBotonPendientes();
  if ($('#panel-pendientes').classList.contains('open')){
    renderPendientes(PENDIENTES_CACHE);
  }
}

function initUserScriptBridge(){
  document.addEventListener('voceiro-ready', () => {
    USCRIPT_OK = true; USCRIPT_CHECKED = true;
    actualizarBotonPendientes();
    actualizarSyncBanner();
    document.dispatchEvent(new CustomEvent('voceiro-get-config'));
    document.dispatchEvent(new CustomEvent('voceiro-later-list'));
  });

  document.addEventListener('voceiro-pong', () => {
    USCRIPT_OK = true; USCRIPT_CHECKED = true;
    actualizarBotonPendientes();
    actualizarSyncBanner();
  });

  document.addEventListener('voceiro-config-data', e => {
    const d = e.detail || {};
    aplicarSitesDesdeUserscript(d.sites);
    const aplicado = aplicarPresetsDesdePlugin(d);
    if (aplicado && typeof NOTICIAS !== 'undefined' && NOTICIAS.length){
      aplicarFiltros();
    }
    if ($('#panel-config').classList.contains('open')){
      renderListaMedios();
      escribirPanel(PRESET);
    }
  });

  document.addEventListener('voceiro-config-changed', e => {
    const d = e.detail || {};
    aplicarSitesDesdeUserscript(d.sites);
    const aplicado = aplicarPresetsDesdePlugin(d);
    if (aplicado && typeof NOTICIAS !== 'undefined' && NOTICIAS.length){
      aplicarFiltros();
    }
    if ($('#panel-config').classList.contains('open')){
      renderListaMedios();
      escribirPanel(PRESET);
    }
  });


  document.addEventListener('voceiro-later-list-data', e => {
    PENDIENTES_PLUGIN = (e.detail && e.detail.items) || [];
    rebuildPendientes();
  });
  document.addEventListener('voceiro-later-changed', e => {
    PENDIENTES_PLUGIN = (e.detail && e.detail.items) || [];
    rebuildPendientes();
  });



  document.addEventListener('voceiro-save-later-done', e => {
    const d = e.detail || {};
    if (!d.ok){ toast('No se pudo guardar', 2000); return; }
    toast(d.added ? t('savedToReader') : t('alreadyInReader'), 1800);
  });

  document.dispatchEvent(new CustomEvent('voceiro-ping'));

  setTimeout(() => {
    if (!USCRIPT_CHECKED){
      USCRIPT_CHECKED = true;
      actualizarBotonPendientes();
      actualizarSyncBanner();
    }
  }, 900);
}
function addLocalPendiente({ url, title, description, image }){
  if (!url) return false;
  const k = normalizeUrlForMatch(url);
  if (PENDIENTES_LOCAL.some(i => normalizeUrlForMatch(i.url) === k)) return false;
  let domain = '';
  try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch(e){}
  PENDIENTES_LOCAL.push({
    url, title: title || '', description: description || '', image: image || '',
    domain, date: Date.now(), read: false, readAt: null
  });
  guardarPendientesLocal();
  rebuildPendientes();
  return true;
}
function setLocalPendienteRead(url, read){
  const k = normalizeUrlForMatch(url);
  let changed = false;
  PENDIENTES_LOCAL.forEach(i => {
    if (normalizeUrlForMatch(i.url) === k){
      i.read = read;
      i.readAt = read ? new Date().toISOString() : null;
      changed = true;
    }
  });
  if (changed){ guardarPendientesLocal(); rebuildPendientes(); }
  return changed;
}
function removeLocalPendiente(url){
  const k = normalizeUrlForMatch(url);
  const n = PENDIENTES_LOCAL.length;
  PENDIENTES_LOCAL = PENDIENTES_LOCAL.filter(i => normalizeUrlForMatch(i.url) !== k);
  if (PENDIENTES_LOCAL.length !== n){ guardarPendientesLocal(); rebuildPendientes(); }
}
function desmarcarLeidaLocal(url){
  const k = normalizeUrlForMatch(url);
  if (!LEIDAS_LOCAL.has(k)) return;
  LEIDAS_LOCAL.delete(k);
  try { localStorage.setItem(LEIDAS_KEY, JSON.stringify([...LEIDAS_LOCAL])); } catch(e){}
}

function emitirUpdateSite(domain, patch){
  const prev = SITES.get(domain) || { lang: 'auto', type: '', tags: [] };
  const next = { ...prev, ...patch };
  SITES.set(domain, next);

  const idx = SITES_LIST.findIndex(s => s.domain === domain);
  if (idx >= 0) SITES_LIST[idx] = { domain, ...next };
  else SITES_LIST.push({ domain, ...next });

  window.__lastLocal.set(domain, next);
  touchLocal(domain);
  guardarSitesCache();

  if (USCRIPT_OK){
    document.dispatchEvent(new CustomEvent('voceiro-update-site', {
      detail: { domain, ...patch }
    }));
  }
}

function guardarParaLeerDespues(n){
  const url = n.enlace;
  const key = normalizeUrlForMatch(url);
  const item = PENDIENTES_MAP.get(key);
  const guardada = !!item;

  // Caso 1: no está → añadir
  if (!guardada){
    if (USCRIPT_OK){
      document.dispatchEvent(new CustomEvent('voceiro-save-later', {
        detail: { url, title: n.titular, description: n.grupo || '', image: '' }
      }));
    } else {
      addLocalPendiente({ url, title: n.titular, description: n.grupo || '' });
      toast(t('savedToReader'), 1800);
    }
    return;
  }

  // Caso 2: ya está → alternar leída/no leída
  const nuevaLeida = !item.read;

  if (USCRIPT_OK && item._src === 'plugin'){
    document.dispatchEvent(new CustomEvent('voceiro-mark-read', { detail: { url } }));
  }

  // Espejo local siempre (para que LEIDAS_LOCAL y pendientes locales queden coherentes)
  if (nuevaLeida) marcarLeidaLocal(url);
  else            desmarcarLeidaLocal(url);

  if (item._src === 'local' || !USCRIPT_OK){
    setLocalPendienteRead(url, nuevaLeida);
  }
}
function refrescarBotonesGuardar(){
  document.querySelectorAll('.btn-save-item').forEach(b => {
    const i = parseInt(b.dataset.idx, 10);
    const n = ULT_FILTRADAS[i];
    if (!n) return;
    const key = normalizeUrlForMatch(n.enlace);
    const guardada = PENDIENTES_URLS.has(key);
    const item = PENDIENTES_MAP.get(key);
    const leida = (guardada && item && item.read) || LEIDAS_LOCAL.has(key);

    if (leida){
      b.textContent = t('saveLabelRead');
      b.title = t('markUnread');
    } else if (guardada){
      b.textContent = t('saveLabelPending');
      b.title = t('markRead');
    } else {

      b.title = t('saveForLaterTitle');
    }
  });
}

  const cont = $('#pendientes-lista');
  if (!items || !items.length){
    const extra = USCRIPT_OK ? '' :
      `<div style="font-size:.72em;color:var(--muted);margin-top:12px;text-align:center">${escapeHtml(t('syncOfflineHint'))}</div>`;
    cont.innerHTML = `<div class="vacio">${escapeHtml(t('noPendientes'))}</div>${extra}`;
    return;
  }
  const noLeidas = items.filter(i => !i.read);
  const leidas   = items.filter(i => i.read);

  function fila(p, esLeida){
    const fecha = p.date ? new Date(p.date).toLocaleString(ACCES.lang) : '';
    return `
      <div class="pendiente-item" style="${esLeida ? 'opacity:.55' : ''}">
        <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" style="${esLeida ? 'text-decoration:line-through' : ''}">${escapeHtml(p.title || p.url)}</a>
        <div class="pendiente-meta">
          ${p.domain ? `<span>${escapeHtml(p.domain)}</span>` : ''}
          ${fecha ? `<span>· ${escapeHtml(fecha)}</span>` : ''}
          ${esLeida && p.readAt ? `<span>· ✓ ${escapeHtml(p.readAt.slice(0,10))}</span>` : ''}
        </div>
        <div class="pendiente-actions">
          <button class="btn-pend-toggle" data-url="${escapeHtml(p.url)}" title="${esLeida ? escapeHtml(t('markUnread')) : escapeHtml(t('markRead'))}">${esLeida ? '↺' : '✓'}</button>
          <button class="btn-pend-remove" data-url="${escapeHtml(p.url)}" title="${escapeHtml(t('deletePending'))}">✕</button>
        </div>
      </div>`;
  }

  let html = '';
  if (noLeidas.length){
    html += `<div style="font-size:.68em; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 6px;">${escapeHtml(t('readItemsNo'))} (${noLeidas.length})</div>`;
    html += noLeidas.map(p => fila(p, false)).join('');
  } else {
    html += `<div class="vacio">${escapeHtml(t('noPendientes'))}</div>`;
  }

  if (leidas.length){
    html += `<div style="font-size:.68em; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 6px;">${escapeHtml(t('readItems'))} (${leidas.length})</div>`;
    html += leidas.map(p => fila(p, true)).join('');
  }

  cont.innerHTML = html;

cont.querySelectorAll('.btn-pend-toggle').forEach(b => {
  b.onclick = () => {
    const url = b.dataset.url;
    const item = PENDIENTES_MAP.get(normalizeUrlForMatch(url));

    if (USCRIPT_OK && item && item._src === 'plugin'){
      document.dispatchEvent(new CustomEvent('voceiro-mark-read', { detail: { url } }));
    }
    if (nuevaLeida) marcarLeidaLocal(url);
    else            desmarcarLeidaLocal(url);

cont.querySelectorAll('.btn-pend-remove').forEach(b => {
  b.onclick = () => {

});

/**
 * Busca un grupo en el bloque dias[i].grupos del manifest.
 * Match robusto por normStrict: 'Galicia' == 'Regional · Galicia' == 'regional-galicia'.
 */
function _buscarGrupoEnDia(diaGrupos, nombreGrupo) {
  if (!diaGrupos) return null;
  const objetivo = normStrict(nombreGrupo);
  for (const [k, v] of Object.entries(diaGrupos)) {
    if (normStrict(k) === objetivo) return v;
  }
  return null;
}


// ─── Decidir qué capas necesita el estado actual ───
function capasRequeridas(parsed) {
  const set = new Set();

    // 1) Preset activo → sus grupos + overrides 'first'
  if (PRESET_ACTIVO && presetTieneReglas()) {
    (PRESET.grupos || []).forEach(g => set.add('grupo:' + normStrict(g)));
    Object.entries(PRESET.overrides || {}).forEach(([d, v]) => {
      if (v === 'first') set.add('dominio:' + normDomain(d));
    });
  }

  // 2) Filtros explícitos del usuario
  (parsed.grupos || []).forEach(g => set.add('grupo:' + g));
  (parsed.dominios || []).forEach(d => set.add('dominio:' + d));
  (parsed.medios || []).forEach(m => {
    const dom = MEDIOS_POR_NOMBRE.get(m);   // m ya viene normStrict
    if (dom) set.add('dominio:' + dom);
  });

  return set;
}

function necesitaTurso(parsed) {
  if (parsed.titulo.length) return true;
  if (parsed.tipos.length)  return true;
  if (parsed.tags.length)   return true;
  if (parsed.lang.length)   return true;
  if (parsed.desde || parsed.hasta) return true;

  // Grupos sin slice en manifest → Turso
  if ((parsed.grupos || []).some(g => !_grupoTieneSlice(g))) return true;

  // Dominios y medios: NO van a Turso. R2 cubre esto con paginación.
  return false;
}

function _grupoTieneSlice(nombreGrupo) {
  if (!_manifest || !_manifest.dias || !_manifest.dias.length) return false;
  const dia0 = _manifest.dias[0];
  return !!(dia0.grupos && _buscarGrupoEnDia(dia0.grupos, nombreGrupo));
}

function _dominioTieneSlice(dom) {
  if (!_manifest || !_manifest.dias || !_manifest.dias.length) return false;
  const dia0 = _manifest.dias[0];
  return !!(dia0.dominios && dia0.dominios[dom]);
}

// ─── Mergear items de una capa/base en NOTICIAS con dedup global ───
// Devuelve cuántos items NUEVOS se añadieron.
function _mergearItemsEnNoticias(items, capaKey) {
  let añadidos = 0;

  for (const n of items) {
    const u = _claveUrl(n.u || '', n.d || '');
    const t = n.t ? normalize(n.t) : '';

    // ¿Ya existe por URL?
    if (u) {
      const existente = _itemPorUrl.get(u);
      if (existente) {
        existente._capas.add(capaKey);
        continue;
      }
    }
    // ¿Ya existe por título?
    if (t) {
      const existente = _itemPorTitulo.get(t);
      if (existente) {
        existente._capas.add(capaKey);
        continue;
      }
    }

    // Es nuevo
    if (u) _urlsCargadas.add(u);
    if (t) _titulosCargados.add(t);

    n._capas = new Set([capaKey]);
    n._dia = n._dia || '';
    n._generado = n._generado || '';
    NOTICIAS.push(n);
    if (u) _itemPorUrl.set(u, n);
    if (t) _itemPorTitulo.set(t, n);
    añadidos++;
  }

  return añadidos;
}

// ─── Cargar una capa desde R2 ───
async function _cargarCapa(key, signal) {
  console.count('capa ' + key);
  const [tipo, valor] = key.split(':', 2);
  if (!_manifest || !_manifest.dias || !_manifest.dias.length) return 0;

  const diasMax = Math.min(DIAS_MEMORIA, DIAS_MEMORIA_MAX_SCOPE);
  const dias = _manifest.dias.slice(0, diasMax);  
  const files = [];

  for (const dia of dias) {
    if (tipo === 'grupo') {
      const g = _buscarGrupoEnDia(dia.grupos, valor);
      if (g && g.file) files.push(g.file);
    } else if (tipo === 'dominio') {
      const d = dia.dominios && dia.dominios[valor];
      if (d && d.file) files.push(d.file);
    }
  }

  if (!files.length) return 0;

  // Fetch con concurrencia 3
  const cola = files.slice();
  const nuevos = [];
  const workers = Array.from({ length: Math.min(3, cola.length) }, async () => {
    while (cola.length) {
      if (signal.aborted) return;
      const f = cola.shift();
      const data = await _fetchJSON(`${DATA_BASE}/${f}`, signal);
      if (!data) continue;
      if (data.medios) {
        for (const d in data.medios) MEDIOS[d] = data.medios[d];
      }
      const diaFecha = data.fecha || '';
      const generadoIso = data.generado || '';
      for (const n of (data.noticias || [])) {
        n._dia = diaFecha;
        n._generado = generadoIso;
        nuevos.push(n);
      }
    }
  });
  await Promise.all(workers);

  const añadidos = _mergearItemsEnNoticias(nuevos, key);
  if (añadidos > 0) hidratarNoticias();     // ← AÑADIR
  LAYERS.set(key, {
    files,
    cargada: Date.now(),
    lastUse: Date.now(),
    n: añadidos,
  });
  _itemsCargadosDeCapas += añadidos;
  return añadidos;
}

// Extiende una o varias capas pidiendo días [desde, hasta) desde el manifest.
// Diferencia con _cargarCapa: aquella carga [0, DIAS_MEMORIA), esta carga
// un rango arbitrario para paginación.
async function extenderCapasR2(capas, desde, hasta) {
  for (const key of capas) {
    const [tipo, valor] = key.split(':', 2);
    const dias = (_manifest.dias || []).slice(desde, hasta);
    if (!dias.length) continue;

    const files = [];
    for (const dia of dias) {
      if (tipo === 'grupo') {
        const g = _buscarGrupoEnDia(dia.grupos, valor);
        if (g && g.file) files.push(g.file);
      } else if (tipo === 'dominio') {
        const d = dia.dominios && dia.dominios[valor];
        if (d && d.file) files.push(d.file);
      }
    }
    if (!files.length) continue;

    const cola = files.slice();
    const nuevos = [];
    const workers = Array.from({ length: Math.min(8, cola.length) }, async () => {
      while (cola.length) {
        const f = cola.shift();
        const data = await _fetchJSON(`${DATA_BASE}/${f}`);
        if (!data) continue;
        if (data.medios) {
          for (const d in data.medios) MEDIOS[d] = data.medios[d];
        }
        const diaFecha = data.fecha || '';
        const generadoIso = data.generado || '';
        for (const n of (data.noticias || [])) {
          n._dia = diaFecha;
          n._generado = generadoIso;
          nuevos.push(n);
        }
      }
    });
    await Promise.all(workers);

    const añadidos = _mergearItemsEnNoticias(nuevos, key);
    if (añadidos > 0) hidratarNoticias();     // ← AÑADIR
    _itemsCargadosDeCapas += añadidos;
  }
}


async function asegurarCapas(capas, signal) {
  const faltantes = [...capas].filter(k => !LAYERS.has(k));
  if (!faltantes.length) return false;

  // Si ya hay una carga en curso, nos colgamos de ella. Cuando termine,
  // re-evaluamos: puede que ya no falte nada (caso típico: aplicarFiltros
  // se dispara dos veces seguidas por el evento del userscript).
  if (_capaEnVuelo) {
    try { await _capaEnVuelo; } catch(e){}
    return asegurarCapas(capas, signal);
  }

  if (_itemsCargadosDeCapas >= LAYER_MAX_ITEMS) {
    toast('Límite de capas alcanzado. Recarga la página para resetear.', 3200);
    return false;
  }

  _capaEnVuelo = (async () => {
    let total = 0;
    for (const key of faltantes) {
      if (signal.aborted) return total;
      if (_itemsCargadosDeCapas >= LAYER_MAX_ITEMS) break;
      try {
        total += await _cargarCapa(key, signal);
      } catch(e) {
        if (e.name !== 'AbortError') console.warn('[capa]', key, e.message);
      }
    }
    return total;
  })();

  try {
    return (await _capaEnVuelo) > 0;
  } finally {
    _capaEnVuelo = null;
  }
}
// ─── Cargar base (portada) ───
async function cargarBase() {
  _cargandoScope = true;
  let myGen = 0;
  try {
    if (_scopeAbort) _scopeAbort.abort();
    _scopeAbort = new AbortController();
    myGen = ++_scopeGeneration;
    const signal = _scopeAbort.signal;

    // 1) Manifest
    const manifestRes = await fetch(`${DATA_BASE}/manifest.json`, {
      cache: 'no-cache', signal
    });
    if (myGen !== _scopeGeneration) return;
    if (!manifestRes.ok) throw new Error('manifest HTTP ' + manifestRes.status);
    _manifest = await manifestRes.json();
    if (myGen !== _scopeGeneration) return;

    // 2) Reset
    MEDIOS = {};
    NOTICIAS = [];
    BASE.items = [];
    BASE.cargada = false;
    LAYERS.clear();
    _itemsCargadosDeCapas = 0;
    _itemPorUrl.clear();
    _itemPorTitulo.clear();
    _urlsCargadas = new Set();
    _titulosCargados = new Set();
    _hidratadasHasta = 0;
    _dupsHechosHasta = 0;
    _dupsLogged = false;

    // 3) Base = portada
    const portadaFile = (_manifest.portada && _manifest.portada.file)
                        ? _manifest.portada.file : 'portada.json';
    const data = await _fetchJSON(`${DATA_BASE}/${portadaFile}`, signal);
    if (data) {
      if (data.medios) {
        for (const d in data.medios) MEDIOS[d] = data.medios[d];
      }
      const generado = data.generado || '';
      for (const n of (data.noticias || [])) {
        n._dia = data.fecha || '';
        n._generado = generado;
        BASE.items.push(n);
      }
      BASE.cargada = true;
      BASE.generado = generado;
      _mergearItemsEnNoticias(BASE.items, 'base');
      pintarFechaCabecera(generado);
    }

    if (myGen === _scopeGeneration) refrescarVistaCompleta();
  } catch(e) {
    if (e.name === 'AbortError') return;
    throw e;
  } finally {
    if (myGen === _scopeGeneration) {
      _cargandoScope = false;
    }
  }
}
